<!doctype html>
<!-- SHOPS — REBEL ARMORY (weapon shop, design 1a). Self-contained, game-ready:
     inline CSS/JS, no libs, no network, no storage. AP stub behind a guard.
     Replaces weaponShop.hpp (idd 39400). Companion: FITTING ROOM (clothing).

     CONTRACT (page defines it; SQF matches; server re-checks everything)
       AP.on("wshop", { name, cash,
         cats:[id],
         items:[{ id, name, cat, price, cal, mag, range, paa, licensed, licName }],
         addons:[{ id, name, kind:"MAG"|"OPTIC"|"MUZZLE", price, fits:[weaponId] }] })
       AP.on("cash", n)                          // pushed after any settle
       AP.call("wsBuy",      [weaponId])  // -> { ok, msg, cash }
       AP.call("wsBuyAddon", [addonId])   // -> { ok, msg, cash }
     THE .PAA IS MANDATORY: rows thumb via AP.texture(paa, 128), the preview
     pane via AP.texture(paa, 512), both cached per path+size — never fetched
     per render. The stub draws striped placeholders; in game the real bridge
     returns the actual gear_*_CA.paa render. Unlicensed weapons stay VISIBLE,
     disabled, with the licence named in place — never hidden.

     WHAT ANIMATES: nothing persistent — the header LED pulse (CSS) and a
     .18s selection transition. Zero rAF. Esc closes the dialog (game-side). -->
<html><head><meta charset="utf-8"><title>SHOP — rebel armory</title>
<script>
/* ---- BRIDGE SHIM (installed by tools/install_shop_pages.py) ---------------
   AP defined synchronously so the page's dev stub never installs; on()/call()
   queue until webui.js lands. AP.texture goes straight to A3API -- no bridge
   round-trip, cached by the page. */
(function () {
  var subs = {}, queued = [], W = null;
  window.WEBUIReady = new Promise(function (r) { window.__webuiReady = r; });
  window.__apSubs = subs;
  window.AP = {
    __shim: true,
    on: function (n, f) { (subs[n] = subs[n] || []).push(f); if (W) W.on(n, f); },
    call: function (n, a) {
      if (W) return W.call(n, a || [], 20000);
      return new Promise(function (res, rej) { queued.push([n, a || [], res, rej]); });
    },
    texture: function (p, s) {
      if (typeof A3API === "undefined" || !A3API.RequestTexture) return Promise.reject(new Error("no A3API"));
      /* ALPHA TRIM. BI gear icons draw the art left-aligned inside a large
         transparent canvas, so object-fit:contain centres the CANVAS, not the
         weapon. Crop to the alpha bounding box before handing it to the page. */
      return A3API.RequestTexture(p, s).then(function (durl) {
        return new Promise(function (res) {
          var im = new Image();
          im.onload = function () {
            try {
              var cv = document.createElement("canvas");
              cv.width = im.width; cv.height = im.height;
              var g = cv.getContext("2d");
              g.drawImage(im, 0, 0);
              var d = g.getImageData(0, 0, cv.width, cv.height).data;
              var x0 = cv.width, y0 = cv.height, x1 = 0, y1 = 0;
              for (var y = 0; y < cv.height; y++) for (var x = 0; x < cv.width; x++) {
                if (d[(y * cv.width + x) * 4 + 3] > 10) {
                  if (x < x0) x0 = x; if (x > x1) x1 = x;
                  if (y < y0) y0 = y; if (y > y1) y1 = y;
                }
              }
              if (x1 <= x0 || y1 <= y0) return res(durl);
              var pad = 2, w = x1 - x0 + 1 + pad * 2, h = y1 - y0 + 1 + pad * 2;
              var out = document.createElement("canvas"); out.width = w; out.height = h;
              out.getContext("2d").drawImage(cv, x0 - pad, y0 - pad, w, h, 0, 0, w, h);
              res(out.toDataURL("image/png"));
            } catch (e) { res(durl); }
          };
          im.onerror = function () { res(durl); };
          im.src = durl;
        });
      });
    },
    handle: function (n, f) { if (W) W.handle(n, f); }
  };
  window.WEBUIReady.then(function (w) {
    W = w;
    Object.keys(subs).forEach(function (n) { subs[n].forEach(function (f) { W.on(n, f); }); });
    queued.forEach(function (q) { W.call(q[0], q[1], 20000).then(q[2], q[3]); });
    queued = [];
    W.call("log", ["armory page up"]);   // instant readiness drain
    /* FLAIR: same page, three uniforms. The payload names the theme; the shim
       applies it so the designer's file stays untouched. */
    ["wshop", "cshop"].forEach(function (ch) {
      W.on(ch, function (v) {
        if (v && v.flair !== undefined) document.body.setAttribute("data-flair", v.flair || "");
      });
    });
  });
  if (typeof A3API !== "undefined" && A3API.RequestFile) {
  window.__webuiBootPath = "stub";
    A3API.RequestFile("webui\\ui\\webui.js")
      .then(function (s) { try { (0, eval)(s); } catch (e) { window.__apBootErr = "eval: " + e; } })
      .catch(function (e) { window.__apBootErr = "RequestFile: " + e; });
  } else { window.__apBootErr = "no A3API on this page"; }
})();
</script>

.arow .kd{font-family:var(--mono);font-size:.52rem;color:var(--faint)}

</style></head><body>
<div id="stage"><div id="frame"><div id="shop" data-screen-label="Rebel Armory">
  <div class="hdr">
    <span class="led"></span>
    <span style="color:var(--gold);font-weight:800;font-size:.8rem;letter-spacing:.22em" id="shopName">REBEL ARMORY</span>
    <span class="cats" id="cats"></span>
    <span class="cash" id="cash">—</span>
  </div>
  <div class="body">
    <div class="list" id="list"></div>
    <div class="det">
      <div class="prev">
        <img id="prevImg" alt="">
        <span class="src">AP.texture · 512</span>
        <span class="paa" id="prevPaa"></span>
        <span class="lic" id="prevLic"></span>
      </div>
      <div class="title"><span class="nm" id="wName">—</span><span class="st" id="wStats"></span><span class="pr" id="wPrice"></span></div>
      <div class="buyrow"><button class="buy" id="buyBtn">PURCHASE</button></div>
      <div class="ahd"><span class="l">Ammunition &amp; scopes</span><span class="r" id="fitsLbl"></span></div>
      <div class="addons" id="addons"></div>
      <div class="status"><span class="f" id="flash">READY</span><span class="n">UNLICENSED ROWS STAY VISIBLE · SERVER RE-CHECKS THE LICENCE · ESC LEAVES</span></div>
    </div>
  </div>
</div></div></div>

<script>
/* ---- AP stub (dev only — the real bridge replaces it). Weapon set mirrors
   the current weaponShop.hpp config; paths are the real A3 gear icons. ---- */
if (typeof AP === "undefined") window.AP = (function () {
  const subs = {}, last = {};
  const push = (n, v) => { last[n] = v; (subs[n] || []).forEach(f => f(v)); };
  let cash = 214000;
  const W = [
    ["mx", "MX 6.5 mm", "rifles", 186000, "6.5×39", "30 RND", "500 M", true, "\\A3\\Weapons_F\\Rifles\\MX\\Data\\UI\\gear_mx_X_CA.paa"],
    ["katiba", "Katiba 6.5 mm", "rifles", 172000, "6.5×39 CASELESS", "30 RND", "470 M", true, "\\A3\\Weapons_F\\Rifles\\Khaybar\\Data\\UI\\gear_arifle_khaybar_X_CA.paa"],
    ["mxc", "MXC 6.5 mm", "rifles", 154000, "6.5×39", "30 RND", "380 M", true, "\\A3\\Weapons_F\\Rifles\\MX\\Data\\UI\\gear_mxc_X_CA.paa"],
    ["spar", "SPAR-16 5.56 mm", "rifles", 148000, "5.56×45", "30 RND", "450 M", false, "\\A3\\Weapons_F_Exp\\Rifles\\SPAR_01\\Data\\UI\\gear_SPAR_01_short_black_X_CA.paa"],
    ["mk20", "Mk20 5.56 mm", "rifles", 96000, "5.56×45", "30 RND", "400 M", true, "\\A3\\Weapons_F\\Rifles\\Mk20\\Data\\UI\\gear_mk20_rifle_X_CA.paa"],
    ["sting", "Sting 9 mm", "smg", 62000, "9×21", "30 RND", "200 M", true, "\\A3\\Weapons_F\\SMGs\\SMG_02\\Data\\UI\\gear_SMG_02_X_CA.paa"],
    ["p07", "P07 9 mm", "pistols", 14500, "9×21", "16 RND", "50 M", true, "\\A3\\Weapons_F\\Pistols\\P07\\Data\\UI\\gear_P07_X_CA.paa"]
  ];
  const A = [
    ["m65", "6.5 mm 30rnd STANAG", "MAG", 450, ["mx", "mxc", "katiba"]],
    ["m556", "5.56 mm 30rnd", "MAG", 380, ["spar", "mk20"]],
    ["m9s", "9 mm 30rnd Vermin", "MAG", 260, ["sting"]],
    ["m9", "9 mm 16rnd Mag", "MAG", 120, ["p07"]],
    ["aco", "ACO Red Dot", "OPTIC", 3200, ["mx", "mxc", "katiba", "sting", "spar", "mk20"]],
    ["rco", "RCO 4× Scope", "OPTIC", 9800, ["mx", "katiba", "spar", "mk20"]],
    ["supp65", "Suppressor 6.5 mm", "MUZZLE", 24000, ["mx", "mxc", "katiba"]],
    ["flash", "Flashlight", "MUZZLE", 900, ["mx", "mxc", "p07", "sting", "spar", "mk20"]]
  ];
  push("wshop", {
    name: "REBEL ARMORY", cash,
    cats: ["rifles", "smg", "pistols"],
    items: W.map(w => ({ id:w[0], name:w[1], cat:w[2], price:w[3], cal:w[4], mag:w[5], range:w[6], licensed:w[7], licName:"REBEL LICENCE", paa:w[8] })),
    addons: A.map(a => ({ id:a[0], name:a[1], kind:a[2], price:a[3], fits:a[4] }))
  });
  const texCache = {};
  return {
    on(n, f) { (subs[n] = subs[n] || []).push(f); if (n in last) f(last[n]); },
    call(name, a) {
      a = a || [];
      const settle = (price, label) => {
        if (price > cash) return { ok:false, msg:"not enough cash" };
        cash -= price; push("cash", cash);
        return { ok:true, msg:label + " delivered", cash };
      };
      if (name === "wsBuy") {
        const w = W.find(x => x[0] === a[0]);
        if (!w) return Promise.resolve({ ok:false, msg:"unknown weapon" });
        if (!w[7]) return Promise.resolve({ ok:false, msg:"rebel licence required" });   // server-side truth
        return Promise.resolve(settle(w[3], w[1]));
      }
      if (name === "wsBuyAddon") {
        const x = A.find(y => y[0] === a[0]);
        return Promise.resolve(x ? settle(x[3], x[1]) : { ok:false, msg:"unknown addon" });
      }
      return Promise.resolve({ ok:true });
    },
    texture(path, size) {   // dev placeholder — real bridge renders the .paa
      const key = path + "@" + size;
      if (texCache[key]) return Promise.resolve(texCache[key]);
      const c = document.createElement("canvas");
      c.width = size; c.height = Math.round(size * .56);
      const x = c.getContext("2d"), seed = path.length % 7;
      x.fillStyle = "#0d120f"; x.fillRect(0, 0, c.width, c.height);
      x.strokeStyle = "#141a16"; x.lineWidth = Math.max(3, size / 40);
      x.save(); x.translate(c.width / 2, c.height / 2); x.rotate((20 + seed * 23) * Math.PI / 180);
      for (let i = -c.width; i < c.width; i += x.lineWidth * 2) { x.beginPath(); x.moveTo(i, -c.width); x.lineTo(i, c.width); x.stroke(); }
      x.restore();
      return Promise.resolve(texCache[key] = c.toDataURL());
    },
    _push:push
  };
})();

const $ = s => document.querySelector(s);
function fit() { document.documentElement.style.fontSize = Math.max(9, $("#frame").getBoundingClientRect().width / 75) + "px"; }
window.addEventListener("resize", fit); fit();
const F = n => "$" + Math.round(n).toLocaleString();

let shop = null, cash = 0, cat = null, sel = null;
const tex = {};   // path@size -> dataURL, fetched ONCE
function getTex(paa, size, img) {
  const key = paa + "@" + size;
  if (tex[key]) { img.src = tex[key]; return; }
  AP.texture(paa, size).then(u => { tex[key] = u; img.src = u; });
}
let flashT = null;
function say(m, bad) {
  const el = $("#flash");
  el.textContent = m; el.style.color = bad ? "var(--danger)" : "var(--acc)";
  clearTimeout(flashT);
  flashT = setTimeout(() => { el.textContent = "READY"; el.style.color = "var(--faint)"; }, 2800);
}
function renderCats() {
  $("#cats").innerHTML = shop.cats.map(c => '<button class="cat' + (c === cat ? " on" : "") + '" data-c="' + c + '">' + c.toUpperCase() + "</button>").join("");
  [...$("#cats").children].forEach(b => b.onclick = () => {
    cat = b.dataset.c;
    const first = shop.items.find(i => i.cat === cat);
    if (first) sel = first.id;
    renderCats(); renderList(); renderDetail();
  });
}
function renderList() {
  const rows = shop.items.filter(i => i.cat === cat);
  $("#list").innerHTML = rows.map(i =>
    '<button class="row' + (i.id === sel ? " on" : "") + (i.licensed ? "" : " nolic") + '" data-id="' + i.id + '">' +
    '<span class="thumb"><img alt=""></span>' +
    '<span class="tx"><span class="nm">' + i.name + '</span><span class="sub">' + i.cal + " · " + i.range + (i.licensed ? "" : " · NEEDS " + i.licName) + "</span></span>" +
    '<span class="pr">' + F(i.price) + "</span></button>").join("");
  [...$("#list").children].forEach((b, k) => {
    getTex(rows[k].paa, 128, b.querySelector("img"));
    b.onclick = () => { sel = b.dataset.id; renderList(); renderDetail(); };
  });
}
function renderDetail() {
  const w = shop.items.find(i => i.id === sel);
  if (!w) return;
  getTex(w.paa, 512, $("#prevImg"));
  $("#prevPaa").textContent = w.paa;
  const lic = $("#prevLic");
  lic.textContent = w.licensed ? "LICENSED" : w.licName + " REQUIRED";
  lic.style.color = w.licensed ? "var(--acc2)" : "var(--danger)";
  $("#wName").textContent = w.name;
  $("#wStats").textContent = w.cal + " · " + w.mag + " · EFFECTIVE " + w.range;
  $("#wPrice").textContent = F(w.price);
  const b = $("#buyBtn");
  b.textContent = !w.licensed ? w.licName + " REQUIRED" : w.price > cash ? "NOT ENOUGH CASH" : "PURCHASE — " + F(w.price);
  b.disabled = !w.licensed || w.price > cash;
  b.onclick = () => AP.call("wsBuy", [w.id]).then(r => {
    if (r.ok === false) return say("wsBuy refused — " + (r.msg || "").toUpperCase(), true);
    say("wsBuy ok — " + w.name.toUpperCase() + " DELIVERED TO HANDS");
  });
  $("#fitsLbl").textContent = "FITS " + w.name.toUpperCase();
  const fits = shop.addons.filter(a => a.fits.includes(w.id));
  const dotCol = { MAG:"var(--acc2)", OPTIC:"var(--gold)", MUZZLE:"var(--dim)" };
  $("#addons").innerHTML = fits.map(a =>
    '<div class="arow"><span class="dot" style="background:' + dotCol[a.kind] + '"></span>' +
    '<span class="nm">' + a.name + '</span><span class="kd">' + a.kind + '</span>' +
    '<span class="pr">' + F(a.price) + '</span>' +
    '<button class="abuy" data-id="' + a.id + '"' + (a.price > cash ? " disabled" : "") + ">BUY</button></div>").join("");
  [...$("#addons").querySelectorAll(".abuy")].forEach(b2 => b2.onclick = () => {
    const a = fits.find(x => x.id === b2.dataset.id);
    AP.call("wsBuyAddon", [a.id]).then(r => {
      if (r.ok === false) return say("wsBuyAddon refused — " + (r.msg || "").toUpperCase(), true);
      say("wsBuyAddon ok — " + a.name.toUpperCase());
    });
  });
}
AP.on("wshop", v => {
  shop = v; cash = v.cash;
  $("#shopName").textContent = v.name;
  $("#cash").textContent = F(cash);
  if (!cat || !v.cats.includes(cat)) cat = v.cats[0];
  if (!sel || !v.items.some(i => i.id === sel)) { const f = v.items.find(i => i.cat === cat); sel = f && f.id; }
  renderCats(); renderList(); renderDetail();
});
AP.on("cash", n => { cash = n; $("#cash").textContent = F(cash); renderList(); renderDetail(); });
