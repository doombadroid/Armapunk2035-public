  if (t.phase !== lastPhase) { lastPhase = t.phase; felt.kick(5000); }
});
AP.on("bj.you", y => { youState = y; renderLocker(); renderSeats(); });
AP.on("bj.event", e => {
  if (e.kind === "deal") { snap(); felt.kick(3000); }
  else if (e.kind === "say" && e.text) splitSay(e.text);
  else if (e.kind === "turn") { ping(); say("// YOUR ACTION — 20S ON THE CLOCK", "warn"); }
  else if (e.kind === "bet" && e.text) $("#ticker").textContent = "// " + e.text;
  else if (e.kind === "drop") { dropFx(); if (e.tier === 2) setTimeout(dropFx, 240); say("// " + e.text + " — DROPPED ON THE WIN", e.tier === 2 ? "warn" : "good"); logRound("◈ " + e.text, null); }
  else if (e.kind === "bonus") { const b = $("#bonus"); if (e.id) { b.style.display = "flex"; b.textContent = "◆ BONUS ROUND — " + e.text; if (e.say) splitSay(e.say); } else b.style.display = "none"; }
  else if (e.kind === "peek") { peeked = e.card; renderDealer(); say("// " + e.text, "warn"); }
  else if (e.kind === "powerup" && e.text) $("#ticker").textContent = "// " + e.text;
  else if (e.kind === "shuffle") $("#ticker").textContent = "// " + e.text;
});
AP.on("casino", v => {
  cas = v; $("#bal").textContent = F(v.balance);
  if (!$("#chips").children.length) {
    $("#chips").innerHTML = v.chips.map(x => '<button class="chip" data-v="' + x + '">' + (x >= 1000000 ? x / 1000000 + "M" : x / 1000 + "K") + "</button>").join("");
    [...$("#chips").children].forEach(c => c.onclick = () => { setBet(+c.dataset.v); });
    $("#clamp").textContent = v.limits[0] / 1000 + "K–" + v.limits[1] / 1000 + "K";
  }
  renderPanel();
});
function setBet(n, fromInput) {
  if (cas) n = Math.max(cas.limits[0], Math.min(cas.limits[1], n || cas.limits[0]));
  bet = n;
  if (!fromInput) $("#betIn").value = bet.toLocaleString();
  [...$("#chips").children].forEach(c => c.classList.toggle("on", +c.dataset.v === bet));
  renderPanel();
}
$("#betIn").addEventListener("input", e => { const n = +e.target.value.replace(/[^\d]/g, ""); if (n) setBet(n, true); });
$("#betIn").addEventListener("blur", () => setBet(bet));
$("#betMax").onclick = () => setBet(cas ? Math.min(cas.limits[1], cas.balance) : 500000);
$("#go").onclick = () => {
  const me = table && table.seats.find(s => s.you);
  if (!me) return;
  AP.call("bjBet", [bet]).then(r => { if (r.ok === false) say("// REFUSED — " + (r.msg || "").toUpperCase(), "bad"); });
  felt.kick(4000);
};
document.addEventListener("keydown", e => { if (e.key === "Escape") setTargeting(null); });
$("#status").textContent = defaultStatus();
felt.kick(8000);
</script>
</body></html>
