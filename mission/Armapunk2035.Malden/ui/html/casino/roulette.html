    cx.save(); cx.rotate(a);
    cx.beginPath(); cx.moveTo(0, -R * .655); cx.lineTo(0, -R * .875);
    cx.strokeStyle = "rgba(185,200,190,.4)"; cx.lineWidth = Math.max(1, W * .0022); cx.stroke();
    cx.restore();
  }
  cx.restore();
  // stator diamonds — fixed deflectors the ball really strikes
  for (const da of DIAMONDS) {
    cx.save(); cx.rotate(da); cx.translate(0, -R * .905); cx.rotate(Math.PI / 4);
    const dsz = W * .011;
    const dg = cx.createLinearGradient(-dsz, -dsz, dsz, dsz);
    dg.addColorStop(0, "#aab6ae"); dg.addColorStop(1, "#4e5a54");
    cx.fillStyle = dg; cx.fillRect(-dsz, -dsz, dsz * 2, dsz * 2);
    cx.strokeStyle = "rgba(0,0,0,.6)"; cx.lineWidth = 1; cx.strokeRect(-dsz, -dsz, dsz * 2, dsz * 2);
    cx.restore();
  }
  // cone + hub
  const hub = cx.createRadialGradient(0, -W * .02, W * .01, 0, 0, W * .34);
  hub.addColorStop(0, "#1c2621"); hub.addColorStop(1, "#0a100d");
  cx.beginPath(); cx.arc(0, 0, W * .335, 0, 7); cx.fillStyle = hub; cx.fill();
  cx.strokeStyle = "rgba(201,226,26,.25)"; cx.lineWidth = 1.5; cx.stroke();
  if (litIdx >= 0) {
    const n = ORDER[litIdx];
    cx.fillStyle = numCol(n);
    cx.font = "800 " + Math.round(W * .11) + "px ui-monospace,Menlo,monospace";
    cx.textAlign = "center"; cx.textBaseline = "middle";
    cx.shadowColor = numCol(n); cx.shadowBlur = W * .04;
    cx.fillText(numLbl(n), 0, -W * .012);
    cx.shadowBlur = 0;
    cx.fillStyle = "rgba(220,239,224,.7)";
    cx.font = "700 " + Math.round(W * .028) + "px ui-monospace,Menlo,monospace";
    cx.fillText((n === 0 || n === 37) ? "GREEN" : REDS.includes(n) ? "RED" : "BLACK", 0, W * .07);
  } else {
    cx.fillStyle = "rgba(127,147,138,.6)";
    cx.font = "800 " + Math.round(W * .042) + "px ui-monospace,Menlo,monospace";
    cx.textAlign = "center"; cx.textBaseline = "middle";
    cx.fillText("38 POCKETS", 0, 0);
  }
  // ball
  if (ball.on) {
    for (let i = trail.length - 1; i > 0; i--) {
      const p = trail[i];
      cx.beginPath(); cx.arc(Math.cos(p.a) * R * p.r, Math.sin(p.a) * R * p.r, W * .014 * (1 - i / 8), 0, 7);
      cx.fillStyle = "rgba(238,244,238," + (.22 * (1 - i / 6)).toFixed(3) + ")"; cx.fill();
    }
    const bx = Math.cos(ball.a) * R * ball.r, by = Math.sin(ball.a) * R * ball.r;
    cx.beginPath(); cx.ellipse(bx + W * .004, by + W * .008, W * .013, W * .008, 0, 0, 7);
    cx.fillStyle = "rgba(0,0,0,.4)"; cx.fill();
    const bg = cx.createRadialGradient(bx - W * .005, by - W * .005, W * .002, bx, by, W * .014);
    bg.addColorStop(0, "#ffffff"); bg.addColorStop(1, "#b9c4bd");
    cx.beginPath(); cx.arc(bx, by, W * .014, 0, 7);
    cx.fillStyle = bg; cx.shadowColor = "rgba(238,244,238,.7)"; cx.shadowBlur = W * .015; cx.fill();
    cx.shadowBlur = 0;
  }
  cx.restore();
}

/* ---- physics: rim run under friction → spiral through the stator diamonds
   → pocket skips → seated, wheel coasts on. The run is honestly simulated;
   ONLY the final skip sequence is steered so the ball comes to rest in the
   SERVER's pocket — the page still never picks a number. ---- */
const TAU = Math.PI * 2;
const norm = a => ((a % TAU) + TAU) % TAU;
const DIAMONDS = Array.from({ length:8 }, (_, k) => k * TAU / 8 + TAU / 16);
let spin = null, result = null, lastTickIdx = -1, trail = [];
function loop(t) {
  if (!spin) { draw(); return; }
  const dt = Math.min(.05, (t - (spin.t || t)) / 1000); spin.t = t;
  thW += spin.wv * dt;
  spin.wv *= Math.exp(-dt / 26);                       // wheel has its own friction
  if (spin.phase === "rim") {
    spin.bv *= Math.exp(-dt / 3.6);
    if (!result && spin.bv < 1.7) spin.bv = 1.7;       // hold the run until the server answers
    ball.a -= spin.bv * dt;
    if (result && spin.bv <= 1.65) spin.phase = "spiral";
  } else if (spin.phase === "spiral") {
    spin.bv *= Math.exp(-dt / 2.8);
    ball.a -= spin.bv * dt;
    ball.r -= dt * .105;
    if (ball.r < .925 && ball.r > .86) {               // deflector band
      const ba = norm(ball.a);
      for (const da of DIAMONDS) {
        if (Math.abs(norm(ba - da + Math.PI) - Math.PI) < spin.bv * dt * .6 && t - (spin.lastHit || 0) > 260) {
          spin.lastHit = t; spin.bv *= .86; ball.r -= .018; rattle();
        }
      }
    }
    if (ball.r <= .72) planSkips();
  } else if (spin.phase === "skip") {
    const P = spin.plan, hop = P.hops[P.i];
    const q = Math.min(1, (t - P.t0) / hop.dur);
    P.rel = hop.a0 - hop.d * (q - .12 * Math.sin(q * Math.PI));
    ball.r = .685 + hop.h * Math.sin(q * Math.PI);
    ball.a = thW + P.rel;
    if (q >= 1) {
      rattle(); P.i++;
      if (P.i >= P.hops.length) seat();
      else { P.hops[P.i].a0 = P.rel; P.t0 = t; }
    }
  } else if (spin.phase === "seated") {
    spin.wv *= Math.exp(-dt / 2.5);                    // brake the wheel once the ball is home
    ball.a = thW + spin.rel;
    ball.r = .672 + .006 * Math.max(0, 1 - (t - spin.seatT) / 250) * Math.sin((t - spin.seatT) / 18);
    if (spin.wv < .15 && t - spin.seatT > 1200) { spin = null; trail = []; draw(); return; }
  }
  if (spin && spin.phase !== "seated") {
    trail.unshift({ a:ball.a, r:ball.r });
    if (trail.length > 6) trail.pop();
    const ri = Math.floor(norm(ball.a - thW) / SEG);
    if (ri !== lastTickIdx) {
      lastTickIdx = ri;
      if (t - (spin.lastSnd || 0) > 50) { spin.lastSnd = t; beep(1250, .015, Math.min(.022, .006 + spin.bv * .003)); }
    }
  } else trail = [];
  draw();
  requestAnimationFrame(loop);
}
function planSkips() {
  spin.targetIdx = IDX[result.spin];
  const pocketA = -Math.PI / 2 + spin.targetIdx * SEG;
  const rel = norm(ball.a - thW);
  let d = norm(rel - pocketA);                         // ball travels in the negative direction
  if (d < 1.1) d += TAU;                               // enough distance for real skips
  spin.plan = { i:0, t0:spin.t, rel,
    hops:[.42, .27, .18, .13].map((p, i) => ({ a0:rel, d:d * p, dur:Math.max(200 + i * 60, d * p / 5.5 * 1000), h:.05 - i * .011 })) };
  spin.phase = "skip";
}
function seat() {
  spin.phase = "seated";
  spin.rel = -Math.PI / 2 + spin.targetIdx * SEG;
  spin.seatT = spin.t;
  ball.r = .672;
  revealResult();
}
function revealResult() {
  const r = result;
  litIdx = IDX[r.spin];
  const colName = r.isGreen ? "GREEN" : r.isRed ? "RED" : "BLACK";
  if (r.win) {
    winSting();
    countUp(r.ret);
    say("// " + numLbl(r.spin) + " " + colName + " — CREDITED " + F(r.ret) + " · SERVER SETTLED", "good");
  } else {
    setRes(numLbl(r.spin) + " " + colName, "NO WIN — " + BETS[r.betType].nm.toUpperCase(), "var(--dim)");
    say("// " + numLbl(r.spin) + " " + colName + " — HOUSE KEEPS " + F(r.bet), "bad");
  }
  $("#lastR").textContent = numLbl(r.spin) + " " + colName + " · " + BETS[r.betType].nm + (r.win ? " — " + F(r.ret) : " — LOST");
  $("#lastR").style.color = r.win ? "var(--acc)" : "var(--dim)";
  logSpin(r, colName);
  result = null;
  syncGo();
  felt.kick(4000);
}
function countUp(n) {
  const el = $("#resBig"); el.style.color = "var(--acc)";
  $("#resLbl").textContent = "YOU WIN";
  const t0 = performance.now();
  (function step(t) {
    const p = Math.min(1, (t - t0) / 900), e = 1 - Math.pow(1 - p, 2);
    el.textContent = F(n * e);
    if (p < 1) requestAnimationFrame(step);
  })(t0);
}
function setRes(big, lbl, col) { $("#resBig").textContent = big; $("#resBig").style.color = col; $("#resLbl").textContent = lbl; }

/* ---- bet board ---- */
const BETS = {
  red:{ nm:"Red", x:"2×", sw:"var(--red)" }, black:{ nm:"Black", x:"2×", sw:"#2a353b" },
  odd:{ nm:"Odd", x:"2×" }, even:{ nm:"Even", x:"2×" },
  low:{ nm:"1–18", x:"2×" }, high:{ nm:"19–36", x:"2×" },
  dozen1:{ nm:"1st 12", x:"3×" }, dozen2:{ nm:"2nd 12", x:"3×" }, dozen3:{ nm:"3rd 12", x:"3×" },
  zero:{ nm:"0", x:"36×", sw:"#0f5c33" }, dzero:{ nm:"00", x:"36×", sw:"#0f5c33" },
  straight:{ nm:"Straight", x:"36×" }
};
let selChip = "red", betType = "red", betVal = 17;
function betLabel() {
  if (selChip === "zero") return "0 · STRAIGHT";
  if (selChip === "dzero") return "00 · STRAIGHT";
  return betType === "straight" ? "STRAIGHT " + numLbl(betVal) : BETS[betType].nm.toUpperCase();
}
function renderBoard() {
  $("#board").innerHTML = Object.keys(BETS).map(k => {
    const b = BETS[k];
    return '<button class="bt' + (selChip === k ? " on" : "") + '" data-k="' + k + '">' +
      (b.sw ? '<span class="sw" style="background:' + b.sw + '"></span>' : "") + b.nm.toUpperCase() + " <small>" + b.x + "</small>" +
      (k === "straight" ? ' <small style="color:var(--magenta)">' + numLbl(betVal) + "</small>" : "") + "</button>";
  }).join("");
  [...$("#board").children].forEach(el => el.onclick = () => {
    selChip = el.dataset.k;
    if (selChip === "zero") { betType = "straight"; betVal = 0; }
    else if (selChip === "dzero") { betType = "straight"; betVal = 37; }
    else betType = selChip;
    $("#grid").style.display = selChip === "straight" ? "" : "none";
    renderBoard(); renderGrid(); syncGo(); felt.kick(2000);
  });
  $("#grid").style.display = selChip === "straight" ? "" : "none";
}
function renderGrid() {
  const cells = [0, 37].concat(Array.from({ length:36 }, (_, i) => i + 1));
  $("#grid").innerHTML = cells.map(n =>
    '<button class="num ' + ((n === 0 || n === 37) ? "g" : REDS.includes(n) ? "r" : "b") + (betVal === n ? " on" : "") + '" data-n="' + n + '">' + numLbl(n) + "</button>").join("");
  [...$("#grid").children].forEach(el => el.onclick = () => { betVal = +el.dataset.n; selChip = "straight"; betType = "straight"; renderGrid(); renderBoard(); syncGo(); });
}

/* ---- bet bar ---- */
let cas = null, bet = 50000;
function setBet(n, fromInput) {
  if (cas) n = Math.max(cas.limits[0], Math.min(cas.limits[1], n || cas.limits[0]));
  bet = n;
  if (!fromInput) $("#betIn").value = bet.toLocaleString();
  [...$("#chips").children].forEach(c => c.classList.toggle("on", +c.dataset.v === bet));
  syncGo();
}
function renderChips() {
  $("#chips").innerHTML = cas.chips.map(v =>
    '<button class="chip" data-v="' + v + '">' + (v >= 1000000 ? v / 1000000 + "M" : v / 1000 + "K") + "</button>").join("");
  [...$("#chips").children].forEach(c => c.onclick = () => { setBet(+c.dataset.v); felt.kick(2000); });
  $("#clamp").textContent = cas.limits[0] / 1000 + "K–" + cas.limits[1] / 1000 + "K";
}
$("#betIn").addEventListener("input", e => { const n = +e.target.value.replace(/[^\d]/g, ""); if (n) setBet(n, true); });
$("#betIn").addEventListener("blur", () => setBet(bet));
$("#betIn").addEventListener("keydown", e => { if (e.key === "Enter") { setBet(bet); $("#go").click(); } });
$("#betMax").onclick = () => setBet(cas ? Math.min(cas.limits[1], cas.balance) : 500000);

/* ---- wiring ---- */
let statusT = null;
function say(m, tone) {
  const el = $("#status");
  el.textContent = m;
  el.style.color = tone === "bad" ? "var(--danger)" : tone === "good" ? "var(--acc)" : tone === "warn" ? "var(--amber)" : "var(--faint)";
  clearTimeout(statusT);
  statusT = setTimeout(() => { el.textContent = defaultStatus(); el.style.color = "var(--faint)"; }, 3600);
}
function defaultStatus() {
  return cas && cas.gate ? "// TABLE CLOSED TO YOU — " + cas.gate.toUpperCase()
    : "// OUTSIDE 2× · DOZENS 3× · STRAIGHT 36× — THE SERVER SPINS · ESC LEAVES";
}
function syncGo() {
  const b = $("#go");
  b.textContent = spin && spin.phase !== "seated" ? "BALL ROLLING…" : "SPIN — " + F(bet) + " ON " + betLabel();
  b.disabled = (spin && spin.phase !== "seated") || !cas || !!cas.gate || cas.balance < bet;
  if (cas && cas.gate) say("// " + cas.gate.toUpperCase(), "bad");
}
$("#go").onclick = () => {
  if (spin && spin.phase !== "seated") return;
  AP.call("casPlay", ["roulette", "play", [bet, betType, betVal]]).then(r => {
    if (r && r.ok === false) { say("// REFUSED — " + (r.msg || "").toUpperCase(), "bad"); return; }
    litIdx = -1; result = null; trail = [];
    setRes("—", "NO MORE BETS", "var(--dim)");
    ball.on = true; ball.r = .94; ball.a = Math.random() * TAU;
    spin = { phase:"rim", wv:.95 + Math.random() * .25, bv:5.2 + Math.random() * .6, t:0 };
    felt.kick(12000);
    syncGo();
    requestAnimationFrame(loop);
  });
};
function logSpin(r, colName) {
  const box = $("#sess");
  if (box.firstChild && box.firstChild.tagName === "SPAN") box.innerHTML = "";
  const d = new Date(), tm = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  const row = document.createElement("div");
  row.className = "row";
  row.innerHTML = '<span class="t">' + tm + '</span><span class="l">' + numLbl(r.spin) + " " + colName + " · " + BETS[r.betType].nm.toUpperCase() +
    '</span><span class="n" style="color:' + (r.net >= 0 ? "var(--acc)" : "var(--danger)") + '">' + (r.net >= 0 ? "+" : "−") + F(Math.abs(r.net)).slice(1) + "</span>";
  box.prepend(row);
  while (box.children.length > 12) box.removeChild(box.lastChild);
}
AP.on("casino", v => { cas = v; $("#bal").textContent = F(v.balance); if (!$("#chips").children.length) renderChips(); setBet(bet); });
AP.on("casResult", r => {
  if (r.game !== "roulette") return;
  if (!spin || spin.phase !== "rim" || result) return;   // bridge replays the last value on subscribe — accept only during a live rim run
  const p = r.payload;
  result = { spin:p[0], isRed:p[1], isGreen:p[2], win:p[3], bet:p[4], ret:p[5], net:p[6], betType:p[7] };
});
renderBoard(); renderGrid();
fit(); sizeWheel(); draw(); felt.kick(6000);
$("#status").textContent = defaultStatus();
</script>
</body></html>
