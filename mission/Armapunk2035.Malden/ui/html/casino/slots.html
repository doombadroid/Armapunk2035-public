<!-- CASINO — SLOTS. Self-contained, game-ready: inline CSS/JS, no libs, no
     network, no storage. AP stub behind a guard.

     CONTRACT
       AP.on("casino", { balance, chips:[amounts], limits:[min,max], gate })
       AP.on("casResult", { game:"slots", payload })
         payload = [[r1, r2, r3], mult, bet, ret, net]   // symbols 0–4
       AP.call("casPlay", ["slots","play",[bet]])         // reply = SENT, not settled
     Five symbols, server-weighted 6·5·4·3·2 (symbol 4 rarest). Triples pay
     8× · 12× · 22× · 45× · 150×, anything else pays nothing. The reels spin
     until casResult arrives, then stop LEFT → RIGHT on the server's symbols.
     The page never rolls anything.

     THE NEAR-MISS IS DESIGNED (spec §4): when reels 1+2 match, reel 3 gets an
     extended slow crawl, hangs half a step short of the payline, then settles
     onto the server's symbol. The jackpot nerf makes two-and-one-off a
     frequent real outcome — it should feel like a heartbeat, not a bug.

     WHAT ANIMATES: the machine canvas (~55% of surface) redraws per frame for
     the ~3.5s of a spin (longer on a near-miss), the felt runs while hot, and
     a win pulses the payline for ~1s. Then every rAF stops. Idle cost zero.
     Audio: reel ticks, stop clunks, win sting scaled to the multiplier,
     jackpot fanfare; SND toggle. -->

/* ---- BRIDGE SHIM (installed by tools/install_casino_pages.py) --------------
   window.WEBUI does not exist while this page's own script runs; the bridge is
   INJECTED afterwards. Anything that touches it at load is silently deaf, which
   is how the first web shop shipped.

   AP is defined here, synchronously, before the page's script -- so its
   `if (typeof AP === "undefined")` dev stub never installs, and every on()/call()
   made before the bridge lands is queued and flushed when it does. -------- */

  var subs = {}, queued = [], W = null;
  window.WEBUIReady = new Promise(function (r) { window.__webuiReady = r; });
  /* Instrumentation for AP_fnc_casinoDiag. The browser console is unreachable
     in game -- Esc opens it and closes the dialog -- so a deaf page has to be
     able to say why on its own surface. */
  window.__apSubs = subs;
  /* A throw inside a channel handler is CAUGHT by webui.js and console.error'd,
     and the console is unreachable in game -- so a payload the page cannot read
     looks exactly like a payload that never arrived. Wrapping every handler
     records the first failure where the diagnostic can print it. */
  function guard(n, f) {
    return function (v) {
      try { return f(v); }
      catch (e) { if (!window.__apHandlerErr) window.__apHandlerErr = n + ": " + e; throw e; }
    };

    __shim: true,
    on: function (n, f) {
      (subs[n] = subs[n] || []).push(guard(n, f));
      if (W) W.on(n, subs[n][subs[n].length - 1]);
    },
    call: function (n, a) {
      if (W) return W.call(n, a || [], 20000);
      return new Promise(function (res, rej) { queued.push([n, a || [], res, rej]); });
    },
    handle: function (n, f) { if (W) W.handle(n, f); }
  };
  window.WEBUIReady.then(function (w) {
    W = w;
    Object.keys(subs).forEach(function (n) { subs[n].forEach(function (f) { W.on(n, f); }); });
    W.on("casino", function () { window.__apGotCasino = true; });
    queued.forEach(function (q) { W.call(q[0], q[1], 20000).then(q[2], q[3]); });

     the src quietly resolves to nothing. SQF injects the same file too and
     webui.js is idempotent, so whichever lands first wins. */
  if (typeof A3API !== "undefined" && A3API.RequestFile) {

      .then(function (s) { try { (0, eval)(s); } catch (e) { window.__apBootErr = "eval: " + e; } })
      .catch(function (e) { window.__apBootErr = "RequestFile: " + e; });

<script>

  const st = { balance:1240000, chips:[10000,50000,100000,250000,500000], limits:[10000,500000], gate:"" };
  push("casino", JSON.parse(JSON.stringify(st)));
  const W = [6,5,4,3,2], PAYS = [8,12,22,45,150];
  const roll = () => { let r = Math.random() * 20, i = 0; while ((r -= W[i]) > 0) i++; return i; };
  let busy = false;
  return {
    on(n, f) { (subs[n] = subs[n] || []).push(f); if (n in last) f(last[n]); },
    call(name, a) {
      if (name !== "casPlay" || a[0] !== "slots") return Promise.resolve({ ok:true });
      if (busy) return Promise.resolve({ ok:false, msg:"reels live" });
      let bet = Math.max(st.limits[0], Math.min(st.limits[1], a[2][0] | 0));
      if (bet > st.balance) return Promise.resolve({ ok:false, msg:"not enough in the bank" });

        const mult = (r[0] === r[1] && r[1] === r[2]) ? PAYS[r[0]] : 0;
        const ret = bet * mult;
        st.balance += ret; push("casino", JSON.parse(JSON.stringify(st)));
        push("casResult", { game:"slots", payload:[r, mult, bet, ret, ret - bet] });
        busy = false;

function feltGL(canvas) {

  if (!gl) { canvas.style.background = "radial-gradient(ellipse at 50% 30%,#0d2a1e,#050b09 75%)"; return { kick(){} }; }

    const R = reels[i], cyC = y + h / 2, sr = w * .26;
    const blur = Math.min(1, Math.abs(R.v) / 10);
    for (let k = Math.floor(R.p) - 2; k <= Math.floor(R.p) + 2; k++) {
      const sy = cyC + (k - R.p) * row;
      if (sy < y - row || sy > y + h + row) continue;
      const s = ((k % 5) + 5) % 5;
      if (blur > .15) {
        drawSym(cx, s, x + w / 2, sy + R.v * row * .012, sr, .25);
        drawSym(cx, s, x + w / 2, sy - R.v * row * .012, sr, .25);
        drawSym(cx, s, x + w / 2, sy, sr, .5);
      } else drawSym(cx, s, x + w / 2, sy, sr);
    }
    // window shading
    const sh = cx.createLinearGradient(0, y, 0, y + h);
    sh.addColorStop(0, "rgba(0,0,0,.85)"); sh.addColorStop(.28, "rgba(0,0,0,0)");
    sh.addColorStop(.72, "rgba(0,0,0,0)"); sh.addColorStop(1, "rgba(0,0,0,.85)");
    cx.fillStyle = sh; cx.fillRect(x, y, w, h);
    cx.restore();
    cx.strokeStyle = "rgba(0,0,0,.9)"; cx.lineWidth = 2;
    cx.beginPath(); cx.roundRect(x, y, w, h, MW * .012); cx.stroke();
    cx.strokeStyle = "rgba(255,255,255,.05)";
    cx.beginPath(); cx.roundRect(x + 1.5, y + 1.5, w - 3, h - 3, MW * .011); cx.stroke();
  }
  // payline
  const win = result && result.mult > 0 && !spinning;
  const flash = win && flashT > 0 ? (Math.sin(flashT / 90) * .5 + .5) : 0;
  const plc = win ? "rgba(201,226,26," + (.55 + .45 * flash) + ")" : "rgba(201,226,26,.35)";
  cx.strokeStyle = plc; cx.lineWidth = Math.max(1.5, MH * .006);
  cx.shadowColor = "rgba(201,226,26,.8)"; cx.shadowBlur = win ? MH * .03 * (1 + flash) : MH * .012;
  cx.beginPath(); cx.moveTo(pad * .35, MH / 2); cx.lineTo(MW - pad * .35, MH / 2); cx.stroke();
  cx.shadowBlur = 0;
  cx.fillStyle = plc;
  cx.beginPath(); cx.moveTo(pad * .18, MH / 2 - MH * .022); cx.lineTo(pad * .18, MH / 2 + MH * .022); cx.lineTo(pad * .18 + MW * .016, MH / 2); cx.closePath(); cx.fill();
  cx.beginPath(); cx.moveTo(MW - pad * .18, MH / 2 - MH * .022); cx.lineTo(MW - pad * .18, MH / 2 + MH * .022); cx.lineTo(MW - pad * .18 - MW * .016, MH / 2); cx.closePath(); cx.fill();
}

/* ---- spin machinery: cruise until casResult, then stop L→R on the server's reels ---- */
let lastTicks = [0, 0, 0];
function loop(t) {
  if (!spinning && flashT <= 0) { drawMachine(); return; }
  let allDone = true;
  reels.forEach((R, i) => {
    if (R.mode === "accel") {
      allDone = false;
      R.v = Math.min(R.v + .9, 16);
      R.p += R.v / 60;
      if (R.v >= 16 && R.plan) startLand(R, t);
    } else if (R.mode === "cruise") {
      allDone = false;
      R.p += R.v / 60;
      if (R.plan) startLand(R, t);
    } else if (R.mode === "land") {
      allDone = false;
      const L = R.plan, q = Math.min(1, (t - L.t0) / L.dur);
      if (L.hang) {
        /* the near-miss: ease to HALF A STEP SHORT, hold, then drop the last half row */
        const shy = L.P - 0.45;
        if (q < .74) { const e = 1 - Math.pow(1 - q / .74, 3); R.p = L.p0 + (shy - L.p0) * e; R.v = 12 * (1 - q / .74); }
        else if (q < .88) { R.p = shy; R.v = 0; }           // the hang — dead still, no blur
        else { const e = 1 - Math.pow(1 - (q - .88) / .12, 2); R.p = shy + (L.P - shy) * e; R.v = 2; }
      } else {
        const e = 1 - Math.pow(1 - q, 3);
        R.p = L.p0 + (L.P - L.p0) * e;
        R.v = 12 * (1 - q);
      }
      if (q >= 1) { R.p = L.P; R.v = 0; R.mode = "done"; R.plan = null; clunk(); }
    }
    if (Math.floor(R.p) !== lastTicks[i] && R.mode !== "idle" && R.mode !== "done") {
      lastTicks[i] = Math.floor(R.p);
      if (i === 2 || Math.random() < .5) beep(900 + i * 150, .02, .014);
    }
  });
  if (flashT > 0) flashT -= 16;
  drawMachine();
  if (allDone && spinning) { spinning = false; settle(); }
  if (spinning || flashT > 0) requestAnimationFrame(loop);
  else drawMachine();
}
function startLand(R, t) {
  const L = R.plan;
  L.t0 = t; L.p0 = R.p;
  let P = Math.ceil(R.p + L.lead);
  P += ((L.sym - (((P % 5) + 5) % 5)) + 5) % 5;
  L.P = P;
  R.mode = "land";
}
function settle() {
  const r = result;
  const near = r.reels[0] === r.reels[1] && r.reels[1] !== r.reels[2];
  if (r.mult > 0) {
    flashT = 1400;
    winSting(r.mult);
    countUp(r.ret);
    $("#resLbl").textContent = "THREE " + SYM[r.reels[0]].nm + (r.mult >= 150 ? " — THE JACKPOT" : "");
    $("#lastR").textContent = SYM[r.reels[0]].nm + " ×3 — " + r.mult + "× — " + F(r.ret);
    $("#lastR").style.color = "var(--acc)";
    say("// CREDITED " + F(r.ret) + " @ " + r.mult + "× — SERVER SETTLED", "good");
  } else {
    setRes("NO LINE", near ? "ONE SHY — " + SYM[r.reels[0]].nm + " ×2" : "NO MATCH", "var(--dim)");
    $("#lastR").textContent = "NO LINE — HOUSE KEEPS " + F(r.bet);
    $("#lastR").style.color = "var(--dim)";
    say(near ? "// ONE SHY — THAT THIRD REEL HAS A SENSE OF HUMOUR" : "// NO LINE — HOUSE KEEPS " + F(r.bet), near ? "warn" : "");
  }
  logSpin(r, near);
  syncGo();
  felt.kick(3000);
}
function countUp(n) {
  const el = $("#resBig"); el.style.color = "var(--acc)";
  $("#resLbl").textContent = "YOU WIN";
  const t0 = performance.now();
  (function step(t) {
    const p = Math.min(1, (t - t0) / 900), e = 1 - Math.pow(1 - p, 2);
    el.textContent = F(n * e);
    if (p < 1) requestAnimationFrame(step);
  })(t0);
}
function setRes(big, lbl, col) { $("#resBig").textContent = big; $("#resBig").style.color = col; $("#resLbl").textContent = lbl; }

/* ---- bet bar ---- */
let cas = null, bet = 50000;
function setBet(n, fromInput) {
  if (cas) n = Math.max(cas.limits[0], Math.min(cas.limits[1], n || cas.limits[0]));
  bet = n;
  if (!fromInput) $("#betIn").value = bet.toLocaleString();
  [...$("#chips").children].forEach(c => c.classList.toggle("on", +c.dataset.v === bet));
  syncGo();
}
function renderChips() {
  $("#chips").innerHTML = cas.chips.map(v =>
    '<button class="chip" data-v="' + v + '">' + (v >= 1000000 ? v / 1000000 + "M" : v / 1000 + "K") + "</button>").join("");
  [...$("#chips").children].forEach(c => c.onclick = () => { setBet(+c.dataset.v); felt.kick(2000); });
  $("#clamp").textContent = cas.limits[0] / 1000 + "K–" + cas.limits[1] / 1000 + "K";
}
$("#betIn").addEventListener("input", e => { const n = +e.target.value.replace(/[^\d]/g, ""); if (n) setBet(n, true); });
$("#betIn").addEventListener("blur", () => setBet(bet));
$("#betIn").addEventListener("keydown", e => { if (e.key === "Enter") { setBet(bet); $("#go").click(); } });
$("#betMax").onclick = () => setBet(cas ? Math.min(cas.limits[1], cas.balance) : 500000);

/* ---- wiring ---- */
let statusT = null;
function say(m, tone) {
  const el = $("#status");
  el.textContent = m;
  el.style.color = tone === "bad" ? "var(--danger)" : tone === "good" ? "var(--acc)" : tone === "warn" ? "var(--amber)" : "var(--faint)";
  clearTimeout(statusT);
  statusT = setTimeout(() => { el.textContent = defaultStatus(); el.style.color = "var(--faint)"; }, 3600);
}
function defaultStatus() {
  return cas && cas.gate ? "// TABLE CLOSED TO YOU — " + cas.gate.toUpperCase()
    : "// REELS ARE WEIGHTED 6·5·4·3·2 — THE SEVEN IS RAREST AND THE SERVER ROLLS · ESC LEAVES";
}
function syncGo() {
  const b = $("#go");
  b.textContent = spinning ? "REELS LIVE…" : "SPIN — " + F(bet);
  b.disabled = spinning || !cas || !!cas.gate || cas.balance < bet;
  if (cas && cas.gate) say("// " + cas.gate.toUpperCase(), "bad");
}
$("#go").onclick = () => {
  if (spinning) return;
  AP.call("casPlay", ["slots", "play", [bet]]).then(r => {
    if (r && r.ok === false) { say("// REFUSED — " + (r.msg || "").toUpperCase(), "bad"); return; }
    spinning = true; result = null;
    setRes("—", "REELS LIVE", "var(--dim)");
    reels.forEach(R => { R.mode = "accel"; R.v = 0; R.plan = null; });
    felt.kick(8000);
    syncGo();
    requestAnimationFrame(loop);
  });
};
function logSpin(r, near) {
  const box = $("#sess");
  if (box.firstChild && box.firstChild.tagName === "SPAN") box.innerHTML = "";
  const d = new Date(), tm = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  const row = document.createElement("div");
  row.className = "row";
  const names = r.reels.map(s => SYM[s].nm[0] + SYM[s].nm.slice(1, 3).toLowerCase()).join("·");
  row.innerHTML = '<span class="t">' + tm + '</span><span class="l">' + names + (near ? " · ONE SHY" : "") +
    '</span><span class="n" style="color:' + (r.net >= 0 ? "var(--acc)" : "var(--danger)") + '">' + (r.net >= 0 ? "+" : "−") + F(Math.abs(r.net)).slice(1) + "</span>";
  box.prepend(row);
  while (box.children.length > 12) box.removeChild(box.lastChild);
}
AP.on("casino", v => { cas = v; $("#bal").textContent = F(v.balance); if (!$("#chips").children.length) renderChips(); setBet(bet); });
AP.on("casResult", r => {
  if (r.game !== "slots") return;
  if (!spinning || result) return;   // bridge replays the last value on subscribe — ignore stale/duplicate results
  const p = r.payload;
  result = { reels:p[0], mult:p[1], bet:p[2], ret:p[3], net:p[4] };
  const near = p[0][0] === p[0][1] && p[0][1] !== p[0][2];
  reels.forEach((R, i) => {
    R.plan = { sym:p[0][i], dur:900 + i * 700 + (near && i === 2 ? 950 : 0), lead:3 + i * 2, hang:near && i === 2 };
  });
});

/* paytable */
(function () {
  const box = $("#pay");
  SYM.forEach((s, i) => {
    const row = document.createElement("div");
    row.className = "row";
    const c = document.createElement("canvas");
    c.width = c.height = 40;
    drawSym(c.getContext("2d"), i, 20, 20, 11);
    row.appendChild(c);
    row.insertAdjacentHTML("beforeend", '<span class="nm">' + s.nm + '</span><span class="odds">' + s.odds + '</span><span class="x">' + s.pay + "×</span>");
    box.appendChild(row);
  });
})();
fit(); sizeMachine(); drawMachine(); felt.kick(6000);
$("#status").textContent = defaultStatus();
</script>
</body></html>
