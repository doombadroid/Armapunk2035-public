     network, no storage. AP stub behind a guard.

     CONTRACT
       AP.on("casino", { balance, chips:[amounts], limits:[min,max], gate })
       AP.on("casResult", { game:"crash", payload })
         payload = ["start", bet, startTime]
                 | ["cashout", mult, bet, ret]
                 | ["bust", bustMult, bet, 0]
       AP.call("casPlay", ["crash","deal",[bet]])     // reply = SENT, not settled
       AP.call("casPlay", ["crash","cashout",[]])
     The bust point is decided server-side THE MOMENT you bet (7% instant at
     1.00×, else 0.93/(1−r) capped 20×). The page animates a clock, asks to
     leave, and renders whatever comes back. It never computes an outcome; a
     cashout's multiplier is the server's number, and a bust snaps the line to
     the server's bustMult wherever the local clock thought it was.

     CURVE: mult(t) = e^(0.13·t) — 2× ≈ 5.3s, 20× ≈ 23s. ⚠ This constant must
     match the server's round clock; confirm against APS_fnc_crash before ship.

     WHAT ANIMATES: this is the one continuously-animating table (spec §4).
     During a live round the graph canvas (~55% of surface) redraws every frame
     and the felt runs at 30fps. Between rounds EVERYTHING is still — the rAF
     stops after the result FX (~1.5s). Audio: pitch-rising ticks while live,
     cashout sting, bust thud; SND toggle. -->

/* ---- BRIDGE SHIM (installed by tools/install_casino_pages.py) --------------
   window.WEBUI does not exist while this page's own script runs; the bridge is
   INJECTED afterwards. Anything that touches it at load is silently deaf, which
   is how the first web shop shipped.

   AP is defined here, synchronously, before the page's script -- so its
   `if (typeof AP === "undefined")` dev stub never installs, and every on()/call()
   made before the bridge lands is queued and flushed when it does. -------- */
(function () {
  var subs = {}, queued = [], W = null;
  window.WEBUIReady = new Promise(function (r) { window.__webuiReady = r; });
  /* Instrumentation for AP_fnc_casinoDiag. The browser console is unreachable
     in game -- Esc opens it and closes the dialog -- so a deaf page has to be
     able to say why on its own surface. */
  window.__apSubs = subs;
  /* A throw inside a channel handler is CAUGHT by webui.js and console.error'd,
     and the console is unreachable in game -- so a payload the page cannot read
     looks exactly like a payload that never arrived. Wrapping every handler
     records the first failure where the diagnostic can print it. */
  function guard(n, f) {
    return function (v) {
      try { return f(v); }
      catch (e) { if (!window.__apHandlerErr) window.__apHandlerErr = n + ": " + e; throw e; }
    };

  window.AP = {
    __shim: true,
    on: function (n, f) {
      (subs[n] = subs[n] || []).push(guard(n, f));
      if (W) W.on(n, subs[n][subs[n].length - 1]);
    },
    call: function (n, a) {
      if (W) return W.call(n, a || [], 20000);
      return new Promise(function (res, rej) { queued.push([n, a || [], res, rej]); });
    },
    handle: function (n, f) { if (W) W.handle(n, f); }
  };
  window.WEBUIReady.then(function (w) {
    W = w;
    Object.keys(subs).forEach(function (n) { subs[n].forEach(function (f) { W.on(n, f); }); });
    W.on("casino", function () { window.__apGotCasino = true; });
    queued.forEach(function (q) { W.call(q[0], q[1], 20000).then(q[2], q[3]); });
    queued = [];

     the src quietly resolves to nothing. SQF injects the same file too and
     webui.js is idempotent, so whichever lands first wins. */
  if (typeof A3API !== "undefined" && A3API.RequestFile) {

      .then(function (s) { try { (0, eval)(s); } catch (e) { window.__apBootErr = "eval: " + e; } })
      .catch(function (e) { window.__apBootErr = "RequestFile: " + e; });

<script>
/* ---- AP stub (dev only — the real bridge replaces it). The bust distribution
   here mirrors the spec for demo feel; in game the SERVER decides. ---- */
if (typeof AP === "undefined") window.AP = (function () {
  const subs = {}, last = {};
  const push = (n, v) => { last[n] = v; (subs[n] || []).forEach(f => f(v)); };
  const st = { balance:1240000, chips:[10000,50000,100000,250000,500000], limits:[10000,500000], gate:"" };
  push("casino", JSON.parse(JSON.stringify(st)));
  const K = 0.1386, mult = t => Math.exp(K * t);
  let round = null;
  return {
    on(n, f) { (subs[n] = subs[n] || []).push(f); if (n in last) f(last[n]); },
    call(name, a) {
      if (name !== "casPlay" || a[0] !== "crash") return Promise.resolve({ ok:true });
      if (a[1] === "deal") {
        if (round) return Promise.resolve({ ok:false, msg:"round live" });
        let bet = Math.max(st.limits[0], Math.min(st.limits[1], a[2][0] | 0));
        if (bet > st.balance) return Promise.resolve({ ok:false, msg:"not enough in the bank" });
        const r = Math.random();
        const bustM = r < .07 ? 1 : Math.min(20, .93 / (1 - Math.random()));
        const tBust = bustM <= 1 ? .05 : Math.log(bustM) / K;
        st.balance -= bet; push("casino", JSON.parse(JSON.stringify(st)));
        round = { bet, bustM, t0: performance.now() };
        push("casResult", { game:"crash", payload:["start", bet, Date.now()] });
        round.timer = setTimeout(() => {
          push("casResult", { game:"crash", payload:["bust", Math.round(bustM * 100) / 100, bet, 0] });
          round = null;
        }, tBust * 1000);
        return Promise.resolve({ ok:true, msg:"sent" });
      }
      if (a[1] === "cashout") {
        if (!round) return Promise.resolve({ ok:false, msg:"no live round" });
        const t = (performance.now() - round.t0) / 1000;
        const m = Math.min(20, Math.min(round.bustM, mult(t)));
        if (m >= round.bustM) return Promise.resolve({ ok:true });   // too late — bust already fired
        clearTimeout(round.timer);
        const ret = Math.round(round.bet * m);
        st.balance += ret; push("casino", JSON.parse(JSON.stringify(st)));
        push("casResult", { game:"crash", payload:["cashout", Math.round(m * 100) / 100, round.bet, ret] });
        round = null;
        return Promise.resolve({ ok:true, msg:"sent" });
      }
      return Promise.resolve({ ok:true });
    },
    _push:push
  };
})();

const $ = s => document.querySelector(s);

const F = n => "$" + Math.round(n).toLocaleString();

/* ---- WebGL felt (same shader as the landing) ---- */
function feltGL(canvas) {
  const gl = canvas.getContext("webgl", { antialias:false, alpha:false, powerPreference:"low-power" });
  if (!gl) { canvas.style.background = "radial-gradient(ellipse at 50% 30%,#0d2a1e,#050b09 75%)"; return { kick(){} }; }

  const Fs = "precision mediump float;uniform vec2 R;uniform float T;" +
    "float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}" +
    "float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);" +
    "return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}" +

    "float weave=n(q*150.)*.6+n(q*300.+7.)*.4;" +
    "float fb=n(q*3.2+T*.008);" +
    "vec3 c=vec3(.045,.155,.11)*(.8+.3*fb)+(weave-.5)*.045;" +
    "vec2 lp=vec2(.42+.2*sin(T*.045),.30+.12*cos(T*.033));" +
    "float d=distance(q,lp*vec2(R.x/R.y,1.));" +
    "c+=vec3(1.,.66,.16)*.085*exp(-d*d*5.5);" +
    "float e=max(abs(uv.x-.5),abs(uv.y-.5))*2.;" +
    "c+=vec3(.75,.85,.12)*.035*pow(e,3.);" +
    "float m=smoothstep(.992,1.,n(q*20.+vec2(T*.018,-T*.011)));" +
    "c+=vec3(.75,.85,.45)*m*.28;" +
    "c*=1.-.5*pow(e,3.5);" +
    "gl_FragColor=vec4(c,1.);}";

    if (t - lastF >= 33) { lastF = t; draw(t); }
    raf = requestAnimationFrame(frame);

  return { kick(ms) { until = performance.now() + (ms || 9000); if (!raf) raf = requestAnimationFrame(frame); } };

  cx.textAlign = "left"; cx.textBaseline = "middle"; cx.fillStyle = "rgba(127,147,138,.6)";
  const mStep = mW <= 3 ? .5 : mW <= 6 ? 1 : mW <= 12 ? 2 : 5;

    cx.globalAlpha = .1; cx.fillStyle = col; cx.fill(); cx.globalAlpha = 1;

    cx.fillStyle = col; cx.shadowColor = col; cx.shadowBlur = GH * .025; cx.fill(); cx.shadowBlur = 0;
    // big readout

    cx.font = "800 " + Math.round(GH * .17) + "px ui-monospace,Menlo,monospace";
    cx.fillStyle = col;
    cx.shadowColor = col; cx.shadowBlur = GH * .04;
    cx.fillText(m.toFixed(2) + "×", GW / 2, GH * .34);
    cx.shadowBlur = 0;
    cx.font = "700 " + Math.round(GH * .036) + "px ui-monospace,Menlo,monospace";
    cx.fillStyle = "rgba(220,239,224,.75)";
    cx.fillText(live ? "LEAVE WITH " + F(round.bet * m) : round.done === "cash" ? "CASHED OUT — " + F(round.ret) : "BUST — HOUSE TAKES " + F(round.bet), GW / 2, GH * .34 + GH * .12);
  } else {
    cx.textAlign = "center"; cx.textBaseline = "middle";
    cx.font = "800 " + Math.round(GH * .07) + "px ui-monospace,Menlo,monospace";
    cx.fillStyle = "rgba(127,147,138,.55)";
    cx.fillText("PLACE A BET", GW / 2, GH * .42);
    cx.font = "600 " + Math.round(GH * .032) + "px ui-monospace,Menlo,monospace";
    cx.fillText("THE BUST POINT IS ALREADY DECIDED WHEN THE LINE STARTS", GW / 2, GH * .42 + GH * .07);
  }
}
function liveLoop() {
  if (!round || !round.live) return;
  const t = curT(), m = Math.min(20, mult(t));
  drawGraph();
  $("#go").textContent = "CASH OUT — " + F(round.bet * m);
  $("#now").textContent = F(round.bet * m) + " @ " + m.toFixed(2) + "×";
  if (t - lastTick > .5) { lastTick = t; beep(400 + m * 120, .03, .018); }
  requestAnimationFrame(liveLoop);
}

/* ---- bet bar ---- */
let cas = null, bet = 50000;
function setBet(n, fromInput) {
  if (cas) n = Math.max(cas.limits[0], Math.min(cas.limits[1], n || cas.limits[0]));
  bet = n;
  if (!fromInput) $("#betIn").value = bet.toLocaleString();
  [...$("#chips").children].forEach(c => c.classList.toggle("on", +c.dataset.v === bet));
  syncGo();
}
function renderChips() {
  $("#chips").innerHTML = cas.chips.map(v =>
    '<button class="chip" data-v="' + v + '">' + (v >= 1000000 ? v / 1000000 + "M" : v / 1000 + "K") + "</button>").join("");
  [...$("#chips").children].forEach(c => c.onclick = () => { setBet(+c.dataset.v); felt.kick(2000); });
  $("#clamp").textContent = cas.limits[0] / 1000 + "K–" + cas.limits[1] / 1000 + "K";
}
$("#betIn").addEventListener("input", e => { const n = +e.target.value.replace(/[^\d]/g, ""); if (n) setBet(n, true); });
$("#betIn").addEventListener("blur", () => setBet(bet));
$("#betIn").addEventListener("keydown", e => { if (e.key === "Enter") { setBet(bet); $("#go").click(); } });
$("#betMax").onclick = () => setBet(cas ? Math.min(cas.limits[1], cas.balance) : 500000);

/* ---- wiring ---- */
let statusT = null;
function say(m, tone) {
  const el = $("#status");
  el.textContent = m;
  el.style.color = tone === "bad" ? "var(--danger)" : tone === "good" ? "var(--acc)" : tone === "warn" ? "var(--amber)" : "var(--faint)";
  clearTimeout(statusT);
  statusT = setTimeout(() => { el.textContent = defaultStatus(); el.style.color = "var(--faint)"; }, 3600);
}
function defaultStatus() {
  return cas && cas.gate ? "// TABLE CLOSED TO YOU — " + cas.gate.toUpperCase()
    : "// 7% OF ROUNDS BUST ON THE FIRST FRAME — THE OTHER 93% ARE A NERVE TEST · ESC LEAVES";
}
function syncGo() {
  const b = $("#go");
  if (round && round.live) { b.disabled = false; b.classList.add("live"); return; }
  b.classList.remove("live");
  b.textContent = "PLACE BET — " + F(bet);
  b.disabled = !cas || !!cas.gate || (round && round.cooling) || cas.balance < bet;
  if (cas && cas.gate) say("// " + cas.gate.toUpperCase(), "bad");
}
$("#go").onclick = () => {
  if (round && round.live) { AP.call("casPlay", ["crash", "cashout", []]); return; }
  AP.call("casPlay", ["crash", "deal", [bet]]).then(r => {
    if (r && r.ok === false) say("// REFUSED — " + (r.msg || "").toUpperCase(), "bad");
  });
};
function logRound(kind, m, net) {
  const box = $("#sess");
  if (box.firstChild && box.firstChild.tagName === "SPAN") box.innerHTML = "";
  const d = new Date(), tm = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  const row = document.createElement("div");
  row.className = "row";
  row.innerHTML = '<span class="t">' + tm + '</span><span class="l">' + kind + " @ " + m.toFixed(2) + '×</span>' +
    '<span class="n" style="color:' + (net >= 0 ? "var(--acc)" : "var(--danger)") + '">' + (net >= 0 ? "+" : "−") + F(Math.abs(net)).slice(1) + "</span>";
  box.prepend(row);
  while (box.children.length > 12) box.removeChild(box.lastChild);
  const h = $("#hist");
  if (h.firstChild && h.firstChild.tagName === "SPAN") h.innerHTML = "";
  const chip = document.createElement("span");
  chip.className = "h";
  chip.style.color = m < 1.5 ? "var(--danger)" : m < 2 ? "var(--dim)" : m < 10 ? "var(--acc)" : "var(--amber)";
  chip.textContent = m.toFixed(2) + "×";
  h.prepend(chip);
  while (h.children.length > 10) h.removeChild(h.lastChild);
}
AP.on("casino", v => { cas = v; $("#bal").textContent = F(v.balance); if (!$("#chips").children.length) renderChips(); setBet(bet); });
AP.on("casResult", r => {
  if (r.game !== "crash") return;
  const p = r.payload;
  if (p[0] === "start") {
    round = { live:true, bet:p[1], t0:performance.now() };
    lastTick = 0;
    felt.kick(30000);
    syncGo();
    say("// ROUND LIVE — THE BUST POINT IS ALREADY SET", "warn");
    requestAnimationFrame(liveLoop);
  } else if (p[0] === "cashout") {
    round = { done:"cash", m:p[1], bet:p[2], ret:p[3], tEnd:Math.log(Math.max(1.01, p[1])) / K };
    cashSting();
    $("#lastR").textContent = "CASHED @ " + p[1].toFixed(2) + "× — " + F(p[3]);
    $("#lastR").style.color = "var(--acc)";
    logRound("CASHED", p[1], p[3] - p[2]);
    say("// CREDITED " + F(p[3]) + " — SERVER SETTLED", "good");
    endRound();
  } else if (p[0] === "bust") {
    round = { done:"bust", m:p[1], bet:p[2], tEnd:Math.log(Math.max(1.01, p[1])) / K };
    bustThud();
    $("#pit").classList.remove("shake"); void $("#pit").offsetWidth; $("#pit").classList.add("shake");
    $("#lastR").textContent = "BUST @ " + p[1].toFixed(2) + "×";
    $("#lastR").style.color = "var(--danger)";
    logRound("BUST", p[1], -p[2]);
    say(p[1] <= 1 ? "// INSTANT BUST — THE 7% · HOUSE TAKES IT" : "// BUST @ " + p[1].toFixed(2) + "× — HOUSE TAKES IT", "bad");
    endRound();
  }
});
function endRound() {
  drawGraph();
  $("#now").textContent = "—";
  round.cooling = true;
  syncGo(); $("#go").disabled = true;
  felt.kick(3000);
  setTimeout(() => { round.cooling = false; syncGo(); }, 900);
}
fit(); sizeGraph(); drawGraph(); felt.kick(6000);
$("#status").textContent = defaultStatus();
</script>
</body></html>
