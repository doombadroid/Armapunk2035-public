     no <script src>, no network, no storage. AP stub behind a guard.

     CONTRACT (landing consumes only the state channel)
       AP.on("casino", { balance, chips:[amounts], limits:[min,max],
                         gate:"",                       // non-empty = reason play is blocked
                         wheel:{ cost, freeAvailable } })
       Navigation: each tile asks the game to swap pages. In this review copy the
       WHEEL tile links to casino-wheel.html; unbuilt tables report to the strip.

     WHAT ANIMATES: the WebGL felt (weave, drifting key light, motes) runs at
     ~30fps for 9s after load or pointer activity, then freezes to a still frame
     (zero cost). Tile hovers are CSS transforms. Nothing else moves. -->

<script>
/* ---- BRIDGE SHIM (installed by tools/install_casino_pages.py) --------------
   window.WEBUI does not exist while this page's own script runs; the bridge is
   INJECTED afterwards. Anything that touches it at load is silently deaf, which
   is how the first web shop shipped.

   AP is defined here, synchronously, before the page's script -- so its
   `if (typeof AP === "undefined")` dev stub never installs, and every on()/call()
   made before the bridge lands is queued and flushed when it does. -------- */
(function () {
  var subs = {}, queued = [], W = null;
  window.WEBUIReady = new Promise(function (r) { window.__webuiReady = r; });
  /* Instrumentation for AP_fnc_casinoDiag. The browser console is unreachable
     in game -- Esc opens it and closes the dialog -- so a deaf page has to be
     able to say why on its own surface. */
  window.__apSubs = subs;
  /* A throw inside a channel handler is CAUGHT by webui.js and console.error'd,
     and the console is unreachable in game -- so a payload the page cannot read
     looks exactly like a payload that never arrived. Wrapping every handler
     records the first failure where the diagnostic can print it. */
  function guard(n, f) {
    return function (v) {
      try { return f(v); }
      catch (e) { if (!window.__apHandlerErr) window.__apHandlerErr = n + ": " + e; throw e; }
    };
  }
  window.AP = {
    __shim: true,
    on: function (n, f) {
      (subs[n] = subs[n] || []).push(guard(n, f));
      if (W) W.on(n, subs[n][subs[n].length - 1]);
    },
    call: function (n, a) {
      if (W) return W.call(n, a || [], 20000);
      return new Promise(function (res, rej) { queued.push([n, a || [], res, rej]); });
    },
    handle: function (n, f) { if (W) W.handle(n, f); }
  };
  /* SOME PAGES CALL BACK, THEY DO NOT AWAIT. holdem.html's helper is
     AP.call(name, args, cb) -- a third argument webui.js's promise-returning
     call(name, args, timeout) knows nothing about. Unbridged, every hSit/hAct
     answer resolves into nothing: a refused seat or an illegal raise returns
     {ok:false,err:"..."} and the page never runs the flash() that would show it,
     so the click looks like it did nothing at all. Same shape the duty terminal
     needed (fn dutyTermBridge / duty_maxsec.html), same fix.
     A REJECTED promise -- the 20 s shim timeout, or an SQF handler that threw --
     becomes the page's own refusal shape too, carrying BOTH keys because the
     older tables read r.msg and holdem.html reads r.err. The wrapper still
     returns the promise, so the .then() callers are untouched. */
  var _rawCall = window.AP.call;
  window.AP.call = function (n, a, cb) {
    var p = _rawCall(n, a).catch(function () {
      return { ok: false, err: "NO ANSWER FROM THE SERVER -- TRY AGAIN",
                          msg: "NO ANSWER FROM THE SERVER -- TRY AGAIN" };
    });
    if (typeof cb !== "function") { return p; }
    p.then(function (v) {
      try { cb(v); }
      catch (e) { if (!window.__apCbErr) window.__apCbErr = n + ": " + e; }
    });
    return p;
  };
  window.WEBUIReady.then(function (w) {
    W = w;
    Object.keys(subs).forEach(function (n) { subs[n].forEach(function (f) { W.on(n, f); }); });
    W.on("casino", function () { window.__apGotCasino = true; });
    queued.forEach(function (q) { W.call(q[0], q[1], 20000).then(q[2], q[3]); });
    queued = [];
  });
  /* A <script src> cannot work here -- the page has no resolvable base URL and
     the src quietly resolves to nothing. SQF injects the same file too and
     webui.js is idempotent, so whichever lands first wins. */
  if (typeof A3API !== "undefined" && A3API.RequestFile) {
    A3API.RequestFile("webui\\ui\\webui.js")
      .then(function (s) { try { (0, eval)(s); } catch (e) { window.__apBootErr = "eval: " + e; } })
      .catch(function (e) { window.__apBootErr = "RequestFile: " + e; });
  } else {
    window.__apBootErr = "no A3API on this page";
  }
})();
</script>

<script>
/* ---- AP stub (dev only) ---- */
if (typeof AP === "undefined") window.AP = (function () {
  const subs = {}, last = {};
  const push = (n, v) => { last[n] = v; (subs[n] || []).forEach(f => f(v)); };
  push("casino", { balance:1240000, chips:[10000,50000,100000,250000,500000],
    limits:[10000,500000], gate:"", wheel:{ cost:50000, freeAvailable:true } });
  return { on(n, f) { (subs[n] = subs[n] || []).push(f); if (n in last) f(last[n]); },
           call() { return Promise.resolve({ ok:true }); }, _push:push };
})();

const $ = s => document.querySelector(s);
function fit() { document.documentElement.style.fontSize = Math.max(9, $("#frame").getBoundingClientRect().width / 75) + "px"; }
window.addEventListener("resize", fit); fit();
const F = n => "$" + Math.round(n).toLocaleString();

/* ---- WebGL felt (shared backdrop — copied into each table file) ---- */
function feltGL(canvas) {
  const gl = canvas.getContext("webgl", { antialias:false, alpha:false, powerPreference:"low-power" });
  if (!gl) { canvas.style.background = "radial-gradient(ellipse at 50% 30%,#0d2a1e,#050a10 75%)"; return { kick(){} }; }
  const V = "attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";
  const Fs = "precision mediump float;uniform vec2 R;uniform float T;" +
    "float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}" +
    "float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);" +
    "return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}" +
    "void main(){vec2 uv=gl_FragCoord.xy/R;vec2 q=uv*vec2(R.x/R.y,1.);" +
    "float weave=n(q*150.)*.6+n(q*300.+7.)*.4;" +
    "float fb=n(q*3.2+T*.008);" +
    "vec3 c=vec3(.045,.155,.11)*(.8+.3*fb)+(weave-.5)*.045;" +
    "vec2 lp=vec2(.5+.2*sin(T*.045),.30+.12*cos(T*.033));" +
    "float d=distance(q,lp*vec2(R.x/R.y,1.));" +
    "c+=vec3(1.,.66,.16)*.085*exp(-d*d*5.5);" +
    "float e=max(abs(uv.x-.5),abs(uv.y-.5))*2.;" +
    "c+=vec3(.75,.85,.12)*.035*pow(e,3.);" +
    "float m=smoothstep(.992,1.,n(q*20.+vec2(T*.018,-T*.011)));" +
    "c+=vec3(.75,.85,.45)*m*.28;" +
    "c*=1.-.5*pow(e,3.5);" +
    "gl_FragColor=vec4(c,1.);}";
  function sh(t, s) { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); return o; }
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, V)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, Fs));
  gl.linkProgram(pr); gl.useProgram(pr);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, "p");
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const uR = gl.getUniformLocation(pr, "R"), uT = gl.getUniformLocation(pr, "T");
  let until = 0, raf = 0, lastF = 0;
  function size() {
    const r = canvas.getBoundingClientRect();
    canvas.width = Math.round(r.width); canvas.height = Math.round(r.height);
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  window.addEventListener("resize", () => { size(); draw(performance.now()); });
  function draw(t) { gl.uniform2f(uR, canvas.width, canvas.height); gl.uniform1f(uT, t / 1000); gl.drawArrays(gl.TRIANGLES, 0, 3); }
  function frame(t) {
    raf = 0;
    if (t > until) { draw(t); return; }              // final still frame
    if (t - lastF >= 33) { lastF = t; draw(t); }     // ~30fps
    raf = requestAnimationFrame(frame);
  }
  size();
  return { kick(ms) { until = performance.now() + (ms || 9000); if (!raf) raf = requestAnimationFrame(frame); } };
}
const felt = feltGL($("#gl"));
felt.kick(9000);

/* ---- floor ---- */
const TILES = [

  { id:"crash",    g:"gcrash",    nm:"CRASH",      fact:"The line climbs until it doesn't. Leave before it goes. Cap 20×.",     built:true, href:"casino-crash.html" },

let cas = null;
function renderFloor() {
  $("#floor").innerHTML = TILES.map(t => {
    const wheel = t.id === "wheel";
    const gate = cas && cas.gate;
    const tag = wheel ? "wheelTile tile" : "tile" + (t.wide ? " wide6" : "") + (t.built ? "" : " soon");
    const el = t.built && !gate ? "a" : "button";

      ? '<span style="color:var(--amber)">' + (cas ? F(cas.wheel.cost) : "—") + ' A SPIN</span>' +
        '<span class="cars"><span class="car" style="color:var(--amber)">IFRIT $1.25M</span><span class="car" style="color:var(--magenta)">QILIN $2M</span><span class="car" style="color:var(--acc2)">BLACKFISH $5M</span></span>' +
        '<span class="play">' + (t.built ? "PLAY ▸" : "IN DESIGN") + "</span>"

      ? '<span>6 SEATS · LIVE PLAYERS · WINNER TAKES THE POT</span><span class="play">' + (t.built ? "PLAY ▸" : "IN DESIGN") + "</span>"
      : "<span>" + (cas ? (cas.limits[0]/1000) + "K – " + (cas.limits[1]/1000) + "K" : "") + '</span><span class="play">' + (t.built ? "PLAY ▸" : "IN DESIGN") + "</span>";
    const tint = { coin:"var(--acc)", slots:"var(--magenta)", roulette:"var(--danger)", hilo:"var(--acc2)", crash:"var(--amber)", wheel:"var(--amber)", bj:"var(--acc2)", holdem:"var(--magenta)" }[t.id];
    return "<" + el + ' class="' + tag + '"' + href + ' data-id="' + t.id + '">' +
      '<svg class="g" style="color:' + tint + '"><use class="w" href="#' + t.g + '"></use><use href="#' + t.g + '"></use></svg>' +
      '<span class="nm">' + t.nm + '</span><span class="fact">' + t.fact + "</span>" +
      '<span class="foot">' + foot + "</span></" + el + ">";
  }).join("");
  [...$("#floor").children].forEach(el => {
    if (el.tagName === "BUTTON") el.onclick = () => {
      const t = TILES.find(x => x.id === el.dataset.id);
      say(cas && cas.gate ? "// BLOCKED — " + cas.gate.toUpperCase()
        : t.built ? "// TABLE OPEN — FOLLOW THE LINK" : "// " + t.nm + " — IN DESIGN · EVERY OTHER TABLE IS LIVE", "warn");
      felt.kick(3000);
    };
  });
}
let statusT = null;
function say(m, tone) {
  const el = $("#status");
  el.textContent = m;
  el.style.color = tone === "warn" ? "var(--amber)" : tone === "bad" ? "var(--danger)" : "var(--faint)";
  clearTimeout(statusT);
  statusT = setTimeout(() => { el.textContent = defaultStatus(); el.style.color = "var(--faint)"; }, 3200);
}
function defaultStatus() {
  return cas && cas.gate ? "// FLOOR CLOSED TO YOU — " + cas.gate.toUpperCase()
    : "// FLOOR OPEN — BETS CLAMP " + (cas ? (cas.limits[0]/1000) + "K–" + (cas.limits[1]/1000) + "K" : "") + " · THE SERVER SETTLES EVERY BET · ESC LEAVES";
}
AP.on("casino", v => {
  cas = v;

  $("#freechip").style.display = v.wheel && v.wheel.freeAvailable ? "" : "none";
  $("#status").textContent = defaultStatus();
  renderFloor();
});
</script>
