<script>
/* ---- BRIDGE SHIM (hand-applied, the DISPLAY-ONLY variant of the one in
   ui/html/landing.html -- the same block with call() and its rejection wrapper
   removed, because this page has no verbs to call). Everything outside this
   one element is the designer's file byte for byte; a re-drop replaces the rest
   of the document and keeps this element.

   window.WEBUI does not exist while this page's own script runs; the bridge is
   INJECTED afterwards. Anything that touches it at load is silently deaf, which
   is how the first web shop shipped.

   AP is defined here, synchronously, ahead of the page's own script -- so its
   `typeof AP!=='undefined'&&AP&&AP.on` test passes and the demo backdrop with
   its 1/2/3/4/5/0 keyboard scenarios never arms. A subscription made before the
   bridge lands is replayed onto it when it arrives, and webui.js's own on()
   replays the last value on the channel, so the page gets the first push
   whichever side won the race.

   DISPLAY-ONLY, DELIBERATELY. There is no call(), no ask(), no handle() and no
   texture() in this shim: the HUD reads one pushed channel and draws it. There
   is no name a page-side script could reach SQF through, which is why this
   whole feature needed no CfgRemoteExec entry and no server function.

   TRANSPARENCY IS THE OWNER REQUIREMENT AND THIS BLOCK PRESERVES IT. The shim
   adds no element, no stylesheet, no background and no wrapper -- the
   designer's own `html,body{background:transparent}` is what the world shows
   through, and the hosting control's colorBackground is {0,0,0,0} to match
   (dialog\hudWeb.hpp). Anything opaque added here would paint over the world.

   NOTHING IN THIS COMMENT MAY CONTAIN A CLOSING SCRIPT TAG. An HTML script
   element ends at the first one anywhere in its content, including inside a
   comment: that shipped once (commit 4a2a2cb5), terminated the shim early,
   rendered the rest of the block as page text and left window.AP unarmed. ---- */
(function () {
  var subs = {}, W = null;
  window.WEBUIReady = new Promise(function (r) { window.__webuiReady = r; });
  /* Instrumentation, same as the casino's and the landing's: the in-game
     browser console is unreachable (Esc closes the display instead of opening
     it), so a deaf page has to be able to say why on its own surface. */
  window.__apSubs = subs;
  /* A throw inside a channel handler is CAUGHT by webui.js and console.error'd,
     and that console is unreachable -- so a payload the page cannot read looks
     exactly like a payload that never arrived. Record the first failure where a
     diagnostic can print it. */
  function guard(n, f) {
    return function (v) {
      try { return f(v); }
      catch (e) { if (!window.__apHandlerErr) window.__apHandlerErr = n + ": " + e; throw e; }
    };
  }
  window.AP = {
    __shim: true,
    on: function (n, f) {
      var g = guard(n, f);
      (subs[n] = subs[n] || []).push(g);
      if (W) W.on(n, g);
    }
  };
  window.WEBUIReady.then(function (w) {
    W = w;
    Object.keys(subs).forEach(function (n) { subs[n].forEach(function (f) { W.on(n, f); }); });
    W.on("hud", function () { window.__apGotHud = true; });
  });
  /* A script element with a src cannot work here -- the page has no resolvable
     base URL and the src quietly resolves to nothing. SQF injects the same file
     too and webui.js is idempotent, so whichever lands first wins. */
  if (typeof A3API !== "undefined" && A3API.RequestFile) {
  window.__webuiBootPath = "stub";
    A3API.RequestFile("webui\\ui\\webui.js")
      .then(function (s) { try { (0, eval)(s); } catch (e) { window.__apBootErr = "eval: " + e; } })
      .catch(function (e) { window.__apBootErr = "RequestFile: " + e; });
  } else {
    window.__apBootErr = "no A3API on this page";
  }
})();
</script>

   them, so the panel is heading-up exactly as the 2D one was.

   is an RscTitles layer that never closes, so every frame it draws is a cost
   paid for the entire session, on whatever rasterizer CEF happens to have.

     * IDLE IS STILL. rAF is not a loop here. A push marks the panel dirty and
       schedules one frame; a frame that nobody asked to repeat schedules
       nothing. A player standing at a bank terminal costs zero frames a second,
       not twelve. This is the property the harness exists to assert
       (scratchpad/grid3d_harness/render_hud.mjs), because it is invisible to a
       screenshot and a regression here is silent and permanent.

       arrives buys nothing but heat.

       extruded box. Real silhouettes cost hundreds of milliseconds of JS per
       sector to build and up to 900k triangles of resident GL buffer, which is
       a fine trade for a full-screen map you opened on purpose and a bad one
       for a 208 px panel that is always there. Skipping the file is all it
       takes: with no mesh library grid3d puts every row in the box sectors.

   payload each frame and interpolates nothing.

   line to change.

   player and 611 m above them, and the top of a 50 deg frustum pitched 52 deg

     exactly when a boot is most likely to be in flight (SwiftShader loses the
     context AT boot roughly 1 run in 8 on the offline harness, so this is
     measured, not theoretical). Guarded on M3.R alone, that restore starts a
     SECOND boot: two create()s, two initAtlases(), two loadHF/buildTerrain/

     terrain VBO orphaned in the GL driver per event -- on a layer that never
     closes.

     gen stops a boot that was superseded while in flight from INSTALLING its
     results over the boot that replaced it, which is the worse failure of the

   THE MASK COMES FROM ui\html\malden_hf.txt, the heightfield map.html already
   fetches (map.html:1392) through the same A3API.RequestFile leg this page's own
   shim uses for webui.js. No new asset, no bake, no server function, nothing
   invented: where the terrain is below sea level, there is sea.
   IT IS BUILT ONCE. 512 x 512 mask over the whole island is 25 m per pixel and
   ~260k bilinear samples -- a one-off cost at first push, then every frame is a
   single drawImage of the visible window. Redrawing the mask per push was the
   alternative and is ~114k samples EVERY frame at 12 Hz, which is the per-frame
   work core\web\README.md forbids.
   THE COAST IS FEATHERED ON PURPOSE. The heightfield is sampled at 64 m, so its
   coastline disagrees with the satellite's by tens of metres in places. Alpha
   ramps with depth across SHORE..DEEP instead of switching at zero, so the
   disagreement reads as a shallows gradient rather than as blue spilling onto a
   visible beach -- and the layer stays under 1.0 alpha so the tile's own
   coastline still reads through it. Hue is map.html's water base
   (vec3(.016,.045,.038), map.html:262) lifted to read on a 13 rem panel. */
var MASKPX=512,SHORE=1.5,DEEP=-10,SHC=[16,45,39],DPC=[6,17,15];

/* Behaviourally map.html's parseHF (map.html:285-299): file row 0 is the NORTH
   edge, data is indexed from the SOUTH, and a truncated file returns null rather
   than a half-island. */
function parseHF(txt){
  var lines=String(txt).split('\n'),meta=null,i0=0,i,L;
  for(i=0;i<lines.length;i++){L=lines[i].trim();
    if(!L||L.charAt(0)==='#')continue;
    meta=L.split(/[\s,]+/).map(Number);i0=i+1;break;}
  if(!meta||meta.length<2)return null;

  for(i=i0;i<lines.length&&row<n;i++){L=lines[i].trim();if(!L)continue;

    if(vals.length<n)return null;
    for(var c=0;c<n;c++)data[y*n+c]=+vals[c]||0;

function buildMask(ws){

  var g=cv.getContext('2d'),im=g.createImageData(MASKPX,MASKPX),px=im.data;
  for(var py=0;py<MASKPX;py++){

    var fy=Math.min(Math.max(wy/cell,0),n-1.001),y0=fy|0,ty=fy-y0;
    for(var pi=0;pi<MASKPX;pi++){

/* One request per session, and SELF-INVALIDATING in the same shape as the push
   side's [0,0,0] marker guard: a heightfield whose extent does not match the
   world being drawn is another world's file, and painting it would put sea over
   dry land. Refused, and the panel is exactly what it was before -- no water,
   no error, no broken image. */
function wantHF(t){
  if(hfAsked||!t||!t.hf||!t.worldSize)return;
  if(typeof A3API==='undefined'||!A3API.RequestFile)return;
  hfAsked=true;
  try{
    A3API.RequestFile(t.hf).then(function(txt){
      var h=parseHF(txt);if(!h)return;
      if(Math.abs((h.n-1)*h.cell-t.worldSize)>t.worldSize*0.1)return;

  }catch(e){}
}
/* One drawImage per render. The source rect is the same world window the tiles
   are laid out over, so the sea cannot drift against them; it is clamped to the
   mask and the destination clamped WITH it (a source rect that runs off the edge
   is not portable), which is why standing on the map edge shows no water beyond
   the island rather than a stretched last row. */
function drawWater(M,k,ws){
  var cv=$('mwater'),g=cv.getContext('2d');
  g.clearRect(0,0,cv.width,cv.height);
  if(!mask||!ws)return;
  var halfM=9.75/k,s=MASKPX/ws,sw=2*halfM*s,z=cv.width/sw;
  var sx=(M.pos[0]-halfM)*s,sy=(ws-(M.pos[1]+halfM))*s;

var tilePool={};
function drawTiles(M,k){
  var box=$('mtiles'),t=M.tiles,T=t&&t.tileMeters;
  if(!T){box.innerHTML='';tilePool={};return;}
  /* PR14: `ov` is the fraction of each tile IMAGE that is edge overlap -- Terrain Builder cuts
     the game's own satellite layer with 16 px of it per edge on a 512 px tile, so one image
     covers MORE ground than one tile step (1050.3 m against a 984.6 m step on Malden). Drawn at
     T it would sit ~6.7% small under the blips. o = that overspill in metres per edge; absent
     (an unpadded custom bake) it is 0 and the geometry below is the old one exactly. */
  var ovf=+t.ov||0,o=ovf?ovf*T/(1-2*ovf):0,ts=(T+2*o)*k;
  var need={},halfM=9.75/k;
  var x0=Math.floor((M.pos[0]-halfM)/T),x1=Math.floor((M.pos[0]+halfM)/T);
  var y0=Math.floor((M.pos[1]-halfM)/T),y1=Math.floor((M.pos[1]+halfM)/T);
  /* PR14: `grid` is the tile count per side, stated rather than divided back out. The worldSize
     form below is a float round-trip (T is itself worldSize/grid) and it is not reliable: over
     54 plausible worldSize x grid pairs it lands one row PAST the edge on two of them, which
     asks for a tile that is not there. It happens to be exact for Malden's 12800/13 -- both give
     12 -- so this is removing a dependency on that luck, not fixing a live off-by-one. */
  var mx=t.grid?t.grid-1:(t.worldSize?Math.ceil(t.worldSize/T)-1:1e9);
  for(var tx=Math.max(0,x0);tx<=Math.min(mx,x1);tx++)
  for(var ty=Math.max(0,y0);ty<=Math.min(mx,y1);ty++){
    var key=tx+'_'+ty+'_'+(t.res||0),img=tilePool[key];   /* review-minor: res IN the key, see tileSig */
    if(!img){img=document.createElement('img');
      img.onload=function(){this.style.opacity=1};
      tilePool[key]=img;box.appendChild(img);tileSrc(img,t,tx,ty);}   /* PR14: async, see below */

    img.style.left=(9.75+(tx*T-o-M.pos[0])*k)+'rem';
    img.style.top=(9.75-((ty+1)*T+o-M.pos[1])*k)+'rem';

/* PR14: was tileURL(), which returned A3API.RequestTexture(name) straight into img.src. That
   call is a PROMISE in this host -- warm.html awaits it, webui.js's own texture() awaits it --
   so the src stringified to "[object Promise]" and no tile could ever have loaded. Resolved
   here instead. `pad` zero-pads both indices and `flipRow` counts the second one from the NORTH
   edge, which is what the game's own layer naming needs (s_012_000_lco.paa is the north-east
   corner) while this page's ty counts north from 0 at the SOUTH edge. Both absent gives the old
   unpadded, south-first name, so an existing custom bake is unaffected.
   Review-minor: a miss does not reject -- RequestTexture resolves it with a ~23 char stub
   (documented engine defect, see bugreport_requesttexture.md), so the promise branch below
   always fires. webui.js's own texture() already guards this exact stub with a length floor
   (webui/ui/webui.js:144-147, >128); the same guard applies here. A short result just leaves
   the tile unpainted -- no console spam, nothing assigned -- rather than painting the stub in. */
function tileSrc(img,t,tx,ty){
  if(t.base==='demo'){img.src=demoTile(tx,ty);return;}
  var a=tx,b=(t.flipRow&&t.grid)?t.grid-1-ty:ty,pd=+t.pad||0;
  if(pd>0){a=('0000000'+a).slice(-pd);b=('0000000'+b).slice(-pd);}
  var name=t.base+a+'_'+b+(t.ext||'');
  try{
    if(typeof A3API!=='undefined'&&A3API.RequestTexture){
      var r=t.res?A3API.RequestTexture(name,t.res):A3API.RequestTexture(name);
      if(r&&typeof r.then==='function'){
        r.then(function(u){if(typeof u==='string'&&u.length>128)img.src=u},function(){});
        return;
      }
      if(typeof r==='string'&&r.length>128)img.src=r;
      return;
    }

var demoTiles={};
function demoTile(tx,ty){
  var key=tx+'_'+ty;if(demoTiles[key])return demoTiles[key];
  var c=document.createElement('canvas');c.width=c.height=128;var g=c.getContext('2d');
  var n=((tx*73856093)^(ty*19349663))>>>0;
  function rnd(){n=(n*1103515245+12345)>>>0;return (n>>>8)/16777216}
  g.fillStyle='#141f18';g.fillRect(0,0,128,128);

if(HAS){
