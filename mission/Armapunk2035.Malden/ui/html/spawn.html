<!doctype html>
<!-- DECK SPAWN — the wake-point picker, on the real 3D island.

     Built from the owner's SPOOL MK-II mockup (spawn.zip, 2026-09-11). The
     mockup's map pane was an explicit placeholder ("AP.texture SATMAP MOSAIC");
     it is now a WebGL canvas + 2D overlay driven by ui/html/grid3d.js, the same
     shared renderer behind MALDEN GRID (map.html) and the HUD minimap. The
     chrome, the list, the DEPLOY-button-as-progress-bar and the .tal palette are
     the mockup's, unchanged in intent. The dev #demo strip is gone, as its README
     asked.

     CONTRACT (core/web/fn_spawnWebBridge.sqf matches this and adds nothing):
       AP.on("spawn", { rows:[{id,label,kind,x,y,near,reason}], side, redeploy,
                        respawned })
            id      = the row's INDEX in the SQF list; the deploy verb re-derives
                      the row from it, so it must not be reordered client-side.
            reason  = "" when the point is usable; any text means the row is
                      greyed and un-deployable, and the text says why.
       AP.call("spawnReady", [])    -> answered by the first "spawn" push
       AP.call("spawnDeploy", [id]) -> { ok, msg }
       AP.call("spawnCancel", [])   -> SQF closes the dialog

     THE CAMERA TARGETS THE SELECTED POINT, NEVER THE PLAYER. map.html opens on
     the player; this screen cannot, because while it is up the player is frozen
     at map centre at 50 km (fn_spawnMenu's hold) and a player-centred camera
     looks at empty sky. It opens on the island, then flies to whichever row is
     selected -- the first one on the first push.

     THE CAMERA BLOCK IS A REDUCED COPY of map.html's, and this says so rather
     than pretending otherwise. grid3d.js is the shared half; extracting
     map.html's camera into a second shared module is a bigger refactor than this
     screen earns. Reduced, not forked-and-grown: no search, no waypoints, no
     group blips, no holograms, no cartel rings, no admin layer, no 2D toggle.
     The calibration constants and the camMat/project path are identical, so a
     blip offset is tuned in the same place (OV_PX / ROW0_NORTH / SWAP_XY) and
     grid3d.js's own header still applies.

     Esc closes the dialog -- the game handles it; no page handler, and the
     opener treats a close without a deploy as "hand the screen to the native
     menu" so nobody is stranded. -->
<html lang="en"><head><meta charset="utf-8"><title>DECK — SPAWN</title>
<script>
/* Bridge self-boot -- the mandatory head block, verbatim from map.html.
   window.WEBUI does not exist while this script runs; the page pulls webui.js
   itself and the SQF fallback injection covers the rest. A <script src> has no
   base URL to resolve against here and would silently resolve to nothing. */
window.WEBUIReady = new Promise(function (resolve) { window.__webuiReady = resolve; });
if (typeof A3API !== "undefined" && A3API.RequestFile) {
  window.__webuiBootPath = "stub";
  A3API.RequestFile("webui\\ui\\webui.js")
    .then(function (src) { (0, eval)(src); })
    .catch(function (e) { console.error("bridge self-load failed, waiting for SQF injection", e); });
}
</script>

<script>
"use strict";
/* ==== calibration (verbatim from map.html / grid3d.js) ===================== */
var MAP_M = 12800, GRID = 13, TILE_PX = 512;
var OV_PX = 16;          // satellite layers are cut with an edge overlap; 16px is the TB default
var ROW0_NORTH = true;   // s_*_000 row sits at the NORTH edge
var SWAP_XY = false;     // s_COL_ROW
var SPAN = MAP_M / GRID;
var K = SPAN / (TILE_PX - 2 * OV_PX);
var EXT = TILE_PX * K;

/* ==== standalone stub — the real bridge always wins ========================
   Lets the page be reviewed in a browser (tools/test_webpages.py, headless
   Chrome) instead of only in game, where the console is unreachable because Esc
   closes the dialog. Answers EVERY method the page calls on the real bus: a stub
   missing one throws inside the WEBUIReady .then as a silent unhandled
   rejection and every handler registered after it is never reached -- the exact
   trap map.html's own stub comment records. */
if (typeof A3API === "undefined") (function mock() {
  function hMock(x, y) {
    var h = (Math.sin(x*7e-4)*.5 + Math.sin(y*5.3e-4+1.7)*.5 + Math.sin((x+y)*3.1e-4)*.6) * 26 + 30;
    var dx = (x-6400)/6400, dy = (y-6400)/6400, d = Math.sqrt(dx*dx+dy*dy);
    return h * Math.max(0, 1.12 - d*1.25) - 6;
  }
  window.A3API = {
    RequestFile: function (p) {
      return new Promise(function (res) { setTimeout(function () {
        if (/grid3d\.js/.test(p)) { res(window.__STUB_GRID3D || ""); }
        else if (/malden_hf/.test(p)) {
          var n = 128, rows = ["# " + n + " " + (MAP_M/n)];
          for (var r = 0; r < n; r++) { var line = [];
            for (var c = 0; c < n; c++) line.push(hMock(c*MAP_M/n, MAP_M - r*MAP_M/n).toFixed(1));
            rows.push(line.join(",")); }
          res(rows.join("\n"));
        } else res("");
      }, 40); });
    },
    RequestTexture: function (p, sz) {
      return new Promise(function (res) { setTimeout(function () {
        var cv = document.createElement("canvas"); cv.width = cv.height = sz;
        var g = cv.getContext("2d"); g.fillStyle = "#16221a"; g.fillRect(0, 0, sz, sz);
        res(cv.toDataURL());
      }, 60); });
    }
  };
  var bus = { _h: {}, on: function (ch, fn) { (this._h[ch] = this._h[ch] || []).push(fn); },
              _push: function (ch, d) { (this._h[ch] || []).forEach(function (f) { f(d); }); },
              call: function (verb, args) {
                if (verb === "spawnDeploy") return Promise.resolve({ ok: true, msg: "STUB DEPLOY" });
                return Promise.resolve(null); },
              ask: function () { return Promise.resolve(false); },
              handle: function () {},
              get: function () { return null; } };
  setTimeout(function () {
    window.__webuiReady(bus);
    bus._push("spawn", { side: "civ", redeploy: false, respawned: false, rows: [
      { id: 0, label: "La Trinite",     kind: "city", x: 6180, y: 8420, near: 7,  reason: "" },
      { id: 1, label: "Larche",         kind: "city", x: 4260, y: 5980, near: 2,  reason: "" },
      { id: 2, label: "La Port",        kind: "city", x: 7550, y: 4120, near: 0,  reason: "" },
      { id: 3, label: "Chapoi",         kind: "city", x: 9100, y: 6600, near: 1,  reason: "" },
      { id: 4, label: "The Shed",       kind: "home", x: 5320, y: 7210, near: -1, reason: "" },
      { id: 5, label: "Gang Building",  kind: "gang", x: 8320, y: 7740, near: 4,  reason: "CONTESTED -- ACTIVE WAR ZONE" },
      { id: 6, label: "Governor Office",kind: "duty", x: 0,    y: 0,    near: -1, reason: "POSITION UNRESOLVED" }
    ] });
  }, 120);
})();

/* The shared renderer. Null until loadRenderer() lands; draw() returns early
   while it is, exactly as map.html's does. */
var R = null;
var el = function (id) { return document.getElementById(id); };

/* ==== chrome fit =========================================================== */
var ASSEMBLY_W = 1034, ASSEMBLY_H = 494, SCREEN_W = 960, REM_MIN = 11.5;
function chromeFit() {
  var w = innerWidth, h = innerHeight; if (!w || !h) return;
  el("spool").style.setProperty("--spool-scale", Math.min(w/ASSEMBLY_W, h/ASSEMBLY_H) * .96);
  document.documentElement.style.fontSize = Math.max(REM_MIN, SCREEN_W/75) + "px";
}

/* ==== GL setup ============================================================= */
var cv = el("gl"), ov = el("ov"), o2 = ov.getContext("2d");
var gl = cv.getContext("webgl", { antialias: true, alpha: false, depth: true,
  preserveDrawingBuffer: false, powerPreference: "high-performance" });
cv.addEventListener("webglcontextlost", function (e) { e.preventDefault(); });
var W = 0, H = 0;

/* ==== camera (reduced copy of map.html's; see the page header) ============== */
var cam = { tx: MAP_M/2, ty: MAP_M/2, dist: 15000, yaw: 0, tilt: 0 };
var FOV = 55*Math.PI/180, DMIN = 220, DMAX = 17000;
/* The fly-to: close enough that the streets of the wake point read, tilted
   enough that the buildings do. Same numbers as map.html's HOME_*, because the
   question they answer is the same one. */
var HOME_DIST = 900, HOME_TILT = 52*Math.PI/180;
var VP = new Float32Array(16), PM = new Float32Array(16), VM = new Float32Array(16);
var eye = [0, 0, 0], camBasis = { r: [1,0,0], u: [0,0,-1], f: [0,-1,0] };
function camClamp() {
  cam.tx = Math.max(-800, Math.min(MAP_M+800, cam.tx));
  cam.ty = Math.max(-800, Math.min(MAP_M+800, cam.ty));
  cam.dist = Math.max(DMIN, Math.min(DMAX, cam.dist));
  cam.tilt = Math.max(0, Math.min(70*Math.PI/180, cam.tilt));
}
function camMat() {
  var th = Math.max(R.hAt(cam.tx, cam.ty), 0);
  var s = Math.sin(cam.tilt);
  var ox = Math.sin(cam.yaw)*s, oy = Math.cos(cam.tilt), oz = Math.cos(cam.yaw)*s;
  eye[0] = cam.tx + ox*cam.dist; eye[1] = th + oy*cam.dist; eye[2] = -cam.ty + oz*cam.dist;
  var eh = R.hAt(eye[0], -eye[2]) + 14;
  if (eye[1] < eh) eye[1] = eh;
  var rx = Math.cos(cam.yaw), rz = -Math.sin(cam.yaw);
  var fx = cam.tx-eye[0], fy = th-eye[1], fz = -cam.ty-eye[2];
  var fl = 1/Math.hypot(fx, fy, fz); fx*=fl; fy*=fl; fz*=fl;
  var cux = -rz*fy, cuy = rz*fx - rx*fz, cuz = rx*fy;
  var ul = 1/(Math.hypot(cux, cuy, cuz)||1);
  camBasis.r = [rx, 0, rz]; camBasis.f = [fx, fy, fz]; camBasis.u = [cux*ul, cuy*ul, cuz*ul];
  R.mPersp(PM, FOV, W/H, Math.max(2, cam.dist*0.004), cam.dist*6 + 26000);
  R.mLook(VM, eye[0], eye[1], eye[2], cam.tx, th, -cam.ty, cux*ul, cuy*ul, cuz*ul);
  R.mMul(VP, PM, VM);
  R.setProjection(VP, W, H);   // keeps R.project() pointed at THIS page's camera
}
function mPerPx() { return 2*cam.dist*Math.tan(FOV/2)/H; }

/* ==== frame pump =========================================================== */
/* Nothing animates at idle: rAF runs only while a gesture or a fly-to is live,
   and a data push paints ONE frame and stops. Same rule as map.html. */
var needs = false, raf = 0, gestureOn = false, anims = [];
function dirty() { needs = true; if (!raf) raf = requestAnimationFrame(frame); }
function frame(now) {
  raf = 0;
  var animAct = stepAnims(now || performance.now());
  if (!needs && !animAct && !gestureOn) return;
  needs = false;
  draw();
  if (needs || gestureOn || anims.length) raf = requestAnimationFrame(frame);
}
function stepAnims(now) {
  /* Returns true whenever ANY animation was stepped this call -- including one
     that just finished. It used to return only "still running", so the step that
     completed a fly-to moved the camera and then told frame() there was nothing to
     draw: the pins were left painted one step short of where the camera ended.
     Same defect, same fix, as map.html's copy of this pump. */
  var stepped = anims.length > 0;
  for (var i = anims.length-1; i >= 0; i--) {
    var a = anims[i], t = Math.min(1, (now-a.t0)/a.ms), e = t*(2-t);
    a.fn(e);
    if (t >= 1) anims.splice(i, 1);
  }
  return stepped;
}
function animTo(props, ms) {
  var from = { tx: cam.tx, ty: cam.ty, dist: cam.dist, yaw: cam.yaw, tilt: cam.tilt };
  anims.push({ t0: performance.now(), ms: ms||420, fn: function (e) {
    for (var k in props) cam[k] = from[k] + (props[k]-from[k])*e;
    camClamp();
  }});
  dirty();
}
function flyTo(p, animate) {
  if (!p || typeof p.x !== "number" || (p.x === 0 && p.y === 0)) return false;
  if (animate) animTo({ tx: p.x, ty: p.y, dist: HOME_DIST, tilt: HOME_TILT, yaw: 0 }, 420);
  else { cam.tx = p.x; cam.ty = p.y; cam.dist = HOME_DIST; cam.tilt = HOME_TILT; cam.yaw = 0;
         camClamp(); dirty(); }
  return true;
}

/* ==== satellite gate (map.html's, same reasoning) ========================== */
/* Declared above their only reader: a var initialised further down is undefined
   -- and so falsy, and so an OPEN gate -- for any draw that beats it. */
var satWait = true, allow256 = false, satPending = true;
var SAT_GATE_MS = 2000;

/* ==== render =============================================================== */
var env = { hour: 12, overcast: 0 };
function draw() {
  if (!R) return;                 // grid3d.js has not landed yet
  camClamp(); camMat();
  var mpp = mPerPx(), L = R.lighting(env.hour, env.overcast, cam.dist);
  gl.viewport(0, 0, W, H);
  gl.clearColor(R.FOG[0], R.FOG[1], R.FOG[2], 1);
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL);
  gl.disable(gl.BLEND); gl.enable(gl.CULL_FACE); gl.cullFace(gl.BACK);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  var span = mpp*Math.max(W, H)*1.4 + cam.dist*0.8;
  var c0 = Math.max(0, (cam.tx-span)/SPAN|0), c1 = Math.min(GRID-1, (cam.tx+span)/SPAN|0);
  var r0 = Math.max(0, (MAP_M-(cam.ty+span))/SPAN|0), r1 = Math.min(GRID-1, (MAP_M-(cam.ty-span))/SPAN|0);
  if (!satWait) for (var r = r0; r <= r1; r++) for (var c = c0; c <= c1; c++) {
    var tcx = c*SPAN+SPAN/2, tcy = MAP_M-r*SPAN-SPAN/2;
    var pr = Math.hypot(tcx-cam.tx, tcy-cam.ty);
    R.tiles.want(c, r, 128, pr);
    if (allow256 && mpp < 10 && pr < 3600) R.tiles.want(c, r, 256, pr-10000);
  }
  R.tiles.updateHero(mpp, cam.tx, cam.ty);
  R.tiles.pump();

  R.drawTerrain(VP, mpp, L.sun, L.amb, L.fogK);
  R.drawWater(VP, L.sun, L.amb, L.fogK);
  R.drawBuildings(VP, mpp, L.sun, L.amb, L.fogK, cam.tx, cam.ty, cam.dist*3.0 + 4200);
  drawPins();
  el("zread").textContent = "1px = " + (mpp < 10 ? mpp.toFixed(1) : mpp.toFixed(0)) + "m";
}

/* Pins live on the 2D overlay, never in GL -- map.html's rule, and the reason
   text has to be legible at any zoom. */
function drawPins() {
  o2.setTransform(1, 0, 0, 1, 0, 0); o2.clearRect(0, 0, W, H);
  var css = getComputedStyle(document.body);
  var ACC = css.getPropertyValue("--acc").trim() || "#c9e21a";
  var ACC2 = css.getPropertyValue("--acc2").trim() || "#33ffbb";
  var BAD = css.getPropertyValue("--danger").trim() || "#ff5a3c";
  var fs = Math.max(9, Math.round(H/46));
  o2.font = "700 " + fs + "px ui-monospace, monospace";
  o2.textAlign = "center"; o2.textBaseline = "middle";
  rows.forEach(function (p, i) {
    if (p.x === 0 && p.y === 0) return;            // unresolved: no pin, the row still says why
    /* R.project returns [px, py], or null when the point is behind the camera or
       past the far plane -- NOT an object. Reading .x/.y off it yields undefined,
       which canvas swallows without an error: the arc is drawn at NaN and the
       screen shows a perfect map with no pins on it. Caught by the offline
       harness, which is the only place this page can be read at all. */
    var s = R.project(p.x, p.y, 2);
    if (!s) return;
    var sx = s[0], sy = s[1];
    var sel = (i === cur), locked = !!p.reason;
    var col = locked ? BAD : (sel ? ACC : ACC2);
    var rad = sel ? fs*.62 : fs*.42;
    o2.globalAlpha = locked ? .55 : 1;
    o2.beginPath(); o2.arc(sx, sy, rad, 0, 6.2832);
    o2.fillStyle = col; o2.fill();
    o2.lineWidth = 2; o2.strokeStyle = col;
    o2.beginPath(); o2.arc(sx, sy, rad + fs*.5, 0, 6.2832); o2.stroke();
    if (sel || locked) {
      var t = p.label.toUpperCase(), tw = o2.measureText(t).width;
      o2.globalAlpha = locked ? .7 : .92;
      o2.fillStyle = "rgba(5,11,9,.82)";
      o2.fillRect(sx - tw/2 - 5, sy - rad - fs*2.1, tw + 10, fs*1.5);
      o2.strokeStyle = col; o2.lineWidth = 1;
      o2.strokeRect(sx - tw/2 - 5, sy - rad - fs*2.1, tw + 10, fs*1.5);
      o2.fillStyle = col;
      o2.fillText(t, sx, sy - rad - fs*1.35);
    }
    o2.globalAlpha = 1;
  });
}

function fit() {
  var r = cv.parentElement.getBoundingClientRect();
  W = Math.max(1, Math.round(r.width)); H = Math.max(1, Math.round(r.height));
  cv.width = W; cv.height = H; ov.width = W; ov.height = H;
  var fitD = MAP_M/(2*Math.tan(FOV/2))*1.12;
  DMAX = fitD*1.25;
  if (cam.dist > DMAX) cam.dist = DMAX;
  dirty();
}
window.addEventListener("resize", function () { chromeFit(); fit(); });

/* ==== input: drag-orbit, wheel zoom, the three buttons ===================== */
var drag = null;
cv.addEventListener("mousedown", function (ev) {
  drag = { x: ev.clientX, y: ev.clientY, yaw: cam.yaw, tilt: cam.tilt };
  gestureOn = true; cv.classList.add("drag"); dirty();
});
window.addEventListener("mousemove", function (ev) {
  if (!drag) return;
  cam.yaw  = drag.yaw  + (ev.clientX - drag.x) * 0.006;
  cam.tilt = drag.tilt + (ev.clientY - drag.y) * 0.004;
  camClamp(); dirty();
});
window.addEventListener("mouseup", function () {
  if (!drag) return;
  drag = null; gestureOn = false; cv.classList.remove("drag"); dirty();
});
cv.addEventListener("wheel", function (ev) {
  ev.preventDefault();
  cam.dist *= (ev.deltaY > 0 ? 1.18 : 1/1.18);
  camClamp(); dirty();
}, { passive: false });
el("zin").onclick  = function () { animTo({ dist: Math.max(DMIN, cam.dist/1.8) }, 260); };
el("zout").onclick = function () { animTo({ dist: Math.min(DMAX, cam.dist*1.8) }, 260); };
el("zwide").onclick = function () {
  animTo({ tx: MAP_M/2, ty: MAP_M/2, dist: DMAX/1.25, tilt: 0, yaw: 0 }, 420);
};

/* ==== the list ============================================================= */
var rows = [], cur = -1, side = "civ", redeploy = false, deploying = false;
var IDLE_MSG = "PICK A WAKE POINT.";
function gridRef(x, y) {
  /* Arma's own 3-digit grid: easting from the west edge, northing from the
     SOUTH edge, 100 m squares. Cosmetic, and derived here rather than sent,
     because it is arithmetic on a number the page already has. */
  var e = Math.floor(x/100), n = Math.floor(y/100);
  var p = function (v) { return ("00" + Math.max(0, v)).slice(-3); };
  return p(e) + " " + p(n);
}
function sub(p) {
  var bits = [];
  if (p.reason) bits.push(p.reason);
  else {
    bits.push("GRID " + gridRef(p.x, p.y));
    if (p.near > 0) bits.push(p.near + (p.near === 1 ? " PLAYER NEAR" : " PLAYERS NEAR"));
  }
  return bits.join(" · ");
}
function select(i) {
  cur = i; paintList();
  flyTo(rows[i], true);
  var p = rows[i];
  el("hgrid").textContent = (p && !(p.x === 0 && p.y === 0)) ? gridRef(p.x, p.y) : "—";
  var b = el("deploy"), t = b.querySelector(".t");
  if (!p) { b.disabled = true; t.textContent = "DEPLOY"; return; }
  b.disabled = !!p.reason || deploying;
  t.textContent = p.reason ? "UNAVAILABLE" : ("DEPLOY ▸ " + p.label.toUpperCase());
}
function paintList() {
  var list = el("list");
  list.innerHTML = "";
  rows.forEach(function (p, i) {
    var r = document.createElement("button");
    r.className = "srow" + (p.reason ? " lock" : "");
    if (i === cur) r.setAttribute("aria-current", "true");
    var nm = document.createElement("span"); nm.className = "nm";
    var b = document.createElement("b"); b.textContent = p.label;
    var s = document.createElement("span"); s.textContent = sub(p);
    nm.appendChild(b); nm.appendChild(s);
    var chip = document.createElement("span");
    chip.className = "chip " + (p.kind || "city");
    chip.textContent = (p.kind || "city").toUpperCase();
    r.appendChild(nm); r.appendChild(chip);
    /* A locked row is still SELECTABLE -- the camera flies there and the pin
       lights up, so the player can see what "contested" means -- it just cannot
       be deployed to. The refusal lives on the button, not in a dead row. */
    r.onclick = function () { select(i); };
    list.appendChild(r);
  });
  var usable = rows.filter(function (p) { return !p.reason; }).length;
  el("avail").textContent = usable + " / " + rows.length + " AVAILABLE";
  el("hcount").textContent = String(rows.length);
}
function setMsg(text, bad) {
  var m = el("msg");
  m.textContent = text;
  m.className = bad ? "status bad" : "status";
  clearTimeout(m._t);
  if (bad) m._t = setTimeout(function () { m.textContent = IDLE_MSG; m.className = "status"; }, 6000);
}

/* ==== deploy =============================================================== */
/* The button IS the progress bar (the mockup's pattern, same as Loadouts). The
   fill is honest about what it is: the request is in flight and SQF owns the
   screen from the moment it answers ok -- it closes this dialog itself. A
   refusal stops the fill, prints the reason and re-arms the button. */
el("deploy").onclick = function () {
  if (deploying || cur < 0) return;
  var p = rows[cur];
  if (!p || p.reason) { setMsg("DEPLOY REFUSED — " + (p ? p.reason : "NO POINT SELECTED"), true); return; }
  var b = this, f = b.querySelector(".fill"), t = b.querySelector(".t");
  deploying = true; b.disabled = true;
  t.textContent = "WAKING…";
  var pct = 0, iv = setInterval(function () {
    pct = Math.min(92, pct + 4); f.style.width = pct + "%";
  }, 50);
  var done = function (ok, msg) {
    clearInterval(iv);
    if (ok) { f.style.width = "100%"; t.textContent = "ON THE GROUND ✓"; setMsg(msg || "ARRIVING…", false); return; }
    f.style.width = "0"; deploying = false;
    t.textContent = "DEPLOY ▸ " + p.label.toUpperCase();
    b.disabled = false;
    setMsg(msg || "DEPLOY REFUSED", true);
  };
  window.WEBUIReady.then(function (AP) {
    return AP.call("spawnDeploy", [p.id]);
  }).then(function (v) {
    if (v && v.ok) done(true, v.msg); else done(false, v && v.msg);
  }).catch(function (e) { done(false, "LINK FAILED — " + e); });
};

/* ==== boot ================================================================= */
/* RequestFile + eval, the same path webui.js takes: a <script src> has no base
   URL to resolve against here. A page that reaches its first draw with no
   GRID3D says so on its own surface, because the in-game console is
   unreachable (Esc closes the dialog). The race and the `won` guard are
   map.html's, for map.html's reasons: RequestFile's behaviour on a missing or
   stuck file was never characterised, and a timer that fires after a WIN would
   write a lie into the page's one diagnostic. */
function loadRenderer() {
  if (typeof A3API === "undefined" || !A3API.RequestFile) {
    window.__apBootErr = "no A3API -- grid3d.js cannot load";
    return Promise.reject(new Error(window.__apBootErr));
  }
  var won = false;
  return Promise.race([
    A3API.RequestFile("ui\\html\\grid3d.js").then(function (s) { won = true; return s; }),
    new Promise(function (_, rej) { setTimeout(function () {
      if (won) return;
      window.__apBootErr = "grid3d.js fetch timed out after 8s";
      rej(new Error(window.__apBootErr));
    }, 8000); })
  ]).then(function (src) {
    try { (0, eval)(src); } catch (e) { window.__apBootErr = "grid3d eval: " + e; throw e; }
    if (!window.GRID3D) { window.__apBootErr = "grid3d.js loaded but defined no GRID3D"; throw new Error("no GRID3D"); }
    R = window.GRID3D.create(gl);
    R.onDirty = dirty;
    R.onFirstTile = function () { var l = el("loading"); if (l) l.style.display = "none"; };
    return R;
  });
}
function satAtlas(res) {
  return Promise.race([
    A3API.RequestFile("ui\\html\\malden_sat" + res + ".txt").catch(function () { return ""; }),
    new Promise(function (ok) { setTimeout(function () { ok(""); }, 8000); })
  ]).then(function (t) {
    if (!t) return false;
    return R.tiles.loadAtlas(res, t).then(function () { return true; });
  }).catch(function (e) { console.error("sat atlas " + res + " unusable, per-tile path", e); return false; });
}
function loadSatAtlases() {
  setTimeout(function () { if (satWait) { satWait = false; dirty(); } }, SAT_GATE_MS);
  return satAtlas(128).then(function (ok128) {
    satWait = false;
    if (!ok128) { satPending = false; dirty(); return false; }
    dirty();
    return satAtlas(256).then(function (ok256) {
      satPending = false; allow256 = true; dirty(); return ok256;
    });
  });
}
function lateFeed(file) {
  return Promise.race([
    A3API.RequestFile("ui\\html\\" + file).catch(function () { return ""; }),
    new Promise(function (res) { setTimeout(function () { res(""); }, 8000); })
  ]);
}
function applyFeed(load, txt, what) {
  return load(txt).catch(function (e) { console.error(what, e); return load(""); });
}
/* Boxes first, real silhouettes after the opening view has arrived: the mesh
   library is 3.0 MB and ~1 s of BLOCKED main thread, which would starve the
   satellite tiles this screen is mostly made of. grid3d.js falls back to a box
   per row while it is absent. map.html's reasoning, unchanged. */
function loadLateFeeds() {
  return Promise.all([lateFeed("malden_msh.txt"), lateFeed("malden_fen.txt")])
    .then(function (a) {
      var lib = null;
      return applyFeed(R.loadMeshLib, a[0], "mesh library unparsable, boxes only")
        .then(function (v) { lib = v; return applyFeed(R.loadFences, a[1], "fence feed unparsable, no fences"); })
        .then(function (fen) {
          if (!lib && !(fen && fen.length)) return null;
          return R.rebuildSectors().then(function () { dirty(); });
        });
    });
}
chromeFit();
var startD = MAP_M/(2*Math.tan(FOV/2))*1.05;
cam.dist = startD;
fit();

loadRenderer().then(function () {
  R.initAtlases();
  R.buildWater();
  dirty();
  return A3API.RequestFile("ui\\html\\malden_hf.txt");
}).then(function (txt) {
  if (R.loadHF(txt)) { R.buildTerrain(); dirty(); }
  el("loading").textContent = "ACQUIRING SATELLITE";
  loadSatAtlases();                                  // in flight, not chained
  return A3API.RequestFile("ui\\html\\malden_bld.txt");
}).then(function (txt) {
  if (!txt) return;
  return R.loadBuildings(txt).then(function () { dirty(); });
}).then(function () {
  var polls = 0, kicked = false, iv = setInterval(function () {
    polls++;
    var idle = !satPending && R && R.tiles && R.tiles.busy() === 0;
    if (!kicked && (idle || polls >= 24)) { kicked = true; loadLateFeeds(); }
    if (idle || polls >= 120) { clearInterval(iv); if (!allow256) { allow256 = true; dirty(); } }
  }, 250);
}).catch(function (e) {
  console.error("terrain feed failed", e);
  el("loading").textContent = "TERRAIN FEED OFFLINE — " + (window.__apBootErr || e);
});

/* ==== the boot overlay (the mockup's WAKE PROTOCOL) ======================== */
/* It is NOT a loading gate: the screen is live underneath it and the first push
   lifts it. fn_spawnWebOpen cuts the engine's own AP_loadingScreen layer when
   this page takes the screen, precisely so there is one of these and not two. */
function openDeck() {
  var sp = el("spool");
  sp.dataset.phase = "0";
  setTimeout(function () { sp.dataset.phase = "1"; }, 60);
  setTimeout(function () { sp.dataset.phase = "2"; }, 180);
  var c = el("connect"), bar = document.querySelector("#cbar i"), st = el("cst");
  c.classList.remove("off");
  bar.style.transition = "none"; bar.style.width = "0";
  requestAnimationFrame(function () { requestAnimationFrame(function () {
    bar.style.transition = "width 1.4s linear"; bar.style.width = "100%"; }); });
  st.textContent = "LOCATING BODY…";
  setTimeout(function () { st.textContent = "HANDSHAKE · spawnReady…"; }, 420);
  setTimeout(function () { st.textContent = "STREAMING SATELLITE…"; }, 900);
}
function closeOverlay() {
  var c = el("connect");
  if (c) c.classList.add("off");
}
openDeck();
/* A push that never arrives must not leave the player looking at a boot splash
   with no way past it: lift the overlay on a deadline too. The list underneath
   is empty in that case and says so, which is a screen they can Esc out of into
   the native menu -- a splash that never lifts is not. */
setTimeout(closeOverlay, 6000);

/* ==== bridge =============================================================== */
window.WEBUIReady.then(function (AP) {
  /* Readiness handshake, and it is load-bearing for more than politeness: SQF
     cannot see PageLoaded for url= pages, so it waits for ANY inbound message
     before draining its ExecJS queue. One call in, drained instantly. */
  AP.call("log", ["spawn page up"]);
  AP.on("spawn", function (d) {
    if (!d) return;
    side = d.side || "civ";
    redeploy = !!d.redeploy;
    document.body.classList.toggle("tal", side !== "civ");
    el("appname").textContent = redeploy ? "REDEPLOY" : "DEPLOY";
    el("csub").textContent = redeploy ? "MALDEN GRID · REDEPLOY"
      : (d.respawned ? "MALDEN GRID · RESPAWN" : "MALDEN GRID · SESSION START");
    var first = rows.length === 0;
    /* The repush tick (2 s) must not fight the player's hand: keep the current
       selection across a repush, and only fly the camera on the FIRST payload
       or when the selected row vanished. */
    var keptLabel = (cur >= 0 && rows[cur]) ? rows[cur].label : null;
    rows = d.rows || [];
    if (keptLabel !== null) {
      cur = rows.findIndex(function (p) { return p.label === keptLabel; });
    }
    if (cur < 0 || cur >= rows.length) {
      /* Open on the first USABLE row; fall back to the first row at all, so a
         list that is entirely locked still shows the player why. */
      var firstOk = rows.findIndex(function (p) { return !p.reason; });
      cur = firstOk >= 0 ? firstOk : (rows.length ? 0 : -1);
      if (cur >= 0) flyTo(rows[cur], !first);
    }
    paintList();
    if (cur >= 0) select(cur);
    if (rows.length === 0) setMsg("NO WAKE POINTS — PRESS ESC FOR THE BASIC MENU.", true);
    closeOverlay();
  });
});
</script>
