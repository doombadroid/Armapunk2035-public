<!doctype html>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; }
  .sheet { display: grid; grid-template-columns: repeat(8, 128px); width: 1024px; }
  .cell { width: 128px; height: 128px; display: grid; place-items: center; }
  .tile {
    width: 120px; height: 120px;
    border-radius: 27px;
    background: linear-gradient(180deg, var(--t1), var(--t2));
    border: 2px solid rgba(255,255,255,.17);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.30);
    display: grid; place-items: center;
    color: #fbfdfa;
    --cut: var(--t2);
  }
  .tile svg { width: 62%; height: 62%; display: block; }
  .a-ice      { --t1:#232b23; --t2:#121712; color:#c8f53a; --cut:#0c110c; border-color: rgba(200,245,58,.5); }
