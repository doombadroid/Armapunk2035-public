// LooneyBin (2026-06-10, BUGS.md #96): mission-transfer + net tuning.
// History: 2013-era throttle (MaxMsgSend 128 / 512B / 1.25Mbit) crawled the 30MB mission download ->
// connect/disconnect loops after every repack. Now maxed for the 2Gbps dedicated box.
// NOTE: Arma's transfer is ENGINE-capped (~1-3MB/s per client even maxed); these same knobs also drive
// in-game traffic -- if potato-connection clients rubber-band, drop MaxMsgSend back to 512.
MaxMsgSend = 1024;
MaxSizeGuaranteed = 1300;
MaxSizeNonguaranteed = 1300;
MinBandwidth = 104857600;       // assume 100Mbit floor per pipe
MaxBandwidth = 2147483647;
MinErrorToSend = 0.001;
MinErrorToSendNear = 0.01;
class sockets { maxPacketSize = 1400; };   // stay under UDP MTU -- bigger = fragmentation, worse
