// LooneyBin — test server.cfg (Boot 1: compile/load test)
hostname        = "LoonyBin Life GANGS|HOUSES|CARTELS";
password        = "";   // owner 2026-06-22: UNLOCKED (Athirahenge ships public, b0090).
// owner 2026-07-10 (security, post-Infamous): real admin passwords are NOT in git. run-boot2 substitutes
// @AP_ADMIN_PW@ / @AP_CMD_PW@ from the gitignored deploy/secrets.env at boot (same CHANGE_ME pattern as
// extdb3-conf.ini). Template: deploy/secrets.example.env. Missing -> placeholder (server still boots).
passwordAdmin         = "@AP_ADMIN_PW@";
serverCommandPassword = "@AP_CMD_PW@";
maxPlayers      = 60;
persistent      = 1;
// LooneyBin (owner 2026-06-13): ANTI-CHEAT HARDENING (staged). BattlEye on in LOG-ONLY mode (deploy/battleye/*.txt
// = action 1 -> logs to be.log, kicks NOBODY) so it can run without mass-kicking the heavy life remoteExec; tune
// the filters from be.log, then raise actions to 7. verifySignatures=2 requires @AP_server to be SIGNED (it
// loads as -mod): run-boot2.sh signs AP_server.pbo + the mission pbo with deploy/keys/looneybin and drops the
// .bikey in keys/. allowedFilePatching=1 = SERVER may file-patch (needed for -filePatching), CLIENTS cannot.
BattlEye        = 1;
verifySignatures = 2;
allowedFilePatching = 1;
missionHTTPDownloadBaseURL = "https://missions.projectloonybin.com/";
forceRotorLibSimulation = 0;
disableVoN      = 0;            // VON on (Direct/3D + group/vehicle voice)
vonCodecQuality = 20;           // 32kHz wideband -> clear 3D direct voice
kickDuplicate   = 0;
// owner 2026-06-25: NETWORK / LAG-SWITCH thresholds (Layer 1 of lag-switch defense; the reliable, engine-measured
// layer -- SQF has no per-player ping, so the ENGINE is the only authoritative network kicker). A lag switch =
// deliberately throttling/dropping your own packets so you freeze on the server then teleport on resync. These let
// the engine measure + act on it directly.
//   maxPing        -- kick threshold for sustained ping (ms). Generous: overseas legit players sit 250-350.
//   maxPacketLoss  -- kick threshold for sustained packet loss (%). HIGH loss = the actual lag-switch signature.
//   maxDesync      -- kick threshold for sustained desync. NOTE: a SERVER-fps dip raises EVERYONE's desync at once,
//                     so a low value here can mass-kick during a stutter (the classic "Client not Responding" boot).
//   disconnectTimeout -- seconds to hold a temporarily-disconnected client before dropping (range 5-90; was default
//                     90). 30 = a frozen lag-switcher is dropped in 30s instead of 90, bounding the abuse window.
//   kickClientsOnSlowNetwork[] = { maxPing, maxPacketLoss, maxDesync, disconnectTimeout }  per-item: 0 = LOG only
//                     (writes to RPT, kicks nobody), 1 = KICK.
// ROLLOUT: shipped LOG-ONLY {0,0,0,0} on purpose -- zero false-kick risk. Watch the RPT for "NetServer: ... kicked"
// / slow-network log lines for a day to see WHO would have been kicked (calibrate the numbers to your pop), THEN
// flip to enable kicks. Recommended first kick step: { 0, 1, 1, 1 } (log ping, KICK packetloss + desync + timeout).
// Detection/visibility BEFORE you flip kicks comes from Layer 2 (loonybot/lagwatch.py BE-RCON ping-watch alerts).
maxPing            = 500;
maxPacketLoss      = 50;
maxDesync          = 300;
disconnectTimeout  = 30;
kickClientsOnSlowNetwork[] = { 0, 0, 0, 0 };
// owner 2026-06-14 (#187): DISABLE player voting. Default Arma voting let any player run `#vote kick` and
// `#vote admin` -> a coordinated group could vote-kick or vote themselves admin (rcon-equivalent). A
// voteThreshold above 1.0 can never be reached (100% of players = 1.0), so NO vote ever passes -> vote
// kick/admin/mission are all dead. voteMissionPlayers high so the mission vote never auto-opens either.
voteThreshold   = 1.5;
voteMissionPlayers = 999;
// owner 2026-06-16: voteThreshold alone only stops votes PASSING -- players could still SPAM `#vote kick`
// (the vote UI pops on everyone's map every time). allowedVoteCmds[] = {} whitelists ZERO vote commands, so
// the vote can't even be STARTED -> no more map vote-kick spam. (Belt-and-suspenders with the 1.5 threshold.)
allowedVoteCmds[] = {};
allowedVotedAdminCmds[] = {};
// LooneyBin (owner, 2026-06-11): MAX-VERBOSITY logging pass. timeStampFormat=full prefixes EVERY RPT/console
// line with a full date+time (precise event correlation); logFile names the .rpt. NOTE: verifySignatures and
// BattlEye stay OFF on purpose — turning either on would kick the unsigned custom @AP_server mod + trip the
// mission's heavy remoteExec. Revert timeStampFormat to "none" after the debug session if it clutters scraping.
timeStampFormat = "full";
logFile         = "looneybin_server.rpt";
// LooneyBin (owner 2026-07-16): HEADLESS CLIENT own slot. Whitelist the local HC so it binds the dedicated
// HeadlessClient_F slot (mission HC1) and does NOT consume a real player slot / show in the player count. Must
// match the dev server.cfg. The HC runs the vehicle autopilot + scripted-event AI offload.
headlessClients[] = {"127.0.0.1"};
localClient[] = {"127.0.0.1"};
class Missions
{
    class LooneyBin
    {
        template = "Armapunk2035_b0169.Malden";   // LooneyBin BUGS.md #96: renamed per version bump -- fresh client MPMissionsCache slot (corrupt partial caches under the old name orphaned)
        difficulty = "Custom";                // #309: selects CustomDifficulty in deploy/looneybin.Arma3Profile (mapContentFriendly=0 -> cops no longer leak onto the civ map). NOT stock "regular" (mapContentFriendly=1) and NOT "veteran" (kills 3rd person).
    };
};
