// Armapunk 2035 LIVE server.cfg TEMPLATE (MIGRATION_96.md §5). deploy/live/reload-live.sh substitutes the three
// @AP_*_PW@ placeholders from the gitignored deploy/secrets.env and the mission template name, and writes the
// result to ~/arma3server_live/server.cfg. Never edit the copy under arma3server_live; edit this file and push.
hostname        = "Armapunk 2035 [COMING SOON]";   // D12
password        = "@AP_JOIN_PW@";                  // D12: password-protected closed test; clear at public open
passwordAdmin         = "@AP_ADMIN_PW@";
serverCommandPassword = "@AP_CMD_PW@";
maxPlayers      = 60;
persistent      = 1;
BattlEye        = 0;                    // OFF (owner 2026-09-22): lets clients run client-side renderers (ReShade/RTGI); was 1
                                        // with log-only filters. Side effects: no BE filter logs, no BE RCON -> the watchdog's
                                        // SOFT restart (be_rcon.py '#restart') fails and it falls back to HARD every time.
verifySignatures = 0;                   // D5 (2026-09-07): 0 until the @Armapunk2035 addon is reworked + published; then 2.
allowedFilePatching = 1;
missionHTTPDownloadBaseURL = "https://missions.armapunk.com/";   // D6
forceRotorLibSimulation = 0;
disableVoN      = 0;
vonCodecQuality = 20;
kickDuplicate   = 0;
maxPing            = 500;
maxPacketLoss      = 50;
maxDesync          = 300;
disconnectTimeout  = 30;
kickClientsOnSlowNetwork[] = { 0, 0, 0, 0 };
voteThreshold   = 1.5;
voteMissionPlayers = 999;
allowedVoteCmds[] = {};
allowedVotedAdminCmds[] = {};
timeStampFormat = "full";
logFile         = "armapunk_server.rpt";
headlessClients[] = {"127.0.0.1"};
localClient[]     = {"127.0.0.1"};
class Missions
{
    class Armapunk
    {
        template = "Armapunk2035_b2001.Malden";   // rewritten by reload-live.sh every push
        difficulty = "Custom";
    };
};
