# File-provisioned dashboards: the JSON under deploy/telemetry/grafana/dashboards is the source
# (generated by deploy/telemetry/gen_dashboards.py -- edit the generator, not the JSON). Grafana
# re-reads the directory every 30 s, so a redeploy of the tree updates the dashboards in place.
apiVersion: 1
providers:
  - name: armapunk
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
