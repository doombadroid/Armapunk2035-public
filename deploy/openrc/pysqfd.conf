# /etc/conf.d/pysqfd -- environment for the PySQF daemon.
#
# Copy to /etc/conf.d/pysqfd and fill in the DSN. This file holds a database
# password, so it belongs at 0640 root:root and NOT in git with real values.

# Turn the game's PostgreSQL path on. The game asks `apdb.enabled` at boot and
# defaults to extDB3/MariaDB on any doubt, so this flag lives here rather than in
# SQF -- SQF cannot read an environment variable.
export AP_DB_POSTGRES=1

# Connection. Note the dev database is `pgm_full_scratch`, NOT `armapunk`:
# deploy/postgres/.env names a different database and is not what the daemon reads.
export PYSQF_DB_DSN="host=127.0.0.1 port=5432 dbname=pgm_full_scratch user=armapunk password=CHANGEME"

# Module search path. Order matters: the first entry providing a module wins, so
# putting a second checkout ahead of the first silently swaps which apdb the game
# talks to. Append, do not prepend.
# ⚠ Point these at the checkout actually being SERVED. During worktree-based
# development that is the worktree (e.g. ~/Armapunk2035-duty), and a daemon
# reading a different checkout's modules is the split-brain that poisoned every
# decode on 2026-08-20. After merge, ~/Armapunk2035 is correct again.
# Socket path. PIN IT -- do not rely on the default. pysqfd's default_socket_path()
# returns $XDG_RUNTIME_DIR/pysqf.sock when that directory exists and
# /tmp/pysqf-<uid>.sock otherwise. This daemon runs as an OpenRC service with no
# login session, so it gets no XDG_RUNTIME_DIR and lands on /tmp; the game server is
# launched from a session and lands on /run/user/<uid>. The two sides then never meet,
# the extension finds no socket, and apdb silently falls back to extDB3 (2026-08-21).
# pysqf.md:125 -- this value MUST be identical here and in the game server's launcher.
export PYSQF_SOCKET=/tmp/pysqf-1000.sock

export PYTHONPATH="/home/timb/PySQF/python:/home/timb/Armapunk2035/tools/pysqf_modules:/home/timb/Armapunk2035/tools/pgmigrate"

# UI page root for the `webpages` module -- same worktree rule as PYTHONPATH.
export AP_WEBPAGES_ROOT="/home/timb/Armapunk2035/server/AP_server/web"

# Loaded modules. `webpages` is what lets the server ship UI without a client
# repack; drop it and every screen falls back to its mission PBO copy, which is
# the designed fallback rather than a break. The daemon logs `functions=N` at
# start -- 8 without it, 11 with it, which is the quickest way to tell which you
# are running.
export PYSQFD_MODULES="pysqf.db,apdb,webpages"

# Where webpages.py serves pages from. Unset, it derives <repo>/server/AP_server/web
# from its own location, which is right for a normal checkout. Set it when the
# pages live somewhere else (a deploy tree, a separate content checkout).
#AP_WEBPAGES_ROOT="/home/timb/Armapunk2035/server/AP_server/web"
