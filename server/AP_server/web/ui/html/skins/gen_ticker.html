<!doctype html><html><head><meta charset="utf-8"><title>gen_ticker</title>
<!-- Gendarmerie Commander uniform, IDENTICAL to stock (its own sheet via A3API.RequestTexture, drawn 1:1),
     plus an animated MAXSEC LED ticker across the shoulders, front AND back, right under the epaulettes,
     and the four epaulettes themselves as red/blue police strobes.
     Sheet islands (2048): back sweater x 24-496, front sweater x 770-1270; epaulettes end at y ~1540.
     Live skin: [player, "gen_ticker", true] call AP_fnc_htmlSkin;  -- self-contained, no external files. -->
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}canvas{display:block;width:100vw;height:100vh}</style>
</head><body><canvas id="c" width="2048" height="2048"></canvas><script>
(function(){
  var cv=document.getElementById("c"),ctx=cv.getContext("2d"),W=cv.width,H=cv.height,t0=performance.now(),frame=0;
  var base=new Image(),ready=false,status="loading base sheet...";
  var BASE="a3\\characters_f_exp\\Gendarmerie\\Data\\U_B_GEN_Commander_F_co.paa";
  var BANDS=[[24,1550,496,1650],[770,1550,1270,1650]];   // [x0,y0,x1,y1]: back, front
  function say(m){status=m;try{if(window.WEBUI)WEBUI.call("log",["skin "+document.title+": "+m]).catch(function(){});}catch(e){}}
  function loadBase(){
    if(typeof A3API==="undefined"||!A3API.RequestTexture){say("no A3API");return;}
    var tries=[BASE,"\\"+BASE,BASE.toLowerCase()],i=0;
    (function next(){ if(i>=tries.length){say("base sheet NOT FOUND");return;} var p=tries[i++];
      A3API.RequestTexture(p,2048).then(function(u){ if(!u||u.length<200){return next();}
        base.onload=function(){ready=true;say("base sheet OK "+base.width+"x"+base.height);}; base.onerror=function(){next();}; base.src=u;
      }).catch(function(){next();}); })();
  }
  loadBase();
  var MSG="   ▪   MAXSEC   ";
  // epaulettes traced off the sheet (scratchpad/skinlab): left pads strobe red, right pads blue, alternating
  var PADS=[{c:"R",ph:0,p:[[184,1398],[169,1421],[147,1445],[134,1469],[122,1493],[110,1517],[122,1541],[227,1541],[231,1517],[221,1493],[218,1469],[208,1445],[209,1421],[184,1398]]},{c:"B",ph:1,p:[[425,1396],[412,1420],[408,1444],[408,1468],[393,1492],[395,1516],[397,1541],[487,1541],[502,1516],[492,1492],[482,1468],[470,1444],[454,1420],[426,1396]]},{c:"R",ph:0,p:[[851,1418],[808,1439],[793,1460],[776,1482],[759,1503],[748,1524],[759,1546],[872,1546],[871,1524],[869,1503],[866,1482],[864,1460],[865,1439],[852,1418]]},{c:"B",ph:1,p:[[1077,1414],[1069,1436],[1045,1458],[1060,1480],[1061,1502],[1058,1524],[1144,1546],[1170,1546],[1179,1524],[1170,1502],[1152,1480],[1129,1458],[1113,1436],[1077,1414]]}];
  function band(t,R){
    var x0=R[0],y0=R[1],x1=R[2],y1=R[3],w=x1-x0,h=y1-y0;
    ctx.save();ctx.beginPath();ctx.rect(x0,y0,w,h);ctx.clip();
    // the band: near-black plate, thin police-blue rails top and bottom
    ctx.fillStyle="rgba(6,8,14,.92)";ctx.fillRect(x0,y0,w,h);
    ctx.fillStyle="#4d8cff";ctx.fillRect(x0,y0,w,6);ctx.fillRect(x0,y1-6,w,6);
    // scrolling LED text, tiled until the band is covered so the seam never shows
    ctx.font="bold "+Math.round(h*.58)+"px monospace";ctx.textBaseline="middle";ctx.textAlign="left";
    var mw=ctx.measureText(MSG).width, x=x0-((t*140)%mw);
    ctx.shadowColor="#8fc0ff";ctx.shadowBlur=22;ctx.fillStyle="#ffffff";
    for(;x<x1;x+=mw)ctx.fillText(MSG,x,y0+h/2);
    ctx.shadowBlur=0;
    // LED dot mask + a slow scan glint
    ctx.fillStyle="rgba(0,0,0,.35)";for(var y=y0;y<y1;y+=4)ctx.fillRect(x0,y,w,1);
    var gx=x0+((t*.35)%1)*w;ctx.fillStyle="rgba(255,255,255,.12)";ctx.fillRect(gx-10,y0,20,h);
    ctx.restore();
  }
  function pad(t,P){
    // police strobe: 2 Hz, two quick flashes per beat, red and blue on opposite phases
    var b=(t*2+P.ph*0.5)%1, on=(b<0.08)||(b>0.16&&b<0.24);
    var col=P.c==="R"?"255,70,70":"110,160,255";
    ctx.save();ctx.beginPath();var q=P.p;ctx.moveTo(q[0][0],q[0][1]);for(var i=1;i<q.length;i++)ctx.lineTo(q[i][0],q[i][1]);ctx.closePath();
    ctx.fillStyle="rgba("+col+","+(on?1:0.4)+")";
    if(on){ctx.shadowColor="rgb("+col+")";ctx.shadowBlur=40;}
    ctx.fill();ctx.shadowBlur=0;
    // +50% (owner): a second, additive pass so the lit pad reads as a light source at night
    ctx.globalCompositeOperation="lighter";ctx.fillStyle="rgba("+col+","+(on?0.5:0.12)+")";ctx.fill();ctx.globalCompositeOperation="source-over";
    // lens rim so the pad reads as a light, not paint
    ctx.lineWidth=4;ctx.strokeStyle="rgba(255,255,255,"+(on?0.9:0.35)+")";ctx.stroke();
    ctx.restore();
  }
  function render(t){
    if(ready){ctx.drawImage(base,0,0,W,H);}else{ctx.fillStyle="#1a1f2b";ctx.fillRect(0,0,W,H);}
    for(var i=0;i<BANDS.length;i++)band(t,BANDS[i]);
    for(var j=0;j<PADS.length;j++)pad(t,PADS[j]);
    frame++;
  }
  function tick(){var t=(performance.now()-t0)/1000;render(t);ctx.font="16px monospace";ctx.textAlign="left";ctx.textBaseline="alphabetic";ctx.fillStyle="rgba(255,255,255,.8)";ctx.fillText("f "+frame+"  "+document.title+": "+status,6,H-6);requestAnimationFrame(tick);}
  requestAnimationFrame(tick);
})();
</script></body></html>
