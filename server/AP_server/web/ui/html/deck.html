.vboot .tier{background:var(--panel2);border:1px solid var(--line);border-radius:.55rem;padding:.45rem .55rem;text-align:center}
.vboot .tier.cur{border-color:rgba(245,166,35,.55)}
.vboot .tier label{display:block;font-family:var(--mono);font-size:.48rem;letter-spacing:.16em;color:var(--faint);margin-bottom:.25rem}
.vboot .tier b{font-size:.62rem;color:#eaf0f6}
.vboot .claim{height:2.5rem;border-radius:.5rem;border:1px solid rgba(245,166,35,.5);background:rgba(245,166,35,.16);
  color:var(--acc);font-family:var(--mono);font-size:.66rem;font-weight:700;letter-spacing:.14em;cursor:pointer}
.vboot .claim:disabled{color:#34435a!important;border-color:rgba(60,74,92,.35)!important;background:transparent!important;cursor:not-allowed}
.vboot .note{font-family:var(--mono);font-size:.52rem;color:var(--faint);line-height:1.5;letter-spacing:.05em}

/* ── GARAGE MOD BAY (deck-garage-a Mods tab; needstest) ── */
.vgrg .dtabs{display:flex;gap:.3rem;margin-left:auto}
.vgrg .dtab{font-family:var(--mono);font-size:.55rem;letter-spacing:.12em;border:1px solid var(--line);background:none;
  color:var(--dim);border-radius:.3rem;padding:.22rem .55rem;cursor:pointer}
.vgrg .dtab.on{color:var(--acc);border-color:rgba(245,166,35,.5);background:rgba(245,166,35,.12)}
.vgrg .modgrid{flex:1;min-height:0;overflow-y:auto;padding:.55rem .8rem;display:grid;grid-template-columns:1fr 1fr;gap:.45rem .7rem;align-content:start}
.vgrg .modgrid .opt label{display:block;font-family:var(--mono);font-size:.5rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:.2rem}
.vgrg .modgrid select,.vgrg .modgrid input{width:100%;background:var(--scr2);border:1px solid #22332a;border-radius:.4rem;
  padding:.32rem .45rem;font-family:var(--mono);font-size:.58rem;color:var(--ink)}
.vgrg .modfoot{flex:none;display:flex;align-items:center;gap:.7rem;padding:.55rem .8rem;border-top:1px solid var(--line)}
.vgrg .modtotal{font-family:var(--mono);font-size:.8rem;color:var(--acc);font-weight:700;font-variant-numeric:tabular-nums}

/* ── RIG CONSOLE (resource extractor, traded system) ── */
.vrig{flex:1;min-height:0;display:grid;place-items:center;padding:.7rem}
.vrig .card{width:30rem;max-width:96%;background:var(--panel);border:1px solid rgba(245,166,35,.35);border-radius:.9rem;
  padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.6rem}
.vrig h2{margin:0;font-family:var(--mono);font-size:.85rem;letter-spacing:.22em;color:var(--acc)}
.vrig .strow{display:flex;gap:.5rem;align-items:center;font-family:var(--mono);font-size:.62rem;color:var(--dim)}
.vrig .stpill{border:1px solid var(--line);border-radius:.3rem;padding:.2rem .55rem;letter-spacing:.14em}
.vrig .stpill.on{color:var(--acc);border-color:rgba(245,166,35,.5)}
.vrig .stpill.mine{color:var(--acc2);border-color:rgba(84,176,255,.5);animation:apPulse 1.4s infinite}
.vrig .chips{display:flex;gap:.35rem;flex-wrap:wrap}
.vrig .rchip{font-family:var(--mono);font-size:.58rem;letter-spacing:.08em;border:1px solid var(--line);background:none;
  color:var(--dim);border-radius:.35rem;padding:.3rem .6rem;cursor:pointer}
.vrig .rchip.on{color:var(--acc);border-color:rgba(245,166,35,.55);background:rgba(245,166,35,.14)}
.vrig .hbar{height:.5rem;border:1px solid var(--line);border-radius:.3rem;overflow:hidden}
.vrig .hbar i{display:block;height:100%;background:var(--acc)}
.vrig .hrows{display:flex;flex-direction:column;gap:.2rem;max-height:6rem;overflow-y:auto}
.vrig .hrow{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.58rem;color:var(--ink);font-variant-numeric:tabular-nums}
.vrig .acts2{display:flex;gap:.45rem}
.vrig .ract{flex:1;height:2.4rem;border-radius:.5rem;border:1px solid var(--line);background:none;color:var(--dim);
  font-family:var(--mono);font-size:.6rem;font-weight:700;letter-spacing:.12em;cursor:pointer}
.vrig .ract.p{border-color:rgba(245,166,35,.5);background:rgba(245,166,35,.16);color:var(--acc)}
.vrig .ract.go{border-color:rgba(84,176,255,.5);background:rgba(84,176,255,.12);color:var(--acc2)}
.vrig .ract.bad{color:var(--danger)}
.vrig .ract:disabled{color:#34435a!important;border-color:rgba(60,74,92,.35)!important;background:transparent!important;cursor:not-allowed}
.vrig .note2{font-family:var(--mono);font-size:.52rem;color:var(--faint);letter-spacing:.06em;line-height:1.5}

/* ── NETLINK (mesh browser) ────────────────────────────────────────────────
   Every rule below is scoped under .nl-root. That scoping is what let the
   designer's stylesheet come across unedited: it shares 79 class names with
   this file (.card .panel .tab .status .row .act ...), and .nl-root .card
   outranks a bare .card, so the browser's own components win inside the view
   and nothing it declares escapes it. The chassis rules (.spool-*, the
   dialling overlay) were dropped, not scoped — this deck already paints them. */
.nl-root{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.nl-root{--scr:#050a10;--scr2:#0a121c;--panel:#0c1622;--panel2:#0e1a28;
--acc:#f5a623;--acc2:#54b0ff;--danger:#ff4d4d;--amber:#54b0ff;--violet:#b57bff;--magenta:#ff3d81;
--ink:#dbe6f2;--dim:#7d8b9e;--faint:#3c4a5c;--line:rgba(245,166,35,.15);
--mono:ui-monospace,'JetBrains Mono','SF Mono',Menlo,Consolas,monospace;
--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif}
.nl-root,
.nl-root{margin:0;padding:0;height:100%;overflow:hidden;background:#07090a}
.nl-root{color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.nl-root{box-sizing:border-box}button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
.nl-root input,
.nl-root textarea{font:inherit;color:inherit;background:none;border:0;outline:0}
.nl-root *::-webkit-scrollbar{width:6px}*::-webkit-scrollbar-thumb{background:#1c2a3a;border-radius:3px}
@keyframes apPulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes apScan{0%{background-position:0 0}100%{background-position:0 3px}}
@keyframes apFlicker{0%,100%{opacity:.46}47%{opacity:.5}52%{opacity:.42}}
@keyframes apSpin{0%{background-position:0 0}100%{background-position:0 -14px}}
@keyframes load{0%{width:0}70%{width:80%}100%{width:100%}}
@keyframes slidein{0%{opacity:0;transform:translateY(-.4rem)}100%{opacity:1;transform:none}}
/* ── browser chrome ── */
.tabs{flex:none;z-index:3;display:flex;align-items:flex-end;gap:.2rem;padding:.45rem .7rem 0;background:var(--scr2);font-family:var(--mono)}
.nl-root .tab{display:flex;align-items:center;gap:.5rem;padding:.42rem .8rem;border:1px solid var(--line);border-bottom:0;border-radius:.45rem .45rem 0 0;
  background:var(--panel);color:var(--dim);font-size:.6rem;letter-spacing:.12em;max-width:13rem}
.nl-root .tab.on{background:var(--scr);color:var(--ink);position:relative}
.nl-root .tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--scr)}
.nl-root .tab .fav{width:.55rem;height:.55rem;border-radius:.15rem;flex:none;background:var(--faint)}
.nl-root .tab .fav.tw{background:var(--acc2)}.tab .fav.ap{background:var(--acc)}
.nl-root .tab .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nl-root .tab .x{color:var(--faint);margin-left:.2rem;font-size:.7rem;line-height:1}.tab .x:hover{color:var(--danger)}
.nl-root .tab.new{border-style:dashed;color:var(--faint);padding:.42rem .6rem}
.nl-root .bar{flex:none;z-index:3;display:flex;align-items:center;gap:.5rem;padding:.45rem .7rem;background:var(--scr);border-bottom:1px solid var(--line);font-family:var(--mono)}
.nl-root .nav{width:1.7rem;height:1.7rem;border-radius:.4rem;border:1px solid var(--line);color:var(--dim);font-size:.8rem;display:grid;place-items:center}
.nl-root .nav:disabled{color:var(--faint);border-color:rgba(60,74,92,.3);cursor:default}
.nl-root .url{flex:1;display:flex;align-items:center;gap:.6rem;height:1.7rem;padding:0 .75rem;border-radius:.85rem;border:1px solid var(--line);background:var(--panel)}
.nl-root .url .lock{color:var(--acc);font-size:.6rem;letter-spacing:.1em}
.nl-root .url .lock.bad{color:var(--danger)}
.nl-root .url input{flex:1;font-family:var(--mono);font-size:.64rem;letter-spacing:.06em;color:var(--ink)}
.nl-root .url .go{color:var(--faint);font-size:.6rem;letter-spacing:.14em}
.nl-root .loadbar{position:absolute;left:0;top:0;height:2px;width:0;background:var(--acc2);z-index:4;box-shadow:0 0 .4rem var(--acc2)}
.nl-root .loadbar.run{animation:load .7s ease-out forwards}
.nl-root .page{position:relative;z-index:2;flex:1;min-height:0;overflow:hidden;display:flex}
/* ── TWATTER ── */
.tw{flex:1;display:grid;grid-template-columns:11rem 1fr 13rem;min-height:0;background:var(--scr)}
.nl-root .tw-nav{border-right:1px solid var(--line);padding:.9rem .7rem;display:flex;flex-direction:column;gap:.15rem}
.nl-root .tw-logo{display:flex;align-items:center;gap:.5rem;padding:.2rem .5rem .9rem;font-family:var(--mono);font-weight:800;font-size:.9rem;letter-spacing:.2em;color:var(--acc2)}
.nl-root .tw-logo i{width:1.4rem;height:1.4rem;border-radius:50%;background:var(--acc2);display:grid;place-items:center;font-style:normal;color:#04101c;font-size:.75rem}
.nl-root .tw-nav button{display:flex;align-items:center;gap:.6rem;padding:.5rem .6rem;border-radius:.5rem;color:var(--dim);font-size:.7rem;letter-spacing:.06em;text-align:left;font-family:var(--mono)}
.nl-root .tw-nav button .pip{width:.45rem;height:.45rem;border-radius:50%;border:1px solid currentColor;flex:none}
.nl-root .tw-nav button.on{color:var(--ink);background:var(--panel)}.tw-nav button.on .pip{background:var(--acc2);border-color:var(--acc2)}
.nl-root .tw-nav button:hover{color:var(--ink)}
.nl-root .tw-nav .n{margin-left:auto;font-size:.55rem;color:var(--acc);font-variant-numeric:tabular-nums}
.nl-root .tw-post{margin-top:.6rem;justify-content:center;background:var(--acc2)!important;color:#04101c!important;font-weight:800;letter-spacing:.2em!important}
.nl-root .tw-me{margin-top:auto;display:flex;align-items:center;gap:.5rem;padding:.5rem .4rem;border-top:1px solid var(--line);font-family:var(--mono)}
.nl-root .av{width:1.9rem;height:1.9rem;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--mono);font-weight:800;font-size:.62rem;
  background:var(--panel2);border:1px solid var(--line);color:var(--acc)}
.nl-root .av.cop{color:var(--acc2);border-color:rgba(84,176,255,.4)}.av.gang{color:var(--magenta);border-color:rgba(255,61,129,.35)}.av.sys{color:var(--violet);border-color:rgba(181,123,255,.35)}
.nl-root .tw-me .h{font-size:.6rem;color:var(--ink);line-height:1.3}.tw-me .h small{display:block;color:var(--faint);font-size:.5rem}
.nl-root .tw-feed{min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--line)}
.nl-root .tw-head{flex:none;display:flex;align-items:center;gap:1rem;padding:.65rem .9rem;border-bottom:1px solid var(--line);font-family:var(--mono)}
.nl-root .tw-head h1{margin:0;font-size:.78rem;letter-spacing:.2em;color:var(--ink)}
.nl-root .tw-head .sub{font-size:.52rem;color:var(--faint);letter-spacing:.14em;margin-left:auto}
.nl-root .tw-head .live{display:flex;align-items:center;gap:.4rem;font-size:.52rem;color:var(--acc2);letter-spacing:.14em}
.nl-root .tw-head .live i{width:.4rem;height:.4rem;border-radius:50%;background:var(--acc2);animation:apPulse 1.6s infinite}
.nl-root .compose{flex:none;display:flex;gap:.7rem;padding:.8rem .9rem;border-bottom:1px solid var(--line);background:var(--scr2)}
.nl-root .compose .box{flex:1;display:flex;flex-direction:column;gap:.5rem}
.nl-root .compose textarea{resize:none;height:2.6rem;font-size:.74rem;line-height:1.45;color:var(--ink);font-family:var(--sans)}
.nl-root .compose textarea::placeholder{color:var(--faint)}
.nl-root .compose .ft{display:flex;align-items:center;gap:.7rem;font-family:var(--mono);font-size:.52rem;color:var(--faint);letter-spacing:.1em}
.nl-root .compose .cnt{margin-left:auto;font-variant-numeric:tabular-nums}.compose .cnt.over{color:var(--danger)}
.nl-root .compose .send{padding:.38rem .9rem;border-radius:1rem;background:var(--acc2);color:#04101c;font-weight:800;letter-spacing:.18em;font-size:.56rem}
.nl-root .compose .send:disabled{background:var(--panel2);color:var(--faint);cursor:not-allowed}
.nl-root .stream{flex:1;min-height:0;overflow-y:auto}
.nl-root .twt{display:flex;gap:.7rem;padding:.75rem .9rem;border-bottom:1px solid rgba(245,166,35,.08)}
.nl-root .twt.new{animation:slidein .35s ease-out}
.nl-root .twt.pin{background:rgba(84,176,255,.05)}
.nl-root .twt .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:.3rem}
.nl-root .twt .who{display:flex;align-items:center;gap:.45rem;font-family:var(--mono);font-size:.6rem}
.nl-root .twt .who b{color:var(--ink);font-weight:700}.twt .who span{color:var(--faint)}
.nl-root .twt .who .badge{font-size:.42rem;letter-spacing:.14em;padding:.08rem .35rem;border-radius:.2rem;border:1px solid currentColor}
.nl-root .badge.cop{color:var(--acc2)}.badge.gang{color:var(--magenta)}.badge.sys{color:var(--violet)}.badge.gov{color:var(--acc)}
.nl-root .twt .who .ts{margin-left:auto;color:var(--faint);font-size:.52rem}
.nl-root .twt .txt{font-size:.76rem;line-height:1.5;color:var(--ink);word-break:break-word}
.nl-root .twt .txt em{font-style:normal;color:var(--acc2)}
.nl-root .twt .txt strong{color:var(--acc);font-weight:600}
.nl-root .twt .pinl{font-family:var(--mono);font-size:.46rem;letter-spacing:.16em;color:var(--acc2)}
.nl-root .twt .acts{display:flex;gap:1.4rem;margin-top:.15rem;font-family:var(--mono);font-size:.54rem;color:var(--faint)}
.nl-root .twt .acts button{display:flex;align-items:center;gap:.35rem;color:inherit;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.nl-root .twt .acts button:hover{color:var(--dim)}
.nl-root .twt .acts button.on.like{color:var(--magenta)}.twt .acts button.on.rt{color:var(--acc)}
.nl-root .twt .quote{border:1px solid var(--line);border-radius:.5rem;padding:.45rem .6rem;font-size:.62rem;color:var(--dim);line-height:1.45}
.nl-root .twt .quote b{color:var(--ink);font-family:var(--mono);font-size:.56rem}
.nl-root .tw-side{padding:.9rem .8rem;display:flex;flex-direction:column;gap:.7rem;min-height:0;overflow-y:auto}
.nl-root .card{background:var(--panel);border:1px solid var(--line);border-radius:.7rem;padding:.7rem .8rem;display:flex;flex-direction:column;gap:.5rem}
.nl-root .card h3{margin:0;font-family:var(--mono);font-size:.56rem;letter-spacing:.22em;color:var(--dim)}
.nl-root .trend{display:flex;flex-direction:column;gap:.1rem;padding:.3rem 0;cursor:pointer}
.nl-root .trend:hover .tg{color:var(--acc2)}
.nl-root .trend .tg{font-family:var(--mono);font-size:.64rem;color:var(--ink);font-weight:600}
.nl-root .trend .tc{font-family:var(--mono);font-size:.48rem;color:var(--faint);letter-spacing:.1em}
.nl-root .who2{display:flex;align-items:center;gap:.5rem;padding:.25rem 0}
.nl-root .who2 .h{flex:1;min-width:0;font-family:var(--mono);font-size:.56rem;color:var(--ink);line-height:1.3;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.nl-root .who2 .h small{display:block;color:var(--faint);font-size:.48rem}
.nl-root .who2 .fl{font-family:var(--mono);font-size:.5rem;letter-spacing:.14em;padding:.22rem .5rem;border-radius:.8rem;border:1px solid var(--acc2);color:var(--acc2)}
.nl-root .who2 .fl.on{background:var(--acc2);color:#04101c}
.nl-root .ad{border-style:dashed;color:var(--dim);font-size:.6rem;line-height:1.5}
.nl-root .ad b{display:block;font-family:var(--mono);font-size:.5rem;letter-spacing:.2em;color:var(--acc);margin-bottom:.2rem}
.nl-root .ad small{display:block;font-family:var(--mono);font-size:.44rem;color:var(--faint);letter-spacing:.14em;margin-top:.3rem}
/* profile view */
.prof{flex:none;padding:.9rem .9rem .6rem;border-bottom:1px solid var(--line);display:flex;gap:.9rem;align-items:flex-start}
.nl-root .prof .av{width:3rem;height:3rem;font-size:.95rem}
.nl-root .prof .pi{display:flex;flex-direction:column;gap:.25rem;font-family:var(--mono)}
.nl-root .prof .pi b{font-size:.8rem;color:var(--ink)}.prof .pi span{font-size:.56rem;color:var(--faint)}
.nl-root .prof .bio{font-family:var(--sans);font-size:.68rem;color:var(--dim);line-height:1.5;margin-top:.2rem}
.nl-root .prof .stats{display:flex;gap:1.2rem;font-size:.56rem;color:var(--faint);margin-top:.25rem}
.nl-root .prof .stats b{color:var(--ink);font-size:.62rem}
/* ── EXCHANGE (deck.html .panel/.row/.act/.status grammar) ── */
.ex{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--scr)}
.nl-root .ex-top{flex:none;display:flex;align-items:center;gap:1rem;padding:.55rem .9rem;border-bottom:1px solid var(--line);font-family:var(--mono)}
.nl-root .ex-top .lg{font-weight:800;font-size:.8rem;letter-spacing:.24em;color:var(--acc)}
.nl-root .ex-top .lg small{font-weight:400;font-size:.5rem;letter-spacing:.2em;color:var(--faint);margin-left:.6rem}
.nl-root .ex-top .bal{margin-left:auto;display:flex;gap:1.4rem;font-size:.7rem;color:var(--dim);font-variant-numeric:tabular-nums}
.nl-root .ex-top .bal b{color:var(--acc);font-weight:600}.ex-top .bal .nd{color:var(--violet);font-weight:600}
.nl-root .ex-body{flex:1;min-height:0;display:flex;padding:.6rem;gap:.6rem}
.nl-root .panel{background:var(--panel);border:1px solid var(--line);border-radius:.7rem}
.nl-root .panel-hd{flex:none;display:flex;align-items:center;gap:.6rem;padding:.55rem .85rem;border-bottom:1px solid var(--line)}
.nl-root .label{font-family:var(--mono);font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.nl-root .meta{font-family:var(--mono);font-size:.56rem;letter-spacing:.12em;color:var(--faint);margin-left:auto}
.nl-root .scroller{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:.5rem .6rem;display:flex;flex-direction:column;gap:.4rem}
.nl-root .status{flex:none;min-height:1.9rem;display:flex;align-items:center;gap:.75rem;padding:.45rem .85rem;border-top:1px solid var(--line);font-family:var(--mono);font-size:.6rem;color:var(--faint)}
.nl-root .status .msg.bad{color:var(--danger)}.status .foothint{margin-left:auto;letter-spacing:.1em}
.nl-root .lcol{flex:none;width:10.5rem;display:flex;flex-direction:column;min-height:0}
.nl-root .fchip{font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;padding:0 .6rem;height:2.3rem;border-radius:.45rem;border:1px solid var(--line);color:var(--dim);display:flex;align-items:center;flex:none;text-align:left}
.nl-root .fchip b{margin-left:auto;font-weight:600;color:var(--faint);font-variant-numeric:tabular-nums}
.nl-root .fchip.on{border-color:rgba(245,166,35,.5);background:rgba(245,166,35,.14);color:var(--acc)}
.nl-root .pcol{flex:none;width:16rem;display:flex;flex-direction:column;min-height:0}
.nl-root .prow{flex:none;height:2.7rem;display:flex;align-items:center;gap:.55rem;padding:0 .6rem;background:var(--panel2);border:1px solid var(--line);border-radius:.55rem;text-align:left}
.nl-root .prow:hover{border-color:rgba(245,166,35,.35)}
.nl-root .prow[aria-current]{border-color:rgba(245,166,35,.5);background:rgba(245,166,35,.1)}
.nl-root .row-dot{width:.45rem;height:.45rem;border-radius:50%;flex:none;background:#26364a}
.nl-root .row-dot.on{background:var(--acc2);box-shadow:0 0 .45rem var(--acc2)}
.nl-root .prow .nm{flex:1;min-width:0;font-size:.72rem;font-weight:550;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nl-root .prow .ask{font-family:var(--mono);font-size:.64rem;font-weight:600;color:var(--acc);font-variant-numeric:tabular-nums;flex:none}
.nl-root .prow .tr{font-family:var(--mono);font-size:.54rem;width:2.6rem;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.nl-root .up{color:var(--acc2)}.dn{color:var(--danger)}
.nl-root .dcol{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.nl-root .worth{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:.45rem;padding:.55rem .6rem 0}
.nl-root .stat{background:var(--panel2);border:1px solid var(--line);border-radius:.55rem;padding:.4rem .6rem}
.nl-root .stat label{display:block;font-family:var(--mono);font-size:.5rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-bottom:.25rem}
.nl-root .stat b{font-family:var(--mono);font-size:.8rem;font-variant-numeric:tabular-nums;color:var(--ink)}
.nl-root .stat b.acid{color:var(--acc)}.stat b.cyan{color:var(--acc2)}
.nl-root .cols,
.nl-root .lrow{display:grid;grid-template-columns:.45rem minmax(0,1fr) minmax(0,3rem) minmax(0,4.4rem) minmax(0,5rem) 5.2rem;gap:.5rem;align-items:center}
.nl-root .cols{flex:none;padding:.4rem 1.2rem 0}
.nl-root .cols span{font-family:var(--mono);font-size:.5rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);text-align:right}
.nl-root .cols span:nth-child(2){text-align:left}
.nl-root .lrow{flex:none;height:2.25rem;padding:0 .6rem;background:var(--panel2);border:1px solid var(--line);border-radius:.55rem}
.nl-root .lrow .seller{font-size:.7rem;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nl-root .lrow .num{font-family:var(--mono);font-size:.62rem;font-variant-numeric:tabular-nums;text-align:right;color:var(--dim);white-space:nowrap;overflow:hidden;min-width:0}
.nl-root .lrow .num.acid{color:var(--acc);font-weight:600}
.nl-root .act{border:1px solid var(--line);color:var(--dim);border-radius:.35rem;padding:.3rem .5rem;font-family:var(--mono);font-size:.56rem;letter-spacing:.1em;white-space:nowrap}
.nl-root .act.acid{color:var(--acc)}.act.acid:hover:not(:disabled){border-color:rgba(245,166,35,.45)}
.nl-root .act:disabled{color:#2c3a4c!important;border-color:rgba(60,74,92,.35)!important;cursor:not-allowed}
/* 404 + home */
.blank{flex:1;display:grid;place-items:center;font-family:var(--mono);text-align:center}
.nl-root .blank .in{display:flex;flex-direction:column;align-items:center;gap:.7rem}
.nl-root .blank .big{font-size:2.6rem;font-weight:800;letter-spacing:.3em;color:var(--faint)}
.nl-root .blank .m{font-size:.6rem;letter-spacing:.2em;color:var(--dim)}
.nl-root .blank .s{font-size:.5rem;letter-spacing:.16em;color:var(--faint);line-height:1.8}
.nl-root .blank .s em{font-style:normal;color:var(--acc2);cursor:pointer}
.nl-root .home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;font-family:var(--mono)}
.nl-root .home .lg{font-size:1.5rem;font-weight:800;letter-spacing:.4em;color:var(--acc)}
.nl-root .home .lg small{display:block;font-size:.5rem;letter-spacing:.3em;color:var(--faint);margin-top:.3rem;font-weight:400}
.nl-root .speed{display:grid;grid-template-columns:repeat(4,7.5rem);gap:.6rem}
.nl-root .dial{aspect-ratio:1.5;border:1px solid var(--line);border-radius:.6rem;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;color:var(--dim);font-size:.56rem;letter-spacing:.12em}
.nl-root .dial:hover{border-color:var(--acc2);color:var(--ink)}
.nl-root .dial i{width:1.3rem;height:1.3rem;border-radius:.3rem;background:var(--faint);font-style:normal}
.nl-root .dial i.tw{background:var(--acc2)}.dial i.ap{background:var(--acc)}
.nl-root .dial.dead{opacity:.45;border-style:dashed}

<script>
/* Bridge self-boot. The page pulls bridge.js out of the PBO itself, which has
   no race in it: A3API is injected into every local-content page before any of
   our script runs. fn_webBridgeInit still injects the same file over ExecJS on
   PageLoaded as a fallback, and bridge.js is idempotent, so whichever wins is
   fine. A <script src> would NOT work here — the page has no resolvable base
   URL and the src silently resolves to nothing. */
window.WEBUIReady = new Promise(function (resolve) { window.__webuiReady = resolve; });
if (typeof A3API !== "undefined" && A3API.RequestFile) {
  window.__webuiBootPath = "stub";
  A3API.RequestFile("webui\\ui\\webui.js")
    .then(function (src) { (0, eval)(src); })
    .catch(function (e) { console.error("bridge self-load failed, waiting for SQF injection", e); });
}
</script>

<script>
"use strict";
/* ---------------------------------------------------------------------------
   WIRE FORMAT.  fn_deckData builds HashMaps and webui_fnc_push serialises
   them with toJSON, so a channel value arrives here as a plain object with the
   same key names SQF used. No mapping layer, and nothing to keep in step.

   Every WEBUI.call() into the deck answers { ok, msg }; promptText answers a bare
   string, or null when the player cancelled.
   --------------------------------------------------------------------------- */

var S = {
  view: "home",
  phone: null, gang: null, keys: null, money: null,
  /* Quickhacks. DECLARED HERE ON PURPOSE, and qhTargets specifically must be an
     ARRAY rather than null. openQh() fires two independent calls -- "deck" and
     "targets" -- and each one calls render() from its own .then. Whichever
     lands first re-renders while the other is still in flight, so there is
     always a window where S.qh is set and S.qhTargets is not. viewQh() guards
     S.qh (returns "BOOTING FIRMWARE") but then reads S.qhTargets.length
     unguarded, which threw "Cannot read properties of undefined (reading
     'length')" on that window and killed the render -- an unhandled rejection
     in the RPT and a dead Quickhacks screen, every time the deck promise won
     the race. Seeding an empty array makes the intermediate state renderable
     instead of fatal: the list simply shows NOTHING IN RANGE until the targets
     arrive. */
  qh: null, qhTargets: [],
  /* staff app: payload, selection, tab, catalogues, arm-then-commit */
  staff: null, stSel: null, stTab: "act", stCat: null, stItem: null, stGroup: null,
  stAcc: null, stAccSel: null, stDos: null, stArm: null, stArmT: 0,
  stFind: "", stCatFind: "", stCoords: "", stReason: "", stAmount: "",
  filter: 0, pick: 0, amount: "", picker: null, confirm: null,
  status: "", statusKind: "", statusTimer: 0,
  /* ctx apps (deck-app wave) */
  bank: null, bankXfer: false, bankArm: 0, bankArmT: 0,
  exch: null, exCat: null, exClass: null, exTab: "browse",
  exSell: null,
  fab: null, fabTab: "print", fabSel: null, fabQ: "", fabArm: null, fabArmT: 0,
  grg: null, grgSel: null, grgArm: null, grgArmT: 0,
  grgPane: "info", grgMod: null, grgModCh: {},
  trunk: null, trkQ: [], trkPick: null,
  vsh: null, vshSel: null, vshMods: {}, vshSkin: -1, vshAlarm: false,
  hse: null, hseArm: null, hseArmT: 0,
  gangArm: null, gangArmT: 0,
  chop: null, chopArm: null, chopArmT: 0, skin: null,
  ldt: null, ldtSel: null, ldtArm: null, ldtArmT: 0,
  spr: null, sprMode: "spray",
  intk: null, intkQ: "", intkBill: [], intkArm: null, intkArmT: 0,
  med: null,
  sui: null, suiArm: null, suiArmT: 0,
  due: null, dueArm: false, dueArmT: 0,
  boot: null,
  rig: null,
  busy: false
};

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function F(n){
  return "$" + Math.round(Number(n) || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}
function el(id){ return document.getElementById(id); }
function ico(g, size, ia){
  return '<svg viewBox="0 0 100 100"' + (size ? ' style="width:'+size+';height:'+size+(ia?';--ia:'+ia:'')+'"' : '') +
         '><use href="#g-' + esc(g) + '"></use></svg>';
}

/* ---- bridge helpers ----------------------------------------------------- */
function say(msg, kind){
  S.status = msg; S.statusKind = kind || "hot";
  if (S.statusTimer) clearTimeout(S.statusTimer);
  S.statusTimer = setTimeout(function(){ S.status = ""; S.statusKind = ""; paintStatus(); }, 2600);
  paintStatus();
}
function paintStatus(){
  var n = document.querySelector(".status .msg");
  if (!n) return;
  n.textContent = S.status || "READY";
  n.className = "msg " + (S.status ? S.statusKind : "");
}
/* Every deck handler answers { ok, msg }. A rejected promise means the bridge
   itself failed (timeout / unregistered name), which is worth showing verbatim. */
function call(key, args, timeout){
  if (!window.WEBUI) { say("bridge not up yet", "bad"); return Promise.resolve(null); }
  return WEBUI.call(key, args || [], timeout).then(function(r){
    if (r && typeof r === "object" && "ok" in r){
      say(String(r.msg || key), r.ok ? "hot" : "bad");
    }
    return r;
  }, function(e){
    say(String(e && e.message || e), "bad");
    return null;
  });
}

/* ---- header ------------------------------------------------------------- */
function renderHeader(){
  var p = S.phone;
  var os   = p && p.side === "cop" ? "TAL LINK" : "NEON AEGEAN OS";
  var clock = p ? p.clock : "--:--";
  var restart = p ? p.restart : "--";
  var right;

  if (S.view === "home"){
    right = '<span>' + F(p ? p.cash : 0) + ' <span class="sep">&middot;</span> ' + F(p ? p.bank : 0) + '</span>' +
            '<span>' + esc(clock) + ' <b>[' + esc(restart) + ']</b></span>' +
            '<span class="batt">' + battBars(p ? p.batt : 0) + ' iGG ' + (p ? p.batt : 0) + '%</span>';
  } else if (S.view === "money"){
    right = '<span>PAYCHECK IN <b>' + esc(S.money && S.money.payIn ? S.money.payIn : "—") + '</b></span>' +
            '<span>' + esc(clock) + ' <b>[' + esc(restart) + ']</b></span>';
  } else {
    right = '<span>' + F(p ? p.cash : 0) + '</span>' +
            '<span>' + esc(clock) + ' <b>[' + esc(restart) + ']</b></span>';
  }

  var lead, app, crumb;
  if (S.view === "home"){
    lead = '<span class="livedot"></span>'; app = os; crumb = "// LAUNCHER";
  } else if (S.view === "gang"){
    lead = '<button class="backbtn" data-act="home">&#9666; BACK</button>'; app = "MY GANG"; crumb = "// ROSTER";
  } else if (S.view === "keys"){
    lead = '<button class="backbtn" data-act="home">&#9666; BACK</button>'; app = "KEYCHAIN";
    crumb = "// " + (S.keys ? S.keys.items.length : 0) + " HELD";
  } else if (S.view === "qh"){
    lead = '<button class="backbtn" data-act="home">&#9666; BACK</button>';
    app   = (S.qh && S.qh.side === "cop") ? "TAL OS" : "ICEBREAKER OS";
    crumb = "// QUICKHACK CONSOLE";
  } else if (S.view === "list"){
    lead = '<button class="backbtn" data-act="home">&#9666; BACK</button>';
    app   = S.list ? S.list.title : "LIST";
    crumb = S.list ? S.list.crumb : "// READING";
  } else if (S.view === "inv"){
    lead = '<button class="backbtn" data-act="home">&#9666; BACK</button>'; app = "INVENTORY";
    crumb = "// " + (S.inv ? S.inv.weight + "/" + S.inv.max : "READING");
  } else if (S.view === "wall"){
    lead = '<button class="backbtn" data-act="home">&#9666; BACK</button>'; app = "WALLPAPER";
    crumb = "// " + (S.wall ? S.wall.items.length + " AVAILABLE" : "READING");
  } else if (S.view === "market"){
    lead = '<button class="backbtn" data-act="home">&#9666; BACK</button>'; app = "MARKET";
    crumb = "// " + (S.market ? S.market.goods.length + " GOODS" : "READING");
  } else if (S.view === "settings"){
    lead = '<button class="backbtn" data-act="home">&#9666; BACK</button>'; app = "SETTINGS"; crumb = "// HANDSET";
  } else if (S.view === "msgs"){
    lead = '<button class="backbtn" data-act="home">&#9666; BACK</button>'; app = "MESSAGES";
    crumb = "// " + (S.msgs ? S.msgs.threads.length + " THREADS" : "READING");
  } else if (S.view === "tree"){
    lead = '<button class="backbtn" data-act="home">&#9666; BACK</button>';
    app   = S.tree ? S.tree.name  : "TREE";
    crumb = "// " + (S.tree ? (S.tree.crumb || "") : "READING");
  } else if (CTX_APPS[S.view]){
    lead = '<button class="backbtn" data-act="home">&#9666; BACK</button>';
    app   = CTX_APPS[S.view].title;
    crumb = CTX_APPS[S.view].crumb ? CTX_APPS[S.view].crumb() : "// READY";
  } else {
    lead = '<button class="backbtn" data-act="home">&#9666; BACK</button>'; app = "MONEY"; crumb = "// WALLET";
  }

  el("hdr").innerHTML =
    lead +
    '<span class="hdr-os">NEON AEGEAN</span>' +
    '<span class="hdr-app">' + esc(app) + '</span>' +
    '<span class="hdr-crumb">' + esc(crumb) + '</span>' +
    '<span class="hdr-right">' + right + '</span>';
}
/* four cells drawn in CSS rather than block glyphs — U+25AE/25AF are not in
   every font the embedded browser can reach, and a missing glyph is tofu. */
function battBars(pct){
  var full = Math.max(0, Math.min(4, Math.round((Number(pct) || 0) / 25)));
  var out = "";
  for (var i = 0; i < 4; i++) out += '<i class="' + (i < full ? "on" : "") + '"></i>';
  return '<span class="cells">' + out + '</span>';
}

/* ---- rail --------------------------------------------------------------- */
var RAIL = [
  { id: "Sync",      glyph: "sync",      ia: "var(--acc2)",   title: "Sync" },
  { id: "Money",     glyph: "money",     ia: "var(--acc)",    title: "Money",     view: "money" },
  { id: "Message",   glyph: "message",   ia: "var(--acc2)",   title: "Messages" },
  { id: "Inventory", glyph: "inventory", ia: "var(--violet)", title: "Inventory" }
];
function renderRail(){
  var h = '<button class="rail-btn" data-act="home"' + (S.view === "home" ? ' aria-current="page"' : '') +
          ' title="Home">' + ico("grid", "1.15rem") + '</button><span class="rail-sep"></span>';
  RAIL.forEach(function(r){
    var cur = r.view && S.view === r.view ? ' aria-current="page"' : '';
    /* Unread badge. The launcher already carries per-app badges in the phone payload,
       so the rail reads the same number rather than inventing a second source. */
    var bdg = "";
    if (S.phone && S.phone.apps){
      for (var i = 0; i < S.phone.apps.length; i++){
        if (S.phone.apps[i].id === r.id && S.phone.apps[i].badge){
          bdg = '<span class="rail-badge">' + esc(S.phone.apps[i].badge) + '</span>'; break;
        }
      }
    }
    h += '<button class="rail-btn" style="--ia:' + r.ia + ';position:relative" title="' + esc(r.title) + '"' + cur +
         ' data-act="rail" data-id="' + esc(r.id) + '">' + ico(r.glyph, "1.2rem") + bdg + '</button>';
  });
  h += '<span class="rail-esc">ESC CLOSES</span>';
  el("rail").innerHTML = h;
}

/* ---- 01 launcher -------------------------------------------------------- */
var CAT_ORDER = ["comms", "gang", "economy", "progress", "standing", "system", "admin"];
var CAT_META = {
  civ: { comms:["Comms","var(--acc2)"], gang:["Gang","var(--danger)"], economy:["Economy","var(--acc)"],
         progress:["Progress","var(--violet)"], standing:["Standing","var(--ice)"],
         system:["System","var(--dim)"], admin:["Admin","var(--magenta)"] },
  cop: { comms:["Comms","var(--acc2)"], gang:["Field","var(--danger)"], economy:["Economy","var(--acc)"],
         progress:["Progress","var(--violet)"], standing:["Records","var(--ice)"],
         system:["System","var(--dim)"], admin:["Admin","var(--magenta)"] }
};
function viewHome(){
  var p = S.phone;
  if (!p) return '<div class="panel" style="flex:1;display:flex"><div class="empty">WAITING FOR THE HANDSET<br>fn_deckData has not pushed the phone channel yet</div></div>';

  var meta = CAT_META[p.side === "cop" ? "cop" : "civ"];

  var favs = p.favs.map(function(f){
    return '<button class="tile' + (f.hero ? ' hero' : '') + '" data-act="launch" data-id="' + esc(f.id) + '">' +
             '<span class="tile-top">' + ico(f.glyph, "1.6rem") +
               '<span class="tile-name">' + esc(f.name) + '</span></span>' +
             '<span class="tile-sub">' + esc(f.sub) + '</span>' +
           '</button>';
  }).join("");

  var rows = CAT_ORDER.map(function(cat){
    var apps = p.apps.filter(function(a){ return a.cat === cat; });
    if (!apps.length) return "";                       // a row with no apps is dropped, label included
    var m = meta[cat] || ["Other", "var(--dim)"];
    return '<div class="cat" style="--ia:' + m[1] + '">' +
             '<div class="cat-label"><i></i><span>' + esc(m[0]) + '</span></div>' +
             '<div class="cat-apps">' + apps.map(function(a){
               return '<button class="app" data-act="launch" data-id="' + esc(a.id) + '">' +
                        ico(a.glyph, "1.3rem") +
                        '<span class="app-name">' + esc(a.name) + '</span>' +
                        (a.badge ? '<span class="badge">' + esc(a.badge) + '</span>' : '') +
                      '</button>';
             }).join("") + '</div>' +
           '</div>';
  }).join("");

  return '<div style="flex:none">' +
           '<div class="favhd"><span class="label">Favourites</span>' +
             '<span class="meta">tap to open</span><span class="rule"></span></div>' +
           '<div class="favgrid">' + (favs || '<div class="empty">NO FAVOURITES SET</div>') + '</div>' +
         '</div>' +
         '<div class="cats">' + rows + '</div>';
}

/* ---- 02 gang roster ----------------------------------------------------- */
/* one arm slot for every destructive gang verb: first click arms, second commits */
function gangArm2(key){
  if (S.gangArm === key){
    S.gangArm = null;
    if (S.gangArmT) clearTimeout(S.gangArmT);
    return true;
  }
  S.gangArm = key; render(); say("click again to confirm", "bad");
  if (S.gangArmT) clearTimeout(S.gangArmT);
  S.gangArmT = setTimeout(function(){ if (S.gangArm){ S.gangArm = null; if (S.view === "gang") render(); } }, 5000);
  return false;
}
function viewGang(){
  var g = S.gang;
  if (!g) return listShell(
    '<div class="card"><div class="card-id">' + ico("mygang", "1.5rem", "var(--danger)") +
      '<div><div class="t">No gang</div><div class="s">NOT A MEMBER</div></div></div></div>',
    "Members", "0", "",
    '<div class="empty">YOU ARE NOT IN A GANG<br>join or create one from MY GANG</div>', "");

  var online = g.members.filter(function(m){ return m.online; }).length;
  var left =
    '<div class="card">' +
      '<div class="card-id">' + ico("mygang", "1.5rem", "var(--danger)") +
        '<div style="min-width:0"><div class="t">' + esc(g.name) + '</div>' +
        '<div class="s">' + (g.tag ? "[" + esc(g.tag) + "]" : "NO TAG") +
        (g.founded ? " &middot; " + esc(g.founded) : "") + '</div></div>' +
      '</div>' +
      '<div class="hair"></div>' +
      kv("YOUR RANK", g.myRank, "acid") +
      kv("GANG BANK", g.funds < 0 ? "—" : F(g.funds), "") +
      kv("ONLINE", online + " / " + g.members.length, "cyan") +
      kv("PERK POINTS", g.perkPoints < 0 ? "—" : String(g.perkPoints), "") +
    '</div>' +
    /* Real fields. Typed text reaches the DOM here -- that was measured, and the
       native prompt overlay this used to open is now only a fallback for when
       the browser is frozen. */
    /* Renaming is leader-only and the gang bank pays for it. Both facts come off
       the payload — the server charges and re-checks the rank regardless, so this
       is here to stop the player finding out by refusal. */
    '<div class="card tight">' +
      '<span class="label">Gang name</span>' +
      '<div class="fieldrow">' +
        '<input id="gname" type="text" maxlength="24" spellcheck="false" value="' + esc(g.name) + '"' +
          (g.canRename ? "" : " disabled") + '>' +
        '<button class="act acid" data-act="renameGang"' + (g.canRename ? "" : " disabled") + '>SAVE</button>' +
      '</div>' +
      '<span class="meta" style="color:var(--faint);letter-spacing:.08em">' +
        (g.canRename
          ? (g.renameFee > 0 ? F(g.renameFee) + " FROM THE GANG BANK" : "FREE")
          : "LEADER ONLY") +
      '</span>' +
    '</div>' +
    '<div class="card tight">' +
      '<span class="label">Invite player</span>' +
      '<div class="fieldrow">' +
        '<input id="ginvite" type="text" maxlength="24" spellcheck="false" placeholder="exact name">' +
        '<button class="act acid" data-act="invite">INVITE</button>' +
      '</div>' +
    '</div>' +
    /* ── COMMAND extension (mocks deck-gang-a/c) ─────────────────────────── */
    (g.rank <= 3 ?
      '<div class="card tight">' +
        '<span class="label">Gang bank' + (g.funds < 0 ? " — OPEN LEDGER FIRST" : " — $ " + F(g.funds)) + '</span>' +
        '<div class="fieldrow">' +
          '<input id="gbamt" inputmode="numeric" placeholder="amount">' +
          '<button class="act acid" data-act="gbVerb" data-id="dep">DEP</button>' +
          '<button class="act" data-act="gbVerb" data-id="depall">ALL</button>' +
          (g.rank <= 2 ? '<button class="act" data-act="gbVerb" data-id="wd">WD</button>' : '') +
        '</div>' +
        (g.rank <= 2 && g.members.length ?
          '<div class="fieldrow"><select id="gbxtgt">' +
            g.members.map(function(m2){ return '<option value="' + esc(m2.uid) + '" data-name="' + esc(m2.name) + '">' + esc(m2.name) + '</option>'; }).join("") +
          '</select><button class="act" data-act="gbXfer">' + (S.gangArm === "xfer" ? "CONFIRM" : "SEND") + '</button></div>' : '') +
        (g.funds < 0 ? '<button class="act cyan" data-act="gbOpen">OPEN LEDGER</button>' : '') +
      '</div>' : '') +
    (g.rank <= 2 ?
      '<div class="card tight">' +
        '<span class="label">Gang tag — 4 chars</span>' +
        '<div class="fieldrow">' +
          '<input id="gtag" maxlength="4" spellcheck="false" value="' + esc(g.tag || "") + '">' +
          '<button class="act acid" data-act="gTag">SET</button>' +
        '</div>' +
      '</div>' : '') +
    /* ── FIXER ALLEGIANCE ────────────────────────────────────────────────
       Which fixer the gang answers to, and the cost of changing that. Every
       number shown here is display: the server re-derives the rank, the fee,
       the cooldown and the war block before it changes anything. The reason a
       defection would be refused is shown BEFORE the button, because being
       told why after clicking is how a rule reads as a bug. */
    (function(){
      var fx = g.fixers || [], war = g.war || [], cur = g.faction || "";
      if (!fx.length) return '';
      var curName = "";
      fx.forEach(function(f){ if (f.id === cur) curName = f.name; });
      var atWar = cur !== "" && (cur === war[0] || cur === war[1]);
      var warLine = "";
      if (war.length >= 3 && war[0]){
        var nm = {}; fx.forEach(function(f){ nm[f.id] = f.name; });
        warLine = '<div class="meta" style="color:var(--amber)">THIS WEEK — ' +
          esc(nm[war[0]] || war[0]) + ' vs ' + esc(nm[war[1]] || war[1]) +
          ' · ' + esc(nm[war[2]] || war[2]) + ' NEUTRAL</div>';
      }
      return '<div class="card tight">' +
        '<span class="label">Fixer' + (cur ? ' — ' + esc(curName || cur) : ' — UNALIGNED') + '</span>' +
        warLine +
        (cur === '' && g.members.length >= (g.alignAt || 5) ?
          '<div class="meta" style="color:var(--danger)">' + g.members.length +
          ' STRONG AND NO PATRON — THE BEST CONTRACTS ARE CLOSED TO YOU</div>' : '') +
        (cur === '' ? '' :
          '<div class="meta" style="color:var(--faint)">BREAKING WITH THEM COSTS $' +
          F(g.defectFee || 0) + ' FROM THE GANG BANK, THEN ' + (g.defectDays || 7) +

/* ---- SUMMON VEHICLE (replaces Robotaxi) ---------------------------------------
   One screen: the starred vehicle, where it is, one button. S.summon is the last
   `summon` channel value (AP_fnc_summonState); "data" asks SQF for a fresh one. */
function openSummon(){
  go("summon");
  call("summon", ["data"]).then(function(v){ if (v) { S.summon = v; if (S.view === "summon") render(); } });
}
function viewSummon(){
  var s = S.summon;
  if (!s) return '<div class="panel" style="flex:1;display:flex"><div class="empty">CALLING THE GARAGE</div></div>';
  var info = s.info || { none: true };
  var st = s.state || "idle";
  var cd = Math.max(0, Math.round(s.cooldown || 0));
  var where = info.none ? "NOTHING STARRED"
            : !info.alive ? "WRECKED"
            : st === "enroute" ? ("EN ROUTE · " + (s.dist >= 1000 ? (s.dist/1000).toFixed(1) + " km" : s.dist + " m") + (s.eta ? " · ~" + s.eta + " s" : ""))
            : st === "spawning" ? "BRINGING IT OUT"
            : info.out ? ("OUT · " + (info.dist >= 1000 ? (info.dist/1000).toFixed(1) + " km" : info.dist + " m"))
            : "GARAGED";
  var reason = info.none ? "star a vehicle in the GARAGE app" : !info.alive ? "your recall vehicle is wrecked"
             : st === "enroute" || st === "spawning" ? "already on its way" : cd > 0 ? ("ready in " + cd + " s") : "";
  return '<div class="card">' +
      '<div class="card-id">' + ico("robotaxi", "1.5rem", "var(--acc)") +
        '<div><div class="t">' + (info.none ? "Summon vehicle" : esc(info.name)) + '</div>' +
        '<div class="s">' + (info.none ? "NO RECALL VEHICLE" : esc(info.kind) + " &middot; PLATE " + esc(info.plate)) + '</div></div>' +
      '</div>' +
      '<div class="hair"></div>' +
      kv("STATUS", where, st === "arrived" ? "acid" : st === "failed" ? "bad" : "") +
      (s.msg ? kv("LAST", esc(s.msg), "") : "") +
      '<div style="display:flex;gap:.5rem;margin-top:.6rem">' +
        '<button class="gact p" data-act="smGo"' + (reason ? " disabled" : "") + '>SUMMON</button>' +
        '<button class="gact" data-act="smGarage">GARAGE</button>' +
      '</div>' +
      (reason ? '<div class="cls" style="margin-top:.4rem;color:var(--amber)">' + esc(reason.toUpperCase()) + '</div>' : "") +
    '</div>' +
    '<div class="hint"><i>&#9673;</i><span>It appears about a kilometre out and drives &mdash; or flies and lands &mdash; to you. ' +
      'Free, two minutes between summons. If it is already out in the world it is brought back in from a kilometre away.</span></div>';
}

/* ---- 04 money ----------------------------------------------------------- */
var PAD = ["1","2","3","1K","4","5","6","10K","7","8","9","50K","CLR","0","000","MAX"];
function amountValue(){ return parseInt(S.amount || "0", 10) || 0; }
function padPush(kk){
  var cash = S.money ? S.money.cash : 0;
  if (kk === "CLR")  { S.amount = ""; return; }
  if (kk === "MAX")  { S.amount = String(cash); return; }
  if (kk === "1K")   { S.amount = "1000"; return; }
  if (kk === "10K")  { S.amount = "10000"; return; }
  if (kk === "50K")  { S.amount = "50000"; return; }
  if (S.amount.length >= 9) return;
  S.amount = (S.amount + kk).replace(/^0+(?=\d)/, "");
}
function viewMoney(){
  var m = S.money;
  if (!m) return '<div class="panel" style="flex:1;display:flex"><div class="empty">WAITING FOR THE WALLET</div></div>';

  var total  = (m.cash || 0) + (m.bank || 0);
  var liquid = total > 0 ? Math.round((m.cash / total) * 100) : 0;

  /* Charges, not bills. There is no way to settle these from a handset — an
     officer processes you — so the rows carry no PAY button (owner 2026-08-14).
     The total is the server's bounty figure, not the sum of the rows. */
  var fines = m.fines.length
    ? m.fines.map(function(f){
        return '<div class="fine"><div style="min-width:0;flex:1">' +
                 '<div class="r">' + esc(f.reason) + '</div><div class="b">' + esc(f.by) + '</div></div>' +
                 '<span class="a">' + F(f.amount) + '</span>' +
               '</div>';
      }).join("")
    : '<div class="empty" style="padding:.6rem">NOTHING OUTSTANDING</div>';
  var fineTotal = m.bounty || 0;

  var col1 =
    '<div class="mcard">' +
      '<span class="label">Cash on hand</span>' +
      '<span class="big">' + F(m.cash) + '</span>' +
      '<span class="meta" style="letter-spacing:.06em">DROPS ON DEATH &middot; SEIZABLE ON SEARCH</span>' +
    '</div>' +
    '<div class="mcard">' +
      '<span class="label">Bank</span>' +
      '<span class="big small">' + F(m.bank) + '</span>' +
      '<div class="meter"><i style="width:' + liquid + '%"></i></div>' +
      '<div class="split"><span class="liq">' + liquid + '% LIQUID</span><span>' + F(total) + ' TOTAL</span></div>' +
    '</div>' +
    /* New Drachma. Its own card because it is a different currency, not a second
       balance: the server holds it to four decimal places and SQF sends the string
       already formatted, so this renders it verbatim rather than running it through
       the dollar formatter. */
    '<div class="mcard nd">' +
      '<span class="label">New Drachma</span>' +
      '<span class="big small nd-v">' + esc(m.nd || "0") + '<i>ND</i></span>' +
      '<span class="meta" style="letter-spacing:.06em">SERVER-HELD LEDGER &middot; EXACT TO 4DP</span>' +
    '</div>' +
    '<div class="finebox">' +
      '<div style="display:flex;align-items:center;gap:.5rem">' +
        '<span class="label">Outstanding fines</span>' +
        '<span class="meta" style="color:var(--danger)">' + (fineTotal ? F(fineTotal) + " DUE" : "") + '</span>' +
      '</div>' +
      '<div class="fine-scroll">' + fines + '</div>' +
      (m.fines.length
        ? '<div class="meta" style="padding:.4rem .55rem 0;color:var(--faint);letter-spacing:.08em">' +
          'SETTLE IN PERSON &middot; AN OFFICER CLEARS THESE</div>'
        : "") +
    '</div>';

  var picks = m.nearby.length
    ? m.nearby.map(function(n, i){
        return '<button class="pick' + (S.pick === i ? " on" : "") + '" data-act="pick" data-id="' + i + '">' +
                 '<i></i><span class="n">' + esc(n.name) + '</span><span class="d">' + esc(n.dist) + '</span>' +
               '</button>';
      }).join("")
    : '<div class="empty" style="padding:.5rem">NOBODY NEARBY</div>';

  var amt = amountValue();
  var target = m.nearby[S.pick];
  var sendOn = amt > 0 && amt <= m.cash && !!target;
  var sendLabel = !target ? "NOBODY SELECTED"
                : amt <= 0 ? "ENTER AN AMOUNT"
                : amt > m.cash ? "NOT ENOUGH CASH"
                : "SEND " + F(amt) + " → " + String(target.name).toUpperCase();

  var pad = PAD.map(function(kk){
    var cls = /^\d$/.test(kk) ? "num" : kk === "000" ? "zeros" : kk === "CLR" ? "clr" : "";
    return '<button class="padkey ' + cls + '" data-act="pad" data-id="' + kk + '">' + kk + '</button>';
  }).join("");

  var col2 =
    '<div class="panel-hd"><span class="label">Transfer</span><span class="meta">nearby only</span></div>' +
    '<div class="picks">' + picks + '</div>' +
    '<div class="xbody">' +
      '<div class="amount"><span class="k">AMOUNT</span><span class="v">' + (S.amount ? F(amt) : "$0") + '</span></div>' +
      '<div class="pad">' + pad + '</div>' +
      '<button class="btn-primary" data-act="send"' + (sendOn ? "" : " disabled") + '>' + esc(sendLabel) + '</button>' +
      /* DEPOSIT / WITHDRAW lived here until 2026-08-14. Banking is an ATM errand
         on this server and the owner kept it that way rather than let the phone
         move cash out of a search or a chase. */
    '</div>';

  var ledger = m.ledger.length
    ? m.ledger.map(function(l){
        var up = (l.delta || 0) > 0;
        return '<div class="ledrow">' +
                 '<span class="t">' + esc(l.t) + '</span>' +
                 '<span class="l">' + esc(l.label) + '</span>' +
                 '<span class="g">' + esc(l.tag) + '</span>' +
                 '<span class="d ' + (up ? "up" : "dn") + '">' + (up ? "+" : "−") +
                   F(Math.abs(l.delta)).slice(1) + '</span>' +
               '</div>';
      }).join("")
    : '<div class="empty">NO LEDGER YET<br>the server does not record transactions per-player</div>';

  return '<div class="body" style="padding:0;gap:.7rem;z-index:auto">' +
           '<div class="mcol">' + col1 + '</div>' +
           '<div class="xfer">' + col2 + '</div>' +
           '<div class="listpanel">' +
             '<div class="panel-hd"><span class="label">Ledger</span>' +
               '<span class="livepip" style="color:var(--faint)">LAST 24H &middot; PUSHED ON CHANGE</span></div>' +
             '<div class="scroller">' + ledger + '</div>' +
             '<div class="status"><span class="msg">READY</span></div>' +
           '</div>' +
         '</div>';
}

/* ---- 12 staff (the admin panel, as an app) --------------------------------
   The fullscreen page (ui\html\staff.html) was the design; this is that design
   living inside the handset, on the deck's own palette and components, driven by
   the same SQF contract: AP.on("staff") at 1 Hz while the app is open, plus
   staffAct(action, targetUid, args) and staffCatalog(panel).

   THE ROSTER IS PATCHED, NOT REBUILT. A 1 Hz payload rewriting innerHTML under
   the cursor is the casino click-rebuild lesson; rows are keyed by uid and only
   touched when their own content signature changes.

   GATING renders what the viewer's level allows: a whole tier hides (the OWNER
   tab), a mixed section locks with the level named. SQF re-checks every verb, so
   this is honesty, not security. */
var ST_TABS = [["act","ACTIONS",2],["evt","EVENT",2],["wep","WEAPONS",3],
               ["veh","VEHICLES",3],["clo","CLOTHING",3],["own","OWNER",5]];
var ST_PANEL = { wep:"weapons", veh:"vehicles", clo:"clothing" };

function stLvl(){ return (S.staff && S.staff.level) || 0; }
function stSel(){
  if (!S.staff || !S.stSel) return null;
  for (var i = 0; i < S.staff.players.length; i++) if (S.staff.players[i].uid === S.stSel) return S.staff.players[i];
  return null;
}
function stFmt(n){ return (n === undefined || n === null || n < 0) ? "—" : F(n); }

/* Arm-then-commit. The engine sandboxes confirm() out, and a staff tool without a
   second step is one misclick from a ban. Same button, two presses, 5s window. */
function stArm(id){
  if (S.stArm === id) { S.stArm = null; return true; }
  S.stArm = id;
  if (S.stArmT) clearTimeout(S.stArmT);
  S.stArmT = setTimeout(function(){ S.stArm = null; if (S.view === "staff") render(); }, 5000);
  say("ARMED — press again to commit", "warn");
  render();
  return false;
}
function stAct(action, target, args){
  call("staffAct", [action, target || null, args || []]).then(function(r){
    if (!r) return;
    if (r.pos) { S.stCoords = r.pos.map(function(n){ return Math.round(n * 10) / 10; }).join(", "); }
    if (r.info) { S.stDos = r.info; }
    if (r.acc)  { S.stAcc = r.acc; S.stAccSel = null; }
    if (S.view === "staff") render();
  });
}
function stCat(tab){
  var panel = ST_PANEL[tab];
  if (!panel || (S.stCat && S.stCat[tab])) return;
  call("staffCatalog", [panel], 20000).then(function(c){
    S.stCat = S.stCat || {};
    S.stCat[tab] = (c && c.groups) ? c : { groups: [] };
    if (S.view === "staff") render();
  });
}
function openStaff(){
  S.view = "staff";
  S.stTab = S.stTab || "act";
  call("staffWatch", [true]);
  stCat(S.stTab);
  render();
}
/* SQF calls this when the phone is already open and a staffer asks for the panel
   (keybind / inventory button), so the app opens without churning the dialog. */
window.__deckOpenStaff = function(){ openStaff(); };

function stBtn(label, act, opt){
  opt = opt || {};
  var need = opt.lvl || 2;
  if (stLvl() < need && opt.hide) return "";
  var locked = stLvl() < need;
  var armed  = S.stArm === (act + "|" + (opt.args || ""));
  return '<button class="st-b' + (opt.cls ? " " + opt.cls : "") + (locked ? " lock" : "") + (armed ? " armed" : "") + '"' +
         ' data-act="stDo" data-id="' + esc(act) + '"' +
         (opt.args ? ' data-args="' + esc(opt.args) + '"' : "") +
         (opt.confirm ? ' data-confirm="1"' : "") +
         (opt.needsel ? ' data-needsel="1"' : "") +
         (locked ? ' data-lvl="LEVEL ' + need + '" disabled' : "") +
         (opt.dis ? " disabled" : "") + '>' + esc(armed ? "CONFIRM?" : label) + '</button>';
}
function stPill(key, label, act, args, note){
  var on = S.staff && S.staff.toggles && S.staff.toggles[key];
  return '<button class="st-pill' + (on ? " on" : "") + '" data-act="stDo" data-id="' + esc(act) + '"' +
         (args ? ' data-args="' + esc(args) + '"' : "") + '><i></i>' + esc(label) +
         '<span class="sp">' + esc(note || (on ? "ON" : "OFF")) + '</span></button>';
}

function stRoster(){
  var s = S.staff;
  if (!s) return '<div class="empty">WAITING FOR THE ROSTER</div>';
  var q = (S.stFind || "").toLowerCase();
  var rows = s.players.filter(function(p){ return !q || p.name.toLowerCase().indexOf(q) >= 0; })
    .map(function(p){
      return '<button class="st-p ' + esc(p.side) + (p.alive ? "" : " dead") + '"' +
             (S.stSel === p.uid ? ' aria-current="page"' : '') +
             ' data-act="stPick" data-id="' + esc(p.uid) + '">' +
             '<i class="dot"></i><span class="n">' + esc(p.name) + '</span>' +
             (p.restrained ? '<span class="tag cuff">CUFF</span>' : '') +
             (p.veh !== "none" ? '<span class="tag">' + esc(p.veh.toUpperCase()) + '</span>' : '') +
             '</button>';

/* ---- one door in from SQF ------------------------------------------------
   Every native surface that used to open a phone dialog now asks for a deck app
   by NAME -- keybinds, the player-settings panel, the cyberdeck ring, quests,
   talents, the dialer. AP_fnc_deckOpenApp calls this when the phone is already
   up, and sets window.__openApp when it had to open the phone first.

   Names are the registry's own app names, so there is one vocabulary across SQF,
   the launcher and this table. An unknown name lands on the launcher rather than
   a blank screen. */
function deckGo(app){
  var f = {
    "My Gang":   function(){ go("gang"); call("refresh", ["gang"]); },
    "Keychain":  function(){ go("keys"); call("refresh", ["keys"]); },
    "Money":     function(){ go("money"); call("refresh", ["money"]); },
    "Message":   openMsgs,  "Phone": openMsgs,
    "Inventory": openInv,   "Settings": openSettings,
    "Market":    openMarket, "Wallpaper": openWallpaper,
    "Admin":     openStaff,
    "ICEBREAKER OS": openQh, "TAL OS": openQh,
    "SUMMON VEHICLE": openSummon,
    /* the design handoff names this entry point deckGo("browser") */
    "browser": function(){ go("net"); call("refresh", ["netlink"]); },
    "NETLINK": function(){ go("net"); call("refresh", ["netlink"]); }
  }[app];
  if (!f){
    var ck = ctxByName(app);
    if (ck) f = function(){
      S.view = ck; S[ck] = null; render();
      call("refresh", [CTX_APPS[ck].ch || ck]);
    };
  }
  if (!f && LIST_APPS[app]) f = function(){ openList(LIST_APPS[app]); };
  if (!f && TREE_APPS[app]) f = function(){ openTree(TREE_APPS[app]); };
  if (!f) { say("no such app: " + app, "bad"); go("home"); return; }
  f();
}
window.__deckGo = deckGo;

/* ---- render / dispatch -------------------------------------------------- */
/* ---- market ---------------------------------------------------------------
   Reports prices. Buying and selling happen at the dealer, in the world, so
   there is no till on this screen.

   The premium column is NOT a 24h change — nothing in the game stores price
   history, so there is no change and no spark to draw. It is the good's live
   position in the [floor, ceil] band from AP_price_index: selling drives a
   good down toward the floor (oversupply), idle ticks let it climb back toward
   the ceiling (scarcity). Untracked goods are static and say so. */
/* ---- wallpaper ------------------------------------------------------------
   The brief specified a 6-column grid of 24 images. There is ONE static .paa
   plus the live CSS wallpaper below, so the grid is sized to the catalogue
   rather than the mock.

   There used to be a PAA-ANIMATED entry too — Matrix Rain, 16 baked frames
   cycled by a timer here and by an SQF loop on the native phone. It was removed
   2026-08-14: the live wallpaper is the same effect drawn in CSS, for no texture
   fetch and no frame cache. */
var WP_CACHE = {};

/* ---- live wallpaper builder ------------------------------------------------
   The designer's build function, with ONE change: it sized itself off
   innerWidth/innerHeight, which here is the browser control (1200x600), not the
   screen element it renders into (960x472 before the chassis scale). Column
   count and glyph size both derive from that box, so measuring the wrong one
   gives the wrong density. It measures the mount now. */
function wpBuildMatrix(host){
  var GLYPHS = "ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789";
  var GRN = "rgba(63,255,110,";
  function rnd(i, m){ return (((Math.sin(i * 12.9898) * 43758.5453) % 1 + 1) % 1) * m; }
  function column(seed){
    var t = "";
    for (var k = 0; k < 30; k++) t += GLYPHS[Math.floor(rnd(seed * 31 + k, GLYPHS.length))] + "\n";
    return t + t;                        /* doubled: -50% -> 0 loops with no seam */
  }
  function mask(css){ return "-webkit-mask-image:" + css + ";mask-image:" + css + ";"; }
  function trailMask(p){
    return mask("linear-gradient(180deg,transparent 0%,rgba(0,0,0,.2) 18%,rgba(0,0,0,.75) 46%,#000 " + p + "%,transparent " + (p + 2) + "%)");
  }
  function headMask(p){
    return mask("linear-gradient(180deg,transparent " + (p - 3) + "%,#000 " + (p - 2) + "%,#000 " + p + "%,transparent " + (p + 1) + "%)");
  }
  var H = host.clientHeight, W = host.clientWidth;
  if (!H || !W) return false;
  var out = [];
  var front = Math.max(8, Math.round(W / H * 7.4));
  var back  = Math.max(6, Math.round(W / H * 5.9));
  for (var i = 0; i < back; i++){
    var fb = "fall " + (11 + rnd(i + 90, 8)).toFixed(1) + "s linear infinite -" + rnd(i + 31, 10).toFixed(1) + "s";
    out.push('<span style="left:' + (i * (100 / back) + 2.4).toFixed(1) + '%;font-size:' + (0.031 * H).toFixed(0) + 'px;color:' + GRN + '.2);' +
      trailMask(58) + 'animation:' + fb + '">' + column(i + 200) + "</span>");
  }
  for (var j = 0; j < front; j++){
    var x = (j * (100 / front) + rnd(j, 2.2)).toFixed(1), p = 56 + Math.round(rnd(j + 8, 10));
    var f = "fall " + (5.5 + rnd(j + 70, 6)).toFixed(1) + "s linear infinite -" + rnd(j + 5, 9).toFixed(1) + "s";
    var base = 'left:' + x + '%;font-size:' + (0.05 * H).toFixed(0) + 'px;';
    var tGlow = 'color:' + GRN + '.55);text-shadow:0 0 7px ' + GRN + '.5);';
    out.push('<span style="' + base + tGlow + trailMask(p) + 'animation:' + f + '">' + column(j) + "</span>");
    out.push('<span style="' + base + tGlow + trailMask(p) + 'animation:' + f + ',mut ' + (0.7 + rnd(j, 0.9)).toFixed(2) + 's steps(1,end) infinite">' + column(j + 500) + "</span>");
    out.push('<span style="' + base + 'color:#eaffe9;text-shadow:0 0 5px ' + GRN + '.95),0 0 14px ' + GRN + '.7);' + headMask(p) + 'animation:' + f + '">' + column(j) + "</span>");
  }
  host.innerHTML = '<div id="wpglow"></div><div id="wp">' + out.join("") + "</div>";
  return true;
}

/* Built once per mount, never per render: rebuilding the DOM on a 2s clock tick
   would restart every stream mid-fall. */
var _liveMounted = null;
function wpMountLive(id){
  var w = el("wall"); if (!w) return;
  if (_liveMounted === id) return;
  w.style.backgroundImage = "";
  w.style.opacity = "1";
  if (wpBuildMatrix(w)) _liveMounted = id;
}
function wpUnmountLive(){
  if (_liveMounted === null) return;
  _liveMounted = null;
  var w = el("wall");
  if (w){ w.innerHTML = ""; w.style.opacity = ""; }
}

/* ---- generic list (pattern A) ----------------------------------------------
   Eight apps, one view, one payload shape. Every one reads a client-side array,
   so opening is a plain fetch with nothing to wait on. Read only. */
var LIST_APPS = {
  "Housing": "housing",
  "Wanted": "wanted", "Gangs Online": "gangs", "Licenses": "licenses",

/* ---- ICEBREAKER OS / TAL OS (pattern G) ------------------------------------
   One screen, both sides: the payload's `side` picks the catalogue and the cop
   rows carry an auth gate instead of breach tools. The designer's layout, driven
   by real data.

   TIMING. ICE TRACE does NOT fire at cast start -- APS_fnc_qhSRV sleeps the whole
   upload and only then traces. So while the bar runs nothing has leaked, and the
   channel is the "will I get away with this" window. The victim knows straight
   away (INTRUSION DETECTED); the APD do not.

   The bar is animated LOCALLY from the hack's known upload time. The server owns
   the real clock and re-validates on completion -- the page is animating an
   expectation, and qhResult is what actually says how it went. */
var QH_GLYPH = {
  ping:"gping", whiteout:"gwhiteout", synapse:"gsynapse", leech:"gleech",
  static:"gstatic", distract:"gjam", unlock:"gcarlock", house:"ghouse",
  atm:"gatm", cuffs:"gcuffs", flatline:"gflatline", memhole:"gmem",
  pursuit:"geye", pa:"gjam", dazzle:"gstatic", silence:"gjam",
  blackout:"gflatline", warranttap:"gmsg"
};
var QH_AUTH = { wanted:"WANTED", restrained:"RESTRAINED", wantedArmed:"WANTED + ARMED" };
var _qhTimer = null;

/* Mirrors the server's own gates so a tile that looks castable is castable. */
function qhWhy(h){
  var t = qhTgt();
  if (!h) return "EMPTY SLOT";
  if (!h.unlocked)      return "CHIP NOT INSTALLED";
  if (h.cdLeft > 0)     return "COOLDOWN " + h.cdLeft + "s";
  if (!t)               return "NO TARGET";
  if (t.dist > h.reach) return "OUT OF RANGE";
  if (h.los && !t.flags.los) return "NO LINE OF SIGHT";
  if (h.auth === "wanted"      && !t.flags.wanted)     return "TARGET NOT WANTED";
  if (h.auth === "restrained"  && !t.flags.restrained) return "TARGET NOT RESTRAINED";
  if (h.auth === "wantedArmed" && !(t.flags.wanted && t.flags.armed)) return "NOT WANTED + ARMED";
  return "";
}
function qhCast(id){
  var h = qhHack(id); if (!h) return;
  var why = qhWhy(h);
  if (why){ say(why, "bad"); return; }
  call("qhCast", [S.qhSel, id]);
  /* Animate the channel for the upload we know about. The server is running the
     real one; this is the page showing what it expects. */
  S.qhCh = { id: id, name: h.name, pct: 0, up: h.up };
  if (_qhTimer) clearInterval(_qhTimer);
  var step = 100 / (h.up * 10);
  _qhTimer = setInterval(function(){
    if (!S.qhCh){ clearInterval(_qhTimer); _qhTimer = null; return; }
    S.qhCh.pct = Math.min(100, S.qhCh.pct + step);
    var b = el("qhBar"), pc = el("qhPct");
    if (b) b.style.width = S.qhCh.pct + "%";
    if (pc) pc.textContent = Math.round(S.qhCh.pct) + "%";
    if (S.qhCh.pct >= 100){
      clearInterval(_qhTimer); _qhTimer = null;
      setTimeout(function(){ S.qhCh = null; render(); call("qh", ["deck"]).then(function(v){ S.qh = v || null; render(); }); }, 700);
    }
  }, 100);
  render();
}

function viewQh(){
  var d = S.qh;
  if (!d) return '<div class="panel" style="flex:1;display:flex"><div class="empty">BOOTING FIRMWARE</div></div>';
  var cop = d.side === "cop";
  var t = qhTgt();

  /* ---- scope: the selected target ---- */
  var scope;
  if (!t){
    scope = '<div class="scope"><span class="nm" style="color:var(--faint)">NO TARGET</span>' +
            '<div class="kv"><span>pick one from the list</span></div></div>';
  } else {
    var fl = [];
    if (t.flags.wanted)     fl.push('<span class="fchip" style="color:var(--danger)">WANTED</span>');
    if (t.flags.restrained) fl.push('<span class="fchip" style="color:var(--acc2)">RESTRAINED</span>');
    if (t.flags.armed)      fl.push('<span class="fchip" style="color:var(--warn)">ARMED</span>');
    if (t.flags.driver)     fl.push('<span class="fchip">DRIVER</span>');
    if (!t.flags.los)       fl.push('<span class="fchip" style="color:var(--faint)">NO LOS</span>');
    scope = '<div class="scope"><span class="nm">' + esc(t.name) + '</span>' +
      '<div class="kv"><span>' + esc(String(t.kind).toUpperCase()) + '</span><b>' + t.dist + ' M</b></div>' +
      '<div class="kv"><span>' + esc(t.l2) + '</span></div>' +
      (fl.length ? '<div class="kv" style="gap:.25rem;justify-content:flex-start;flex-wrap:wrap">' + fl.join("") + '</div>' : '') +
      '</div>';
  }

  /* ---- target list ---- */
  var q = (S.qhQ || "").toLowerCase(), tl = "", inRange = 0;
  for (var i = 0; i < S.qhTargets.length; i++){
    var x = S.qhTargets[i];
    if (x.dist <= 150) inRange++;
    if (q && x.name.toLowerCase().indexOf(q) === -1) continue;
    var dot = x.flags.wanted ? "var(--danger)" : (x.kind === "vehicle" ? "var(--warn)" : "var(--acc2)");
    tl += '<button class="trow' + (S.qhSel === x.id ? " on" : "") + '" data-act="qhSel" data-id="' + esc(x.id) + '">' +
      '<i class="d" style="background:' + dot + '"></i>' +
      '<span style="min-width:0;display:flex;flex-direction:column;gap:.1rem">' +
      '<span class="nm">' + esc(x.name) + '</span>' +
      '<span class="sub">' + esc(String(x.kind).toUpperCase()) + '</span></span>' +
      '<span class="dist">' + x.dist + 'm</span></button>';
  }
  if (!S.qhTargets.length) tl = '<div class="empty" style="padding:1.5rem .5rem">NOTHING IN RANGE</div>';

  /* ---- ring: the six slots ---- */
  var ring = "";
  for (var i = 0; i < 6; i++){
    var id = d.slots[i], h = id ? qhHack(id) : null;
    if (!h){
      ring += '<button class="tile" data-act="qhSlot" data-id="' + i + '">' +
              '<div class="hd"><span class="nm" style="color:var(--faint)">EMPTY</span>' +
              '<span class="slot">SLOT ' + (i + 1) + '</span></div>' +
              '<div class="bl">nothing loaded</div>' +
              '<div class="state" style="color:var(--acc2)">PICK A HACK</div></button>';
      continue;
    }
    var why = qhWhy(h), up = S.qhCh && S.qhCh.id === h.id;
    ring += '<button class="tile' + (why ? " dis" : "") + (up ? " up" : "") + '" data-act="qhFire" data-id="' + esc(h.id) + '">' +
      (up ? '<span class="sweep" style="width:' + (S.qhCh.pct || 0) + '%"></span>' : '') +
      '<div class="hd">' + qhGly(h.id, 1) + '<span class="nm">' + esc(h.name) + '</span>' +
      '<span class="slot" data-act="qhSlot" data-id="' + i + '" style="cursor:pointer">SLOT ' + (i + 1) + '</span></div>' +
      '<div class="bl">' + esc(h.blurb) + '</div>' +
      '<div class="st">' + h.up + 's up &middot; ' + h.cd + 's cd &middot; ' + h.range + 'm' +
      (h.auth ? ' &middot; ' + esc(QH_AUTH[h.auth] || h.auth) : '') + '</div>' +
      '<div class="state" style="color:' + (why ? "var(--faint)" : "var(--acc)") + '">' +
      esc(up ? "UPLOADING" : (why || "READY")) + '</div></button>';
  }

  /* ---- breach tools (civ only) ---- */
  var tools = "";
  if (!cop && d.tools && d.tools.length){
    for (var i = 0; i < d.tools.length; i++){
      var h = d.tools[i], why = qhWhy(h);
      tools += '<button class="tool' + (why ? " dis" : "") + '" data-act="qhFire" data-id="' + esc(h.id) + '">' +
        qhGly(h.id, .95) + '<span class="tx"><span class="nm">' + esc(h.name) + '</span>' +
        '<span class="st">' + h.range + 'm</span></span>' +
        '<span class="state" style="color:' + (why ? "var(--faint)" : "var(--acc2)") + '">' +
        esc(why ? "—" : "OK") + '</span></button>';
    }
    tools = '<div class="tools">' + tools + '</div>';
  }

  /* ---- DECK card: chips, proxy, ICE ---- */
  var chips = "";
  for (var i = 0; i < d.chips.owned.length; i++){
    var c = d.chips.owned[i];
    chips += '<button class="fchip" style="cursor:pointer;color:' + (c.equipped ? "var(--acc)" : "var(--faint)") +
      ';background:' + (c.equipped ? "var(--accw)" : "rgba(255,255,255,.05)") + '"' +
      ' data-act="qhChip" data-id="' + esc(c.id) + '">' + esc(c.name) + '</button>';
  }
  var p = d.proxy || { armed:false, charges:0 };
  /* ICE FIREWALL: defence, not a hack. Three states, and the re-arm matters --
     five minutes is a long time to stand around un-armoured. */
  var ice = d.ice || { owned:false, seated:false, rearm:0 };
  var iceTxt = ice.rearm > 0 ? "SHATTERED — " + ice.rearm + "s"
             : ice.seated   ? "SEATED"
             : ice.owned    ? "OWNED, NOT SEATED" : "NONE";
  var iceCol = ice.rearm > 0 ? "var(--danger)" : ice.seated ? "var(--acc2)" : "var(--faint)";

  var deckCard = '<div class="card"><div class="ch">DECK</div><div class="cb">' +
    (cop ? '' :
      '<div class="kv"><span>PROXY CHAIN</span><b style="color:' + (p.armed ? "var(--acc2)" : "var(--faint)") + '">' +
      (p.armed ? "ARMED" : (p.charges > 0 ? p.charges + " IN BAG" : "NONE")) + '</b></div>' +
      '<div class="kv" style="color:var(--faint);font-size:.5rem"><span>' +
      (p.armed ? "next cast leaves no ICE trace — burns on use"
               : "arm one from your bag before casting") + '</span></div>') +
    '<div class="kv"><span>ICE FIREWALL</span><b style="color:' + iceCol + '">' + esc(iceTxt) + '</b></div>' +
    (ice.rearm > 0 ? '<div class="kv" style="color:var(--faint);font-size:.5rem"><span>it ate a hack and shattered; firmware needs the cooldown before another seats</span></div>' : '') +
    '<div class="kv" style="margin-top:.2rem"><span>FIREWALL CHIPS</span><b>' + d.chips.equipped.length + ' / ' + d.chips.cap + '</b></div>' +
    '<div style="display:flex;flex-wrap:wrap;gap:.25rem">' + chips + '</div>' +
    '</div></div>';

  /* ---- LAST CAST ---- */
  var lc = S.qhLast;
  var lastCard = '<div class="card"><div class="ch">LAST CAST</div><div class="cb">' +
    (!lc ? '<div class="kv"><span style="color:var(--faint)">nothing yet</span></div>'
         : '<div class="kv"><span>HACK</span><b>' + esc(lc.name) + '</b></div>' +
           '<div class="kv"><span>RESULT</span><b style="color:' + (lc.iced ? "var(--danger)" : "var(--acc)") + '">' +
           esc(lc.iced ? "EATEN BY ICE" : "LANDED") + '</b></div>' +
           (lc.iced ? '<div class="kv" style="color:var(--faint);font-size:.5rem"><span>they were running a hard firewall — your charge is spent either way</span></div>' : '') +
           '<div class="kv"><span>ICE TRACE</span><b>' + esc(cop ? "N/A — TAL GRID" : (lc.quiet ? "SUPPRESSED — PROXY" : "EMITTED")) + '</b></div>')
    + '</div></div>';

  /* ---- channel strip ---- */
  var ch = S.qhCh;
  var strip = '<div class="strip">' +
    '<span style="font-size:.6rem;letter-spacing:.14em;color:var(--dim)">' +
    (ch ? 'UPLOADING — ' + esc(ch.name) : 'UPLOAD CHANNEL — IDLE') + '</span>' +
    '<div class="bar"><span id="qhBar" style="width:' + (ch ? ch.pct : 0) + '%"></span></div>' +
    '<span id="qhPct" style="font-size:.62rem;color:var(--acc2);width:2.6rem;text-align:right;font-variant-numeric:tabular-nums">' +
    (ch ? Math.round(ch.pct) + "%" : "—") + '</span>' +
    (S.qhTrace > 0 ? '<span class="trace" style="display:flex">TRACED — ' + S.qhTrace + 's</span>' : '') +
    '</div>';

  /* THE LIBRARY. The ring is six slots and nothing shipped to fill them -- the
     verb existed, the picker did not. Clicking a slot chip opens this over the
     cards; picking a hack loads it and closes.

     Only UNLOCKED hacks are listed: a hack whose chip is not installed cannot be
     loaded at all (AP_fnc_qhConsoleGet filters the pool the same way), so
     showing it as a choice would be a lie. */
  var lib = "";
  if (S.qhSlot !== null && S.qhSlot !== undefined){
    var rows = "";
    for (var i = 0; i < d.library.length; i++){
      var h = d.library[i];
      var inSlot = d.slots.indexOf(h.id);
      rows += '<button class="tool' + (h.unlocked ? "" : " dis") + '" style="height:2.6rem"' +
        (h.unlocked ? ' data-act="qhPut" data-id="' + esc(h.id) + '"' : '') + '>' +
        qhGly(h.id, .95) +
        '<span class="tx"><span class="nm">' + esc(h.name) + '</span>' +
        '<span class="st">' + h.up + 's &middot; ' + h.cd + 's &middot; ' + h.range + 'm' +
        (h.auth ? ' &middot; ' + esc(QH_AUTH[h.auth] || h.auth) : '') + '</span></span>' +
        '<span class="state" style="color:' + (!h.unlocked ? "var(--faint)" : (inSlot > -1 ? "var(--acc)" : "var(--acc2)")) + '">' +
        (!h.unlocked ? "LOCKED" : (inSlot > -1 ? "SLOT " + (inSlot + 1) : "LOAD")) + '</span></button>';
    }
    lib = '<div class="card" style="grid-column:1/-1"><div class="ch">LIBRARY &mdash; FILLING SLOT ' +
          (S.qhSlot + 1) + '<span style="margin-left:auto"><button class="act" data-act="qhSlotX">CANCEL</button></span></div>' +
          '<div class="cb">' + rows + '</div></div>';
  }

  return '<div class="qh"><div class="body">' +
      '<div class="left">' + scope +
        '<div class="filter"><span style="color:var(--faint);font-size:.7rem">&#9906;</span>' +
        '<input id="qhq" placeholder="Filter targets…" spellcheck="false" value="' + esc(S.qhQ || "") + '"></div>' +
        '<div class="tlist">' + tl + '</div>' +
        '<div class="tfoot"><span>' + inRange + ' IN RANGE</span><span>' + S.qhTargets.length + ' SCANNED</span></div>' +
      '</div>' +
      '<div class="main"><div class="ring">' + ring + '</div>' + tools +
        '<div class="cards" style="grid-template-columns:' + (lib ? '1fr' : '1fr 1fr') + '">' +
        (lib ? lib : deckCard + lastCard) + '</div>' +
      '</div>' +
    '</div>' + strip + '</div>';
}

  var q = (S.listQ || "").toLowerCase(), rows = "", shown = 0;
  for (var i = 0; i < L.rows.length; i++){
    var r = L.rows[i];

    shown++;
    rows += '<div class="ls-row">' +
      '<i class="ls-dot ' + esc(r.state) + '"></i>' +

  var bar = L.rows.length >= 8
    ? '<div class="ls-bar"><span style="color:var(--faint);font-family:var(--mono);font-size:.7rem">&#9906;</span>' +

      '<span class="ct">' + shown + ' / ' + L.rows.length + '</span></div>'
    : "";

      var tl = L.tools[i];

        /* Destructive squad actions are two-step: the first click arms, the
           second commits, and it disarms itself. Leaving is recoverable;
           disbanding is not. */
        var armed = S.lsArm === tl.act;
        tools += '<div class="ls-tool"><button class="act ' + (tl.tone === "bad" ? "bad" : "") +
          '" style="flex:1" data-act="lsBtn" data-id="' + esc(tl.act) + '">' +
          (armed ? "CONFIRM &mdash; " + esc(tl.btn) : esc(tl.btn)) + '</button></div>';
        continue;
      }
      tools += '<div class="ls-tool">' +
        '<input id="' + esc(tl.id) + '" type="text" maxlength="' + (tl.max || 24) + '"' +
        ' placeholder="' + esc(tl.ph) + '" spellcheck="false">' +
        (tl.id2 ? '<input id="' + esc(tl.id2) + '" type="text" maxlength="' + (tl.max || 24) + '"' +
                  ' placeholder="' + esc(tl.ph2) + '" spellcheck="false">' : '') +
        (tl.nobtn ? '' :
          '<button class="act acid" data-act="lsTool" data-id="' + esc(tl.act) +
          '" data-arg="' + esc(tl.id) + '" data-arg2="' + esc(tl.id2 || "") + '">' + esc(tl.btn) + '</button>') +
        '</div>';
    }
    tools = '<div class="ls-tools">' + tools + '</div>';
  }
  return '<div class="ls">' + tools + bar + '<div class="ls-wrap">' + rows + '</div></div>';
}

function openInv(){ S.view = "inv"; render(); call("refresh", ["inv"]); }
function adoptInv(v){

function invItem(id){
  if (!S.inv) return null;
  for (var i = 0; i < S.inv.items.length; i++) if (S.inv.items[i].id === id) return S.inv.items[i];

function invDo(verb){
  var it = invItem(S.invPick); if (!it) return;
  var q = Math.max(1, Math.min(S.invQty || 1, it.qty));
  if (verb === "give"){
    if (!S.inv.nearby.length){ say("nobody nearby", "bad"); return; }
    S.picker = { key: it.id, label: it.name, list: S.inv.nearby, kind: "inv", qty: q };

  }
  call("invAction", [verb, it.id, q, ""]).then(function(){
    // the native functions suspend; give them a beat before asking what changed
    setTimeout(function(){ call("refresh", ["inv"]); }, 400);
  });
}
