function render(){
  /* A render can land mid-keystroke — the server pushes `phone` every 2s and any
     channel refresh repaints its own view — and rewriting innerHTML destroys the
     <input> the player is typing into along with its contents. Capture the focused
     field and put it back, caret included. Without this no sentence longer than a
     couple of seconds ever survives to the end. */
  var af = document.activeElement, keep = null;
  if (af && af.tagName === "INPUT" && af.id && !af.disabled){
    keep = { id: af.id, v: af.value, s: af.selectionStart, e: af.selectionEnd };
  }

  document.body.className = (S.phone && S.phone.side === "cop") ? "tal" : "";
  renderHeader();
  renderRail();
  var pane = el("pane");
  pane.innerHTML = S.view === "home"  ? viewHome()
                 : S.view === "gang"  ? viewGang()
                 : S.view === "keys"  ? viewKeys()
                 : S.view === "summon" ? viewSummon()
                 : S.view === "tree"  ? viewTree()
                 : S.view === "msgs"  ? viewMsgs()
                 : S.view === "settings" ? viewSettings()
                 : S.view === "market"   ? viewMarket()
                 : S.view === "wall"     ? viewWallpaper()
                 : S.view === "inv"      ? viewInv()
                 : S.view === "list"     ? viewList()
                 : S.view === "staff"    ? viewStaff()
                 : S.view === "qh"       ? viewQh()
                 : CTX_APPS[S.view]       ? CTX_APPS[S.view].view()
                 : viewMoney();
  pane.insertAdjacentHTML("beforeend", overlay());
  /* The status strip is where every refusal is reported, and paintStatus() gives
     up silently when it is absent — so a view without one throws away all of its
     own error messages. Only Money ever rendered it, which is why a refused send
     on any other screen looked like the button doing nothing at all. Appended
     here so it is structural rather than something each view has to remember. */
  if (!pane.querySelector(".status")){
    pane.insertAdjacentHTML("beforeend", '<div class="status"><span class="msg">READY</span></div>');
  }
  paintStatus();
  /* NETLINK binds its own url bar / tab strip / page links, so it can only be
     wired after the pane exists. Idempotent: wire() re-attaches on every deck
     render and the browser's own navigation re-renders only #page. */
  if (S.view === "net" && window.NL) { try { NL.wire({ call: call }); } catch(e){ say("netlink: " + e, "bad"); } }
  // conversations open on the newest message, like every messaging app
  var mb = el("mbody"); if (mb) mb.scrollTop = mb.scrollHeight;

  /* Textures are cached per path, so this is cheap after the first paint. */
  var vt = pane.querySelectorAll("[data-vtex]");
  for (var vi = 0; vi < vt.length; vi++){
    (function(node){ var pth = node.getAttribute("data-vtex"); if (!pth) return;
      wpTex(pth).then(function(u){ if (u) node.style.backgroundImage = 'url("' + u + '")'; }); })(vt[vi]);
  }
  var wt = pane.querySelectorAll("[data-wp]");
  for (var wi = 0; wi < wt.length; wi++){
    (function(node){ wpTex(node.getAttribute("data-wp")).then(function(u){
      if (u) node.style.backgroundImage = 'url("' + u + '")'; }); })(wt[wi]);
  }
  if (S.view === "wall" && S.wall){
    var pk = (S.wallPick !== undefined && S.wallPick !== null) ? S.wallPick : S.wall.current;
    for (var wj = 0; wj < S.wall.items.length; wj++){
      if (S.wall.items[wj].id === pk) wpPaint("#wpprev", S.wall.items[wj].path);
    }
  }
  wpApplyBackdrop();

  if (keep){
    var back = el(keep.id);
    if (back && !back.disabled){
      back.value = keep.v;
      back.focus();
      try { back.setSelectionRange(keep.s, keep.e); } catch (_e) {}
    }
  }
}

function go(view){
  /* The roster costs a push a second and a cash sweep every five, so SQF only
     pays for it while the app is actually on screen. */
  if (S.view === "staff" && view !== "staff") call("staffWatch", [false]);
  /* leaving the trunk releases the vehicle's AP_activeTrunk lock -- the SQF
     watchdog polls this flag, so without it the trunk stays "in use" until the
     phone itself closes. */
  if (S.view === "trunk" && view !== "trunk"){ S.trkQ = []; call("trunk", ["left", []]); }
  S.view = view;
  render();
}

/* Typed input is handled by delegation and WITHOUT a re-render. render() rewrites
   innerHTML, so filtering the thread list on each keystroke by re-rendering would
   destroy the field under the caret and drop focus every character. The search
   toggles row visibility in place instead, and the composer only repaints its own
   counter. */
document.addEventListener("input", function(ev){
  var t = ev.target;
  /* Staff fields are read at click time, so they only need to survive a repaint --
     stash the value and let the existing focus-restore put the caret back. */
  if (t.id === "stfind")    { S.stFind    = t.value; renderStaffRoster(); return; }
  if (t.id === "stcatfind") { S.stCatFind = t.value; if (S.view === "staff") render(); return; }
  if (t.id === "stcoords")  { S.stCoords  = t.value; return; }
  if (t.id === "streason")  { S.stReason  = t.value; return; }
  if (t.id === "stamount")  { S.stAmount  = t.value; return; }
  if (t.id === "stnd")      { S.stNd      = t.value; return; }
  if (t.id === "msearch"){
    S.msgQuery = t.value;
    var q = t.value.toLowerCase(), rows = document.querySelectorAll(".mw-thread[data-id]"), hit = 0;
    for (var i = 0; i < rows.length; i++){
      var did = rows[i].getAttribute("data-id");
      if (did === "__inbox" || did.charAt(0) === "#") continue;   // not contacts
      var nm = rows[i].querySelector(".nm");
      var show = !q || (nm && nm.textContent.toLowerCase().indexOf(q) !== -1);
      rows[i].style.display = show ? "" : "none";
      if (show) hit++;
    }
    var none = el("mnone");
    if (none) none.style.display = (q && !hit) ? "" : "none";
  } else if (t.id === "qhq"){
    S.qhQ = t.value;
    var tq = t.value.toLowerCase(), tr = document.querySelectorAll(".qh .trow");
    for (var ti = 0; ti < tr.length; ti++){
      var nmn = tr[ti].querySelector(".nm");
      tr[ti].style.display = (!tq || (nmn && nmn.textContent.toLowerCase().indexOf(tq) !== -1)) ? "" : "none";
    }
  } else if (t.id === "lsq"){
    /* Filter in place, no re-render — same reason as the message search: render()
       rewrites innerHTML and would drop the field under the caret. */
    S.listQ = t.value;
    var lq = t.value.toLowerCase(), lr = document.querySelectorAll(".ls-row"), lh = 0;
    for (var li = 0; li < lr.length; li++){
      var okr = !lq || lr[li].textContent.toLowerCase().indexOf(lq) !== -1;
      lr[li].style.display = okr ? "" : "none";
      if (okr) lh++;
    }
    var cn = document.querySelector(".ls-bar .ct");
    if (cn) cn.textContent = lh + " / " + lr.length;
  } else if (t.id === "scrange"){
    /* Readout only while dragging. Applying per input event would mean a control
       resize and an ExecJS for every pixel of slider travel. */
    S.scalePreview = parseInt(t.value, 10) / 100;
    var n = el("scpct"); if (n) n.textContent = t.value + "%";
  } else if (t.id === "mcomp"){
    var c = el("mct");
    if (c) c.textContent = t.value.length + "/" + (S.msgs ? S.msgs.maxLen : 500);
  } else if (t.classList && t.classList.contains("optr")){
    /* Readout only while dragging, same reason as the size slider: one call per
       pixel of travel is one ExecJS per pixel of travel. */
    var o = el("ov_" + t.getAttribute("data-id"));
    if (o) o.textContent = t.value + (t.getAttribute("data-pct") === "1" ? "%" : "m");
  }
});

/* Commit on release, once. */
document.addEventListener("change", function(ev){
  if (ev.target && ev.target.id === "scrange") applyScale(parseInt(ev.target.value, 10) / 100);
  if (ev.target && ev.target.classList && ev.target.classList.contains("optr")){
    var pct = ev.target.getAttribute("data-pct") === "1";
    var raw = parseInt(ev.target.value, 10);
    /* Percent settings are stored 0.01-1; the slider works in whole percent so
       it has something to snap to. */
    call("settingsSet", [ev.target.getAttribute("data-id"), pct ? raw / 100 : raw])
      .then(function(v){ if (v) S.opts = v; });
  }
});

document.addEventListener("input", function(ev){
  if (ev.target && ev.target.id === "fabq"){ S.fabQ = ev.target.value; render(); }
  if (ev.target && ev.target.id === "intkq"){ S.intkQ = ev.target.value; render(); }
  if (ev.target && ev.target.id === "grgplate"){ S.grgModCh[10] = ev.target.value.trim(); render(); }
});
document.addEventListener("change", function(ev){
  var t2 = ev.target;
  if (!t2) return;
  if (t2.id === "vshskin"){ S.vshSkin = parseInt(t2.value, 10); return; }
  if (t2.id === "sprcolor"){
    var sc = parseInt(t2.value, 10);
    if (sc >= 0) call("sprays", ["hexColor", sc]);
    return;
  }
  if (t2.id === "vshalarm"){ S.vshAlarm = t2.value === "1"; render(); return; }
  var slot = t2.getAttribute && t2.getAttribute("data-vslot");
  if (slot){ S.vshMods[parseInt(slot, 10)] = parseInt(t2.value, 10) || 0; render(); }
  var mslot = t2.getAttribute && t2.getAttribute("data-mslot");
  if (mslot !== null && mslot !== undefined && mslot !== ""){
    S.grgModCh[parseInt(mslot, 10)] = parseInt(t2.value, 10) || 0;
    render();
  }
});

document.addEventListener("keydown", function(ev){
  if (ev.key !== "Enter") return;
  var id = ev.target && ev.target.id;
  if (id === "mcomp"){ ev.preventDefault(); sendCurrent(); }
  else if (id === "gname"){ ev.preventDefault(); document.querySelector('[data-act="renameGang"]').click(); }
  else if (id === "ginvite"){ ev.preventDefault(); document.querySelector('[data-act="invite"]').click(); }
  else if (id === "gname" || id === "gpass" || id === "gpass2"){
    ev.preventDefault();
    var btn = document.querySelector('[data-act="lsTool"][data-arg="' + id + '"]')
           || document.querySelector('[data-act="lsTool"][data-arg2="' + id + '"]');
    if (btn) btn.click();
  }
});

document.addEventListener("click", function(ev){
  var t = ev.target.closest ? ev.target.closest("[data-act]") : null;
  if (!t || t.disabled) return;
  var act = t.getAttribute("data-act");
  var id  = t.getAttribute("data-id");

  switch (act){
    case "home":   go("home"); break;
    case "filter": S.filter = parseInt(id, 10) || 0; render(); break;
    case "pick":   S.pick   = parseInt(id, 10) || 0; render(); break;
    case "pad":    padPush(id); render(); break;

    case "rail":
      /* Money has a designed screen; the other three globals still run their
         native dialogs, so they close the deck like any other app. */
      if (id === "Money") { go("money"); }
      else if (id === "Message") { openMsgs(); }
      else if (id === "Inventory") { openInv(); }
      else if (LIST_APPS[id]) { openList(LIST_APPS[id]); }
      else if (id === "ICEBREAKER OS" || id === "TAL OS") { openQh(); }
      /* A catalogue app that is ALSO a ctx view (NETLINK) switches view in place.
         Without this it falls to the SQF "launch" verb, which closes the deck and
         reopens it on the same app -- a dialog churn for a view we already have. */
      else if (ctxByName(id)) { var _k = ctxByName(id); go(_k); call("refresh", [CTX_APPS[_k].ch || _k]); }
      else { call("launch", [id]); }
      break;

    case "launch":
      /* Keychain, My Gang and the six point-spend trees have designed screens
         here; everything else hands off to the app's existing native dialog
         (which closes this one). */
      if (id === "Keychain") { go("keys"); call("refresh", ["keys"]); }
      else if (id === "My Gang") { go("gang"); call("refresh", ["gang"]); }
      else if (TREE_APPS[id]) { openTree(TREE_APPS[id]); }
      else if (id === "Phone" || id === "Message") { openMsgs(); }
      else if (id === "Admin") { openStaff(); }
      else if (id === "Settings") { openSettings(); }
      else if (id === "Market") { openMarket(); }
      else if (id === "Wallpaper") { openWallpaper(); }
      else if (id === "Inventory") { openInv(); }
      else if (LIST_APPS[id]) { openList(LIST_APPS[id]); }
      else if (id === "ICEBREAKER OS" || id === "TAL OS") { openQh(); }
      /* A catalogue app that is ALSO a ctx view (NETLINK) switches view in place.
         Without this it falls to the SQF "launch" verb, which closes the deck and
         reopens it on the same app -- a dialog churn for a view we already have. */
      else if (ctxByName(id)) { var _k = ctxByName(id); go(_k); call("refresh", [CTX_APPS[_k].ch || _k]); }
      else { call("launch", [id]); }
      break;

    /* ---- staff app ---- */
    case "stPick":  S.stSel = (S.stSel === id) ? null : id; S.stDos = null; render(); break;
    case "stTab":   S.stTab = id; S.stItem = null; S.stAcc = null; stCat(id); render(); break;
    case "stGroup": S.stGroup = (S.stGroup === id) ? null : id; render(); break;
    case "stItem":  S.stItem = id; S.stAcc = null; S.stAccSel = null; render(); break;
    case "stAcc":   S.stAccSel = id; render(); break;
    case "stDo": {
      var sArgs = t.getAttribute("data-args");
      var need  = t.getAttribute("data-needsel");
      var pSel  = stSel();
      if (need && !pSel) { say("select a player first", "bad"); break; }
      if (t.getAttribute("data-confirm") && !stArm(id + "|" + (sArgs || ""))) break;
      S.stArm = null;

      var a = [], tgt = null;
      switch (id) {
        case "kick": case "ban":
          if (!S.stReason) { say(id + " needs a reason", "bad"); break; }
          tgt = pSel.uid; a = [S.stReason]; break;
        case "adminMessage": {
          var mEl = el("stmsg"), mv = mEl ? mEl.value.trim() : "";
          if (!mv) { say("type a message first", "bad"); break; }
          tgt = pSel ? pSel.uid : null; a = [mv]; if (mEl) mEl.value = ""; break;
        }
        case "newsBroadcast": {
          var nEl = el("stnews"), nv = nEl ? nEl.value.trim() : "";
          if (!nv) { say("type the news first", "bad"); break; }
          a = [nv]; if (nEl) nEl.value = ""; break;
        }
        case "setPos": {
          var nums = (S.stCoords || "").split(/[\s,]+/).map(Number).filter(function(n){ return !isNaN(n); });
          if (nums.length < 2 || nums.every(function(n){ return n === 0; })) {
            say("coords empty or [0,0,0] — that is the debug island", "bad"); break; }
          if (nums.length < 3) nums[2] = 0;
          tgt = (sArgs === "sel" && pSel) ? pSel.uid : null; a = nums; break;
        }
        case "getPos": tgt = (sArgs === "sel" && pSel) ? pSel.uid : null; break;
        case "addMoneySelf": case "addMoneySel": {
          var amt = parseInt(S.stAmount, 10);
          if (!amt || amt <= 0) { say("amount must be a positive number", "bad"); break; }
          tgt = (id === "addMoneySel" && pSel) ? pSel.uid : null; a = [amt]; break;
        }
        case "addNdSelf": case "addNdSel": {
          var nd = parseInt(S.stNd, 10);
          if (!nd || nd <= 0) { say("ND amount must be a positive number", "bad"); break; }
          tgt = (id === "addNdSel" && pSel) ? pSel.uid : null; a = [nd]; break;
        }
        case "giveWeapon": case "giveKit": case "weaponAcc": case "spawnVehicle":
          if (!S.stItem) { say("pick something from the list first", "bad"); break; }
          a = [S.stItem]; break;
        case "wearClothing": case "giveClothing":
          if (!S.stItem) { say("pick something from the list first", "bad"); break; }
          tgt = pSel ? pSel.uid : null; a = [S.stItem]; break;
        case "giveAddon":
          if (!S.stAccSel) { say("pick a mag or attachment first", "bad"); break; }
          a = [S.stAccSel, parseInt(sArgs, 10) || 1]; break;
        case "restart": {
          var rp = (sArgs || "").split(",");
          a = [rp[0], parseInt(rp[1], 10) || 0]; break;
        }
        default:
          if (sArgs) a = [sArgs];
          if (need || ["info","tpToMe","tpToThem","restrain","unrestrain","revive","jail"].indexOf(id) >= 0) {
            tgt = pSel ? pSel.uid : null;
          }
      }
      /* A guard above that said its piece leaves the verb unsent: every one of
         them breaks out of the inner switch with nothing queued. */
      if (["kick","ban","adminMessage","newsBroadcast","setPos","addMoneySelf","addMoneySel","addNdSelf","addNdSel",
           "giveWeapon","giveKit","weaponAcc","spawnVehicle","wearClothing","giveClothing",
           "giveAddon"].indexOf(id) >= 0 && !a.length) break;
      stAct(id, tgt, a);
      break;
    }

    case "qhSel":  S.qhSel = id; render(); break;
    case "qhSlot": S.qhSlot = parseInt(id, 10); render(); break;
    case "qhSlotX": S.qhSlot = null; render(); break;
    case "qhPut":
      call("qhLoad", [id, S.qhSlot]).then(function(r){
        S.qhSlot = null;
        call("qh", ["deck"]).then(function(v){ S.qh = v || null; render(); });
      });
      break;
    case "qhFire": qhCast(id); break;
    case "qhChip":
      call("chipEquip", [id]).then(function(){ call("qh", ["deck"]).then(function(v){ S.qh = v || null; render(); }); });
      break;

    case "invPick": S.invPick = id; S.invQty = 1; render(); break;
    case "ivQ": {
      var cur = invItem(S.invPick); if (!cur) break;
      if (id === "all") S.invQty = cur.qty;
      else S.invQty = Math.max(1, Math.min(cur.qty, (S.invQty || 1) + parseInt(id, 10)));
      render(); break;
    }
    case "ivUse":  invDo("use");  break;
    case "ivDrop": invDo("drop"); break;
    case "ivGive": invDo("give"); break;

    case "wpPick":     S.wallPick = parseInt(id, 10); render(); break;
    case "wpPickLive": S.wallPick = id; render(); break;
    case "wpSetLive":
      call("setWallpaper", [id]).then(function(r){ if (r && r.wallpaper) adoptWall(r.wallpaper); });
      break;
    case "scrim":
      call("setScrim", [parseInt(id, 10)]).then(function(r){ if (r && r.wallpaper) adoptWall(r.wallpaper); });
      break;
    case "wmot":
      call("setWallMotion", [id]).then(function(r){ if (r && r.wallpaper) adoptWall(r.wallpaper); });
      break;
    case "wpSet":
      call("setWallpaper", [parseInt(id, 10)]).then(function(r){
        if (r && r.wallpaper){ wpUnmountLive(); adoptWall(r.wallpaper); }
      });
      break;

    case "mkCat":  S.mkCat = id || null; render(); break;
    case "mkPick": S.mkPick = id; render(); break;

    case "scUp":
    case "scDn": {
      if (!S.settings) break;
      var step = (act === "scUp") ? 0.05 : -0.05;
      var nv = Math.round(((S.scalePreview || S.settings.scale) + step) * 100) / 100;
      applyScale(Math.max(S.settings.min, Math.min(S.settings.max, nv)));
      break;
    }
    case "optA": {
      /* Fire and forget: the action opens a screen of its own and this one is about to be
         closed under it. No payload comes back and none is wanted -- a re-render against a
         dialog that no longer exists is the one thing that could go wrong here. */
      call("settingsAction", [id]);
      break;
    }

    case "optT": {
      /* SQF owns the value: it answers with the whole payload again, so the
         screen can never disagree with what was actually written. */
      var id = t.getAttribute("data-id");
      var row = null;
      (S.opts.groups || []).forEach(function(g){ g.rows.forEach(function(r){ if (r.id === id) row = r; }); });
      call("settingsSet", [id, row && row.value ? 0 : 1]).then(function(v){ if (v) { S.opts = v; render(); } });
      break;
    }

    case "thr":
      S.thread = id; render();
      /* Only a real conversation can be unread — broadcasts and one-way channels
         are not tracked. */
      if (id !== "__inbox" && id.charAt(0) !== "#"){
        var th = threadByKey(id);
        if (th && th.unread > 0) call("msgRead", [id]).then(function(r){ if (r && r.msgs) adoptMsgs(r.msgs); });
      }
      break;
    case "lsAct": {
      /* A row action can name a tools-bar field to carry with it — JOIN takes the
         shared password box, which an open squad simply ignores. */
      var fld = t.getAttribute("data-field"), fv = "";
      if (fld){ var fe = el(fld); fv = fe ? fe.value.trim() : ""; }
      call("listAction", [id, t.getAttribute("data-arg") || "", S.listKind, fv]).then(function(r){
        if (r && r.list){ S.list = r.list; render(); }
      });
      break;
    }
    case "lsBtn": {
      if (S.lsArm !== id){
        S.lsArm = id; render(); say("click again to confirm", "bad");
        if (S.lsTimer) clearTimeout(S.lsTimer);
        S.lsTimer = setTimeout(function(){ if (S.lsArm){ S.lsArm = null; render(); } }, 4000);
        break;
      }
      S.lsArm = null;
      if (S.lsTimer) clearTimeout(S.lsTimer);
      call("listAction", [id, "", S.listKind]).then(function(r){
        if (r && r.list){ S.list = r.list; render(); }
      });
      break;
    }
    case "lsTool": {
      var f = el(t.getAttribute("data-arg") || ""), v = f ? f.value.trim() : "";
      if (!v){ say("type something first", "bad"); break; }
      /* Some actions need two fields — creating a squad takes a name AND a
         password, because fn_createGroup refuses without one. */
      var a2 = t.getAttribute("data-arg2"), f2 = a2 ? el(a2) : null;
      var v2 = f2 ? f2.value.trim() : "";
      if (f2 && !v2){ say("a password is required", "bad"); break; }
      call("listAction", [id, v, S.listKind, v2]).then(function(r){
        if (r && r.list){ S.list = r.list; render(); }
      });
      break;
    }

    /* ── RIG ── */
    case "rigVerb": t.disabled = true;
      call("rig", [id]).then(function(){ setTimeout(function(){ call("refresh", ["rig"]); }, 1200); }); break;
    case "rigTgt":
      call("rig", ["target", id]).then(function(){ setTimeout(function(){ call("refresh", ["rig"]); }, 500); }); break;
    case "rigLink":
      call("rig", ["link", id]).then(function(){ setTimeout(function(){ call("refresh", ["rig"]); }, 700); }); break;
    case "rigUnlink":
      call("rig", ["unlink", id]).then(function(){ setTimeout(function(){ call("refresh", ["rig"]); }, 700); }); break;

    /* ── FIRST BOOT ── */
    case "bootClaim": t.disabled = true;
      call("boot", ["claim"]).then(function(){ setTimeout(function(){ call("refresh", ["boot"]); }, 1500); }); break;

    /* ── DUEL ── */
    case "dueAccept": call("duel", ["accept"]); break;
    case "dueInvite": {
      var dt = el("duetgt"), dw = el("duewager");
      var duid = dt ? dt.value : "", dval = dw ? parseInt(dw.value.replace(/[^0-9]/g, ""), 10) || 0 : 0;
      if (!duid){ say("pick an opponent", "bad"); break; }
      if (dval < 50000 || dval > 999999){ say("wager $50,000 to $999,999", "bad"); break; }
      if (!S.dueArm){
        S.dueArm = true; render(); say("half the wager is staked on acceptance — click again", "hot");
        if (S.dueArmT) clearTimeout(S.dueArmT);
        S.dueArmT = setTimeout(function(){ if (S.dueArm){ S.dueArm = false; if (S.view === "due") render(); } }, 6000);
        break;
      }
      S.dueArm = false;
      call("duel", ["invite", duid, dval]).then(function(){ setTimeout(function(){ call("refresh", ["duel"]); }, 800); });
      break;
    }

    /* ── SUITES ── */
    case "suiLease": t.disabled = true;
      call("suites", ["lease", id, parseInt(t.getAttribute("data-arg"), 10)])
        .then(function(){ setTimeout(function(){ call("refresh", ["suites"]); }, 1500); }); break;
    case "suiPay": t.disabled = true;
      call("suites", ["pay", id]).then(function(){ setTimeout(function(){ call("refresh", ["suites"]); }, 1500); }); break;
    case "suiStore": call("suites", ["storage", id, parseInt(t.getAttribute("data-arg"), 10)]); break;
    case "suiFurn": call("suites", ["furn"]); break;
    case "suiEnd": {
      if (S.suiArm !== id){
        S.suiArm = id; render(); say("ending DESTROYS everything stored — click again", "bad");
        if (S.suiArmT) clearTimeout(S.suiArmT);
        S.suiArmT = setTimeout(function(){ if (S.suiArm){ S.suiArm = null; if (S.view === "sui") render(); } }, 6000);
        break;
      }
      S.suiArm = null;
      call("suites", ["end", id]).then(function(){ setTimeout(function(){ call("refresh", ["suites"]); }, 1500); });
      break;
    }

    /* ── MEDIC ── */
    case "medAccept": t.disabled = true;
      call("medic", ["accept", parseInt(id, 10)]).then(function(){ setTimeout(function(){ call("refresh", ["medic"]); }, 800); }); break;

    /* ── INTAKE ── */
    case "intkAdd": {
      var cid = parseInt(id, 10), cRow = null;
      for (var ci = 0; ci < S.intk.charges.length; ci++) if (S.intk.charges[ci].id === cid) cRow = S.intk.charges[ci];
      if (!cRow) break;
      var ex = null;
      for (var bi = 0; bi < S.intkBill.length; bi++) if (S.intkBill[bi].id === cid) ex = S.intkBill[bi];
      if (ex){
        if (cRow.stack && ex.n < 5) ex.n++;
        else say(cRow.stack ? "five counts is the cap" : "that charge does not stack", "bad");
      } else {
        S.intkBill.push({ id: cid, title: cRow.title, fine: cRow.fine, months: cRow.months, n: 1, stack: cRow.stack });
      }
      S.intkArm = null; render();
      break;
    }
    case "intkDrop": S.intkBill.splice(parseInt(id, 10), 1); S.intkArm = null; render(); break;
    case "intkTicket": {
      var ft = 0;
      for (var t3 = 0; t3 < S.intkBill.length; t3++) ft += S.intkBill[t3].fine * S.intkBill[t3].n;
      t.disabled = true;
      call("intake", ["ticket", S.intk.suspect.uid, ft]).then(function(){ S.intkBill = []; render(); });
      break;
    }
    case "intkBook": {
      if (S.intkArm !== "book"){
        S.intkArm = "book"; render(); say("booking files every line — click again", "bad");
        if (S.intkArmT) clearTimeout(S.intkArmT);
        S.intkArmT = setTimeout(function(){ if (S.intkArm){ S.intkArm = null; if (S.view === "intk") render(); } }, 5000);
        break;
      }
      S.intkArm = null;
      var moves2 = S.intkBill.map(function(L2){ return [L2.id, L2.n]; });
      S.intkBill = [];
      call("intake", ["book", S.intk.suspect.uid, moves2]);
      render();
      break;
    }

    /* ── SPRAY / HEX ── */
    case "sprMode": S.sprMode = id; S.spr = null; render(); call("sprays", ["data", id]).then(function(v){ if (v && v.rows){ S.spr = v; render(); } }); break;
    case "sprPick":
      call("sprays", [S.sprMode === "hex" ? "hex" : "spray", parseInt(id, 10)])
        .then(function(){ call("sprays", ["data", S.sprMode]).then(function(v){ if (v && v.rows){ S.spr = v; render(); } }); });
      break;

    /* ── LOADOUTS ── */
    case "ldtSel": S.ldtSel = parseInt(id, 10); S.ldtArm = null; render(); break;
    case "ldtEquip":
      t.disabled = true;
      call("loadouts", ["equip", parseInt(id, 10), t.getAttribute("data-arg") || "$"]);
      break;
    case "ldtSave": {
      var ln = el("ldtname"), lv = ln ? ln.value.trim() : "";
      var slot = parseInt(id, 10);
      if (slot < 0 && !lv){ say("name it first", "bad"); break; }
      if (slot >= 0 && !lv){
        /* overwriting keeps the existing name */
        var cur2 = null;
        for (var li = 0; li < S.ldt.rows.length; li++) if (S.ldt.rows[li].idx === slot) cur2 = S.ldt.rows[li];
        lv = cur2 ? cur2.name : "";
      }
      t.disabled = true;
      call("loadouts", ["save", slot, lv]).then(function(){ call("refresh", ["loadouts"]); });
      break;
    }
    case "ldtDel": {
      var did = parseInt(id, 10);
      if (S.ldtArm !== did){
        S.ldtArm = did; render(); say("click again to delete", "bad");
        if (S.ldtArmT) clearTimeout(S.ldtArmT);
        S.ldtArmT = setTimeout(function(){ if (S.ldtArm !== null){ S.ldtArm = null; if (S.view === "ldt") render(); } }, 5000);
        break;
      }
      S.ldtArm = null;
      call("loadouts", ["del", did]).then(function(){ S.ldtSel = null; call("refresh", ["loadouts"]); });
      break;
    }

    /* ── CHOP + SKIN ── */
    case "chopSell": {
      if (S.chopArm !== id){
        S.chopArm = id; render(); say("chopping is final — click again", "bad");
        if (S.chopArmT) clearTimeout(S.chopArmT);
        S.chopArmT = setTimeout(function(){ if (S.chopArm){ S.chopArm = null; if (S.view === "chop") render(); } }, 5000);
        break;
      }
      S.chopArm = null;
      call("chop", ["chop", id]).then(function(){ setTimeout(function(){ call("refresh", ["chop"]); }, 1500); });
      break;
    }
    case "chopClaim": t.disabled = true;
      call("chop", ["claim", id]).then(function(){ setTimeout(function(){ call("refresh", ["chop"]); }, 1500); }); break;
    case "skinBuy": t.disabled = true;
      call("chop", ["skin", parseInt(id, 10)]).then(function(){ setTimeout(function(){ call("refresh", ["skins"]); }, 800); }); break;

    /* ── GANG COMMAND ── */
    case "gbOpen": call("gangCmd", ["bank"]); break;
    case "gbVerb": {
      var ga = el("gbamt"), gv = ga ? parseInt(ga.value.replace(/[^0-9]/g, ""), 10) || 0 : 0;
      if (id !== "depall" && gv <= 0){ say("type an amount", "bad"); break; }
      t.disabled = true;
      call("gangCmd", [id, gv]).then(function(){ setTimeout(function(){ call("gangCmd", ["bank"]); }, 1500); });
      break;
    }
    case "gbXfer": {
      var gx = el("gbamt"), xv2 = gx ? parseInt(gx.value.replace(/[^0-9]/g, ""), 10) || 0 : 0;
      var gt = el("gbxtgt");
      if (xv2 <= 0){ say("type an amount", "bad"); break; }
      if (!gt || !gt.value){ say("pick a member", "bad"); break; }
      if (!gangArm2("xfer")) break;
      call("gangCmd", ["xfer", xv2, gt.value, gt.options[gt.selectedIndex].getAttribute("data-name") || ""])
        .then(function(){ setTimeout(function(){ call("gangCmd", ["bank"]); }, 1500); });
      break;
    }
    case "gTag": {
      var tg = el("gtag"), tvv = tg ? tg.value.trim() : "";
      if (!tvv){ say("type a tag", "bad"); break; }
      call("gangCmd", ["tag", 0, tvv]);
      break;
    }
    case "gWar": {
      var parts = id.split(":"), wv = parts[0], wid = parts[1];
      if (wv === "challenge"){ var wt = el("gwtgt"); wid = wt ? wt.value : ""; }
      if (!wid){ say("pick a gang", "bad"); break; }
      if (wv === "surrender" && !gangArm2("sur" + wid)) break;
      call("gangCmd", ["war", wv, String(wid)]).then(function(){ call("refresh", ["gang"]); });
      break;
    }
    case "gFaction": {
      var gf = el("gfix"); if (!gf || !gf.value){ say("pick a fixer", "bad"); break; }
      /* Two clicks, like every other irreversible gang verb on this screen:
         swearing costs nothing but defecting costs the bank and a week, and
         the arm is the only thing standing between a misclick and both. */
      if (!gangArm2("fix")) break;
      call("gangCmd", ["faction", 0, gf.value]).then(function(){ call("refresh", ["gang"]); });
      break;
    }
    case "gLeave":   if (gangArm2("leave"))   call("gangCmd", ["leave"]).then(function(){ go("home"); }); break;
    case "gDisband": if (gangArm2("disband")) call("gangCmd", ["disband"]).then(function(){ go("home"); }); break;
    case "gLead": {
      var gl = el("gltgt"); if (!gl || !gl.value){ say("pick a member", "bad"); break; }

        .then(function(){ call("refresh", ["gang"]); });

    case "gOwner": {
      var go2 = el("gltgt"); if (!go2 || !go2.value){ say("pick a member", "bad"); break; }
      if (!gangArm2("owner")) break;
      call("gangCmd", ["owner", 0, go2.value, go2.options[go2.selectedIndex].getAttribute("data-name") || ""])
        .then(function(){ call("refresh", ["gang"]); });

    /* ── HOUSE ── */
    case "hseLock":   call("house", ["lock"]).then(function(){ call("refresh", ["house"]); }); break;
    case "hseLights": {
      var hl = el("hselight"), hv = hl ? parseInt(hl.value, 10) : -1;
      if (hv < 0){ say("pick a colour", "bad"); break; }

    case "hseRename": {
      var hn = el("hsename"), nv = hn ? hn.value.trim() : "";
      if (!nv){ say("type a name", "bad"); break; }
      call("house", ["rename", nv]).then(function(){ setTimeout(function(){ call("refresh", ["house"]); }, 800); });
      break;
    }
    case "hseSell": {
      if (S.hseArm !== "sell"){
        S.hseArm = "sell"; render(); say("selling to the bank is permanent — click again", "bad");
        if (S.hseArmT) clearTimeout(S.hseArmT);
        S.hseArmT = setTimeout(function(){ if (S.hseArm){ S.hseArm = null; if (S.view === "hse") render(); } }, 5000);
        break;
      }
      S.hseArm = null;
      call("house", ["run", "sellBank"]);
      break;
    }
    case "hseRun": call("house", ["run", id]); break;

    /* ── VEHICLE SHOP ── */
    case "vshSel": S.vshSel = id; S.vshMods = {}; S.vshSkin = -1; S.vshAlarm = false; render(); break;
    case "vshBuy": {
      var sk2 = el("vshskin"), al = el("vshalarm");
      var skinId = sk2 ? parseInt(sk2.value, 10) : -1;
      var skinTxt = sk2 && sk2.selectedIndex >= 0 ? sk2.options[sk2.selectedIndex].text : "";
      var alarm = al && al.value === "1" ? 1 : 0;
      /* mod values in slot order 1,2,3,4,5,7,8,9 -- what fn_deckVShop reprices */
      var order = [1, 2, 3, 4, 5, 7, 8, 9, 6], vals = [];   /* 6 = Chameleon Paint, appended last (fn_deckVShop "buy" reads the same order) */
      for (var vo = 0; vo < order.length; vo++) vals.push(S.vshMods[order[vo]] || 0);
      t.disabled = true;
      call("vshop", ["buy", id, alarm, skinId, skinTxt, vals])
        .then(function(){ setTimeout(function(){ t.disabled = false; }, 2500); });
      break;
    }

    /* ── TRUNK ── */
    case "trkPick": S.trkPick = (S.trkPick === id) ? null : id; render(); break;
    case "trkAdd": {
      var tq = el("trkqty"), tv = tq ? parseInt(tq.value.replace(/[^0-9]/g, ""), 10) || 0 : 0;
      if (tv <= 0){ say("type an amount", "bad"); break; }
      var dir = id.indexOf("store") === 0 ? "store" : "take";
      var iid = t.getAttribute("data-arg");
      var src = dir === "store" ? S.trunk.mine : S.trunk.trunk, item = null;
      for (var ti = 0; ti < src.length; ti++) if (src[ti].id === iid) item = src[ti];
      if (!item) break;
      S.trkQ.push({ dir: dir, id: iid, name: item.name, qty: tv, w: item.w });
      S.trkPick = null; render();
      break;
    }
    case "trkDrop": S.trkQ.splice(parseInt(id, 10), 1); render(); break;
    case "trkPhysTake": {
      /* physical stacks move whole, immediately -- no queue: the natives take
         the full class stack and gear maths does not preview like weights do */
      t.style.pointerEvents = "none";
      var pq = parseInt(t.getAttribute("data-arg"), 10) || 1;
      call("trunk", ["batch", [["take", id, pq, false]]]);
      break;
    }
    case "trkCommit": {
      if (!S.trkQ.length) break;
      t.disabled = true;
      var moves = S.trkQ.map(function(m){ return [m.dir, m.id, m.qty, m.virt !== false]; });
      S.trkQ = [];
      call("trunk", ["batch", moves]);
      break;
    }

    /* ── GARAGE ── */
    case "grgSel": S.grgSel = parseInt(id, 10); S.grgArm = null; S.grgPane = "info"; S.grgMod = null; S.grgModCh = {}; render(); break;
    case "grgGet": t.disabled = true; call("garage", ["get", parseInt(id, 10)])
      .then(function(){ setTimeout(function(){ call("refresh", ["garage"]); }, 1500); }); break;
    case "grgFix": t.disabled = true; call("garage", ["fix", parseInt(id, 10)])
      .then(function(){ setTimeout(function(){ call("refresh", ["garage"]); }, 1200); }); break;
    case "grgStar": t.disabled = true; call("garage", ["recall", parseInt(id, 10)])
      .then(function(){ setTimeout(function(){ call("refresh", ["garage"]); }, 1500); }); break;
    case "smGo": t.disabled = true; call("summon", ["go"]); break;
    case "smGarage": deckGo("Garage"); break;
    case "grgPane":
      S.grgPane = id;
      if (id === "mods" && (!S.grgMod || S.grgMod.id !== S.grgSel)){
        S.grgMod = null; S.grgModCh = {};
        call("garage", ["modData", S.grgSel]).then(function(v){ if (v && v.slots){ S.grgMod = v; render(); } });
      }

    case "grgMods":
      S.grgPane = "mods"; S.grgMod = null; S.grgModCh = {};

      call("garage", ["modData", parseInt(id, 10)]).then(function(v){ if (v && v.slots){ S.grgMod = v; render(); } });
      break;
    case "grgModFit": {
      var md2 = S.grgMod; if (!md2) break;

      var pl = el("grgplate"); if (pl) S.grgModCh[10] = pl.value.trim();
      var out = [];
      for (var oi = 0; oi <= 11; oi++) out.push((oi in S.grgModCh) ? S.grgModCh[oi] : (oi in base ? base[oi] : 0));

      call("garage", ["modBuy", parseInt(id, 10), out]).then(function(){

      S.grgArm = null;
      call("garage", [act === "grgSell" ? "sell" : "gang", parseInt(id, 10)])

    case "fabTab": S.fabTab = id; S.fabSel = null; S.fabArm = null; render(); break;

      call("fab", ["burn", id]).then(function(){ setTimeout(function(){ call("refresh", ["fab"]); }, 1200); });

    /* ── EXCHANGE ── */

    case "bkPreset": {

      var xa = el("bkamt"), xv = xa ? parseInt(xa.value.replace(/[^0-9]/g, ""), 10) || 0 : 0;

        if (S.bankArmT) clearTimeout(S.bankArmT);
        S.bankArmT = setTimeout(function(){ if (S.bankArm){ S.bankArm = 0; if (S.view === "bank") render(); } }, 5000);
        break;
      }
      S.bankArm = 0;
      if (S.bankArmT) clearTimeout(S.bankArmT);
      call("bank", ["xfer", xv, xu]).then(function(){
        S.bankXfer = false;
        var xb = el("bkamt"); if (xb) xb.value = "";
      });
      break;
    }

    case "msgClear": S.msgQuery = ""; render(); break;
    case "msgSend":  sendCurrent(); break;

    case "buyPt":
      if (!S.buyArm){
        S.buyArm = true; render(); say("click again to confirm the purchase", "hot");
        if (S.buyTimer) clearTimeout(S.buyTimer);
        S.buyTimer = setTimeout(function(){ if (S.buyArm){ S.buyArm = false; render(); } }, 4000);
        break;
      }
      S.buyArm = false;
      if (S.buyTimer) clearTimeout(S.buyTimer);
      call("buyTalentPoint", []).then(function(r){ if (r && r.tree) adoptTree(r.tree); });
      break;

    case "branch": S.branch = parseInt(id, 10); S.node = null; render(); break;
    case "node": {
      var picked = nodeAnywhere(parseInt(id, 10));
      if (picked && picked.state === "locked" && !picked.why) break;
      S.node = parseInt(id, 10); render();

    }
    /* One verb, because the native functions are toggles: calling them on a node
       you own unlearns it, at that tree's own price. */
    case "tnode":
      call("treeAction", [S.treeCat, parseInt(id, 10)]).then(function(r){
        if (r && r.tree) adoptTree(r.tree);
      });
      break;

    case "mark":    call("markPlayer", [id]); break;
    case "promote": call("gangAction", [id, "promote"]); break;
    case "kick":    call("gangAction", [id, "kick"]); break;
    case "locate":  call("keyAction",  [id, "locate"]); break;
    case "give":    giveKey(id); break;
    case "drop":    dropKey(id); break;

    /* Read straight off the page. The native prompt these used to open is still
       there as webui_fnc_prompt, but nothing on this screen needs it. */
    case "renameGang": {
      var gf = el("gname"), gv = gf ? gf.value.trim() : "";
      if (!gv) { say("type a name first", "bad"); break; }
      if (S.gang && gv === S.gang.name) { say("that is already the name", "bad"); break; }
      call("gangRename", [gv]);
      break;
    }
    case "invite": {
      var inf = el("ginvite"), inv = inf ? inf.value.trim() : "";
      if (!inv) { say("type a player name first", "bad"); break; }
      call("gangInvite", [inv]);
      break;
    }

    case "send":
      var tgt = S.money && S.money.nearby[S.pick];
      if (tgt) call("transfer", [tgt.uid, amountValue()]);
      break;
    /* deposit / withdraw / payFine are gone, not stubbed: banking stays an ATM
       errand and charges are cleared by an officer, not from a handset. */

    case "giveTo":
      var pick = S.picker && S.picker.list[parseInt(id, 10)];
      var pkey = S.picker && S.picker.key;
      S.pickerKind = S.picker && S.picker.kind;
      S.pickerQty  = S.picker && S.picker.qty;
      S.picker = null; render();
      if (pick && S.pickerKind === "inv"){
        call("invAction", ["give", pkey, S.pickerQty || 1, pick.uid]).then(function(){
          setTimeout(function(){ call("refresh", ["inv"]); }, 400);
        });
      } else if (pick) {
        call("keyAction", [pkey, "give", pick.uid]).then(function(){ call("refresh", ["keys"]); });
      }
      break;
    case "dropYes":
      var dkey = S.confirm && S.confirm.key;
      S.confirm = null; render();
      if (dkey) call("keyAction", [dkey, "drop"]).then(function(){ call("refresh", ["keys"]); });
      break;
    case "cancelOvl": S.picker = null; S.confirm = null; render(); break;
  }
});

/* ---- key give / drop ----------------------------------------------------
   GIVE needs a recipient, so it asks SQF who is close enough (same rule the
   native keychain uses: same gang / group / vehicle, or 12 m on foot) and
   offers them. DROP is irreversible, so it asks twice. Both then go through the
   native fns, which re-check everything. */
function keyRow(key){ return (S.keys && S.keys.items || []).filter(function(k){ return k.key === key; })[0]; }

async function giveKey(key){
  var row = keyRow(key);
  var near = await WEBUI.call("nearbyPlayers", []).catch(function(){ return []; });
  if (!Array.isArray(near) || !near.length){ say("nobody close enough to hand a key to", "bad"); return; }
  S.picker = { key: key, label: row ? row.id : key, list: near };
  render();
}
async function dropKey(key){
  var row = keyRow(key);
  S.confirm = { key: key, label: row ? (row.id + " — " + row.label) : key };
  render();
}
function overlay(){
  if (S.picker){
    return '<div class="ovl"><div class="ovl-box"><div class="label" style="margin-bottom:.5rem">' +
      'Give ' + esc(S.picker.label) + ' to</div>' +
      S.picker.list.map(function(n, i){
        return '<button class="pick" data-act="giveTo" data-id="' + i + '">' +
          '<i></i><span class="n">' + esc(n.name) + '</span><span class="d">' + esc(n.dist) + ' m</span></button>';
      }).join("") +
      '<button class="btn-sec" style="margin-top:.6rem" data-act="cancelOvl">CANCEL</button></div></div>';
  }
  if (S.confirm){
    return '<div class="ovl"><div class="ovl-box"><div class="label" style="margin-bottom:.5rem">Drop this key?</div>' +
      '<div style="font-size:.78rem;color:var(--ink);margin-bottom:.3rem">' + esc(S.confirm.label) + '</div>' +
      '<div class="meta" style="line-height:1.6;margin-bottom:.6rem">A dropped key is not recoverable.</div>' +
      '<button class="act bad" style="width:100%;padding:.5rem" data-act="dropYes">DROP IT</button>' +
      '<button class="btn-sec" style="margin-top:.4rem" data-act="cancelOvl">CANCEL</button></div></div>';
  }
  return "";
}

/* ---- the rem hook ------------------------------------------------------- */
/* 1rem = frame width / 75 is the design ratio, reviewed at ~1200px wide. The
   in-game control at 1080p is narrower than that, which would put a 2.9rem list
   row under the tap floor — so the rem gets a floor. The layout has horizontal
   slack (the widest screen packs ~60 of its 75rem), so the floor costs nothing
   until it bites. Measured numbers go to the RPT via deckLog on first fit. */
/* The assembly is a fixed 1034x494 internally and is SCALED to the control, so
   the bezel never resizes and the layout never reflows during the roll. rem is
   therefore derived from the screen's own fixed 960px, not from the control —
   the chassis eats ~7% of the box, exactly as CHASSIS.md says it would. */
var ASSEMBLY_W = 1034, ASSEMBLY_H = 494, SCREEN_W = 960;
var REM_MIN = 11.5;
var _lastW = 0;
function fit(){
  var host = el('fit');
  if (!host) return;
  var w = host.clientWidth, h = host.clientHeight;
  if (!w || !h) return;
  var scale = Math.min(w / ASSEMBLY_W, h / ASSEMBLY_H);
  el('spool').style.setProperty('--spool-scale', scale);

  var rem = Math.max(REM_MIN, SCREEN_W / 75);
  document.documentElement.style.fontSize = rem + "px";

  if (Math.abs(w - _lastW) > 1 && window.WEBUI){
    _lastW = w;
    WEBUI.call("log", ["fit: control " + Math.round(w) + "x" + Math.round(h) +
      "px, spool scale " + scale.toFixed(3) +
      ", screen " + Math.round(SCREEN_W * scale) + "px effective" +
      ", 1rem=" + rem.toFixed(2) + "px (" + (rem * scale).toFixed(2) + "px effective)" +
      ", row=" + (rem * 2.9 * scale).toFixed(1) + "px effective"]).catch(function(){});
  }
}
window.addEventListener("resize", fit);
fit();

/* ---- boot --------------------------------------------------------------- */
/* bridge.js is injected by fn_deckOpen over ExecJS on a retry timer, so WEBUI
   appears shortly AFTER this script runs. Poll for it; WEBUI.on() replays the last
   value per channel, so nothing pushed before we subscribe is lost. */
render();

/* No polling: WEBUIReady resolves the moment bridge.js has run, by either boot
   path. WEBUI.on() replays the last value per channel, so a push that landed
   before we subscribed is not lost. */
/* ---- chassis phases ------------------------------------------------------
   0 stowed  1 baton in place, panel wound  2 live.

   The dialog appears and the page loads in the same frame, so an unprompted
   unroll would play against an empty screen. Hold at the baton — the spindle
   spins, which reads as loading, which is what it is — and only unroll once
   real data has landed. Fail open after 1.5s rather than leave the player
   staring at a baton. (CHASSIS.md, "Wiring it to the dialog lifecycle".)

   Stow is NOT wired to Esc: Arma closes the dialog instantly and intercepting
   that would hold input for ~1.4s every time the player closes the phone,
   which is bad when they are being shot at. CHASSIS.md says to ask first. */
/* Frame delivery here is DIRTY-DRIVEN: nothing changes, nothing paints (~0.6
   fps idle), but the moment content animates the surface runs — measured 20 fps
   of engine draws and 61 fps of rAF. So transitions are fine.

   THE CATCH, and it cost most of an afternoon: this only holds when Arma is
   launched THROUGH STEAM. Started outside Steam (tools/launch_arma.sh, no
   gameoverlayrenderer.so injected) the same page is clamped to ~1 fps and the
   roll is invisible. See core/web/README.md. */
/* Opening is a flourish (1150ms, reads as mass); closing should get out of the
   way — the player may be closing the phone because they are being shot at. */
var PAGE_BUILD = "b0424+";
var DUR = 1150, STOW_DUR = 520, phaseT = null, armed = false;
function phase(n){ clearTimeout(phaseT); var r = el('spool'); if (r) r.dataset.phase = String(n); }
function unroll(){
  if (armed) return;
  armed = true;
  phase(1);
  /* was 380ms; the baton is a loading state, not a feature — get off it fast */
  phaseT = setTimeout(function(){ phase(2); fit(); }, 120);
}
phase(1);                                   // baton + spinning spindle while we wait
setTimeout(unroll, 600);                    // fail open, was 1500

/* Esc is intercepted in fn_deckOpen so the roll-shut can actually play, which
   CHASSIS.md flagged as needing an owner decision — granted 2026-08-11. SQF
   calls this, waits for the number of ms it returns, then closes the dialog.
   A second Esc during the stow closes instantly, so nobody is ever trapped
   inside an animation. */
var WEBUI_STOW_MS = STOW_DUR + 220;
window.__deckStow = function () {
  var r = el('spool');
  if (r) r.style.setProperty('--dur', STOW_DUR + 'ms');
  phase(1);                                      // wind the panel shut
  phaseT = setTimeout(function(){ phase(0); }, STOW_DUR);   // then pop out
  return WEBUI_STOW_MS;
};

var booted = false;
window.WEBUIReady.then(function (WEBUI) {
  booted = true;
  /* Announce which copy of this file is actually running. The browser caches by
     URL and the URL is identical every build, so a stale page otherwise looks
     exactly like a broken feature — it cost a round chasing a "missing" stow
     handler that was present in the PBO all along. */
  WEBUI.call("log", ["page build " + PAGE_BUILD]).catch(function(){});
  unroll();                       // bridge is up — no reason to sit on the baton
  /* ---- chassis diagnostic ------------------------------------------------
     The rollable reads as "doesn't animate, buttons laggy" in game but is
     smooth in a desktop browser. The difference that matters is almost
     certainly that CEF here composites on the CPU, which makes a large blur
     filter and a scaled subtree far more expensive than they look.

     Rather than guess which one, measure each: real rAF frame rate with the

/* ── live bridge ─────────────────────────────────────────────────────────────
   TWATTER runs on the real Looner feed. The server half already existed and is
   untouched: APS_fnc_loonerSRV owns "feed"/"post"/"like", resolves identity from
   remoteExecutedOwner, rate-limits, and rebroadcasts the whole feed to every
   client after any mutation. So this page never patches its own feed on a post
   or a like -- it fires the verb and waits for the push that always follows.
   That is also why a like has no optimistic toggle: the authority is the row
   count coming back, and one-like-per-uid is enforced there, not here.

   TWRETWAT stays local. There is no retwat verb server-side and inventing one
   would mean a new column, a new dedupe table and a new CfgRE entry -- out of
   scope for wiring up the app. The button toggles for the session and says so.

   EXCHANGE is still the page's built-in sample data. Deliberate: the deck already
   ships a real EXCHANGE app, and a second live one would be two clients for the
   same listings.

   LIVE is "am I inside the game": with A3API the demo rows are dropped on boot so
   nothing fake is ever on screen, and opened standalone in a browser the page keeps
   them and stays a working comp. */
var LIVE = true, SITES = null, twReady = false;   /* inside the deck the bridge always exists */
if (LIVE) { FEED = []; USERS = {}; ME = { h:'@…', n:'CONNECTING', av:'··', k:'' }; }

function esc(x){ return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
/* the feed carries minutes-ago as a number for exactly this reason: DATE_FORMAT's
   tokens did not survive SQF format[] server-side (see fn_loonerSRV's own note). */
function rel(m){ m = +m || 0; return m < 1 ? 'NOW' : m < 60 ? Math.floor(m)+'M'
                : m < 1440 ? Math.floor(m/60)+'H' : Math.floor(m/1440)+'D'; }
function initials(n){ var w = String(n||'?').trim().split(/\s+/);
  return ((w[0]||'?').charAt(0) + (w.length>1 ? w[w.length-1].charAt(0) : (w[0]||'?').charAt(1)||'')).toUpperCase(); }
/* Looner has no handles -- a row is a display name. Derive one so the profile
   route, the @mention and the avatar key all have something stable to hang on. */
function handleOf(n){ var h = String(n||'loon').toLowerCase().replace(/[^a-z0-9_]+/g,'_').replace(/^_+|_+$/g,'');
  return '@' + (h || 'loon'); }

/* The sidebar shipped with sample TRENDS and three hard-coded handles. Both are
   mock furniture: on a live feed USERS is rebuilt from the posts, so indexing it by
   a sample handle throws, and a trend list nobody generated is an invented stat on a
   real screen. Live, both come out of the feed itself. */
function trendsNow(){
  if (!LIVE) return TRENDS;
  var seen = {}, out = [];
  for (var i = 0; i < FEED.length; i++){
    var tags = String(FEED[i].x).match(/#\w+/g) || [];
    for (var j = 0; j < tags.length; j++){
      var k = tags[j].toLowerCase();
      if (!seen[k]) { seen[k] = { n: 0, label: tags[j] }; }
      seen[k].n++;
    }
  }
  for (var k2 in seen) out.push([seen[k2].label, seen[k2].n + (seen[k2].n === 1 ? ' TWAT' : ' TWATS')]);
  out.sort(function(a,b){ return parseInt(b[1],10) - parseInt(a[1],10); });
  return out;
}
/* loudest voices in the window, which is the only "who to follow" the feed can honestly answer */
function suggestNow(){
  if (!LIVE) return ['@mpd_dispatch','@saltline','@drfixit'];
  var by = {}, out = [];
  for (var i = 0; i < FEED.length; i++){ if (FEED[i].u !== ME.h) by[FEED[i].u] = (by[FEED[i].u] || 0) + 1; }
  for (var h in by) out.push([h, by[h]]);
  out.sort(function(a,b){ return b[1] - a[1]; });
  return out.slice(0, 3).map(function(x){ return x[0]; });
}

function adoptTw(v){
  if (!v) return;
  FEED = []; USERS = {};
  var rows = v.feed || [];
  for (var i = rows.length - 1; i >= 0; i--){          /* server sends oldest-first; the stream reads newest-first */
    var r = rows[i], h = handleOf(r.n);
    if (!USERS[h]) USERS[h] = { n: String(r.n||'Loon'), av: initials(r.n), k: r.v ? 'sys' : '',
                                badge: r.v ? 'VERIFIED' : '', bio: '', f: '—', g: '—' };
    FEED.push({ id: r.id, u: h, t: rel(r.m), x: esc(r.x), l: +r.l || 0, r: 0 });
  }
  if (v.me){ ME = { h: handleOf(v.me.n), n: String(v.me.n||'YOU').toUpperCase(), av: initials(v.me.n), k:'' };
    if (!USERS[ME.h]) USERS[ME.h] = { n: ME.n, av: ME.av, k:'', badge:'', bio:'', f:'—', g:'—' }; }
}
