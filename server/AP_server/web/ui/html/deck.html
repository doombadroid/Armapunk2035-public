function openWallpaper(){ S.view = "wall"; render(); call("refresh", ["wallpaper"]); }
function adoptWall(v){ S.wall = v || null; render(); }

/* One fetch per path, ever. WEBUI.texture is not free and the grid would
   otherwise re-request on every repaint. */
function wpTex(path){
  if (WP_CACHE[path] !== undefined) return Promise.resolve(WP_CACHE[path]);
  if (!window.WEBUI || !WEBUI.texture) return Promise.resolve(null);
  return WEBUI.texture(path, 512).then(function(url){
    WP_CACHE[path] = url || null; return WP_CACHE[path];
  }, function(){ WP_CACHE[path] = null; return null; });
}
function wpPaint(sel, path){
  wpTex(path).then(function(url){
    if (!url) return;
    var n = document.querySelector(sel);
    if (n) n.style.backgroundImage = 'url("' + url + '")';
  });
}

/* The backdrop follows whatever is APPLIED, on every screen — it is not a
   feature of the picker. */
function wpApplyBackdrop(){
  if (!S.wall) return;
  var w = el("wall"); if (!w) return;

  var sc = el("scrim");
  if (sc) sc.className = "s" + (S.wall.scrim || 0);

  if (S.wall.deck){
    /* A live wallpaper is a DOM layer, not a texture — it supersedes the .paa
       choice without discarding it, so clearing the override brings the static
       one straight back. */
    wpMountLive(S.wall.deck);
  } else {
    wpUnmountLive();
    var cur = null;
    for (var i = 0; i < S.wall.items.length; i++) if (S.wall.items[i].cur) cur = S.wall.items[i];
    if (!cur) w.style.backgroundImage = "";
    else wpPaint("#wall", cur.path);
  }

  /* THE PAUSE RULE. Frame delivery is dirty-driven: a static screen is free, a
     full-bleed animation dirties the whole surface every frame. `.paused` stops
     every stream where it stands via animation-play-state and costs nothing, so
     a paused live wallpaper is exactly as cheap as a static one. Default is
     launcher-only — the one screen that is otherwise idle. */
  var motion = S.wall.motion || "launcher";
  document.body.classList.toggle("paused",
    motion === "off" || (motion === "launcher" && S.view !== "home"));
}

function viewWallpaper(){
  var w = S.wall;
  if (!w) return '<div class="panel" style="flex:1;display:flex"><div class="empty">READING WALLPAPERS</div></div>';

  var pick = (S.wallPick !== undefined && S.wallPick !== null) ? S.wallPick : (w.deck || w.current);
  var tiles = "";
  if (w.live && w.live.length){
    tiles += '<div class="wp-group">LIVE &middot; CSS, NO TEXTURE</div>';
    for (var L = 0; L < w.live.length; L++){
      var lv = w.live[L];
      tiles += '<button class="wp-tile wp-live-tile" data-act="wpPickLive" data-id="' + esc(lv.id) + '"' +
        (pick === lv.id ? ' aria-current="page"' : '') + '>' +
        '<span class="img" style="background:radial-gradient(ellipse at 50% 32%,rgba(10,40,18,.85),#000 76%)"></span>' +
        '<span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;' +
        'font-family:var(--mono);font-size:.7rem;color:rgba(63,255,110,.75);text-shadow:0 0 7px rgba(63,255,110,.5)">' +
        'ｱｲｳ 01 ﾈﾉ</span>' +
        '<span class="live">' + esc(lv.note) + '</span>' +
        (w.deck === lv.id ? '<span class="on">&#10003;</span>' : '') +
        '<span class="cap">' + esc(lv.name) + '</span></button>';
    }
    tiles += '<div class="wp-group">STATIC</div>';
  }
  for (var i = 0; i < w.items.length; i++){
    var it = w.items[i];
    tiles += '<button class="wp-tile" data-act="wpPick" data-id="' + it.id + '"' +
             (pick === it.id ? ' aria-current="page"' : '') + '>' +
             '<span class="img" data-wp="' + esc(it.path) + '"></span>' +
             (it.cur && !w.deck ? '<span class="on">&#10003;</span>' : '') +
             '<span class="cap">' + esc(it.name) + '</span></button>';
  }

  var sel = null, selLive = null;
  for (var i = 0; i < w.items.length; i++) if (w.items[i].id === pick) sel = w.items[i];
  if (w.live) for (var i = 0; i < w.live.length; i++) if (w.live[i].id === pick) selLive = w.live[i];
  var side;
  if (selLive){
    var applied = w.deck === selLive.id;
    side = '<div class="wp-prev" style="background:radial-gradient(ellipse at 50% 32%,rgba(10,40,18,.85),#000 76%)"></div>' +
      '<div style="font-family:var(--sans);font-size:.9rem;font-weight:700;color:#eaf0f6">' + esc(selLive.name) + '</div>' +
      '<dl><dt>TYPE</dt><dd>LIVE</dd></dl>' +
      '<dl><dt>COST</dt><dd>' + esc((w.motion || "launcher") === "off" ? "NONE" : "LAUNCHER ONLY") + '</dd></dl>' +
      '<dl><dt>STATE</dt><dd>' + (applied ? "APPLIED" : "PREVIEW") + '</dd></dl>' +
      '<div style="font-family:var(--sans);font-size:.58rem;line-height:1.6;color:var(--faint)">' +
      'Drawn in CSS &mdash; no texture is fetched. Motion pauses when an app is open, ' +
      'which costs nothing while paused. Tune it in Settings.</div>' +
      '<button class="act acid" style="width:100%;margin-top:auto" data-act="wpSetLive" data-id="' + esc(selLive.id) + '"' +
      (applied ? " disabled" : "") + '>' + (applied ? "ALREADY APPLIED" : "APPLY") + '</button>';
  } else if (!sel){
    side = '<div class="empty" style="margin:auto">PICK ONE</div>';
  } else {
    side = '<div class="wp-prev" id="wpprev"></div>' +
      '<div style="font-family:var(--sans);font-size:.9rem;font-weight:700;color:#eaf0f6">' + esc(sel.name) + '</div>' +
      '<dl><dt>TYPE</dt><dd>STATIC</dd></dl>' +
      '<dl><dt>STATE</dt><dd>' + (sel.cur ? "APPLIED" : "PREVIEW") + '</dd></dl>' +
      '<button class="act acid" style="width:100%;margin-top:auto" data-act="wpSet" data-id="' + sel.id + '"' +
      (sel.cur && !w.deck ? " disabled" : "") + '>' + (sel.cur && !w.deck ? "ALREADY APPLIED" : "APPLY") + '</button>';
  }

  return '<div class="wp"><div class="wp-grid">' + tiles + '</div>' +
         '<div class="wp-side">' + side + '</div></div>';
}

function openMarket(){
  S.view = "market"; render();
  call("refresh", ["market"]);
}
function adoptMarket(v){
  S.market = v || null;
  if (S.market && S.mkPick === undefined) S.mkPick = null;
  render();
}
function mkGood(id){
  if (!S.market) return null;
  for (var i = 0; i < S.market.goods.length; i++) if (S.market.goods[i].id === id) return S.market.goods[i];
  return null;
}
function premLabel(g){
  if (!g.tracked) return { cls: "flat", txt: "STATIC" };
  var d = Math.round((g.prem - 1) * 100);
  if (d > 1)  return { cls: "up", txt: "+" + d + "%" };
  if (d < -1) return { cls: "dn", txt: d + "%" };
  return { cls: "flat", txt: "PAR" };
}

function viewMarket(){
  var m = S.market;
  if (!m) return '<div class="panel" style="flex:1;display:flex"><div class="empty">READING THE MARKET</div></div>';

  var cats = '<button class="mk-cat" data-act="mkCat" data-id=""' + (!S.mkCat ? ' aria-current="page"' : '') +
             '><span class="n">ALL GOODS</span><span class="c">' + m.goods.length + '</span></button>';
  for (var i = 0; i < m.cats.length; i++){
    var c = m.cats[i];
    cats += '<button class="mk-cat" data-act="mkCat" data-id="' + esc(c.id) + '"' +
            (S.mkCat === c.id ? ' aria-current="page"' : '') +
            '><span class="n">' + esc(c.title) + '</span><span class="c">' + c.n + '</span></button>';
  }

  var hold = '<div class="hr" style="color:var(--faint);font-size:.55rem;letter-spacing:.12em">YOU HOLD</div>';
  if (!m.holdings.length){
    hold += '<div class="hr"><span class="n">nothing worth selling</span></div>';
  } else {
    for (var i = 0; i < m.holdings.length; i++){
      var h = m.holdings[i];
      hold += '<div class="hr"><span class="n">' + esc(h.name) + ' &times;' + h.qty + '</span>' +
              '<span class="v">' + F(h.value) + '</span></div>';
    }
  }

  var rows = "", shown = 0;
  for (var i = 0; i < m.goods.length; i++){
    var g = m.goods[i];
    if (S.mkCat && g.cats.indexOf(S.mkCat) === -1) continue;
    shown++;
    var p = premLabel(g);
    rows += '<button class="mk-row" data-act="mkPick" data-id="' + esc(g.id) + '"' +
            (S.mkPick === g.id ? ' aria-current="page"' : '') + '>' +
            '<span class="mk-nm">' + esc(g.name) + (g.held > 0 ? ' <span class="chip">&times;' + g.held + '</span>' : '') + '</span>' +
            '<span class="mk-c mk-buy">' + (g.buy > 0 ? F(g.buy) : "&mdash;") + '</span>' +
            '<span class="mk-c mk-sell">' + (g.sell > 0 ? F(g.sell) : "&mdash;") + '</span>' +
            '<span class="mk-c mk-prem ' + p.cls + '">' + p.txt + '</span></button>';
  }
  if (!shown) rows = '<div class="empty" style="padding:1.5rem">NOTHING TRADES HERE</div>';

  var table =
    (m.bust > 0 ? '<div class="mk-bust">DRUG BUST &mdash; ILLEGAL GOODS +12% FOR ' + m.bust + 's</div>' : '') +
    '<div class="mk-table">' +
      '<div class="mk-head"><span class="mk-nm">GOOD</span>' +
        '<span class="mk-c mk-buy">YOU PAY</span>' +
        '<span class="mk-c mk-sell">YOU GET</span>' +
        '<span class="mk-c mk-prem">PREMIUM</span></div>' +
      '<div class="mk-rows">' + rows + '</div>' +
    '</div>';

  var g = S.mkPick ? mkGood(S.mkPick) : null;
  var det;
  if (!g){
    det = '<div class="empty" style="margin:auto">PICK A GOOD</div>';
  } else {
    var p = premLabel(g);
    /* Where this good sits between the floor and the ceiling. Drawn from the real
       band the server clamps to, not a made-up scale. */
    var pos = Math.max(0, Math.min(1, (g.prem - m.floor) / (m.ceil - m.floor))) * 100;
    var tags = g.cats.map(function(c){
      for (var i = 0; i < m.cats.length; i++) if (m.cats[i].id === c) return m.cats[i].title;
      return c;
    });
    det =
      '<div class="dn">' + esc(g.name) + '</div>' +
      '<div style="font-family:var(--mono);font-size:.55rem;letter-spacing:.14em;color:var(--faint)">SELLS FOR</div>' +
      '<div class="big">' + (g.sell > 0 ? F(g.sell) : "&mdash;") + '</div>' +
      (g.tracked
        ? '<div class="mk-band"><i style="left:calc(' + pos.toFixed(1) + '% - .12rem)"></i></div>' +
          '<div class="mk-band-lbl"><span>GLUT ' + Math.round(m.floor * 100) + '%</span>' +
          '<span>SCARCE ' + Math.round(m.ceil * 100) + '%</span></div>'
        : '<div class="note" style="font-family:var(--sans);font-size:.6rem;line-height:1.6;color:var(--faint)">' +
          'Fixed price. This good is not on the supply/demand market, so it never moves.</div>') +
      '<dl><dt>PREMIUM</dt><dd class="' + p.cls + '">' + p.txt + '</dd></dl>' +
      (g.tracked ? '<dl><dt>SOLD</dt><dd>' + F(g.sales) + '</dd></dl>' : '') +
      '<dl><dt>YOU PAY</dt><dd>' + (g.buy > 0 ? F(g.buy) : "&mdash;") + '</dd></dl>' +
      '<dl><dt>YOU HOLD</dt><dd>' + g.held + '</dd></dl>' +
      (g.held > 0 ? '<dl><dt>WORTH</dt><dd>' + F(g.held * g.sell) + '</dd></dl>' : '') +
      '<dl><dt>WEIGHT</dt><dd>' + g.weight + '</dd></dl>' +
      '<div style="font-family:var(--mono);font-size:.55rem;letter-spacing:.12em;color:var(--faint);margin-top:.2rem">TRADES IN</div>' +
      '<div style="font-family:var(--sans);font-size:.64rem;color:var(--dim);line-height:1.6">' + esc(tags.join(" · ")) + '</div>';
  }

  return '<div class="mk"><div class="mk-left"><div class="mk-cats">' + cats + '</div>' +
         '<div class="mk-hold">' + hold + '</div></div>' +
         '<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:.5rem">' + table + '</div>' +
         '<div class="mk-detail">' + det + '</div></div>';
}

/* ---- settings -------------------------------------------------------------
   Only the handset size lives here so far. Everything the NATIVE settings app
   does (view distance, markers, hex colours) is still its own dialog and is
   handed off rather than reimplemented — replacing it would mean porting a lot
   of unrelated state for no gain. */
function openSettings(){
  S.view = "settings"; render();
  if (!S.wall) call("refresh", ["wallpaper"]);
  call("settingsGet", []).then(function(v){ if (v) { S.opts = v; render(); } }).catch(function(){});
  call("deckScaleGet", []).then(function(v){
    if (v) { S.settings = v; S.scalePreview = v.scale; render(); }
  });
}
function applyScale(v){
  call("deckScaleSet", [v]).then(function(r){
    /* The request is clamped to the safezone server-side, so trust the answer
       rather than the slider — asking for more than fits snaps back. */
    if (r && typeof r.scale === "number"){
      if (S.settings) S.settings.scale = r.scale;
      S.scalePreview = r.scale; render();
    }
  });
}

function viewSettings(){
  var st = S.settings;
  if (!st) return '<div class="panel" style="flex:1;display:flex"><div class="empty">READING SETTINGS</div></div>';
  var cur = (typeof S.scalePreview === "number") ? S.scalePreview : st.scale;
  var pct = Math.round(cur * 100);
  var maxPct = Math.round(st.max * 100);

  return '<div class="st"><div class="st-col">' +
    '<div class="st-card">' +
      '<div class="hd"><span class="ttl">HANDSET SIZE</span><span class="val" id="scpct">' + pct + '%</span></div>' +
      '<div class="st-row">' +
        '<button class="step" data-act="scDn">&minus;</button>' +
        '<input id="scrange" type="range" min="100" max="' + maxPct + '" step="5" value="' + pct + '">' +
        '<button class="step" data-act="scUp">+</button>' +
      '</div>' +
      '<div class="st-ticks"><span>100% &middot; SMALLEST</span><span>' + maxPct + '% &middot; FITS SCREEN</span></div>' +
      '<div class="note">Scales the whole handset, chassis and all. 100% is as small as it goes. ' +
      'The ceiling is worked out from your screen and interface size, so it can never grow off the edge. ' +
      'Saved to your profile &mdash; it comes back at this size next time.</div>' +
    '</div>' +
    /* Live-wallpaper controls live here rather than in the picker: they are
       settings that apply to whatever is chosen, not properties of one image. */
    (S.wall ?
    '<div class="st-card">' +
      '<div class="hd"><span class="ttl">WALLPAPER MOTION</span>' +
      '<span class="val" style="font-size:.8rem">' + esc((S.wall.motion || "launcher").toUpperCase()) + '</span></div>' +
      '<div class="st-row">' +
        ["off", "launcher", "on"].map(function(m){
          return '<button class="act' + ((S.wall.motion || "launcher") === m ? " acid" : "") +
                 '" style="flex:1" data-act="wmot" data-id="' + m + '">' + m.toUpperCase() + '</button>';
        }).join("") +
      '</div>' +
      '<div class="note">Frame delivery here is dirty-driven: a still screen costs nothing, ' +
      'a full-bleed animation redraws everything. <b>LAUNCHER</b> runs motion only on the home ' +
      'screen and freezes it the moment an app opens &mdash; a paused wallpaper is exactly as ' +
      'cheap as a static one. <b>ON</b> keeps it running everywhere.</div>' +
    '</div>' +
    '<div class="st-card">' +
      '<div class="hd"><span class="ttl">SCRIM</span>' +
      '<span class="val" style="font-size:.8rem">' + ["OFF","LOW","MED","HIGH"][S.wall.scrim || 0] + '</span></div>' +
      '<div class="st-row">' +
        [0,1,2,3].map(function(n){
          return '<button class="act' + ((S.wall.scrim || 0) === n ? " acid" : "") +
                 '" style="flex:1" data-act="scrim" data-id="' + n + '">' + ["OFF","LOW","MED","HIGH"][n] + '</button>';
        }).join("") +
      '</div>' +
      '<div class="note">Darkens the wallpaper behind the panels. Raise it if a bright ' +
      'wallpaper is fighting the text.</div>' +
    '</div>' : "") +
    /* Everything the native settings panel owned. Slots, ranges and live
       effects are SQF's (AP_fnc_deckSettings / ...Set) -- this only draws
       them, so a new setting appears here by being added there. */
    ((S.opts && S.opts.groups) ? S.opts.groups.map(function(g){
      return '<div class="st-card">' +
        '<div class="hd"><span class="ttl">' + esc(g.name) + '</span></div>' +
        g.rows.map(function(r){
          /* An ACTION row has no value and no slot -- it opens something. SQF owns what that
             means (fn_deckOpen's settingsAction); this only draws the button. */
          if (r.type === "action") {
            return '<div class="st-line"><span class="lb">' + esc(r.label) + '</span>' +
              '<button class="act acid" data-act="optA" data-id="' + esc(r.id) + '">OPEN</button></div>' +
              (r.note ? '<div class="note">' + esc(r.note) + '</div>' : "");
          }
          if (r.type === "toggle") {
            return '<div class="st-line"><span class="lb">' + esc(r.label) + '</span>' +
              '<button class="act' + (r.value ? " acid" : "") + '" data-act="optT" data-id="' +
              esc(r.id) + '">' + (r.value ? "ON" : "OFF") + '</button></div>';
          }
          var isPct = r.type === "pct";
          var lo = isPct ? 1 : r.min, hi = isPct ? 100 : r.max;
          var v  = isPct ? Math.round(r.value * 100) : Math.round(r.value);
          return '<div class="st-line"><span class="lb">' + esc(r.label) + '</span>' +
            '<span class="val" id="ov_' + esc(r.id) + '">' + v + (isPct ? "%" : (r.note || "")) + '</span></div>' +
            '<div class="st-row"><input class="optr" type="range" data-id="' + esc(r.id) +
            '" data-pct="' + (isPct ? 1 : 0) + '" min="' + lo + '" max="' + hi +
            '" step="' + (isPct ? 1 : 100) + '" value="' + v + '"></div>';
        }).join("") +
      '</div>';
    }).join("") : '<div class="st-card"><div class="note">READING SETTINGS&hellip;</div></div>') +
  '</div></div>';
}

/* ---- messages -------------------------------------------------------------
   S.thread is a thread key (a display NAME, because that is what the store is
   keyed by), or "__inbox" for the read-only broadcast pane, or "#<mode>" for a
   one-way channel like the police. Only the first of those can be replied to as
   a conversation; the channels compose but never thread, because fn_sendText
   does not call msgAppend for them. */
function openMsgs(){
  S.view = "msgs"; S.msgQuery = ""; if (S.thread === undefined) S.thread = null;
  render();
  call("refresh", ["msgs"]);
}
function adoptMsgs(v){
  S.msgs = v || null;
  if (S.msgs && S.thread === null && S.msgs.threads.length) S.thread = S.msgs.threads[0].key;
  render();
}
function threadByKey(k){
  if (!S.msgs) return null;
  for (var i = 0; i < S.msgs.threads.length; i++) if (S.msgs.threads[i].key === k) return S.msgs.threads[i];
  return null;
}
/* The store is keyed by name; sending needs a uid. Resolve against the live
   contact list, which is the same set the native dialog builds. */
function uidForName(n){
  if (!S.msgs) return "";
  for (var i = 0; i < S.msgs.contacts.length; i++) if (S.msgs.contacts[i].name === n) return S.msgs.contacts[i].uid;
  /* Not here right now. A uid remembered from when they were is what makes an
     offline text possible — the server queues it and delivers on their next login. */
  var t = threadByKey(n);
  if (t && t.uid) return t.uid;
  for (var i = 0; i < S.msgs.offline.length; i++) if (S.msgs.offline[i].name === n) return S.msgs.offline[i].uid;
  return "";
}
function sendCurrent(){
  var f = el("mcomp"), tx = f ? f.value.trim() : "";
  if (!tx) return;
  if (!S.msgs) return;
  if (S.msgs.jammed > 0){ say("signal jammed for another " + S.msgs.jammed + "s", "bad"); return; }
  var k = S.thread || "";
  if (k.charAt(0) === "#"){
    call("sendMsg", [parseInt(k.slice(1), 10), tx, ""]).then(function(r){ if (r && r.msgs) adoptMsgs(r.msgs); });
  } else {
    var uid = uidForName(k);
    if (!uid){ say("no number stored for " + k, "bad"); return; }
    call("sendMsg", [0, tx, uid]).then(function(r){ if (r && r.msgs) adoptMsgs(r.msgs); });
  }
  f.value = "";
}

function viewMsgs(){
  var m = S.msgs;
  if (!m) return '<div class="panel" style="flex:1;display:flex"><div class="empty">READING THE HANDSET</div></div>';

  var q = (S.msgQuery || "").toLowerCase();
  var rows = "";

  /* Broadcasts are pinned and never filtered out by the contact search — they
     are not a contact. */
  if (m.inbox.length){
    rows += '<button class="mw-thread" data-act="thr" data-id="__inbox"' +
            (S.thread === "__inbox" ? ' aria-current="page"' : '') + '>' +
            '<span class="top"><i class="dot on"></i><span class="nm">BROADCASTS</span>' +
            '<span class="tm">' + m.inbox.length + '</span></span>' +
            '<span class="pv">dispatch, EMT and admin &mdash; read only</span></button>';
  }

  var shown = 0;
  for (var i = 0; i < m.threads.length; i++){
    var t = m.threads[i];
    if (q && t.name.toLowerCase().indexOf(q) === -1) continue;
    shown++;
    rows += '<button class="mw-thread" data-act="thr" data-id="' + esc(t.key) + '"' +
            (S.thread === t.key ? ' aria-current="page"' : '') + '>' +
            '<span class="top"><i class="dot' + (t.online ? " on" : "") + '"></i>' +
            '<span class="nm">' + esc(t.name) + '</span>' +
            (t.unread > 0 ? '<span class="unread">' + t.unread + '</span>' : '') +
            '<span class="tm">' + esc(t.time) + '</span></span>' +
            '<span class="pv">' + esc(t.preview) + '</span></button>';
  }
  rows += '<div class="empty" id="mnone" style="padding:1rem .5rem;display:' + (q && !shown ? "" : "none") +
          '">NO CONTACT MATCHES</div>';

  /* Channels always compose-able, thread or not. */
  for (var i = 0; i < m.channels.length; i++){
    var c = m.channels[i], ck = "#" + c.mode;
    rows += '<button class="mw-thread" data-act="thr" data-id="' + ck + '"' +
            (S.thread === ck ? ' aria-current="page"' : '') + '>' +
            '<span class="top"><i class="dot"></i><span class="nm">' + esc(c.name) + '</span></span>' +
            '<span class="pv">one-way &mdash; no reply thread</span></button>';
  }

  var list = '<div class="mw-search"><span class="gl">&#9906;</span>' +
             '<input id="msearch" type="text" placeholder="search contacts" spellcheck="false" value="' + esc(S.msgQuery || "") + '">' +
             (S.msgQuery ? '<span class="cl" data-act="msgClear">&#10005;</span>' : '') + '</div>' +
             '<div class="mw-threads">' + rows + '</div>';

  /* ---- conversation ---- */
  var conv;
  var k = S.thread;
  if (!k){
    conv = '<div class="mw-body"><div class="empty" style="margin:auto">PICK A CONVERSATION</div></div>';
  } else if (k === "__inbox"){
    var b = "";
    for (var i = 0; i < m.inbox.length; i++){
      b += '<div class="bub cast"><span class="tx">' + esc(m.inbox[i].text) + '</span></div>';
    }
    conv = '<div class="mw-head"><span class="nm">BROADCASTS</span>' +
           '<span class="chip">READ ONLY</span></div>' +
           '<div class="mw-body">' + (b || '<div class="empty" style="margin:auto">NOTHING RECEIVED</div>') + '</div>';
  } else {
    var isCh = k.charAt(0) === "#", t = isCh ? null : threadByKey(k);
    var title = isCh ? (function(){
      for (var i = 0; i < m.channels.length; i++) if ("#" + m.channels[i].mode === k) return m.channels[i].name;
      return k; })() : k;
    var b = "";
    if (t){
      for (var i = 0; i < t.items.length; i++){
        var it = t.items[i];
        b += '<div class="bub ' + (it.dir === 1 ? "me" : "them") + '">' +
             '<span class="tx">' + esc(it.text) + '</span>' +
             '<span class="mt">' + esc(it.t) + (it.dir === 1 ? ' &middot; SENT' : '') + '</span></div>';
      }
    }
    if (!b) b = '<div class="empty" style="margin:auto">' + (isCh ? "ONE-WAY CHANNEL &mdash; NOTHING IS KEPT" : "NO MESSAGES YET") + '</div>';

    var online = t ? t.online : true;
    /* No stored number means no reply is possible: the thread store files by
       display name, and a uid is only learned by talking to someone while they
       are on the server. Say so up front rather than refusing after a sentence
       has been typed. */
    var noNum = !isCh && !online && !uidForName(k);
    var blocked = m.jammed > 0 || (m.arrested && isCh && k === "#1") || noNum;
    var ph = m.jammed > 0 ? ("SIGNAL JAMMED — " + m.jammed + "s")
           : (m.arrested && k === "#1") ? "INMATES CANNOT MESSAGE POLICE"
           : noNum ? "no number stored — catch them online once"
           : (!isCh && !online) ? "offline — they will get it on next login" : "type a message";

    conv = '<div class="mw-head">' +
             '<i class="dot' + (online ? " on" : "") + '" style="width:.4rem;height:.4rem;border-radius:50%;background:' +
               (online ? "var(--acc2)" : "#2f3d36") + '"></i>' +
             '<span class="nm">' + esc(title) + '</span>' +
             '<span class="chip">' + (isCh ? "CHANNEL" : (online ? "ONLINE" : "OFFLINE")) + '</span>' +
           '</div>' +
           '<div class="mw-body" id="mbody">' + b + '</div>' +
           '<div class="mw-comp">' +
             '<input id="mcomp" type="text" maxlength="' + m.maxLen + '" placeholder="' + esc(ph) + '"' +
               (blocked ? " disabled" : "") + ' spellcheck="false">' +
             '<span class="ct" id="mct">0/' + m.maxLen + '</span>' +
             '<button class="act acid" data-act="msgSend"' + (blocked ? " disabled" : "") + '>SEND</button>' +
           '</div>';
  }

  return '<div class="mw"><div class="mw-list">' + list + '</div>' +
         '<div class="mw-conv">' + conv + '</div></div>';
}

/* ---- point-spend trees ----------------------------------------------------
   Six phone apps behind one screen and one category string — the collapse the
   design brief called pattern C, and it is real. What the brief got wrong is
   the shape underneath: nodes are BINARY (there are no ranks anywhere in either
   catalogue, so there is nothing for rank pips to read) and gating is PER NODE,
   because every catalogue row names its own prerequisite id. So the left column
   switches BRANCH — one root plus its descendants — not app, and civ talents
   have 21 of those. fn_deckTree carries the rest of the reasoning, including
   why there is no respec button. */
var TREE_APPS = { "Talents": "standard", "Perks": "gang", "Honor": "bh",
                  "Prestige": "cop", "TT Prestige": "medic", "Infamy": "rebel" };   /* Trauma Team, renamed on main 2026-08-13 */

function openTree(cat){
  S.view = "tree"; S.treeCat = cat;
  S.tree = null; S.branch = null; S.node = null;
  render();
  call("tree", [cat]).then(adoptTree);
}
/* Every mutation hands the whole tree back, so the pool, the caps and the child
   locks never have to be guessed at client-side. */
function adoptTree(v){
  S.tree = (v && v.trees) ? v : null;
  if (S.tree && S.tree.trees.length && !branchById(S.branch)) S.branch = S.tree.trees[0].id;
  render();
}
function branchById(id){
  if (!S.tree) return null;
  for (var i = 0; i < S.tree.trees.length; i++) if (S.tree.trees[i].id === id) return S.tree.trees[i];
  return null;
}
function nodeAnywhere(id){
  if (!S.tree) return null;
  for (var i = 0; i < S.tree.trees.length; i++){
    var b = S.tree.trees[i];
    for (var j = 0; j < b.tiers.length; j++)
      for (var k = 0; k < b.tiers[j].nodes.length; k++)
        if (b.tiers[j].nodes[k].id === id) return b.tiers[j].nodes[k];
  }
  return null;
}

function viewTree(){
  var t = S.tree;
  if (!t) return '<div class="panel" style="flex:1;display:flex"><div class="empty">READING THE TREE</div></div>';
  if (!t.trees.length) return '<div class="panel" style="flex:1;display:flex"><div class="empty">NOTHING IN THIS TREE</div></div>';

  var b   = branchById(S.branch) || t.trees[0];
  var pts = t.economy === "points";

  var sub = pts ? (t.spent + " OF " + t.cap + " SPENT")
                : (t.spent + (t.cap > -1 ? " OF " + t.cap : "") + " LEARNED");
  /* Extra points are buyable past the free cap, on a ladder starting at $1m.
     Two-step because it is irreversible and expensive — the first click arms,
     the second spends, and it disarms itself after four seconds. */
  var buy = "";
  if (t.buyPrice > 0){
    var blab, bok = false;
    if (!t.canBuy)              blab = "CAP COVERS THE TREE";
    else if (t.bank < t.buyPrice) blab = "NEED " + F(t.buyPrice) + " IN BANK";
    else { bok = true; blab = (S.buyArm ? "CONFIRM &mdash; " : "BUY POINT &mdash; ") + F(t.buyPrice); }
    buy = '<button class="act ' + (S.buyArm && bok ? "bad" : "acid") + '" style="width:100%;margin-top:.55rem"' +
          ' data-act="buyPt"' + (bok ? "" : " disabled") + '>' + blab + '</button>';
  }

  var left =
    '<div class="tw-pool"><div class="lbl">' + esc(t.poolLabel) + '</div>' +
    '<div class="num">' + F(t.pool) + '</div>' +
    '<div class="sub">' + esc(sub) + (t.full ? ' &middot; FULL' : '') + '</div>' + buy + '</div>';

  var bs = "";
  for (var i = 0; i < t.trees.length; i++){
    var br = t.trees[i];
    bs += '<button class="tw-branch" data-act="branch" data-id="' + br.id + '"' +
          (br.id === b.id ? ' aria-current="page"' : '') + '>' +
          '<span class="nm">' + esc(br.name) + '</span>' +
          (br.owned ? '<span class="pill">' + br.owned + '/' + br.total + '</span>' : '') + '</button>';
  }
  left += '<div class="tw-branches">' + bs + '</div>';

  /* Locked tiers stay on screen at reduced opacity — the shape of the branch is
     the information, so hiding what you cannot afford yet defeats the screen. */
  var tiers = "";
  for (var i = 0; i < b.tiers.length; i++){
    var ti = b.tiers[i], ns = "", open = false;
    for (var j = 0; j < ti.nodes.length; j++){
      var n = ti.nodes[j];
      if (n.state !== "locked") open = true;
      ns += '<button class="tw-node" data-state="' + esc(n.state) + '" data-act="node" data-id="' + n.id + '"' +
            (n.id === S.node ? ' aria-current="page"' : '') + '>' +
            '<span class="hd"><i class="dot"></i><span class="nm">' + esc(n.name) + '</span>' +
            '<span class="cost">' + (pts ? "1 PT" : F(n.cost)) + '</span></span>' +
            '<span class="eff">' + esc(n.effect) + '</span></button>';
    }
    tiers += '<div class="tw-tier"><div class="tw-gutter"><span class="t">T' + ti.n + '</span>' +
             '<span class="s" style="color:' + (open ? "var(--acc)" : "var(--faint)") + '">' +
             (open ? "OPEN" : "LOCK") + '</span></div>' +
             '<div class="tw-nodes">' + ns + '</div></div>';
  }

  var n = S.node === null || S.node === undefined ? null : nodeAnywhere(S.node);
  var det;
  if (!n){
    det = '<div class="empty" style="margin:auto">PICK A NODE</div>';
  } else {
    var owned  = n.state === "owned";
    var canAct = owned ? (t.canUnlearn && !n.blocked) : n.can;
    /* The button label IS the validation — every refusal reason came from the
       native function's own exitWith list, so there is no second copy to drift. */
    var label;
    if (owned){
      if (!t.canUnlearn)   label = "PERMANENT";
      else if (n.blocked)  label = "UNLEARN ITS CHILD FIRST";
      else                 label = t.unlearnCash > 0 ? "UNLEARN &mdash; " + F(t.unlearnCash) : "UNLEARN";
    } else {
      label = n.can ? "LEARN" : esc(n.why || "UNAVAILABLE");
    }
    var req = n.req > 0 ? nodeAnywhere(n.req) : null;
    det =
      '<div class="dn">' + esc(n.name) + '</div>' +
      '<div class="de">' + esc(n.effect) + '</div>' +
      '<dl><dt>STATE</dt><dd>' + (owned ? "LEARNED" : (n.state === "open" ? "AVAILABLE" : "LOCKED")) + '</dd></dl>' +
      '<dl><dt>COST</dt><dd>' + (pts ? "1 POINT" : F(n.cost) + " " + esc(t.poolLabel)) + '</dd></dl>' +
      (n.req > 0 ? '<dl><dt>REQUIRES</dt><dd>' + esc(req ? req.name : "#" + n.req) + '</dd></dl>' : '') +
      '<button class="act ' + (owned ? "bad" : "acid") + '" style="margin-top:auto;width:100%"' +
      ' data-act="tnode" data-id="' + n.id + '"' + (canAct ? "" : " disabled") + '>' + label + '</button>';
  }

  return '<div class="tw"><div class="tw-left">' + left + '</div>' +
         '<div class="tw-tiers">' + tiers + '</div>' +
         '<div class="tw-detail">' + det + '</div></div>';
}

/* ---- EXCHANGE — master–detail (mock deck-exchange, approved) ---------------
   Browse: category -> product -> listings, buy inline with a qty box.
   MINE: retract. VAULT: virtual goods withdraw (weight-clamped server-side of
   the app); gear and vehicles name the storage terminal instead of pretending.
   The worth strip shows only what the game can actually know -- low ask and
   fetched stock; nothing stores sale history, so no fake "last sale". */
function viewExchange(){
  var x = S.exch;
  if (!x) return viewConnect("MDN CENTRAL NODE");
  if (x.down) return '<div class="vconnect"><div class="in"><div class="t1" style="color:var(--danger)">EXCHANGE OFFLINE</div>' +
    '<div class="t2">STILL INITIALISING — REOPEN IN A MOMENT</div></div></div>';

  var tabs = '<span class="tabs">' +
    '<button class="tab' + (S.exTab === "browse" ? " on" : "") + '" data-act="exTab" data-id="browse">BROWSE</button>' +
    '<button class="tab' + (S.exTab === "mine"   ? " on" : "") + '" data-act="exTab" data-id="mine">MINE ' + x.mine.length + '</button>' +
    '<button class="tab' + (S.exTab === "vault"  ? " on" : "") + '" data-act="exTab" data-id="vault">VAULT ' + x.vault.length + '</button>' +
    '<button class="tab' + (S.exTab === "sell"   ? " on" : "") + '" data-act="exTab" data-id="sell">SELL</button></span>';

  if (S.exTab === "mine"){
    var mrows = "";
    for (var m = 0; m < x.mine.length; m++){
      var mr = x.mine[m];
      mrows += '<div class="lrow"><span class="seller">' + esc(mr.name) + '</span>' +
        '<span class="num">' + mr.qty + '</span><span class="num acid">$ ' + F(mr.price) + '</span>' +
        '<span class="num">' + esc(mr.exp) + '</span>' +
        '<button class="xact" data-act="exRetract" data-id="' + mr.id + '">RETRACT</button></div>';
    }
    if (!mrows) mrows = '<div class="hint">NO ACTIVE LISTINGS — USE THE SELL TAB.</div>';
    return '<div class="vexch"><div class="panel dcol"><div class="panel-hd"><span class="plabel">My Listings</span>' + tabs + '</div>' +
      '<div class="cols"><span>Item</span><span>Qty</span><span>Unit</span><span>Expires</span><span></span></div>' +
      '<div class="scroller">' + mrows + '</div></div></div>';
  }

  if (S.exTab === "vault"){
    var vrows = "";
    for (var vv = 0; vv < x.vault.length; vv++){
      var vr = x.vault[vv];
      var vAct = vr.kind === "virtual"
        ? '<button class="xact" data-act="exTake" data-id="' + vr.id + '">TAKE ALL</button>'
        : '<button class="xact" disabled title="storage terminal">TERMINAL</button>';
      vrows += '<div class="lrow"><span class="seller">' + esc(vr.name) + '</span>' +
        '<span class="num">' + vr.qty + '</span><span class="num">' + esc(vr.kind.toUpperCase()) + '</span>' +
        '<span class="num"></span>' + vAct + '</div>';
    }
    if (!vrows) vrows = '<div class="hint">VAULT EMPTY. PURCHASES AND EXPIRED LISTINGS LAND HERE.</div>';
    return '<div class="vexch"><div class="panel dcol"><div class="panel-hd"><span class="plabel">Vault</span>' + tabs + '</div>' +
      '<div class="cols"><span>Item</span><span>Qty</span><span>Kind</span><span></span><span></span></div>' +
      '<div class="scroller">' + vrows + '</div>' +
      '<div class="hint">GEAR AND VEHICLES COLLECT AT THE EXCHANGE STORAGE TERMINAL.</div></div></div>';
  }

  /* ── SELL (needstest): list from the trunk or a vehicle, one form, one commit.
     The native chain of guiMessages is gone; every bound and fee is enforced
     again SQF-side under the trunk lock at commit. */
  if (S.exTab === "sell"){
    var sl = S.exSell;
    if (!sl) return '<div class="vexch"><div class="panel dcol"><div class="panel-hd"><span class="plabel">Sell</span>' + tabs + '</div>' +
      '<div class="hint" style="padding:2rem">READING YOUR TRUNK…</div></div></div>';
    function sellRows(list, verb, qtyIsFull){
      var h2 = "";
      for (var si = 0; si < list.length; si++){
        var it = list[si];
        h2 += '<div class="lrow" style="grid-template-columns:minmax(0,1fr) minmax(0,3rem) minmax(0,6rem) 6rem">' +
          '<span class="seller">' + esc(it.name) + '</span>' +
          '<span class="num">' + (it.qty !== undefined ? "×" + it.qty : (it.dist !== undefined ? it.dist + "M" : "")) + '</span>' +
          '<span style="display:flex"><input class="qty" style="width:100%" id="exsp' + esc(it.id || it.net) + '"' +
            ' placeholder="$' + F(it.minP) + '–' + F(it.maxP) + '" inputmode="numeric"></span>' +
          '<button class="xact" data-act="' + verb + '" data-id="' + esc(it.id || it.net) + '">' +
            (qtyIsFull ? "LIST ALL" : "LIST") + '</button></div>';
      }
      return h2;
    }
    var body2 = "";
    if (sl.truck){
      body2 += '<div class="hint">TRUNK SOURCE: ' + esc(sl.truck.toUpperCase()) + ' · THE FULL STACK OF AN ITEM LISTS AT ONCE (HOUSE RULE) · FEE 5%</div>';
      body2 += sellRows(sl.virt, "exSellV", true);
      body2 += sellRows(sl.phys, "exSellP", true);
      if (!sl.virt.length && !sl.phys.length) body2 += '<div class="hint">NOTHING WHITELISTED IN THE TRUNK.</div>';
    } else {
      body2 += '<div class="hint">NO IDLE VEHICLE OF YOURS WITHIN 35M — PARK ONE AT THE BROKER TO SELL GOODS.</div>';
    }
    if (sl.vehs.length){
      body2 += '<div class="hint" style="border-top:1px solid var(--line);margin-top:.4rem;padding-top:.6rem">VEHICLE LISTINGS TRANSFER OWNERSHIP. LOOSE CARGO IS DESTROYED ON LISTING.</div>';
      body2 += sellRows(sl.vehs.map(function(vv){ return { net: vv.net, name: vv.name + (vv.cargo ? " ⚠ CARGO" : ""), dist: vv.dist, minP: vv.minP, maxP: vv.maxP }; }), "exSellCar", false);
    }
    return '<div class="vexch"><div class="panel dcol"><div class="panel-hd"><span class="plabel">Sell</span>' +
      '<span class="pmeta">LISTINGS HELD ' + sl.caps[0] + 'V / ' + sl.caps[1] + 'P / ' + sl.caps[2] + 'C OF 20 EACH</span>' + tabs + '</div>' +
      '<div class="scroller">' + body2 + '</div></div></div>';
  }

  /* browse */
  var byCat = {}, listedByClass = {};
  for (var r = 0; r < x.rows.length; r++){
    var row = x.rows[r];
    (listedByClass[row["class"]] = listedByClass[row["class"]] || []).push(row);
  }
  var cats = {}, order = [];
  for (var c = 0; c < x.classes.length; c++){
    var cl = x.classes[c];
    if (!cats[cl.cat]){ cats[cl.cat] = []; order.push(cl.cat); }
    cats[cl.cat].push(cl);
  }
  order.sort();
  if (!S.exCat || !cats[S.exCat]) S.exCat = order[0] || null;

  var chips = "";
  for (var o = 0; o < order.length; o++){
    var live = 0, arr = cats[order[o]];
    for (var a2 = 0; a2 < arr.length; a2++) live += (listedByClass[arr[a2]["class"]] || []).length;
    chips += '<button class="fchip' + (order[o] === S.exCat ? " on" : "") + '" data-act="exCat" data-id="' + esc(order[o]) + '">' +
      esc(order[o]) + '<b>' + live + '</b></button>';
  }

  var prods = "", cur = cats[S.exCat] || [];
  cur.sort(function(a3, b3){ return a3.name < b3.name ? -1 : 1; });
  if (!S.exClass || !cur.some(function(k){ return k["class"] === S.exClass; }))
    S.exClass = cur.length ? cur[0]["class"] : null;
  for (var p2 = 0; p2 < cur.length; p2++){
    var pc = cur[p2], pl = listedByClass[pc["class"]] || [];
    var low = 0;
    for (var l2 = 0; l2 < pl.length; l2++) if (!low || pl[l2].price < low) low = pl[l2].price;
    prods += '<button class="prow"' + (pc["class"] === S.exClass ? ' aria-current="true"' : '') +
      ' data-act="exClass" data-id="' + esc(pc["class"]) + '">' +
      '<span class="pdot' + (pl.length ? " on" : "") + '"></span>' +
      '<span class="nm">' + esc(pc.name) + '</span>' +
      '<span class="ask">' + (pl.length ? "$ " + F(low) : "—") + '</span></button>';
  }

  var sel = null;
  for (var c2 = 0; c2 < x.classes.length; c2++) if (x.classes[c2]["class"] === S.exClass) sel = x.classes[c2];
  var listings = listedByClass[S.exClass] || [];
  listings.sort(function(a4, b4){ return a4.price - b4.price; });
  var lowAsk = listings.length ? listings[0].price : 0;
  var stock = 0;
  for (var t2 = 0; t2 < listings.length; t2++) stock += listings[t2].qty;

  var lrows = "";
  for (var i2 = 0; i2 < listings.length; i2++){
    var L = listings[i2];
    lrows += '<div class="lrow"><span class="seller">' + esc(L.seller) + (L.mine ? ' <b style="color:var(--acc2)">· YOU</b>' : '') + '</span>' +
      '<span class="num">' + L.qty + '</span><span class="num acid">$ ' + F(L.price) + '</span>' +
      '<span class="num">' + esc(L.exp) + '</span>' +
      (L.mine
        ? '<button class="xact" data-act="exRetract" data-id="' + L.id + '">RETRACT</button>'
        : '<span style="display:flex;gap:.3rem;justify-content:flex-end">' +
            (L.kind === "vehicle" ? '' : '<input class="qty" id="exq' + L.id + '" value="1" inputmode="numeric">') +
            '<button class="xact" data-act="exBuy" data-id="' + L.id + '">BUY</button></span>') +
      '</div>';
  }
  if (!lrows) lrows = '<div class="hint">NO FETCHED LISTINGS FOR THIS PRODUCT — CHECK AVAILABILITY PULLS THE FULL BOOK.</div>';

  return '<div class="vexch">' +
    '<div class="panel lcol"><div class="panel-hd"><span class="plabel">Market</span><span class="pmeta">' + x.classes.length + '</span></div>' +
      '<div class="scroller">' + chips + '</div></div>' +
    '<div class="panel pcol"><div class="panel-hd"><span class="plabel">Products</span><span class="pmeta">' + esc(S.exCat || "") + '</span></div>' +
      '<div class="scroller">' + prods + '</div></div>' +
    '<div class="panel dcol"><div class="panel-hd">' +
        '<span class="plabel" style="color:#eef4ee;text-transform:none;font-size:.7rem">' + esc(sel ? sel.name : "—") + '</span>' + tabs + '</div>' +
      '<div class="worth">' +
        '<div class="stat"><label>Low ask</label><b class="acid">' + (lowAsk ? "$ " + F(lowAsk) : "—") + '</b></div>' +
        '<div class="stat"><label>Fetched stock</label><b>' + F(stock) + '</b></div>' +
        '<div class="stat"><label>Listings</label><b class="cyan">' + listings.length + '</b></div>' +
        '<div class="stat"><label>List fee</label><b>' + (sel ? "$ " + F(sel.fee) : "—") + '</b></div>' +
      '</div>' +
      '<div class="cols"><span>Seller</span><span>Qty</span><span>Unit</span><span>Expires</span>' +
        '<span><button class="xact" data-act="exAvail"' + (sel ? ' data-id="' + esc(sel["class"]) + '"' : ' disabled') + '>CHECK AVAIL</button></span></div>' +
      '<div class="scroller">' + lrows + '</div></div>' +
  '</div>';
}

/* ---- FABRICATOR (mock deck-fabricator, approved) ---------------------------
   Row colour = the XP rule, never affordability: green earns, red locked, dim
   outgrown. Print/Schem/Burn tabs; job slots with a snapshot progress bar --
   `remain` is the server's number at push time, not a live clock, so the bar
   fills on refresh rather than pretending to tick. */
function viewFab(){
  var f = S.fab;
  if (!f) return viewConnect("MACHINE LINK");
  if (f.gone) return '<div class="vconnect"><div class="in"><div class="t1" style="color:var(--danger)">NO MACHINE</div>' +
    '<div class="t2">STAND AT A FABRICATOR AND REOPEN</div></div></div>';

  var tabs = '<span style="display:flex;gap:.3rem;margin-left:auto">' +
    '<button class="ftab' + (S.fabTab === "print" ? " on" : "") + '" data-act="fabTab" data-id="print">PRINT</button>' +
    '<button class="ftab' + (S.fabTab === "shop"  ? " on" : "") + '" data-act="fabTab" data-id="shop">SCHEM ' + f.shop.length + '</button>' +
    '<button class="ftab' + (S.fabTab === "burn"  ? " on" : "") + '" data-act="fabTab" data-id="burn">BURN</button></span>';

  var q = (S.fabQ || "").toLowerCase();
  var rows = "", pool, sel = null;

  if (S.fabTab === "shop"){
    pool = f.shop;
    for (var sh = 0; sh < pool.length; sh++){
      var sr = pool[sh];
      if (q && sr.name.toLowerCase().indexOf(q) < 0) continue;
      rows += '<button class="rrow shoprow rar-' + esc(sr.rarity) + '"' + (S.fabSel === sr.key ? ' aria-current="true"' : '') +
        ' data-act="fabSel" data-id="' + esc(sr.key) + '">' +
        '<span class="nm">' + esc(sr.name) + '</span><span class="lv">L' + sr.lvl + '</span>' +
        '<span class="price">' + esc(String(sr.price)) + ' ND</span></button>';
      if (S.fabSel === sr.key) sel = sr;
    }
  } else {
    pool = f.recipes;
    for (var r = 0; r < pool.length; r++){
      var rr = pool[r];
      if (S.fabTab === "burn" && !rr.burnable) continue;
      if (q && rr.name.toLowerCase().indexOf(q) < 0) continue;
      var tone = rr.lvl > f.lv || rr.lvl > f.cap ? "lock" : (rr.lvl >= f.lv - 1 ? "earn" : "past");
      rows += '<button class="rrow ' + tone + '"' + (S.fabSel === rr.key ? ' aria-current="true"' : '') +
        ' data-act="fabSel" data-id="' + esc(rr.key) + '">' +
        '<span class="nm">' + esc(rr.name) + '</span><span class="lv">L' + rr.lvl + '</span></button>';
      if (S.fabSel === rr.key) sel = rr;
    }
  }
  if (!rows) rows = '<div style="font-family:var(--mono);font-size:.56rem;color:var(--faint);padding:.6rem">' +
    (S.fabTab === "burn" ? "NO SCHEMATICS HELD — NOTHING TO BURN." : "NOTHING MATCHES.") + '</div>';

  var detail;
  if (!sel){
    detail = '<div class="scroller" style="justify-content:center;align-items:center">' +
      '<span style="font-family:var(--mono);font-size:.6rem;color:var(--faint)">SELECT A RECIPE</span></div>';
  } else if (S.fabTab === "shop"){
    detail = '<div class="scroller" style="padding-top:.5rem">' +
      '<div class="irow"><span>Unlocks permanently</span><span>' + esc(String(sel.price)) + ' ND</span></div>' +
      '<div class="irow"><span>Your credit</span><span>' + esc(f.nd) + ' ND</span></div></div>' +
      '<div class="commit"><button class="btn-primary" data-act="fabBuy" data-id="' + esc(sel.key) + '">BUY SCHEMATIC</button></div>';
  } else if (S.fabTab === "burn"){
    detail = '<div class="scroller" style="padding-top:.5rem">' +
      '<div class="irow"><span>You will FORGET this schematic</span><span></span></div>' +
      '<div class="irow"><span>The shard rolls a RANDOM one of its tier when used</span><span></span></div></div>' +
      '<div class="commit"><button class="btn-primary" data-act="fabBurn" data-id="' + esc(sel.key) + '">' +
        (S.fabArm === sel.key ? "CONFIRM BURN" : "BURN TO SHARD") + '</button></div>';
  } else {
    var ing = "", afford = true;
    var qn = el("fabqn"), want = qn ? parseInt(qn.value, 10) || 1 : 1;
    for (var p2 = 0; p2 < sel.parts.length; p2++){
      var pt = sel.parts[p2], need = pt[1] * want, ok = pt[2] >= need;
      if (!ok) afford = false;
      ing += '<div class="irow ' + (ok ? "ok" : "short") + '"><span>' + esc(pt[0]) + '</span>' +
        '<span>' + need + ' / ' + pt[2] + '</span></div>';
    }
    var mins = (sel.secs * want / 60).toFixed(1);
    var can = f.free || (afford && sel.lvl <= f.lv && sel.lvl <= f.cap);
    detail = '<div class="scroller" style="padding-top:.5rem">' + ing + '</div>' +
      '<p class="rectot">CONTAINS <b>' + sel.fee + '</b> FILAMENT RECURSIVELY — THAT TOTAL PRICES ITS SCHEMATIC · PRINT TIME <b>' + mins + ' MIN</b>' +
        (f.free ? ' · <b style="color:#7ad19a">FREE BUILD</b>' : '') + '</p>' +
      '<div class="commit"><span class="pmeta" style="margin-left:0">QTY</span>' +
        '<input id="fabqn" value="' + want + '" inputmode="numeric">' +
        '<button class="btn-primary" data-act="fabPrint" data-id="' + esc(sel.key) + '"' + (can ? '' : ' disabled') + '>PRINT</button></div>';
  }

  var jobs = "";
  for (var j = 0; j < f.slots; j++){
    var job = f.jobs[j];
    if (!job){
      jobs += '<div class="jslot" style="opacity:.55;justify-content:center"><span class="tag">Slot ' + (j + 1) + ' · Empty</span></div>';
    } else if (job.ready){
      jobs += '<div class="jslot done"><span class="tag" style="color:var(--acc2)">Slot ' + (j + 1) + ' · Complete</span>' +
        '<span class="nm">' + esc(job.name) + ' ×' + job.qty + '</span>' +
        '<button class="jact" data-act="fabCollect">COLLECT</button></div>';
    } else {
      var mm = Math.floor(job.remain / 60), ss = Math.floor(job.remain % 60);
      jobs += '<div class="jslot"><span class="tag">Slot ' + (j + 1) + ' · Printing</span>' +
        '<span class="nm">' + esc(job.name) + ' ×' + job.qty + '</span>' +
        '<span style="font-family:var(--mono);font-size:.55rem;color:var(--dim)">' + mm + "m " + ss + 's left at push</span></div>';
    }
  }

  return '<div class="vfab">' +
    '<div class="panel lcol"><div class="panel-hd"><span class="plabel">Recipes</span>' + tabs + '</div>' +
      '<div class="fieldrow"><input id="fabq" placeholder="search ' + f.recipes.length + ' recipes…" value="' + esc(S.fabQ || "") + '" autocomplete="off"></div>' +
      '<div class="scroller">' + rows + '</div>' +
      '<div class="legend"><span class="e">EARNS XP</span><span class="l">LOCKED</span><span class="p">OUTGROWN</span></div></div>' +
    '<div class="dcol">' +
      '<div class="panel dpanel"><div class="panel-hd">' +
        '<span class="plabel" style="color:#eef4ee;text-transform:none;font-size:.7rem">' + esc(sel ? sel.name : f.machine) + '</span>' +
        '<span class="pmeta">LV ' + f.lv + ' · ' + f.xp + ' XP · MACHINE TOPS AT L' + f.cap + '</span></div>' + detail + '</div>' +
      '<div class="panel" style="flex:none"><div class="jobs">' + jobs + '</div></div>' +
    '</div></div>';
}

/* ---- GARAGE — master–detail bay (mock deck-garage-a, approved) -------------
   Fleet rail, hero with the vehicle's own config art via wpTex, stat grid,
   commit bar. SELL and TO GANG arm-then-commit; the mod tree stays native this
   wave (its own 135-line screen) -- MODS closes the deck, opens it, and the
   deck reopens after. */
/* ---- MOD BAY — the Mods tab (needstest) ------------------------------------
   Twelve slots in the native shop layout: 0-8 mods, 9 colour, 10 plate,
   11 autopilot. The page sums a PREVIEW; the commit is re-priced SQF-side,
   where already-fitted is free, MOTORIST waives only the autopilot module,
   and the plate runs the charset gate before it costs $2,500. */
function viewGarageMods(sel){
  var md = S.grgMod;
  if (!md || md.id !== sel.id)
    return '<div class="scroller" style="justify-content:center;align-items:center">' +
      '<span style="font-family:var(--mono);font-size:.6rem;color:var(--acc);animation:apPulse 1.2s infinite">READING THE BAY…</span></div>';
  var ch = S.grgModCh, total = 0, g2 = "";
  function slotSel(idx, label, opts, cur, dis){
    var have = (idx in ch) ? ch[idx] : cur, h = "";
    for (var o = 0; o < opts.length; o++){
      var op = opts[o], chg = op.val !== cur;
      if (have === op.val && chg) total += op.cost;
      h += '<option value="' + op.val + '"' + (have === op.val ? " selected" : "") + '>' +
        esc(op.label) + (chg && op.cost ? " — $" + F(op.cost) : "") + '</option>';
    }
    return '<div class="opt"><label>' + esc(label) + '</label>' +
      '<select data-mslot="' + idx + '"' + (dis ? " disabled" : "") + '>' + h + '</select></div>';
  }
  for (var sIdx = 0; sIdx < md.slots.length; sIdx++){
    var sl = md.slots[sIdx];
    var dis = (sl.idx === 11 && !md.canAutopilot) ||
              (sl.idx === 8 && !md.canDoors) ||
              (sl.idx === 6 && !md.canTrunk && false) ||
              ([2, 4].indexOf(sl.idx) >= 0 && !md.canCarOnly) ||
              (sl.idx === 1 && !md.canTrunk);
    g2 += slotSel(sl.idx, sl.name, sl.opts, sl.cur, dis);
  }
  /* horn */
  var hOpts = md.horns.map(function(h2){ return { label: h2.name, val: h2.id, cost: h2.cost }; });
  hOpts.unshift({ label: "Stock Horn", val: 0, cost: 0 });
  g2 += slotSel(3, "Custom Horn", hOpts, md.curHorn, !md.canCarOnly);
  /* skin */
  var kOpts = md.skins.map(function(k2){ return { label: k2.name, val: k2.id, cost: 2500 }; });
  kOpts.unshift({ label: "Current Paint", val: md.curSkin, cost: 0 });
  g2 += slotSel(9, "Paint", kOpts, md.curSkin, !md.canSkin);
  /* plate */
  var pv = (10 in ch) ? ch[10] : md.plate;
  if (pv !== md.plate && pv !== "") total += 2500;
  g2 += '<div class="opt"><label>License plate — $2,500</label>' +
    '<input id="grgplate" maxlength="8" value="' + esc(pv) + '"' + (md.canCarOnly ? "" : " disabled") + '></div>';

  return '<div class="modgrid">' + g2 + '</div>' +
    '<div class="modfoot"><span class="plabel">Preview total</span><span class="modtotal">$ ' + F(total) + '</span>' +
    '<span style="font-family:var(--mono);font-size:.5rem;color:var(--faint)">FINAL PRICE IS RE-COMPUTED ON FIT</span>' +
    '<button class="gact p" style="margin-left:auto" data-act="grgModFit" data-id="' + sel.id + '"' + (total ? "" : " disabled") + '>FIT — $ ' + F(total) + '</button></div>';
}
function viewGarage(){
  var g = S.grg;
  if (!g) return viewConnect("FLEET REGISTRY");
  if (!g.rows.length && !g.out.length)
    return '<div class="vconnect"><div class="in"><div class="t1">EMPTY BAY</div>' +
      '<div class="t2">NOTHING STORED AT THIS GARAGE</div></div></div>';

  var rows = "";
  for (var i = 0; i < g.rows.length; i++){
    var v = g.rows[i];
    if (S.grgSel === null && !v.outNow) S.grgSel = v.id;
    rows += '<button class="vrow' + (v.outNow ? " isout" : "") + '"' + (S.grgSel === v.id ? ' aria-current="true"' : '') +
      ' data-act="grgSel" data-id="' + v.id + '">' +
      '<span class="nm">' + (v.recall ? '<span style="color:var(--acc)">&#9733; </span>' : '') + esc(v.name) + '</span>' +
      '<span class="k">' + (v.outNow ? "OUT" : v.kind) + '</span></button>';
  }
  for (var o = 0; o < g.out.length; o++){
    var w = g.out[o];
    rows += '<div class="vrow isout"><span class="nm">' + esc(w.name) + '</span>' +
      '<span class="k">OUT · ' + w.dist + 'M</span></div>';
  }

  var sel = null;
  for (var j = 0; j < g.rows.length; j++) if (g.rows[j].id === S.grgSel) sel = g.rows[j];
  var detail;
  if (!sel){
    detail = '<div class="scroller" style="justify-content:center;align-items:center">' +
      '<span style="font-family:var(--mono);font-size:.6rem;color:var(--faint)">SELECT A VEHICLE</span></div>';
  } else if (S.grgPane === "mods"){
    detail = viewGarageMods(sel);
  } else {
    var sellTxt = sel.nd ? (sel.sell / 6000).toFixed(4) + " ND" : "$ " + F(sel.sell);
    detail =
      '<div class="hero"><div class="art" data-vtex="' + esc(sel.pic) + '">' + (sel.pic ? "" : "NO ART") + '</div>' +
        '<div><h2>' + esc(sel.name) + '</h2>' +
        '<div class="cls">' + esc(sel.kind) + ' · PLATE ' + esc(sel.plate) + '</div>' +
        '<div class="stats">' +
          '<div><label>Damage</label><b class="' + (sel.dmg > 40 ? "bad" : sel.dmg > 15 ? "warn" : "") + '">' + sel.dmg + '%</b></div>' +
          '<div><label>Fuel</label><b>' + sel.fuel + '%</b></div>' +
          '<div><label>Sell value</label><b class="acid">' + sellTxt + '</b></div>' +
          '<div><label>Repair est.</label><b>$ ' + F(sel.fixCost) + '</b></div>' +
        '</div>' +
        (sel.talent ? '<div class="cls" style="margin-top:.4rem;color:var(--amber)">NEEDS THE ' + esc(sel.talent.toUpperCase()) + ' TALENT</div>' : '') +
        '</div></div>' +
      '<div style="flex:1"></div>' +
      '<div class="footacts">' +
        '<button class="gact p" data-act="grgGet" data-id="' + sel.id + '"' + (sel.outNow || sel.talent ? " disabled" : "") + '>GET VEHICLE</button>' +
        '<button class="gact' + (sel.recall ? " p" : "") + '" data-act="grgStar" data-id="' + sel.id + '">' + (sel.recall ? "&#9733; RECALL VEHICLE" : "&#9734; SET RECALL") + '</button>' +
        '<button class="gact" data-act="grgFix" data-id="' + sel.id + '"' + (sel.outNow ? " disabled" : "") + '>REPAIR — $ ' + F(sel.fixCost) + '</button>' +
        (g.canGang ? '<button class="gact" data-act="grgGang" data-id="' + sel.id + '"' + (sel.outNow ? " disabled" : "") + '>' +
          (S.grgArm === "gang" + sel.id ? "CONFIRM" : "TO GANG") + '</button>' : '') +
        '<button class="gact" data-act="grgMods" data-id="' + sel.id + '"' + (sel.outNow ? " disabled" : "") + '>MOD BAY</button>' +
        '<button class="gact bad' + (S.grgArm === "sell" + sel.id ? " armed" : "") + '" data-act="grgSell" data-id="' + sel.id + '"' + (sel.outNow ? " disabled" : "") + '>' +
          (S.grgArm === "sell" + sel.id ? "CONFIRM SALE" : "SELL — " + sellTxt) + '</button>' +
      '</div>';
  }

  return '<div class="vgrg">' +
    '<div class="panel lcol"><div class="panel-hd"><span class="plabel">Fleet</span>' +
      '<span class="pmeta">' + g.rows.length + ' STORED · ' + g.out.length + ' OUT</span></div>' +
      '<div class="scroller">' + rows + '</div></div>' +
    '<div class="panel dcol">' +
      (sel ? '<div class="panel-hd"><span class="plabel">' + esc(sel.name) + '</span><span class="dtabs">' +
        '<button class="dtab' + (S.grgPane === "info" ? " on" : "") + '" data-act="grgPane" data-id="info">INFO</button>' +
        '<button class="dtab' + (S.grgPane === "mods" ? " on" : "") + '" data-act="grgPane" data-id="mods">MODS</button></span></div>' : '') +
      (detail || "") + '</div></div>';
}

/* ---- TRUNK — queue-and-commit (mock deck-trunk-b, approved) ----------------
   Clicking a row stages a move; the queue strip previews the weight result on
   BOTH sides before anything is sent; one COMMIT walks the batch through the
   parametrized natives in order. A refused move refuses in the game's own
   voice (handleMessage) and the repaint shows what actually moved. */
function viewTrunk(){
  var tk = S.trunk;
  if (!tk) return viewConnect("CARGO MANIFEST");
  if (tk.gone) return '<div class="vconnect"><div class="in"><div class="t1" style="color:var(--danger)">TRUNK CLOSED</div>' +
    '<div class="t2">' + esc((tk.why || "SESSION ENDED").toUpperCase()) + '</div></div></div>';

  /* weight preview including the queue */
  var dT = 0, dP = 0;
  for (var q = 0; q < S.trkQ.length; q++){
    var mv = S.trkQ[q], wsum = mv.w * mv.qty;
    if (mv.dir === "store"){ dT += wsum; dP -= wsum; } else { dT -= wsum; dP += wsum; }
  }
  var tW = tk.tW + dT, pW = tk.pW + dP;

  function rows(list, dir){
    var h = "";
    for (var i = 0; i < list.length; i++){
      var it = list[i];
      var pend = 0;
      for (var q2 = 0; q2 < S.trkQ.length; q2++)
        if (S.trkQ[q2].id === it.id && S.trkQ[q2].dir === dir) pend += S.trkQ[q2].qty;
      var pickKey = dir + it.id;
      h += '<div class="irow" data-act="trkPick" data-id="' + esc(pickKey) + '">' +
        '<span class="nm">' + esc(it.name) + (pend ? ' <b style="color:var(--acc)">−' + pend + '</b>' : '') + '</span>' +
        '<span class="q">×' + it.qty + '</span><span class="w">' + it.w + 'kg</span>' +
        (S.trkPick === pickKey
          ? '<span class="qty-pop"><input id="trkqty" value="' + Math.max(1, it.qty - pend) + '" inputmode="numeric">' +
            '<button class="qchip" data-act="trkAdd" data-id="' + esc(pickKey) + '" data-arg="' + esc(it.id) + '"><b>' +
            (dir === "store" ? "STORE" : "TAKE") + '</b></button></span>'
          : '') +
        '</div>';
    }
    return h || '<div class="qempty" style="padding:.6rem">EMPTY</div>';
  }

  var chips = "";
  for (var c = 0; c < S.trkQ.length; c++){
    var m = S.trkQ[c];
    chips += '<button class="qchip" data-act="trkDrop" data-id="' + c + '" title="remove">' +
      '<span class="d">' + (m.dir === "store" ? "→TRUNK" : "→YOU") + '</span> ' + esc(m.name) + ' <b>×' + m.qty + '</b></button>';
  }

  var overT = tW > tk.tMax, overP = pW > tk.pMax;
  /* houses carry the physical wing too (needstest): gear rows take/store whole
     stacks through the same parametrized natives, flagged non-virtual */
  var physBlock = "";
  if (tk.house && tk.phys){
    var ph = "";
    for (var pi = 0; pi < tk.phys.length; pi++){
      var pit = tk.phys[pi];
      ph += '<div class="irow" data-act="trkPhysTake" data-id="' + esc(pit.id) + '" data-arg="' + pit.qty + '">' +
        '<span class="nm">' + esc(pit.name) + '</span><span class="q">×' + pit.qty + '</span>' +
        '<span class="w" style="width:auto">TAKE ALL</span></div>';
    }
    physBlock = '<div class="panel" style="flex:none;max-height:8rem"><div class="panel-hd">' +
      '<span class="plabel">Physical (gear)</span>' +
      '<span class="pmeta">' + tk.pyW + ' / ' + tk.pyMax + ' · WHOLE STACKS ONLY</span></div>' +
      '<div class="scroller">' + (ph || '<div class="qempty" style="padding:.5rem">NO GEAR STORED — STORE WORN GEAR FROM THE NATIVE FALLBACK FOR NOW</div>') + '</div></div>';
  }
  return '<div class="vtrk">' +
    '<div class="cols2">' +
      '<div class="panel"><div class="panel-hd"><span class="plabel">On You</span>' +
        '<span class="pmeta' + (overP ? " over" : "") + '">' + pW.toFixed(0) + ' / ' + tk.pMax + '</span></div>' +
        '<div class="scroller">' + rows(tk.mine, "store") + '</div></div>' +
      '<div class="panel"><div class="panel-hd"><span class="plabel">' + esc(tk.veh) + '</span>' +
        '<span class="pmeta' + (overT ? " over" : "") + '">' + tW.toFixed(0) + ' / ' + tk.tMax + '</span></div>' +
        '<div class="scroller">' + rows(tk.trunk, "take") + '</div></div>' +
    '</div>' + physBlock +
    '<div class="queue">' + (chips || '<span class="qempty">CLICK AN ITEM TO STAGE A MOVE — NOTHING SENDS UNTIL COMMIT</span>') +
      '<button class="commitbtn" data-act="trkCommit"' + (!S.trkQ.length || overT || overP ? " disabled" : "") + '>' +
      'COMMIT ' + S.trkQ.length + '</button></div>' +
  '</div>';
}

/* ---- VEHICLE SHOP — dealership (mock deck-vshop-a, approved) ---------------
   Class rail -> detail with the vehicle's own art, spec grid, a CONFIGURE
   column (colour + alarm + the 8 buy-time mod slots from the same config the
   garage prices from) and a running TOTAL. The page sums a PREVIEW total for
   display; the committed cost is recomputed SQF-side from the chosen values --
   the page never prices anything. */
function viewVShop(){
  var v = S.vsh;
  if (!v) return viewConnect("DEALER TERMINAL");
  if (v.gone) return '<div class="vconnect"><div class="in"><div class="t1" style="color:var(--danger)">NO DEALER</div>' +
    '<div class="t2">REOPEN AT A VEHICLE SHOP</div></div></div>';

  var rows = "";
  for (var i = 0; i < v.rows.length; i++){
    var r = v.rows[i];
    if (S.vshSel === null) S.vshSel = r["class"];
    rows += '<button class="vrow"' + (S.vshSel === r["class"] ? ' aria-current="true"' : '') +
      ' data-act="vshSel" data-id="' + esc(r["class"]) + '">' +
      '<span class="nm">' + esc(r.name) + '</span>' +
      '<span class="pr">' + (v.nd ? esc(String(r.ndPrice)) + ' ND' : '$ ' + F(r.price)) + '</span></button>';
  }

  var sel = null;
  for (var j = 0; j < v.rows.length; j++) if (v.rows[j]["class"] === S.vshSel) sel = v.rows[j];
  var detail = "";
  if (sel){
    var modTotal = 0, cfgHtml = "";
    /* colour */
    var skins = '<option value="-1">Stock</option>';
    for (var sk = 0; sk < sel.skins.length; sk++)
      skins += '<option value="' + sel.skins[sk].id + '"' + (S.vshSkin === sel.skins[sk].id ? " selected" : "") + '>' +
        esc(sel.skins[sk].name) + '</option>';
    cfgHtml += '<div class="opt"><label>Paint</label><select id="vshskin">' + skins + '</select></div>';
    cfgHtml += '<div class="opt"><label>Alarm (+$500)</label><select id="vshalarm">' +
      '<option value="0">None</option><option value="1"' + (S.vshAlarm ? " selected" : "") + '>Fitted</option></select></div>';
    if (!v.duty){
      for (var m = 0; m < v.mods.length; m++){
        var md = v.mods[m], opts = "";
        var cur = S.vshMods[md.slot] || 0;
        for (var o = 0; o < md.opts.length; o++){
          var op = md.opts[o];
          opts += '<option value="' + op.val + '" data-cost="' + op.cost + '"' + (cur === op.val ? " selected" : "") + '>' +
            esc(op.label) + '</option>';
          if (cur === op.val) modTotal += op.cost;
        }
        if (md.opts.length > 1)
          cfgHtml += '<div class="opt"><label>' + esc(md.name) + '</label>' +
            '<select data-vslot="' + md.slot + '">' + opts + '</select></div>';
      }
    }
    var total = sel.price + (S.vshAlarm ? 500 : 0) + modTotal;
    var priceTxt = v.nd ? esc(String(sel.ndPrice)) + " ND" : "$ " + F(total);
    detail =
      '<div class="hero"><div class="art" data-vtex="' + esc(sel.pic) + '">' + (sel.pic ? "" : "NO ART") + '</div>' +
        '<div><h2>' + esc(sel.name) + '</h2>' +
        '<div class="specs">' +
          '<div><label>Top speed</label><b>' + sel.speed + ' km/h</b></div>' +
          '<div><label>Seats</label><b>' + sel.seats + '</b></div>' +
          '<div><label>Trunk</label><b>' + (sel.trunk >= 1 ? sel.trunk : "—") + '</b></div>' +
          '<div><label>Armor</label><b>' + sel.armor + '</b></div>' +
          '<div><label>Fuel</label><b>' + sel.fuel + ' L</b></div>' +
          '<div><label>Sellback</label><b>$ ' + F(sel.sell) + '</b></div>' +
          '<div><label>Garage fee</label><b>$ ' + F(sel.fee) + '</b></div>' +
          '<div><label>Kind</label><b>' + esc(sel.kind) + '</b></div>' +
        '</div>' +
        (sel.talent ? '<div style="font-family:var(--mono);font-size:.55rem;color:var(--amber);margin-top:.35rem">NEEDS THE ' + esc(sel.talent.toUpperCase()) + ' TALENT</div>' : '') +
        '</div></div>' +
      '<div class="cfg">' + cfgHtml + '</div>' +
      '<div class="foot"><span class="plabel">Total</span><span class="total">' + priceTxt + '</span>' +
        '<button class="buy" data-act="vshBuy" data-id="' + esc(sel["class"]) + '"' +
        (v.disableBuy || sel.talent ? " disabled" : "") + '>PURCHASE</button></div>';
  }

  return '<div class="vvsh">' +
    '<div class="panel lcol"><div class="panel-hd"><span class="plabel">Showroom</span>' +
      '<span class="pmeta">' + v.rows.length + ' MODELS</span></div>' +
      '<div class="scroller">' + rows + '</div></div>' +
    '<div class="panel dcol">' + detail + '</div></div>';
}

/* ---- HOUSE — property dashboard (mock deck-house-a, approved) --------------
   Function cards, no navigation. Instant verbs (lock, lights, rename) act
   in-deck; every flow with a native confirm hands the screen over -- a
   blocking guiMessage under an open browser is a wedged deck. */
function viewHouse(){
  var h = S.hse;
  if (!h) return viewConnect("PROPERTY REGISTRY");

    '<div class="t2">STAND AT A HOUSE YOU CAN OPEN</div></div></div>';

  function run(label, verb, tone, dis){
    return '<button class="hact' + (tone ? " " + tone : "") + '" data-act="hseRun" data-id="' + verb + '"' +
      (dis ? " disabled" : "") + '>' + label + '</button>';
  }
  var own = h.owner;

  /* hero */
  var hero = '<div class="card wide"><div class="chd"><h2>' +
    esc(h.custom || h.name) + '</h2><span class="cmeta">#' + h.id + (own ? " · YOURS" : " · KEYHOLDER") +
    (h.isGangHouse ? " · GANG HOUSE" : "") + '</span></div>' +
    '<div class="kv"><span>Paid-in value</span><b class="acid">$ ' + F(h.value) + '</b></div>' +
    (own ? '<div style="display:flex;gap:.35rem"><input id="hsename" placeholder="rename property" value="' + esc(h.custom || "") + '">' +
      '<button class="hact p" data-act="hseRename">RENAME</button></div>' : '') +
    '</div>';

  /* storage card */
  var stor = '<div class="card"><div class="chd"><span class="clabel">Storage</span></div>' +
    '<div class="kv"><span>Virtual</span><b>' + h.vCap + '</b></div>' +
    '<div class="kv"><span>Physical</span><b>' + h.pCap + '</b></div>' +
    '<div class="rowacts">' + run("OPEN", "storage", "p") +
    (own ? (h.vNext.length ? run("V+ → " + h.vNext[0] + " ($" + F(h.vNext[1]) + ")", "upV") : "") +
           (h.pNext.length ? run("P+ → " + h.pNext[0] + " ($" + F(h.pNext[1]) + ")", "upP") : "") : "") +
    '</div></div>';

  /* utilities */
  var lights = '<option value="-1">Lights…</option>';
  for (var l = 0; l < h.lights.length; l++) lights += '<option value="' + l + '">' + esc(h.lights[l]) + '</option>';
  var util = '<div class="card"><div class="chd"><span class="clabel">Utilities</span>' +
    '<span class="cmeta">' + (h.locked ? "LOCKED" : "OPEN") + '</span></div>' +
    '<div class="rowacts">' +
    '<button class="hact' + (h.locked ? "" : " p") + '" data-act="hseLock"' + (own ? "" : " disabled") + '>' +
      (h.locked ? "UNLOCK DOORS" : "LOCK DOORS") + '</button>' +
    (h.garage ? "" : '<select id="hselight"' + (own ? "" : " disabled") + '>' + lights + '</select>' +
      '<button class="hact" data-act="hseLights"' + (own ? "" : " disabled") + '>' + (h.lightsOn ? "RE-LIGHT" : "LIGHT") + '</button>') +
    '</div></div>';

  /* keys */
  var keys = "";
  for (var k = 0; k < h.keys.length; k++) keys += '<div class="keyrow">' + esc(h.keys[k]) + '</div>';
  var keycard = '<div class="card"><div class="chd"><span class="clabel">Keys</span>' +
    '<span class="cmeta">' + h.keys.length + ' / ' + h.keyCap + '</span></div>' +
    (keys || '<div class="kv"><span>No keys handed out</span></div>') +
    '<div class="rowacts">' + run("MANAGE", "keys", "p", !own) + '</div></div>';

  /* production upgrades */
  var prod = h.garage ? "" :
    '<div class="card"><div class="chd"><span class="clabel">Production</span></div>' +
    '<div class="kv"><span>Aging barrel</span><b class="' + (h.barrel ? "on" : "") + '">' + (h.barrel ? "ACTIVE" : "—") + '</b></div>' +
    '<div class="kv"><span>Greenhouse</span><b class="' + (h.greenhouse ? "on" : "") + '">' + (h.greenhouse ? "ACTIVE" : "—") + '</b></div>' +
    '<div class="kv"><span>Lead container</span><b class="' + (h.lead ? "on" : "") + '">' + (h.lead ? "ACTIVE" : "—") + '</b></div>' +
    '<div class="rowacts">' +
      (!h.barrel ? run("+BARREL", "barrel", "", !own) : "") +
      (!h.greenhouse ? run("+GREENHOUSE", "greenhouse", "", !own) : "") +
      (!h.lead ? run("+LEAD ($350K)", "lead", "", !own) : "") +
      run("FURNITURE / MACHINES", "shop", "p", !own) +
    '</div></div>';

  /* market */
  var mkt = '<div class="card"><div class="chd"><span class="clabel">Market</span>' +
    '<span class="cmeta">' + (h.listed ? "LISTED $ " + F(h.listPrice) : "NOT LISTED") + '</span></div>' +
    '<div class="rowacts">' +
      run(h.listed ? "REMOVE LISTING" : "LIST FOR SALE", "listMkt", "", !own) +
      '<button class="hact bad' + (S.hseArm === "sell" ? "" : "") + '" data-act="hseSell"' + (own ? "" : " disabled") + '>' +
        (S.hseArm === "sell" ? "CONFIRM → BANK" : "SELL TO BANK") + '</button>' +
    '</div></div>';

  /* extras */
  var extras = '<div class="card"><div class="chd"><span class="clabel">Works</span></div><div class="rowacts">' +
    (h.helipadable ? run("ADD HELIPAD", "helipad") : "") +
    (h.makeover ? run("MALDEN MAKEOVER", "makeover") : "") +
    (h.garage ? run("ACCESS GARAGE", "garage", "p") + run("STORE VEHICLE", "storeVeh") : "") +
    (h.gangSet && !h.isGangHouse ? run("SET GANG HOUSE", "setGang") : "") +
    '</div></div>';

  return '<div class="vhse">' + hero + stor + util + keycard + prod + mkt + extras + '</div>';
}

/* ---- MAXSEC INTAKE — the form with a bill (mock deck-intake, approved) -----
   Suspect card, charge picker with counts, the WARRANT as an itemised bill.
   ISSUE TICKET fines the total through the native prompt protocol; BOOK files
   every line through APS_fnc_wantedAdd with the native pacing. */
function viewIntake(){
  var n2 = S.intk;
  if (!n2) return viewConnect("MAXSEC INTAKE");
  var hasSus = n2.suspect && n2.suspect.uid;

  var fineTotal = 0, moTotal = 0, bill = "";
  for (var b = 0; b < S.intkBill.length; b++){
    var L = S.intkBill[b];
    fineTotal += L.fine * L.n; moTotal += L.months * L.n;
    bill += '<div class="wline" data-act="intkDrop" data-id="' + b + '" title="remove">' +
      '<span class="t3">' + esc(L.title) + (L.n > 1 ? " ×" + L.n : "") + '</span>' +
      '<span>$ ' + F(L.fine * L.n) + '</span></div>';
  }
  if (!bill) bill = '<div style="font-family:var(--mono);font-size:.56rem;color:var(--faint);padding:.6rem">CLICK CHARGES TO BUILD THE WARRANT.</div>';

  var q = (S.intkQ || "").toLowerCase(), rows = "";
  for (var c = 0; c < n2.charges.length; c++){
    var ch = n2.charges[c];
    if (q && ch.title.toLowerCase().indexOf(q) < 0) continue;
    rows += '<div class="chrow" data-act="intkAdd" data-id="' + ch.id + '">' +
      '<span class="nm">' + esc(ch.title) + (ch.stack ? ' <b style="color:var(--faint);font-size:.5rem">STACKS</b>' : '') + '</span>' +
      '<span class="fn2">$ ' + F(ch.fine) + '</span><span class="mo">' + ch.months + 'mo</span></div>';
  }

  return '<div class="vint">' +
    '<div class="panel scol">' +
      (hasSus
        ? '<div class="sname">' + esc(n2.suspect.name) + '</div>' +
          '<div class="skv"><span>UID</span><span>' + esc(n2.suspect.uid.slice(-6)) + '</span></div>' +
          '<div class="skv"><span>Distance</span><span>' + n2.suspect.dist + ' m</span></div>' +
          '<div class="skv"><span>Restrained</span><span>' + (n2.suspect.cuffed ? "YES" : "NO") + '</span></div>'
        : '<div class="sname" style="color:var(--danger)">NO SUSPECT</div>' +
          '<div class="skv"><span>Aim at a civilian and reopen</span></div>') +
