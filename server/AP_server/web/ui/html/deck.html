<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NEON AEGEAN OS</title>
<style>
/* ===========================================================================
   Armapunk 2035 phone — GHOSTLINE MK-II / NEON AEGEAN OS
   Four screens in ONE page. Navigation is a view swap, not a page load: a page
   load would drop window.WEBUI and force fn_deckOpen to re-inject bridge.js and
   re-push every channel, which is both slow and visible. One file also keeps
   the sandbox rules trivially satisfiable — no <script src>, no external CSS.

   1rem = frame width / 75 (set in fit(), bottom of this file). Every length
   below is rem, so 1080p through 3440x1440 is the same layout at a different
   size. Nothing here is a fixed pixel except the 1px hairlines.
   =========================================================================== */

:root{
  /* surfaces */
  --scr:    #050a10;   /* screen floor, radial-gradient outer stop */
  --scr2:   #0a121c;   /* header bar, inset wells, scroll track base */
  --panel:  #0c1622;   /* deck panel — cards, rail, list containers */
  --panel2: #0e1a28;   /* row / tile fill, one step up from panel */

  /* accents */
  --acc:    #f5a623;   /* acid — primary, money, active state, focus */
  --acc2:   #54b0ff;   /* cyan — online/live, secondary action */
  --danger: #ff4d4d;   /* fines, kick, drop, negative deltas */
  --amber:  #54b0ff;   /* warnings, promptText callouts */
  --ice:    #5fd3ff;   /* standing / records category */
  --violet: #b57bff;   /* progress category */
  --magenta:#ff3d81;   /* admin category */

  /* text */
  --ink:   #dbe6f2;
  --dim:   #7d8b9e;
  --faint: #3c4a5c;

  --line: rgba(245,166,35,.15);   /* every 1px border on screen */

  --mono: ui-monospace,'JetBrains Mono','SF Mono',Menlo,Consolas,monospace;
  --sans: -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}

/* TAL OS (cop). SQF pushes side on the "phone" channel; the page puts .tal on
   <body>. Same chassis, same geometry — colours only. */
body.tal{
  --scr:#050a10; --scr2:#0a121c; --panel:#0c1622; --panel2:#0e1a28;
  --acc:#f5a623; --acc2:#54b0ff; --danger:#ff4d4d; --amber:#54b0ff;
  --ink:#dbe6f2; --dim:#7d8b9e; --faint:#3c4a5c;
  --line:rgba(245,166,35,.15);
}

html,body{margin:0;padding:0;height:100%;overflow:hidden;background:transparent}
body{color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit}

*::-webkit-scrollbar{width:6px;height:6px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:#22332a;border-radius:3px}
*::-webkit-scrollbar-thumb:hover{background:#3a4f42}

@keyframes apPulse  {0%,100%{opacity:1}50%{opacity:.35}}
@keyframes apDrift  {0%{transform:translateY(-30%)}100%{transform:translateY(130%)}}
@keyframes apScan   {0%{background-position:0 0}100%{background-position:0 3px}}
@keyframes apFlicker{0%,100%{opacity:.46}47%{opacity:.5}52%{opacity:.42}}

.defs{position:absolute;width:0;height:0}
svg{display:block}

/* ---- chassis: SPOOL MK-II (rollable) -------------------------------------
   Replaces the fixed GHOSTLINE slab. The phone pops in as a baton, unrolls off
   a spindle, winds shut on stow. Geometry is kept at the reference's own pixel
   scale (assembly 1034x494) and the whole assembly is scaled to fit the
   control — NOT re-expressed in %, because the bezel must never resize: if it
   did, the layout inside would reflow on every frame of the roll. What you see
   mid-roll is the finished panel being progressively revealed.
   ---------------------------------------------------------------------- */
.spool-fit{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}
.spool-root{
  transform:scale(var(--spool-scale,1));transform-origin:center center;
  --w:976px; --pop:1; --popY:0px; --popS:1; --edge:0; --rail:1; --dur:1150ms;   /* phase 2, live */
}
.spool-root[data-phase="1"]{ --w:0px; --pop:1; --popY:0px;  --popS:1;   --edge:1; --rail:0 }
.spool-root[data-phase="0"]{ --w:0px; --pop:0; --popY:14px; --popS:.72; --edge:1; --rail:0 }

/* the pop is its own element so it composites separately from the roll, and
   its easing is deliberately NOT the roll's — do not unify them */
.spool-pop{
  display:flex;justify-content:center;
  opacity:var(--pop);
  transform:translateY(var(--popY)) scale(var(--popS));
  transition:opacity .3s ease, transform .34s cubic-bezier(.16,1,.3,1);
}
.spool-body{position:relative;display:flex;align-items:stretch;
  filter:drop-shadow(0 26px 42px rgba(0,0,0,.6))}

/* the fixed point the panel unwinds from — never changes size */
.spool{
  position:relative;flex:none;width:58px;border-radius:29px;z-index:4;
  background:linear-gradient(90deg,#0d1211,#404c48 38%,#222b28 62%,#0b0f0e);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:16px 0;
}
.spool-cap{width:22px;height:22px;border-radius:50%;background:#151b19;
  box-shadow:inset 0 0 0 1px #000, inset 0 2px 4px rgba(0,0,0,.8)}
.spool-spindle{width:26px;height:150px;border-radius:13px;box-shadow:inset 0 0 0 1px #000;
  background:repeating-linear-gradient(180deg,#2b3532 0 5px,#161d1b 5px 7px)}
.spool-root[data-phase="1"] .spool-spindle{animation:apSpin .9s linear infinite}
.spool-led{width:5px;height:34px;border-radius:3px;background:var(--acc);
  box-shadow:0 0 7px rgba(245,166,35,.7)}
.spool-root:not([data-phase="2"]) .spool-led{
  background:rgba(245,166,35,.55);animation:apPulse 1.8s ease-in-out infinite}

/* ONLY this animates. No padding on it: a border-box element cannot shrink
   below its own horizontal padding, which would weld a 16px flap to the baton
   at "fully shut". The padding lives on the bezel instead. */
.spool-clip{position:relative;height:494px;overflow:hidden;width:var(--w);
  transition:width var(--dur) cubic-bezier(.22,.9,.24,1)}
.spool-bezel{
  position:relative;width:976px;height:494px;box-sizing:border-box;overflow:hidden;
  padding:11px 12px 11px 4px;border-radius:0 14px 14px 0;
  background:linear-gradient(170deg,#232d2a,#101715 60%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
}
.spool-screen{
  position:relative;width:960px;height:100%;overflow:hidden;
  border-radius:0 8px 8px 0;
  background:radial-gradient(ellipse at 45% 18%,#0c1622,#050a10 74%);
  box-shadow:inset 0 0 0 1px #000;
  display:flex;flex-direction:column;
}
.spool-shade{position:absolute;right:0;top:0;bottom:0;width:22px;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(0,0,0,.8))}
.spool-edge{position:absolute;right:0;top:0;bottom:0;width:2px;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(245,166,35,.55),transparent);
  opacity:var(--edge);transition:opacity .25s ease}
.spool-rail{position:absolute;right:-5px;top:0;bottom:0;width:10px;border-radius:5px;z-index:6;
  background:linear-gradient(90deg,#39443f,#141a18);box-shadow:0 0 0 1px #000;
  opacity:var(--rail);transition:opacity .3s ease}

@keyframes apSpin{0%{background-position:0 0}100%{background-position:0 -14px}}

.scanlines{
  position:absolute;inset:0;z-index:9;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(180deg,transparent 0 2px,rgba(0,0,0,.22) 2px 3px);
  animation:apScan 5.5s linear infinite, apFlicker 6.1s ease-in-out infinite;
}
.glowband{
  position:absolute;left:0;right:0;height:26%;z-index:9;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(245,166,35,.03),transparent);
  animation:apDrift 11s linear infinite;
}

/* ---- header ------------------------------------------------------------ */
.hdr{
  flex:none;position:relative;z-index:3;
  display:flex;align-items:center;gap:1rem;padding:.62rem 1rem;
  background:var(--scr2);border-bottom:1px solid var(--line);
  font-family:var(--mono);
}
.livedot{width:.5rem;height:.5rem;border-radius:50%;flex:none;background:var(--acc);
         box-shadow:0 0 .55rem var(--acc);animation:apPulse 2.4s ease-in-out infinite}
.hdr-os   {color:var(--acc);font-weight:800;font-size:1rem;letter-spacing:.3em;white-space:nowrap}
.hdr-app  {color:var(--acc2);font-size:.72rem;font-weight:600;letter-spacing:.28em;white-space:nowrap}
.hdr-crumb{color:var(--faint);font-size:.68rem;letter-spacing:.26em;white-space:nowrap}
.hdr-right{margin-left:auto;display:flex;align-items:baseline;gap:1.4rem;
           color:#c9d3de;font-size:.78rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.hdr-right b{color:var(--acc);font-weight:600}
.hdr-right .sep{color:var(--faint)}
.batt{display:flex;align-items:center;gap:.4rem}
.batt .cells{display:inline-flex;gap:.12rem}
.batt .cells i{width:.24rem;height:.62rem;border:1px solid rgba(245,166,35,.45);border-radius:.05rem}
.batt .cells i.on{background:var(--acc);border-color:var(--acc)}
.backbtn{border:1px solid var(--line);background:var(--panel2);color:var(--dim);border-radius:.35rem;
         font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;padding:.3rem .55rem;cursor:pointer}
.backbtn:hover{color:var(--acc);border-color:rgba(245,166,35,.5)}

/* ---- body: rail + app pane --------------------------------------------- */
.body{position:relative;z-index:2;flex:1;min-height:0;display:flex;padding:.7rem;gap:.7rem}
.rail{
  flex:none;width:3.3rem;background:var(--panel);border:1px solid var(--line);
  border-radius:.7rem;display:flex;flex-direction:column;align-items:center;
  padding:.55rem 0;gap:.45rem;
}
.rail-btn{
  position:relative;width:2.4rem;height:2.4rem;padding:0;display:grid;place-items:center;cursor:pointer;
  background:var(--panel2);border:1px solid var(--line);border-radius:.55rem;color:var(--dim);
}
.rail-btn:hover{border-color:rgba(245,166,35,.5);color:var(--ink)}
.rail-btn[aria-current="page"]{
  background:rgba(245,166,35,.14);border-color:rgba(245,166,35,.45);color:var(--acc);
}
.rail-btn svg{width:1.2rem;height:1.2rem}
.rail-sep{width:1.4rem;height:1px;background:var(--line);margin:.15rem 0}
.rail-badge{position:absolute;top:-.2rem;right:-.2rem;min-width:.95rem;height:.95rem;border-radius:.5rem;
  background:var(--danger);color:#150402;font-family:var(--mono);font-size:.55rem;font-weight:700;
  display:grid;place-items:center;padding:0 .18rem}
.rail-esc{margin-top:auto;font-family:var(--mono);font-size:.55rem;letter-spacing:.1em;color:var(--faint);
          writing-mode:vertical-rl;transform:rotate(180deg)}
.pane{flex:1;min-width:0;display:flex;flex-direction:column;gap:.7rem}

/* ---- shared panel / row / chip grammar --------------------------------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:.7rem}
.panel-hd{
  flex:none;display:flex;align-items:center;gap:.6rem;
  padding:.6rem .85rem;border-bottom:1px solid var(--line);
}
.label{font-family:var(--mono);font-size:.62rem;letter-spacing:.18em;
       text-transform:uppercase;color:var(--dim)}
.meta {font-family:var(--mono);font-size:.58rem;letter-spacing:.12em;color:var(--faint)}
.livepip{margin-left:auto;font-family:var(--mono);font-size:.58rem;letter-spacing:.12em;color:var(--acc2);
         display:flex;align-items:center;gap:.35rem}
.livepip i{width:.32rem;height:.32rem;border-radius:50%;background:var(--acc2);box-shadow:0 0 .4rem var(--acc2)}

.row{
  flex:none;height:2.9rem;
  display:flex;align-items:center;gap:.7rem;padding:0 .7rem;
  background:var(--panel2);border:1px solid var(--line);border-radius:.55rem;
}
.row:hover{border-color:rgba(245,166,35,.35)}
.row-dot{width:.45rem;height:.45rem;border-radius:50%;flex:none;background:#2f3d36}
.row-dot.on   {background:var(--acc2);box-shadow:0 0 .45rem var(--acc2)}
.row-dot.acid {background:var(--acc);  box-shadow:0 0 .45rem var(--acc)}
.row-name{flex:1;min-width:0;font-size:.8rem;font-weight:550;color:#eaf0f6;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-name.off{color:var(--dim)}
.row-id{font-family:var(--mono);font-size:.74rem;font-weight:600;color:#eaf0f6;width:6rem;
        flex:none;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-ico{width:1.15rem;height:1.15rem;flex:none;color:var(--dim);--ia:var(--acc)}
.chip{font-family:var(--mono);font-size:.55rem;font-weight:700;letter-spacing:.1em;
      padding:.15rem .4rem;border-radius:.28rem;color:var(--dim);
      background:rgba(255,255,255,.045);white-space:nowrap}
.chip.lead{color:var(--acc)} .chip.off2{color:var(--acc2)}
.row-metric{font-family:var(--mono);font-size:.66rem;color:var(--dim);
            text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-acts{display:flex;gap:.3rem;margin-left:auto}

.act{
  border:1px solid var(--line);background:transparent;color:var(--dim);
  border-radius:.35rem;padding:.32rem .5rem;cursor:pointer;
  font-family:var(--mono);font-size:.58rem;letter-spacing:.1em;white-space:nowrap;
}
.act:hover:not(:disabled){color:var(--acc2);border-color:rgba(84,176,255,.5)}
.act.acid:hover:not(:disabled){color:var(--acc);border-color:rgba(245,166,35,.45)}
.act.bad:hover:not(:disabled) {color:var(--danger);border-color:rgba(255,90,60,.45)}
.act.acid{color:var(--acc)} .act.bad{color:var(--danger)}
.act:disabled{color:#34435a!important;border-color:rgba(60,74,92,.35)!important;cursor:not-allowed}

.scroller{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
          padding:.5rem .6rem;display:flex;flex-direction:column;gap:.4rem}
.empty{margin:auto;font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;color:var(--faint);
       text-align:center;padding:1.4rem;line-height:1.7}

.status{flex:none;min-height:1.9rem;display:flex;align-items:center;gap:.75rem;
        padding:.5rem .85rem;border-top:1px solid var(--line);
        font-family:var(--mono);font-size:.62rem;color:var(--faint)}
.status .msg.hot{color:var(--acc)}
.status .msg.bad{color:var(--danger)}
.status .foothint{margin-left:auto;letter-spacing:.1em}

.btn-primary{
  flex:none;height:2.5rem;border-radius:.5rem;cursor:pointer;
  border:1px solid rgba(245,166,35,.45);background:rgba(245,166,35,.18);color:var(--acc);
  font-family:var(--mono);font-size:.68rem;font-weight:700;letter-spacing:.12em;
}
.btn-primary:hover:not(:disabled){background:rgba(245,166,35,.26)}
.btn-primary:disabled{border-color:rgba(60,74,92,.35);background:transparent;
                      color:#34435a;cursor:not-allowed}
.btn-sec{flex:none;height:2.1rem;border:1px solid var(--line);background:var(--panel2);color:var(--ink);
  border-radius:.45rem;font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;cursor:pointer}
.btn-sec:hover{border-color:rgba(245,166,35,.5);color:var(--acc)}
.btn-sec.tall{height:2.5rem;font-size:.7rem;letter-spacing:.14em;border-radius:.55rem}

/* Real text field. This used to be a tap-target that opened the native prompt,
   on the belief that typed text could not reach the DOM in this control. That
   was measured wrong — it reaches it fine, so these are ordinary <input>s and
   webui_fnc_prompt is now only a fallback for a frozen browser. */
.fieldrow{display:flex;gap:.4rem;align-items:stretch}
.fieldrow input{
  flex:1;min-width:0;background:var(--scr2);border:1px solid #22332a;border-radius:.45rem;
  padding:.5rem .6rem;font-family:var(--mono);font-size:.72rem;color:var(--ink);
}
.fieldrow input:focus{border-color:rgba(245,166,35,.55);outline:none}
.fieldrow input::placeholder{color:var(--faint)}
.fieldrow .act{flex:none;padding-left:.7rem;padding-right:.7rem}

.ovl{position:absolute;inset:0;z-index:20;display:grid;place-items:center;
     background:rgba(3,7,6,.72)}
.ovl-box{min-width:16rem;max-width:24rem;background:var(--panel);border:1px solid rgba(245,166,35,.45);
     border-radius:.7rem;padding:.9rem 1rem;display:flex;flex-direction:column;gap:.35rem}
.ovl-box .pick{width:100%}

/* ---- 01 launcher ------------------------------------------------------- */
.favhd{display:flex;align-items:center;gap:.6rem;margin-bottom:.45rem}
.favhd .rule{flex:1;height:1px;background:var(--line)}
.favgrid{display:grid;grid-template-columns:1.9fr 1fr 1fr 1fr 1fr;gap:.6rem}
.tile{
  display:flex;flex-direction:column;gap:.4rem;height:100%;min-height:5.4rem;
  padding:.7rem .75rem;background:var(--panel2);border:1px solid var(--line);
  border-radius:.65rem;cursor:pointer;color:var(--ink);text-align:left;
  transition:transform .14s cubic-bezier(.22,1,.36,1),border-color .14s;
}
.tile:hover{border-color:rgba(245,166,35,.55);transform:translateY(-2px)}
.tile.hero{background:linear-gradient(150deg,rgba(245,166,35,.13),var(--panel2) 65%);
           border-color:rgba(245,166,35,.4)}
.tile-top{display:flex;align-items:flex-start;gap:.5rem}
.tile-top svg{width:1.6rem;height:1.6rem;flex:none}
.tile-name{text-align:left;font-size:.82rem;font-weight:650;color:#eaf0f6;line-height:1.15;letter-spacing:.01em}
.tile-sub{margin-top:auto;font-family:var(--mono);font-size:.6rem;letter-spacing:.06em;color:var(--dim);text-align:left;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cats{flex:1;min-height:0;display:flex;flex-direction:column;gap:.45rem}
.cat{display:flex;align-items:stretch;gap:.6rem;flex:1;min-height:0}
.cat-label{flex:none;width:6rem;display:flex;align-items:center;gap:.4rem}
.cat-label i{width:.32rem;height:.32rem;border-radius:50%;background:var(--ia);flex:none}
.cat-label span{font-family:var(--mono);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.cat-apps{flex:1;min-width:0;display:flex;gap:.5rem;overflow:hidden}
/* 10.3rem is the design width and the cap. It shrinks rather than clipping: the
   rem floor in fit() can make a full row (5 apps + the label cell) wider than the
   frame at 1080p, and a clipped app button is worse than a narrow one. */
.app{
  flex:1 1 10.3rem;max-width:10.3rem;min-width:0;
  display:flex;align-items:center;gap:.5rem;height:100%;min-height:2.5rem;
  padding:0 .55rem;background:var(--panel2);border:1px solid var(--line);border-radius:.55rem;
  cursor:pointer;color:var(--ink);text-align:left;
}
.app:hover{border-color:rgba(245,166,35,.5);background:#12202e}
.app svg{width:1.3rem;height:1.3rem;flex:none}
.app-name{font-size:.74rem;font-weight:550;letter-spacing:.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{margin-left:auto;font-family:var(--mono);font-size:.55rem;font-weight:700;letter-spacing:.06em;
       color:var(--ia);background:rgba(255,255,255,.05);border-radius:.3rem;padding:.1rem .3rem}

/* ---- 02/03 list screens ------------------------------------------------ */
.lcol{flex:none;width:15.5rem;display:flex;flex-direction:column;gap:.6rem;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:.7rem;
      padding:.85rem .9rem;display:flex;flex-direction:column;gap:.55rem}
.card.tight{padding:.75rem .9rem;gap:.5rem}
.card-id{display:flex;align-items:center;gap:.55rem;min-width:0}
.card-id svg{width:1.5rem;height:1.5rem;flex:none;color:var(--ink)}
.card-id .t{font-size:1rem;font-weight:700;color:#eef4ee;letter-spacing:-.01em;
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-id .s{font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;color:var(--faint)}
.hair{height:1px;background:var(--line)}
.kv{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.68rem;color:var(--dim)}
.kv b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.kv b.acid{color:var(--acc);font-weight:600}
.kv b.cyan{color:var(--acc2);font-weight:600}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:.45rem}
.chips{display:flex;gap:.35rem;flex-wrap:wrap}
.fchip{font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;padding:.35rem .6rem;border-radius:.35rem;
       cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--dim)}
.fchip.on{border-color:rgba(245,166,35,.5);background:rgba(245,166,35,.14);color:var(--acc)}
.hint{margin-top:auto;background:var(--panel);border:1px solid var(--line);border-radius:.7rem;
      padding:.7rem .9rem;display:flex;gap:.6rem;align-items:flex-start}
.hint i{color:var(--acc);font-family:var(--mono);font-size:.75rem;font-style:normal}
.hint span{font-family:var(--mono);font-size:.6rem;line-height:1.6;color:var(--dim)}
.listpanel{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:.7rem;
           display:flex;flex-direction:column;overflow:hidden}

/* ---- 04 money ---------------------------------------------------------- */
.mcol{flex:none;width:17rem;display:flex;flex-direction:column;gap:.6rem;min-height:0}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:.7rem;
       padding:.9rem 1rem;display:flex;flex-direction:column;gap:.3rem}
.big{font-size:2.3rem;font-weight:700;letter-spacing:-.02em;color:var(--acc);
     font-variant-numeric:tabular-nums;line-height:1;text-shadow:0 0 1.6rem rgba(245,166,35,.28)}
.big.small{font-size:1.7rem;color:var(--ink);line-height:1.1;text-shadow:none}
.meter{margin-top:.35rem;height:.4rem;border-radius:.2rem;background:#0a121c;overflow:hidden;display:flex}
.meter i{background:var(--acc);border-radius:.2rem}
.split{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.58rem;

.split .liq{color:var(--acc)}
.mcard.nd .nd-v{color:var(--acc2)}   /* cyan: a second currency, not the acid one */
.mcard.nd .nd-v i{font-style:normal;font-size:.42em;letter-spacing:.14em;margin-left:.35rem;
                  color:var(--dim);vertical-align:.28em}
/* ---- STAFF (admin panel as a phone app, owner 2026-08-14) -----------------
   Magenta is the launcher's admin category colour, so the app keeps it as its
   accent rather than importing the fullscreen page's amber -- one palette. Every
   class is .st- prefixed: the deck already owns .card/.row/.chip/.act. */
.st{flex:1;min-height:0;display:flex;gap:.55rem}
.st-col{display:flex;flex-direction:column;min-height:0;gap:.45rem}
.st-roster{flex:0 0 26%}
.st-work{flex:1;min-width:0}
.st-rail{flex:0 0 20%}
.st-pane{background:var(--panel);border:1px solid var(--line);border-radius:.7rem;
         display:flex;flex-direction:column;min-height:0;overflow:hidden}
.st-hd{flex:none;display:flex;align-items:center;gap:.4rem;padding:.45rem .6rem;
       font-family:var(--mono);font-size:.58rem;letter-spacing:.14em;color:var(--faint);
       border-bottom:1px solid var(--line)}
.st-hd b{color:var(--magenta);font-weight:700}
.st-hd .sp{margin-left:auto;color:var(--dim)}
.st-scroll{flex:1;min-height:0;overflow-y:auto;padding:.4rem;display:flex;flex-direction:column;gap:.3rem;
           scrollbar-width:thin;scrollbar-color:rgba(255,61,129,.35) transparent}
.st-scroll::-webkit-scrollbar{width:6px}
.st-scroll::-webkit-scrollbar-thumb{background:rgba(255,61,129,.35);border-radius:3px}
.st-p{display:flex;align-items:center;gap:.45rem;padding:.4rem .5rem;background:var(--panel2);
      border:1px solid transparent;border-radius:.45rem;cursor:pointer;text-align:left;width:100%;
      font-family:var(--sans);color:var(--ink);font-size:.72rem}
.st-p:hover{border-color:rgba(255,61,129,.3)}
.st-p[aria-current]{border-color:var(--magenta);background:rgba(255,61,129,.1)}
.st-p .dot{width:6px;height:6px;border-radius:50%;flex:none;background:var(--acc2)}
.st-p.cop .dot{background:var(--ice)} .st-p.med .dot{background:var(--ok,#7ad06d)}
.st-p.dead .dot{background:var(--faint)}
.st-p .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-p.dead .n{color:var(--dim);text-decoration:line-through}
.st-p .tag{font-family:var(--mono);font-size:.5rem;letter-spacing:.1em;color:var(--dim)}
.st-p .tag.cuff{color:var(--danger)}
.st-tabs{flex:none;display:flex;gap:.25rem;padding:.35rem .4rem;border-bottom:1px solid var(--line);flex-wrap:wrap}
.st-tab{font-family:var(--mono);font-size:.55rem;letter-spacing:.12em;padding:.28rem .5rem;border-radius:.35rem;
        background:var(--panel2);border:1px solid transparent;color:var(--dim);cursor:pointer}
.st-tab[aria-current]{border-color:var(--magenta);color:var(--magenta)}
.st-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.6rem,1fr));gap:.3rem}
.st-b{font-family:var(--mono);font-size:.56rem;letter-spacing:.09em;padding:.42rem .3rem;border-radius:.4rem;
      background:var(--panel2);border:1px solid var(--line);color:var(--ink);cursor:pointer;text-align:center}
.st-b:hover:not(:disabled){border-color:var(--magenta)}
.st-b:disabled{opacity:.4;cursor:not-allowed}
.st-b.bad{background:rgba(255,90,60,.14);border-color:rgba(255,90,60,.3);color:#ffb3a3}
.st-b.go{background:rgba(245,166,35,.14);border-color:rgba(245,166,35,.35);color:var(--acc)}
.st-b.armed{background:var(--danger);color:#1a0b08;border-color:var(--danger)}
.st-b.lock{opacity:.45;cursor:not-allowed;border-style:dashed}
.st-b.lock:after{content:attr(data-lvl);display:block;font-size:.44rem;color:var(--amber);letter-spacing:.1em}
.st-sec{font-family:var(--mono);font-size:.5rem;letter-spacing:.16em;color:var(--faint);
        margin:.35rem .1rem .1rem;grid-column:1/-1}
.st-f{display:flex;gap:.3rem;align-items:center;grid-column:1/-1}
.st-f input{flex:1;min-width:0;background:var(--scr2);border:1px solid var(--faint);border-radius:.35rem;
            color:var(--ink);font-family:var(--mono);font-size:.6rem;padding:.3rem .4rem;outline:none}
.st-f input:focus{border-color:var(--magenta)}
.st-pill{display:flex;align-items:center;gap:.4rem;padding:.36rem .5rem;border-radius:.4rem;
         background:var(--panel2);border:1px solid var(--line);font-family:var(--mono);
         font-size:.56rem;letter-spacing:.1em;color:var(--dim);cursor:pointer}
.st-pill i{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none;font-style:normal}
.st-pill.on{color:var(--acc);border-color:rgba(245,166,35,.35)}
.st-pill.on i{background:var(--acc);box-shadow:0 0 6px var(--acc)}
.st-pill .sp{margin-left:auto;color:var(--faint);font-size:.5rem}
.st-dos{font-family:var(--mono);font-size:.56rem;color:var(--dim);display:flex;flex-direction:column;gap:.18rem}
.st-dos b{color:var(--ink);font-weight:400}
.st-cat{display:flex;flex-direction:column;gap:.25rem}
.st-cg{font-family:var(--mono);font-size:.52rem;letter-spacing:.12em;color:var(--magenta);
       padding:.25rem .3rem;background:var(--panel2);border-radius:.3rem;cursor:pointer}
.st-ci{font-family:var(--sans);font-size:.66rem;color:var(--ink);padding:.28rem .45rem;border-radius:.3rem;
       background:var(--panel2);border:1px solid transparent;cursor:pointer;text-align:left;width:100%;
       overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-ci[aria-current]{border-color:var(--acc);color:var(--acc)}
.finebox{flex:1;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:.7rem;
         padding:.75rem .9rem;display:flex;flex-direction:column;gap:.5rem;overflow:hidden}
/* The charge sheet is as long as the player has been busy -- a felon can carry a
   dozen counts, and the box is a fixed slice of the column. The HEADER and the
   settle-in-person line stay put; only the rows move. */
.fine-scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:.4rem;
             scrollbar-width:thin;scrollbar-color:rgba(255,90,60,.35) transparent}
.fine-scroll::-webkit-scrollbar{width:6px}
.fine-scroll::-webkit-scrollbar-thumb{background:rgba(255,90,60,.35);border-radius:3px}
.fine{display:flex;align-items:center;gap:.6rem;padding:.45rem .55rem;background:var(--panel2);
      border:1px solid rgba(255,90,60,.25);border-radius:.5rem}
.fine .r{font-size:.72rem;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fine .b{font-family:var(--mono);font-size:.56rem;color:var(--faint);letter-spacing:.08em}
.fine .a{font-family:var(--mono);font-size:.72rem;color:var(--danger);font-variant-numeric:tabular-nums}
.paybtn{border:1px solid rgba(255,90,60,.4);background:rgba(255,90,60,.14);color:var(--danger);
        border-radius:.35rem;font-family:var(--mono);font-size:.58rem;font-weight:700;letter-spacing:.1em;
        padding:.32rem .5rem;cursor:pointer}
.paybtn:hover{background:rgba(255,90,60,.24)}
.xfer{flex:none;width:19rem;background:var(--panel);border:1px solid var(--line);border-radius:.7rem;
      display:flex;flex-direction:column;overflow:hidden}
.picks{flex:none;padding:.6rem .7rem;display:flex;flex-direction:column;gap:.35rem;border-bottom:1px solid var(--line)}
.pick{display:flex;align-items:center;gap:.55rem;padding:.45rem .6rem;border-radius:.45rem;cursor:pointer;
      color:var(--ink);text-align:left;border:1px solid var(--line);background:var(--panel2)}
.pick.on{border-color:rgba(245,166,35,.5);background:rgba(245,166,35,.1)}
.pick i{width:.4rem;height:.4rem;border-radius:50%;flex:none;background:var(--faint)}
.pick.on i{background:var(--acc)}
.pick .n{flex:1;text-align:left;font-size:.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .d{font-family:var(--mono);font-size:.62rem;color:var(--dim)}
.xbody{flex:1;min-height:0;display:flex;flex-direction:column;padding:.6rem .7rem;gap:.5rem}
.amount{display:flex;align-items:baseline;justify-content:space-between;background:var(--scr2);
        border:1px solid var(--line);border-radius:.5rem;padding:.45rem .7rem;user-select:none}
.amount .k{font-family:var(--mono);font-size:.58rem;letter-spacing:.14em;color:var(--faint)}
.amount .v{font-family:var(--mono);font-size:1.35rem;font-weight:700;color:var(--acc);
           font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:.35rem;flex:1;min-height:0}
.padkey{border:1px solid var(--line);border-radius:.45rem;background:transparent;color:var(--acc2);
        font-family:var(--mono);font-size:.62rem;font-weight:600;cursor:pointer;letter-spacing:.04em}
.padkey.num{background:var(--panel2);color:var(--ink);font-size:.95rem}
.padkey.zeros{background:var(--panel2);color:var(--ink)}
.padkey.clr{color:var(--danger)}
.padkey:hover{border-color:rgba(245,166,35,.5)}
.ledrow{display:flex;align-items:center;gap:.65rem;flex:none;height:2.35rem;padding:0 .65rem;
        background:var(--panel2);border:1px solid var(--line);border-radius:.5rem}
.ledrow .t{font-family:var(--mono);font-size:.6rem;color:var(--faint);width:2.6rem;
           font-variant-numeric:tabular-nums;flex:none}
.ledrow .l{flex:1;min-width:0;font-size:.74rem;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ledrow .g{font-family:var(--mono);font-size:.52rem;font-weight:700;letter-spacing:.1em;padding:.12rem .35rem;
           border-radius:.25rem;color:var(--dim);background:rgba(255,255,255,.045)}
.ledrow .d{font-family:var(--mono);font-size:.72rem;font-variant-numeric:tabular-nums;width:5.2rem;
           text-align:right;flex:none}
.ledrow .d.up{color:var(--acc)} .ledrow .d.dn{color:var(--danger)}
/* ---- ICEBREAKER OS / TAL OS (pattern G) -----------------------------------
   The designer's deck-icebreaker-os.html, scoped under .qh so its generic class
   names (.body .card .hdr .kv .rail .status .tile .fchip) cannot collide with
   the ones this page already uses on every other screen.

   Their standalone page chrome is dropped -- #stage/#frame/#screen plus their own
   header, rail and status strip all duplicate what the chassis already provides.
   Kept is everything unique to the terminal: the scope card, the target list, the
   ring, the tools, the cards and the upload channel strip.

   Their :root is dropped too; the tokens are identical to ours. Only the handful
   they add is carried over. */
:root{
  --sel:rgba(245,166,35,.5);
  --glow:rgba(245,166,35,.55);
  --accw:rgba(245,166,35,.16);
  --acc2w:rgba(84,176,255,.16);
  --warn:#54b0ff;
}
.qh{display:flex;flex-direction:column;flex:1;min-height:0}
.qh .g{flex:none}
.qh .g use{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.qh .g use.w{stroke-width:3.4;opacity:.2}
.qh .hdr{flex:none;display:flex;align-items:center;gap:.8rem;padding:.5rem 1rem;background:var(--scr2);border-bottom:1px solid var(--line)}
.qh .led{width:.5rem;height:.5rem;border-radius:50%;background:var(--acc);box-shadow:0 0 .55rem var(--glow);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.qh .body{flex:1;min-height:0;display:flex}
.qh .rail{flex:none;width:3rem;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:.4rem;padding:.55rem 0}
.qh .rail button{width:2.2rem;height:2.2rem;border-radius:.45rem;display:grid;place-items:center;color:var(--faint)}
.qh .rail button:hover{color:var(--dim)}
.qh .rail button.on{color:var(--acc);background:var(--accw);box-shadow:inset 2px 0 0 var(--acc)}
.qh .left{flex:none;width:15.5rem;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.qh .scope{flex:none;margin:.5rem .5rem 0;padding:.55rem .65rem;background:var(--panel);border:1px solid var(--line);border-radius:.55rem;display:flex;flex-direction:column;gap:.3rem}
.qh .scope .nm{font-size:.95rem;font-weight:700;color:#eef4ee;letter-spacing:.02em}
.qh .kv{display:flex;justify-content:space-between;font-size:.58rem;color:var(--dim)}
.qh .kv b{color:var(--ink);font-weight:600}
.qh .filter{flex:none;display:flex;align-items:center;gap:.4rem;margin:.45rem .5rem 0;padding:.38rem .55rem;background:var(--scr2);border:1px solid var(--line);border-radius:.45rem;border-left:2px solid var(--acc2)}
.qh .filter input{flex:1;min-width:0;font-size:.66rem}
.qh .tlist{flex:1;min-height:0;overflow-y:auto;margin:.4rem .5rem;display:flex;flex-direction:column;gap:.28rem}
.qh .trow{display:flex;align-items:center;gap:.45rem;min-height:2.5rem;flex:none;padding:.25rem .5rem;background:var(--panel2);border:1px solid var(--line);border-radius:.5rem;text-align:left}
.qh .trow.on{background:rgba(255,61,129,.14);border-color:rgba(255,61,129,.55)}
.qh .trow .d{width:.4rem;height:.4rem;border-radius:50%;flex:none}
.qh .trow .nm{font-size:.7rem;font-weight:600;color:#eaf0f6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qh .trow .sub{font-size:.5rem;letter-spacing:.06em;color:var(--faint);display:flex;gap:.3rem;align-items:center;white-space:nowrap}
.qh .trow .dist{margin-left:auto;font-size:.62rem;color:var(--dim);font-variant-numeric:tabular-nums}
.qh .tfoot{flex:none;display:flex;gap:.8rem;padding:.35rem .8rem .5rem;font-size:.54rem;letter-spacing:.12em;color:var(--faint)}
.qh .fchip{font-size:.46rem;font-weight:700;letter-spacing:.08em;padding:.08rem .28rem;border-radius:.22rem;background:rgba(255,255,255,.05)}
.qh .main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;padding:.5rem .6rem;gap:.45rem}
.qh .ring{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem}
.qh .tile{position:relative;overflow:hidden;height:6.9rem;padding:.5rem .55rem;background:var(--panel);border:1px solid var(--line);border-radius:.55rem;display:flex;flex-direction:column;gap:.22rem;text-align:left}
.qh .tile:hover{border-color:var(--sel)}
.qh .tile .hd{display:flex;align-items:center;gap:.4rem}
.qh .tile .nm{flex:1;min-width:0;font-size:.72rem;font-weight:700;color:#eaf0f6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qh .tile .slot{font-size:.46rem;font-weight:700;letter-spacing:.1em;color:var(--faint);background:rgba(255,255,255,.05);padding:.1rem .3rem;border-radius:.22rem}
.qh .tile .bl{font-size:.54rem;line-height:1.45;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qh .tile .st{margin-top:auto;font-size:.54rem;letter-spacing:.06em;color:var(--faint);font-variant-numeric:tabular-nums}
.qh .tile .state{font-size:.58rem;font-weight:700;letter-spacing:.1em;font-variant-numeric:tabular-nums}
.qh .tile .sweep{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--acc2w);border-right:1px solid var(--acc2);pointer-events:none;transition:width .12s linear}
.qh .tile.up{border-color:var(--acc2)}
.qh .tile.dis{opacity:.62;cursor:not-allowed}
.qh .tools{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem}
.qh .tool{display:flex;align-items:center;gap:.45rem;height:3.1rem;padding:0 .55rem;background:var(--panel2);border:1px solid var(--line);border-radius:.5rem;text-align:left}
.qh .tool:hover{border-color:var(--sel)}
.qh .tool .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:.1rem}
.qh .tool .nm{font-size:.62rem;font-weight:700;color:#eaf0f6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qh .tool .st{font-size:.48rem;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.qh .tool .state{font-size:.5rem;font-weight:700;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.qh .cards{flex:1;min-height:0;display:grid;gap:.45rem}
.qh .card{min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:.55rem;display:flex;flex-direction:column;overflow:hidden}
.qh .card .ch{flex:none;display:flex;align-items:center;gap:.4rem;padding:.35rem .6rem;border-bottom:1px solid var(--line);font-size:.52rem;letter-spacing:.16em;color:var(--dim)}
.qh .card .cb{flex:1;min-height:0;overflow-y:auto;padding:.4rem .6rem;display:flex;flex-direction:column;gap:.3rem}
.qh .strip{flex:none;display:flex;align-items:center;gap:.6rem;height:2.25rem;padding:0 1rem;border-top:1px solid var(--line);background:var(--scr2)}
.qh .bar{flex:1;height:.4rem;border-radius:.2rem;background:#0a121c;overflow:hidden;border:1px solid rgba(255,255,255,.05)}
.qh .bar span{display:block;height:100%;width:0;background:var(--acc2);transition:width .12s linear}
.qh .trace{display:none;align-items:center;gap:.35rem;font-size:.56rem;font-weight:700;letter-spacing:.08em;color:var(--danger);border:1px solid rgba(255,90,60,.5);background:rgba(255,90,60,.12);padding:.22rem .5rem;border-radius:.35rem;animation:pulse 1.1s ease-in-out infinite}
.qh .status{flex:none;display:flex;align-items:center;height:1.7rem;padding:0 1rem;border-top:1px solid var(--line);font-size:.56rem;letter-spacing:.06em;color:var(--faint)}

/* ---- generic list (pattern A) ---------------------------------------------
   Wanted, Gangs Online, Licences, Captures, Group, Achievements, Titles and
   Quests are one screen with a kind string. Same row grammar as the gang roster
   and the keychain: state dot, label, chip, right-aligned figure. Read only —
   the actions that would change any of this live in their own native dialogs. */
.ls{display:flex;flex-direction:column;flex:1;min-height:0;gap:.5rem}
/* Form controls above a list — create a squad, set a password. Kept generic so
   any list app can grow one without a new screen. */
.ls-tools{flex:none;display:flex;flex-direction:column;gap:.35rem}
.ls-tool{display:flex;gap:.4rem;align-items:stretch}
.ls-tool input{flex:1;min-width:0;background:var(--scr2);border:1px solid var(--line);
  border-radius:.45rem;padding:.45rem .55rem;font-family:var(--mono);font-size:.7rem;color:var(--ink)}
.ls-tool input:focus{border-color:rgba(245,166,35,.55);outline:none}
.ls-tool input::placeholder{color:var(--faint)}
.ls-tool .act{flex:none;padding-left:.8rem;padding-right:.8rem}
.ls-bar{flex:none;display:flex;align-items:center;gap:.5rem;background:var(--scr2);
  border:1px solid var(--line);border-radius:.5rem;padding:.35rem .55rem}
.ls-bar input{flex:1;min-width:0;background:none;border:none;outline:none;
  font-family:var(--mono);font-size:.66rem;color:var(--ink)}
.ls-bar input::placeholder{color:var(--faint)}
.ls-bar .ct{font-family:var(--mono);font-size:.55rem;color:var(--faint)}
.ls-wrap{flex:1;min-height:0;overflow-y:auto;background:var(--panel);
  border:1px solid var(--line);border-radius:.7rem;padding:.35rem}
.ls-row{display:flex;align-items:center;gap:.5rem;min-height:2.9rem;padding:.35rem .55rem;
  border-bottom:1px solid rgba(245,166,35,.07)}
.ls-row:last-child{border-bottom:none}
.ls-dot{width:.42rem;height:.42rem;border-radius:50%;flex:none;background:#2f3d36}
.ls-dot.on{background:var(--acc)} .ls-dot.live{background:var(--acc2)} .ls-dot.bad{background:var(--danger)}
.ls-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:.1rem}
.ls-nm{font-family:var(--sans);font-size:.76rem;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ls-sub{font-family:var(--sans);font-size:.58rem;color:var(--faint);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ls-meta{flex:none;font-family:var(--mono);font-size:.64rem;color:var(--acc);
  font-variant-numeric:tabular-nums}

/* ---- inventory ------------------------------------------------------------
   Pattern E again: tiles plus a detail column. Crate keys and scalps sit in
   their own read-only group because they are not virtual items — they have no
   id and cannot be dropped, used or given. */
.iv{display:flex;gap:.55rem;flex:1;min-height:0}
.iv-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:.5rem;min-height:0}
.iv-wt{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:.7rem;padding:.5rem .7rem;
  display:flex;align-items:center;gap:.6rem;font-family:var(--mono);font-size:.6rem;color:var(--dim)}
.iv-bar{flex:1;height:.35rem;border-radius:.2rem;background:#1a2432;overflow:hidden}
.iv-bar i{display:block;height:100%;background:var(--acc);transition:width .2s}
.iv-bar.hot i{background:var(--danger)}
.iv-grid{flex:1;min-height:0;overflow-y:auto;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(7.5rem,1fr));gap:.45rem;align-content:start;padding-right:.2rem}
.iv-tile{position:relative;display:flex;flex-direction:column;gap:.2rem;text-align:left;cursor:pointer;
  background:var(--panel);border:1px solid var(--line);border-radius:.55rem;padding:.5rem .55rem;
  transition:border-color .14s}
.iv-tile:hover{border-color:rgba(245,166,35,.4)}
.iv-tile[aria-current="page"]{border-color:rgba(245,166,35,.55);background:var(--panel2)}
.iv-tile .n{font-family:var(--sans);font-size:.7rem;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iv-tile .w{font-family:var(--mono);font-size:.52rem;color:var(--faint)}
.iv-tile .q{position:absolute;top:.35rem;right:.4rem;font-family:var(--mono);font-size:.55rem;
  padding:.05rem .28rem;border-radius:.28rem;background:rgba(245,166,35,.16);color:var(--acc)}
.iv-side{width:13.5rem;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:.7rem;
  padding:.75rem;display:flex;flex-direction:column;gap:.5rem;overflow-y:auto}
.iv-qty{display:flex;align-items:center;gap:.4rem}
.iv-qty .st{flex:none;width:1.7rem;height:1.7rem;border-radius:.35rem;cursor:pointer;
  background:var(--panel2);border:1px solid var(--line);color:var(--ink);font-family:var(--mono);font-size:.75rem}
.iv-qty .st:hover{border-color:rgba(245,166,35,.5);color:var(--acc)}
.iv-qty .v{flex:1;text-align:center;font-family:var(--mono);font-size:1.1rem;color:var(--acc);
  font-variant-numeric:tabular-nums}
.iv-acts{display:flex;gap:.35rem}
.iv-acts .act{flex:1}
.iv-odd{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:.7rem;padding:.5rem .6rem;
  display:flex;flex-wrap:wrap;gap:.35rem}
.iv-odd .o{font-family:var(--mono);font-size:.55rem;color:var(--dim);
  background:var(--panel2);border:1px solid var(--line);border-radius:.3rem;padding:.15rem .35rem}

/* ---- live wallpaper (Matrix Rain, live_10) --------------------------------
   Lifted from the designer's wallpaper-matrix.html. A LAYER, not a page: it
   mounts inside #wall, under the scrim, the scanlines and the panels.

   The pause rule is the load-bearing part. Frame delivery here is dirty-driven —
   a static screen costs nothing, but a full-bleed animation marks the whole
   surface dirty every frame. `.paused` freezes every stream via
   animation-play-state, which costs nothing, and the default motion mode only
   lets it run on the launcher. */
#wp{position:absolute;inset:0;overflow:hidden}
#wp span{position:absolute;top:0;font-family:var(--mono);
  line-height:1.05;white-space:pre;text-align:center;will-change:transform}
#wpglow{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 32%,rgba(10,40,18,.5),transparent 76%)}
@keyframes fall{from{transform:translateY(-50%)}to{transform:translateY(0)}}
@keyframes mut{0%,49.9%{opacity:1}50%,100%{opacity:0}}
body.paused #wp span{animation-play-state:paused!important}
/* Between wallpaper and chrome. A live wallpaper is bright and full-bleed; the
   panels have to stay readable over it. */
#scrim{position:absolute;inset:0;z-index:0;pointer-events:none;background:transparent}
#scrim.s1{background:rgba(5,11,9,.18)}
#scrim.s2{background:rgba(5,11,9,.34)}
#scrim.s3{background:rgba(5,11,9,.52)}
.wp-live-tile{background:#000;position:relative;overflow:hidden}
.wp-group{font-family:var(--mono);font-size:.55rem;letter-spacing:.14em;color:var(--faint);
  grid-column:1/-1;padding:.1rem 0 .05rem}

/* ---- wallpaper -----------------------------------------------------------
   The deck had no wallpaper at all until now: the native phone painted one onto
   its own control 90300 and the browser control knew nothing about it. It sits
   BEHIND the screen's own gradient at low opacity — a full-brightness image
   under this much mono text is unreadable, and legibility wins. */
#wall{position:absolute;inset:0;z-index:0;pointer-events:none;background-size:cover;
  background-position:center;opacity:.22;filter:saturate(.7)}
.spool-screen > .hdr, .spool-screen > .body{position:relative;z-index:1}
.wp{display:flex;gap:.55rem;flex:1;min-height:0}
.wp-grid{flex:1;min-width:0;display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;
  align-content:start;overflow-y:auto;padding-right:.2rem}
.wp-tile{position:relative;aspect-ratio:16/9;border-radius:.55rem;overflow:hidden;cursor:pointer;
  background:var(--panel2);border:1px solid var(--line);padding:0;transition:border-color .14s}
.wp-tile:hover{border-color:rgba(245,166,35,.45)}
.wp-tile[aria-current="page"]{border-color:rgba(245,166,35,.6)}
.wp-tile .img{position:absolute;inset:0;background-size:cover;background-position:center}
.wp-tile .cap{position:absolute;left:0;right:0;bottom:0;padding:.3rem .4rem;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.85));
  font-family:var(--mono);font-size:.52rem;letter-spacing:.08em;color:var(--ink);text-align:left}
.wp-tile .live{position:absolute;top:.3rem;left:.3rem;font-family:var(--mono);font-size:.48rem;
  letter-spacing:.1em;padding:.1rem .28rem;border-radius:.25rem;
  background:rgba(84,176,255,.18);color:var(--acc2)}
.wp-tile .on{position:absolute;top:.3rem;right:.3rem;width:1rem;height:1rem;border-radius:50%;
  background:var(--acc);color:#0b0f0e;font-size:.6rem;display:flex;align-items:center;justify-content:center}
.wp-side{width:13rem;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:.7rem;
  padding:.75rem;display:flex;flex-direction:column;gap:.5rem}
.wp-prev{aspect-ratio:16/9;border-radius:.5rem;overflow:hidden;background:var(--panel2);
  border:1px solid var(--line);background-size:cover;background-position:center}

/* ---- market --------------------------------------------------------------
   Reports prices; it does not trade. The right column is detail, not a till.
   The premium column is a POSITION IN A BAND (0.6-1.3), not a 24h change --
   there is no price history in the game to draw a change or a spark from. */
.mk{display:flex;gap:.55rem;flex:1;min-height:0}
.mk-left{width:10.5rem;flex:none;display:flex;flex-direction:column;gap:.5rem;min-height:0}
.mk-cats{background:var(--panel);border:1px solid var(--line);border-radius:.7rem;padding:.35rem;
  display:flex;flex-direction:column;gap:.2rem;overflow-y:auto;flex:none;max-height:14rem}
.mk-cat{width:100%;text-align:left;cursor:pointer;background:transparent;border:1px solid transparent;
  border-radius:.45rem;padding:.32rem .45rem;font-family:var(--mono);font-size:.62rem;color:var(--dim);
  display:flex;gap:.4rem;transition:border-color .14s,color .14s}
.mk-cat:hover{border-color:rgba(245,166,35,.3);color:var(--ink)}
.mk-cat[aria-current="page"]{border-color:rgba(245,166,35,.55);color:var(--ink);background:var(--panel2)}
.mk-cat .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mk-cat .c{color:var(--faint)}
.mk-hold{flex:1;min-height:0;overflow-y:auto;background:var(--panel);border:1px solid var(--line);
  border-radius:.7rem;padding:.5rem .55rem;display:flex;flex-direction:column;gap:.3rem}
.mk-hold .hr{display:flex;gap:.4rem;font-family:var(--mono);font-size:.6rem;color:var(--ink)}
.mk-hold .hr .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim)}
.mk-hold .hr .v{color:var(--acc);font-variant-numeric:tabular-nums}
.mk-table{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--panel);
  border:1px solid var(--line);border-radius:.7rem;overflow:hidden}
.mk-head,.mk-row{display:flex;align-items:center;gap:.5rem;padding:0 .7rem}
.mk-head{flex:none;height:2rem;border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:.55rem;letter-spacing:.12em;color:var(--faint)}
.mk-rows{flex:1;min-height:0;overflow-y:auto}
.mk-row{height:2.9rem;border-bottom:1px solid rgba(245,166,35,.07);cursor:pointer;width:100%;
  background:transparent;border-left:none;border-right:none;border-top:none;text-align:left;
  transition:background .14s}
.mk-row:hover{background:var(--panel2)}
.mk-row[aria-current="page"]{background:var(--panel2);box-shadow:inset 2px 0 0 var(--acc)}
.mk-nm{flex:1;min-width:0;font-family:var(--sans);font-size:.74rem;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mk-c{flex:none;font-family:var(--mono);font-size:.66rem;text-align:right;font-variant-numeric:tabular-nums}
.mk-buy{width:5.2rem;color:var(--dim)}
.mk-sell{width:5.2rem;color:var(--acc)}
.mk-prem{width:5.4rem}
.mk-prem.up{color:var(--acc2)} .mk-prem.dn{color:var(--danger)} .mk-prem.flat{color:var(--faint)}
.mk-detail{width:14rem;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:.7rem;
  padding:.75rem;display:flex;flex-direction:column;gap:.5rem;overflow-y:auto}
.mk-detail .dn{font-family:var(--sans);font-size:1.05rem;font-weight:700;color:#eaf0f6}
.mk-detail .big{font-family:var(--mono);font-size:1.7rem;font-weight:700;color:var(--acc);
  font-variant-numeric:tabular-nums;line-height:1.1}
.mk-band{height:.4rem;border-radius:.2rem;background:linear-gradient(90deg,#3a1a16,#1a2432 50%,#16304a);
  position:relative}
.mk-band i{position:absolute;top:-.18rem;width:.24rem;height:.76rem;border-radius:.12rem;background:var(--ink);
  box-shadow:0 0 .4rem rgba(220,239,224,.6)}
.mk-band-lbl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.5rem;color:var(--faint)}
.mk-bust{flex:none;display:flex;align-items:center;gap:.5rem;background:rgba(255,58,30,.12);
  border:1px solid rgba(255,58,30,.4);border-radius:.5rem;padding:.4rem .6rem;
  font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;color:var(--danger)}

/* ---- settings ------------------------------------------------------------ */
.st{display:flex;gap:.55rem;flex:1;min-height:0}
.st-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:.55rem;overflow-y:auto}
.st-card{background:var(--panel);border:1px solid var(--line);border-radius:.7rem;padding:.8rem .85rem;
  display:flex;flex-direction:column;gap:.5rem}
.st-card .hd{display:flex;align-items:baseline;gap:.5rem}
.st-card .ttl{font-family:var(--mono);font-size:.6rem;letter-spacing:.16em;color:var(--dim);flex:1}
.st-card .val{font-family:var(--mono);font-size:1.35rem;font-weight:700;color:var(--acc);
  font-variant-numeric:tabular-nums}
.st-card .note{font-family:var(--sans);font-size:.6rem;line-height:1.6;color:var(--faint)}
.st-row{display:flex;align-items:center;gap:.5rem}
.st-row input[type=range]{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:.35rem;
  border-radius:.2rem;background:#1a2432;outline:none}
.st-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
  width:.95rem;height:.95rem;border-radius:50%;background:var(--acc);cursor:pointer;
  box-shadow:0 0 .5rem rgba(245,166,35,.5)}
.st-row .step{flex:none;width:1.9rem;height:1.9rem;border-radius:.35rem;cursor:pointer;
  background:var(--panel2);border:1px solid var(--line);color:var(--ink);
  font-family:var(--mono);font-size:.8rem;line-height:1}
.st-row .step:hover{border-color:rgba(245,166,35,.5);color:var(--acc)}
.st-ticks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.52rem;color:var(--faint)}
/* one setting per line: label left, state right, slider under it when it has one */
.st-line{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.28rem 0}
.st-line .lb{font-size:.62rem;color:var(--ink);letter-spacing:.04em}
.st-line .val{font-size:.62rem;color:var(--acc);font-variant-numeric:tabular-nums}
.st-line .act{padding:.16rem .55rem;font-size:.55rem;min-width:3.2rem}
input.optr{width:100%}

/* ---- messages ------------------------------------------------------------
   Two stores behind one screen: AP_msgThreads holds real two-way DM threads
   (keyed by display name, not uid), and AP_messages is a flat one-way inbox
   of dispatch and admin broadcasts that cannot be replied to. They are drawn
   differently on purpose — the broadcast pane has no composer. */
.mw{display:flex;gap:.55rem;flex:1;min-height:0}
.mw-list{width:14rem;flex:none;display:flex;flex-direction:column;gap:.4rem;min-height:0}
.mw-search{display:flex;align-items:center;gap:.4rem;background:var(--scr2);
  border:1px solid var(--line);border-radius:.45rem;padding:.35rem .5rem;flex:none}
.mw-search input{flex:1;min-width:0;background:none;border:none;outline:none;
  font-family:var(--mono);font-size:.68rem;color:var(--ink)}
.mw-search input::placeholder{color:var(--faint)}
.mw-search .gl,.mw-search .cl{font-family:var(--mono);font-size:.7rem;color:var(--faint);cursor:pointer}
.mw-threads{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:.3rem;
  background:var(--panel);border:1px solid var(--line);border-radius:.7rem;padding:.4rem}
.mw-thread{display:flex;flex-direction:column;gap:.15rem;width:100%;text-align:left;cursor:pointer;
  background:transparent;border:1px solid transparent;border-radius:.55rem;padding:.4rem .45rem;
  transition:border-color .14s}
.mw-thread:hover{border-color:rgba(245,166,35,.3)}
.mw-thread[aria-current="page"]{border-color:rgba(245,166,35,.55);background:var(--panel2)}
.mw-thread .top{display:flex;align-items:center;gap:.35rem}
.mw-thread .dot{width:.38rem;height:.38rem;border-radius:50%;background:#2f3d36;flex:none}
.mw-thread .dot.on{background:var(--acc2)}
.mw-thread .nm{flex:1;font-family:var(--sans);font-size:.72rem;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mw-thread .tm{font-family:var(--mono);font-size:.55rem;color:var(--faint)}
.mw-thread .unread{font-family:var(--mono);font-size:.52rem;min-width:.9rem;height:.9rem;border-radius:.45rem;
  display:inline-flex;align-items:center;justify-content:center;padding:0 .2rem;
  background:var(--danger);color:#0b0f0e;font-weight:700}
.mw-thread .pv{font-family:var(--sans);font-size:.58rem;color:var(--faint);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mw-conv{flex:1;min-width:0;display:flex;flex-direction:column;gap:.45rem}
.mw-head{flex:none;display:flex;align-items:center;gap:.45rem;background:var(--panel);
  border:1px solid var(--line);border-radius:.7rem;padding:.5rem .65rem}
.mw-head .nm{flex:1;font-family:var(--sans);font-size:.82rem;color:#eaf0f6}
.mw-body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:.4rem;
  background:var(--panel);border:1px solid var(--line);border-radius:.7rem;padding:.6rem}
.bub{max-width:72%;display:flex;flex-direction:column;gap:.15rem}
.bub .tx{font-family:var(--sans);font-size:.7rem;line-height:1.5;padding:.45rem .6rem;border-radius:.55rem;
  word-break:break-word}
.bub .mt{font-family:var(--mono);font-size:.52rem;color:var(--faint)}
.bub.them{align-self:flex-start}
.bub.them .tx{background:var(--panel2);border:1px solid var(--line);color:var(--ink)}
.bub.me{align-self:flex-end;align-items:flex-end}
.bub.me .tx{background:rgba(245,166,35,.14);border:1px solid rgba(245,166,35,.3);color:var(--ink)}
.bub.cast{max-width:100%;align-self:stretch}
.bub.cast .tx{background:var(--scr2);border:1px solid var(--line);color:var(--dim);font-family:var(--mono);font-size:.64rem}
.mw-comp{flex:none;display:flex;align-items:center;gap:.4rem;background:var(--scr2);
  border:1px solid var(--line);border-radius:.55rem;padding:.4rem .5rem}
.mw-comp input{flex:1;min-width:0;background:none;border:none;outline:none;
  font-family:var(--sans);font-size:.72rem;color:var(--ink)}
.mw-comp input::placeholder{color:var(--faint)}
.mw-comp .ct{font-family:var(--mono);font-size:.55rem;color:var(--faint);font-variant-numeric:tabular-nums}

/* ---- point-spend trees (Talents / Perks / Honor / Prestige / NG / Infamy) ----
   One screen, six categories. The left column switches BRANCH, not app: every
   catalogue row names its own prerequisite, so a "tree" is one root plus its
   descendants and a civ has 21 of them. Nodes are binary — there are no ranks
   anywhere in either catalogue, so there is nothing to draw pips from. */
.tw{display:flex;gap:.55rem;flex:1;min-height:0}
.tw-left{width:12.5rem;flex:none;display:flex;flex-direction:column;gap:.55rem;min-height:0}
.tw-pool{background:var(--panel);border:1px solid var(--line);border-radius:.7rem;padding:.7rem .75rem}
.tw-pool .lbl{font-family:var(--mono);font-size:.6rem;letter-spacing:.16em;color:var(--dim)}
.tw-pool .num{font-family:var(--mono);font-size:2.3rem;font-weight:700;line-height:1.05;color:var(--acc);
  text-shadow:0 0 1.6rem rgba(245,166,35,.28);font-variant-numeric:tabular-nums}
.tw-pool .sub{font-family:var(--mono);font-size:.62rem;color:var(--faint);margin-top:.2rem}
.tw-branches{background:var(--panel);border:1px solid var(--line);border-radius:.7rem;padding:.4rem;
  overflow-y:auto;flex:1;min-height:0}
.tw-branch{display:flex;align-items:center;gap:.45rem;width:100%;text-align:left;cursor:pointer;
  background:transparent;border:1px solid transparent;border-radius:.55rem;padding:.4rem .45rem;
  font-family:var(--sans);font-size:.72rem;color:var(--dim);transition:border-color .14s,color .14s}
.tw-branch:hover{border-color:rgba(245,166,35,.3);color:var(--ink)}
.tw-branch[aria-current="page"]{border-color:rgba(245,166,35,.55);color:var(--ink);background:var(--panel2)}
.tw-branch .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tw-branch .pill{font-family:var(--mono);font-size:.55rem;padding:.1rem .3rem;border-radius:.28rem;
  background:rgba(245,166,35,.16);color:var(--acc)}
.tw-tiers{flex:1;min-width:0;display:flex;flex-direction:column;gap:.45rem;overflow-y:auto;padding-right:.2rem}
.tw-tier{display:flex;gap:.5rem;flex:none;min-height:5.1rem}
.tw-gutter{width:2.6rem;flex:none;font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;
  display:flex;flex-direction:column;align-items:flex-start;gap:.15rem;padding-top:.55rem}
.tw-gutter .t{color:var(--dim)}
.tw-gutter .s{font-size:.52rem}
.tw-nodes{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:.4rem;align-content:start}
.tw-node{display:flex;flex-direction:column;gap:.35rem;padding:.55rem .6rem;cursor:pointer;text-align:left;
  background:var(--panel);border:1px solid var(--line);border-radius:.55rem;transition:border-color .14s}
.tw-node:hover{border-color:rgba(245,166,35,.4)}
.tw-node[data-state="owned"]{border-color:rgba(245,166,35,.3)}
.tw-node[data-state="locked"]{opacity:.55;cursor:not-allowed}
.tw-node[aria-current="page"]{border-color:rgba(245,166,35,.55);background:var(--panel2)}
.tw-node .hd{display:flex;align-items:center;gap:.35rem}
.tw-node .dot{width:.4rem;height:.4rem;border-radius:50%;background:#2f3d36;flex:none}
.tw-node[data-state="owned"] .dot{background:var(--acc)}
.tw-node[data-state="open"]  .dot{background:var(--acc2)}
.tw-node .nm{flex:1;font-family:var(--sans);font-size:.74rem;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tw-node .cost{font-family:var(--mono);font-size:.58rem;color:var(--dim);font-variant-numeric:tabular-nums}
.tw-node .eff{font-family:var(--sans);font-size:.58rem;line-height:1.6;color:var(--faint);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tw-detail{width:14rem;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:.7rem;
  padding:.75rem;display:flex;flex-direction:column;gap:.5rem;overflow-y:auto}
.tw-detail .dn{font-family:var(--sans);font-size:1.1rem;font-weight:700;color:#eaf0f6;line-height:1.2}
.tw-detail .de{font-family:var(--sans);font-size:.66rem;line-height:1.6;color:var(--dim)}
.tw-detail dl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.6rem;
  border-top:1px solid var(--line);padding-top:.35rem;margin:0}
.tw-detail dt{color:var(--faint);letter-spacing:.1em}
.tw-detail dd{margin:0;color:var(--ink);font-variant-numeric:tabular-nums}

/* ══ CTX APPS — the deck-app wave (UI overhaul 2026-08-26) ══════════════════
   World interactables render as deck views. Shared: the CONNECTING panel every
   ctx app shows until its first payload push lands. Per-app rules are scoped
   under the view root class so 21 app vocabularies cannot collide. */
.vconnect{position:relative;flex:1;min-height:0;display:grid;place-items:center}
.vconnect .in{display:flex;flex-direction:column;align-items:center;gap:.9rem;font-family:var(--mono)}
.vconnect .t1{color:var(--acc);font-weight:800;font-size:1rem;letter-spacing:.34em;animation:apPulse 1.2s ease-in-out infinite}
.vconnect .t2{color:var(--dim);font-size:.62rem;letter-spacing:.26em}
/* ── BANK — the card ── */
.vbank{flex:1;min-height:0;display:grid;place-items:center;padding:.7rem}
.vbank .card{width:26rem;max-width:94%;background:linear-gradient(150deg,rgba(245,166,35,.1),var(--panel) 55%);
