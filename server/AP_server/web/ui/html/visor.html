<!doctype html>
<!-- VISOR — QUICKHACK PLATE STACK (design 2a). Self-contained, game-ready:
     inline CSS/JS, no libs, no network, no storage. AP stub behind a guard.
     Replaces the vr_dock magnifying dock (idd 941300 / fn_qhDockFill.sqf) with
     a stacked plate launcher; visor overlay, HUD strip, reticle, gaze-lock
     card and LMB/RMB semantics carry over unchanged.

     THE DESIGN: chamfered plates stagger down the LEFT side — BREACH SPLICE
     pinned on top (mint frame), six loadout hacks below, breach tools +
     firewall in a footer rail. Each plate: name, READY/RUN chip, stat line,
     RAM cost + tone pip, framed glyph. Hover arms (glow + slide), LMB fires
     at the gaze target, RMB bails. ICE (civ) and TAL (cop) palettes; the SQF
     pushes side. In game the backdrop is the world; this file ships a dim
     placeholder. DEMO ONLY: press T to flip ICE/TAL.

     CONTRACT (page defines it; SQF matches; target model same as the dock:
     AP_cdTarget = cursorObject at open)
       AP.on("visor", { side,                      // "civ" | "cop"
                        cash, trace, deckPct,      // HUD strip
                        lock: null | { name, kind, dist, status, los, inRange },
                        items: [{ id, name, tone, kind, cost, stat }],
                          // kind = cast | breach | fw ; tone = acc | util | danger
                          // order is the loadout; unlock rides on top as the breach plate
                        running: [ids], fw: "1/2" })
         — pushed on open + any loadout/lock/trace change; rendered verbatim
       AP.call("qhFire", [id])    // -> { ok } — routes to qhCast / breach fns game-side
       AP.call("fwEdit",  [])     // -> opens the ring-loadout firewall editor
       AP.call("visorClose", [])  // page asks; the display owns the keybind in game

     WHAT ANIMATES: hover transitions + the armed-plate glow (CSS only). No rAF,
     no timers. -->

<script>
/* ---- BRIDGE SHIM (installed by tools/install_shop_pages.py) ---------------
   AP defined synchronously so the page's dev stub never installs; on()/call()
   queue until webui.js lands. AP.texture goes straight to A3API -- no bridge
   round-trip, cached by the page. */
(function () {
  var subs = {}, queued = [], W = null;
  window.WEBUIReady = new Promise(function (r) { window.__webuiReady = r; });
  window.__apSubs = subs;
  window.AP = {
    __shim: true,
    on: function (n, f) { (subs[n] = subs[n] || []).push(f); if (W) W.on(n, f); },
    call: function (n, a) {
      if (W) return W.call(n, a || [], 20000);
      return new Promise(function (res, rej) { queued.push([n, a || [], res, rej]); });
    },
    texture: function (p, s) {
      if (typeof A3API === "undefined" || !A3API.RequestTexture) return Promise.reject(new Error("no A3API"));
      return A3API.RequestTexture(p, s).then(function (durl) {
        return new Promise(function (res) {
          var im = new Image();
          im.onload = function () {
            try {
              var cv = document.createElement("canvas");
              cv.width = im.width; cv.height = im.height;
              var g = cv.getContext("2d");
              g.drawImage(im, 0, 0);
              var d = g.getImageData(0, 0, cv.width, cv.height).data;
              var x0 = cv.width, y0 = cv.height, x1 = 0, y1 = 0;
              for (var y = 0; y < cv.height; y++) for (var x = 0; x < cv.width; x++) {
                if (d[(y * cv.width + x) * 4 + 3] > 10) {
                  if (x < x0) x0 = x; if (x > x1) x1 = x;
                  if (y < y0) y0 = y; if (y > y1) y1 = y;
                }
              }
              if (x1 <= x0 || y1 <= y0) return res(durl);
              var pad = 2, w = x1 - x0 + 1 + pad * 2, h = y1 - y0 + 1 + pad * 2;
              var out = document.createElement("canvas"); out.width = w; out.height = h;
              out.getContext("2d").drawImage(cv, x0 - pad, y0 - pad, w, h, 0, 0, w, h);
              res(out.toDataURL("image/png"));
            } catch (e) { res(durl); }
          };
          im.onerror = function () { res(durl); };
          im.src = durl;
        });
      });
    },
    handle: function (n, f) { if (W) W.handle(n, f); }
  };
  window.WEBUIReady.then(function (w) {
    W = w;
    Object.keys(subs).forEach(function (n) { subs[n].forEach(function (f) { W.on(n, f); }); });
    queued.forEach(function (q) { W.call(q[0], q[1], 20000).then(q[2], q[3]); });
    queued = [];
    W.call("log", ["visor page up"]);   // instant readiness drain
  });
  if (typeof A3API !== "undefined" && A3API.RequestFile) {
  window.__webuiBootPath = "stub";
    A3API.RequestFile("webui\\ui\\webui.js")
      .then(function (s) { try { (0, eval)(s); } catch (e) { window.__apBootErr = "eval: " + e; } })
      .catch(function (e) { window.__apBootErr = "RequestFile: " + e; });
  } else { window.__apBootErr = "no A3API on this page"; }
})();
</script>

if (typeof AP === "undefined") {

const $ = id => document.getElementById(id);

function glyph(id) { return ["ping","distract","static","whiteout","leech","synapse","unlock","house","atm","cuffs","fw","person"].includes(id) ? "vq-" + id : "vq-static"; }

    const run = D.running.includes(o.id);
    h += '<div class="plate' + (run ? " run" : "") + '" data-id="' + o.id + '" data-kind="' + o.kind + '" style="left:' +
      LEFTS[i] + "rem;top:" + y.toFixed(2) + "rem;width:" + w + "rem;height:" + hgt + "rem;--tone:" + TONE[o.tone] +
      ";--frame:" + (breach ? "var(--util)" : "var(--acc)") + '">' +
      '<div class="in"></div><div class="row">' +
      '<div><div class="nm">' + esc(o.name).toUpperCase() + '</div>' +
      '<div class="sub"><span class="chip">' + (run ? "RUN" : "READY") + '</span><span class="stat">' + esc(o.stat) + "</span></div></div>" +
      '<div class="right"><span class="cost">&#8595; ' + o.cost + '</span><span class="pip"></span>' +
      '<span class="tile"><svg viewBox="0 0 24 24"><use href="#' + glyph(o.id) + '"/></svg></span></div>' +
      "</div></div>";
    y += hgt + 0.55;
  });
  $("stack").innerHTML = h;
  $("rail").style.top = "calc(4.2rem + " + y.toFixed(2) + "rem + .4rem)";
  let r = '<span class="k">BREACH</span>';
  D.items.filter(x => x.kind === "breach" && x.id !== "unlock").forEach(o => {
    r += '<div class="mini" data-id="' + o.id + '" data-kind="breach" title="' + esc(o.name) + '"><svg viewBox="0 0 24 24"><use href="#' + glyph(o.id) + '"/></svg></div>';
  });
  r += '<div class="mini fw" data-id="fw" data-kind="fw"><svg viewBox="0 0 24 24"><use href="#vq-fw"/></svg><span>FIREWALL ' + esc(D.fw) + "</span></div>";
  $("rail").innerHTML = r;
}
AP.on("visor", d => { D = d; render(); });

document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-id]");
  if (!el) return;
  if (el.dataset.kind === "fw") AP.call("fwEdit", []);
  else AP.call("qhFire", [el.dataset.id]);
});
document.addEventListener("contextmenu", ev => { ev.preventDefault(); AP.call("visorClose", []); });
document.addEventListener("keydown", ev => { if (ev.key === "Escape") AP.call("visorClose", []); });

/* Target box feed. One channel, one element; hidden the moment SQF says the
   lock is gone, the target died, it left the screen, or line of sight broke --
   SQF owns every one of those decisions because only it can see the world. */
(function(){
  if (typeof AP === "undefined" || !AP.on) return;
  var el = document.getElementById("lockbox");
  AP.on("lockbox", function (d) {
    if (!el || !d) return;
    if (!d.on) { el.classList.remove("on"); return; }
    el.style.left   = d.x + "%";
    el.style.top    = d.y + "%";
    el.style.width  = d.w + "%";
    el.style.height = d.h + "%";
    el.classList.add("on");
  });
})();
</script>
<style>
/* __INGAME__ (port): this file's #stage is a PLACEHOLDER SCENE -- a gradient, three blurred
   colour blobs and a caption -- so the design could be judged in a browser. The caption says
   so itself: "IN GAME: TRANSPARENT OVER WORLD". Over the live world it is a wall you cannot
   see through, which is exactly what it looked like in testing.

   Neutralised here rather than by editing the authored CSS above, so that block stays
   byte-comparable to the handoff source (same convention as carradio.html).

   body AND html both need it: the dialog control is already colorBackground[]={0,0,0,0}, but a
   page painting its own opaque body is still opaque -- transparency needs BOTH sides, which is
   the whole finding in arma-webui's FINDINGS section 8.

   The scanlines and vignette stay, softened. They are the visor reading as a visor; at the
   authored strength (.55 over rgba(0,0,0,.22), and an 8-tenths inset shadow) they grey out the
   world they are supposed to be laid over. */
html,body{background:transparent!important}
#stage{background:none!important}
#stage .blob,#stage .note{display:none!important}

/* SCANLINES. Raised from the .18 this file first shipped -- that was tuned to
   stop the placeholder backdrop greying the world, and once the backdrop was
   gone it left the overlay looking like floating widgets rather than something
   seen THROUGH. Tighter pitch (2px, not 3), a little more contrast, plus a slow
   rolling sweep, which is the thing that actually sells a CRT: a static grille
   reads as texture, a moving one reads as a display. Still light enough to aim
   through -- that is the constraint, not taste. */
#scan{opacity:.30!important;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.30) 0 1px,transparent 1px 2px)!important}
#sweep{position:fixed;inset:0;pointer-events:none;z-index:3;
  background:linear-gradient(180deg,transparent 0%,rgba(200,245,58,.055) 45%,rgba(200,245,58,.10) 50%,rgba(200,245,58,.055) 55%,transparent 100%);
  background-size:100% 42%;background-repeat:no-repeat;animation:vsweep 6.5s linear infinite}
@keyframes vsweep{0%{background-position:0 -45%}100%{background-position:0 145%}}
#vig{box-shadow:inset 0 0 7rem rgba(0,0,0,.46)!important}

/* TARGET BOX. Corner brackets rather than a closed rectangle: a full box hides
   the thing it is framing, which is the opposite of the point at range. Driven
   entirely by the "lockbox" channel -- SQF projects the target's bounding box
   and sends percentages, so nothing here knows about world space.
   The transition is deliberately short: long enough to smooth the ~25 Hz feed
   into continuous motion, short enough that it does not swim behind a target
   that changes direction. */
#lockbox{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none;z-index:4;
  opacity:0;transition:opacity .12s ease,left .05s linear,top .05s linear,width .05s linear,height .05s linear}
#lockbox.on{opacity:1}
#lockbox .c{position:absolute;width:.85rem;height:.85rem;border:2px solid var(--acc);
  filter:drop-shadow(0 0 .25rem var(--acc))}
#lockbox .c.tl{left:-2px;top:-2px;border-right:0;border-bottom:0}
#lockbox .c.tr{right:-2px;top:-2px;border-left:0;border-bottom:0}
#lockbox .c.bl{left:-2px;bottom:-2px;border-right:0;border-top:0}
#lockbox .c.br{right:-2px;bottom:-2px;border-left:0;border-top:0}
#lockbox .tick{position:absolute;left:50%;top:50%;width:.3rem;height:.3rem;margin:-.15rem 0 0 -.15rem;
  background:var(--acc);border-radius:50%;opacity:.85;
  animation:vpulse 1.6s ease-in-out infinite}
@keyframes vpulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.9);opacity:.35}}
</style>
</body></html>
