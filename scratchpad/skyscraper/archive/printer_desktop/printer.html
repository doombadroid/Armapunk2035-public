<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Desktop 3D Printers — Arma props</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<style>
  html, body { margin: 0; height: 100%; }
  body { display: grid; grid-template-rows: 1fr 1fr; background: #23252c; }
  .half { position: relative; border-bottom: 1px solid #3a3e48; }
  three-d-stage { position: absolute; inset: 0; }
  three-d-stage:not(:defined) { visibility: hidden; }
  .cap { position: absolute; left: 16px; bottom: 14px; font: 12px/1.6 ui-monospace, Menlo, monospace;
         color: #b8bcc4; background: rgba(24,26,32,.88); padding: 8px 12px;
         border: 1px solid #3a3e48; border-radius: 8px; pointer-events: none; z-index: 5; }
  .cap a { color: #0db8ff; pointer-events: auto; }
</style>
</head>
<body>
<div class="half">
  <three-d-stage id="s1" name="printer_i3" background="#23252c"></three-d-stage>
  <div class="cap"><b>A — i3 bedslinger</b> · open frame, 0.50×0.50 m, 0.60 m tall w/ spool · front faces +Z<br>
  materials → ARMA3_HANDOFF_PRINTER.md</div>
</div>
<div class="half">
  <three-d-stage id="s2" name="printer_corexy" background="#1f2127"></three-d-stage>
  <div class="cap"><b>B — enclosed CoreXY</b> · 0.50×0.50 m cube, 0.585 m tall (rear spool adds 0.15 m depth)<br>
  materials → ARMA3_HANDOFF_PRINTER.md · <a href="kitchen.html">kitchen</a> · <a href="toilet.html">toilet</a></div>
</div>
<script src="./three-d-stage.js"></script>
<script type="module">
  const { buildPrinterI3, buildPrinterCoreXY } = await import('./printer.js');
  const s1 = document.getElementById('s1'), s2 = document.getElementById('s2');
  await s1.ready; s1.setObject(buildPrinterI3());
  await s2.ready; s2.setObject(buildPrinterCoreXY());
</script>
</body>
</html>
