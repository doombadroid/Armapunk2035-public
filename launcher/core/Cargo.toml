[package]
name = "apl_core"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
hex = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sysinfo = "0.39.6"

[dev-dependencies]
tempfile = "3.27.0"
tiny_http = "0.12.0"
